<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQLive - Screen Program (Sender)</title>
    <style>
        @font-face {
            font-family: 'UDKakugo';
            src: url('assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: black; overflow: hidden;
            font-family: 'UDKakugo', sans-serif;
            font-feature-settings: "palt";
        }
        #screen-container {
            position: relative; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        .content-media {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; border: none;
            object-fit: contain; background-color: #000;
        }
        .content-media.web-frame { background-color: #fff; }
        #program-overlay {
            position: absolute; top: 30px; right: 30px;
            display: flex; align-items: center; z-index: 100;
            transition: opacity 0.5s; opacity: 0; pointer-events: none;
            background-color: rgba(0, 0, 0, 0.9); padding: 0px 24px; border-radius: 8px;
        }
        #program-overlay.active { opacity: 1; }
        .program-title { color: white; font-size: 48px; font-weight: bold; letter-spacing: 0.05em; }
        #share-btn {
            position: absolute; z-index: 200;
            padding: 25px 50px; font-size: 28px; font-family: 'UDKakugo';
            background: #0078d4; color: white; border: 2px solid white; border-radius: 12px;
            cursor: pointer; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<div id="screen-container">
    <button id="share-btn">画面共有を開始して転送する</button>
    <div id="program-overlay">
        <span id="target-title" class="program-title">---</span>
    </div>
    <div id="media-target" style="width:100%; height:100%;"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974",
        measurementId: "G-BK3MJJ0VR7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let hls = null;
    let localStream = null;
    let peerConnection = null;
    let currentType = "";
    let currentUrl = "";

    const container = document.getElementById('media-target');
    const overlay = document.getElementById('program-overlay');
    const titleElement = document.getElementById('target-title');
    const shareBtn = document.getElementById('share-btn');

    const pcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    function startSync() {
        onValue(ref(db, 'broadcast/screen_program'), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            if (data.type !== currentType || data.url !== currentUrl) updateMedia(data);
            if (data.title) {
                titleElement.innerText = data.title;
                overlay.classList.add('active');
            } else {
                overlay.classList.remove('active');
            }
        });
    }

    async function updateMedia(data) {
        currentType = data.type; currentUrl = data.url;
        if (hls) { hls.destroy(); hls = null; }
        // 画面共有以外に切り替わったらストリームを止める
        if (data.type !== 'screenshare' && localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            remove(ref(db, 'webrtc'));
        }
        container.innerHTML = "";
        shareBtn.style.display = (data.type === 'screenshare') ? "block" : "none";

        switch (data.type) {
            case 'web':
                const iframe = document.createElement('iframe');
                iframe.src = data.url; iframe.className = "content-media web-frame";
                container.appendChild(iframe);
                break;
            case 'youtube':
                let vidId = data.url.split('v=')[1]?.split('&')[0] || data.url.split('/').pop();
                container.innerHTML = `<iframe class="content-media" src="https://www.youtube.com/embed/${vidId}?autoplay=1&mute=1" allow="autoplay"></iframe>`;
                break;
            case 'image':
                const img = new Image(); img.src = data.url; img.className = "content-media";
                container.appendChild(img);
                break;
            case 'video':
                const video = document.createElement('video');
                video.className = "content-media"; video.muted = true; video.autoplay = true; video.loop = true;
                container.appendChild(video);
                if (data.url.includes('.m3u8') && Hls.isSupported()) {
                    hls = new Hls(); hls.loadSource(data.url); hls.attachMedia(video);
                } else { video.src = data.url; }
                break;
        }
    }

    shareBtn.addEventListener('click', async () => {
        try {
            localStream = await navigator.mediaDevices.getDisplayMedia({ video: { width: 1920, height: 1080 }, audio: false });
            const video = document.createElement('video');
            video.className = "content-media"; video.autoplay = true; video.srcObject = localStream;
            container.appendChild(video);
            shareBtn.style.display = "none";

            // WebRTC Offerの作成
            setupWebRTC();
        } catch (err) { console.error(err); }
    });

    async function setupWebRTC() {
        peerConnection = new RTCPeerConnection(pcConfig);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                set(ref(db, `webrtc/candidates/sender/${Date.now()}`), event.candidate.toJSON());
            }
        };

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        await set(ref(db, 'webrtc/offer'), { sdp: offer.sdp, type: offer.type });

        // Answer待機
        onValue(ref(db, 'webrtc/answer'), async (snapshot) => {
            const answer = snapshot.val();
            if (answer && peerConnection.signalingState !== "stable") {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
            }
        });

        // 受信側のCandidateを追加
        onChildAdded(ref(db, 'webrtc/candidates/receiver'), (snapshot) => {
            const candidate = snapshot.val();
            if (candidate) peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
        });
    }

    window.onload = startSync;
</script>
</body>
</html>
