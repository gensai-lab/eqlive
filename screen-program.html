<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQLive - Screen Program</title>
    <style>
        @font-face {
            font-family: 'UDKakugo';
            src: url('assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: black; overflow: hidden;
            font-family: 'UDKakugo', sans-serif;
            font-feature-settings: "palt";
        }
        #screen-container {
            position: relative; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        .content-media {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; border: none;
            object-fit: contain; background-color: #000;
        }
        #program-overlay {
            position: absolute; top: 30px; right: 30px;
            display: flex; align-items: center; z-index: 100;
            transition: opacity 0.5s; opacity: 0; pointer-events: none;
            background-color: rgba(0, 0, 0, 0.9); padding: 0px 24px; border-radius: 8px;
        }
        #program-overlay.active { opacity: 1; }
        .program-title { color: white; font-size: 48px; font-weight: bold; letter-spacing: 0.05em; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<div id="screen-container">
    <div id="program-overlay">
        <span id="target-title" class="program-title">---</span>
    </div>
    <div id="media-target" style="width:100%; height:100%;"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974",
        measurementId: "G-BK3MJJ0VR7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let hls = null;
    let currentType = "";
    const container = document.getElementById('media-target');
    const overlay = document.getElementById('program-overlay');
    const titleElement = document.getElementById('target-title');

    function startSync() {
        onValue(ref(db, 'broadcast/screen_program'), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            if (data.type !== currentType) updateMedia(data);
            titleElement.innerText = data.title || "";
            data.title ? overlay.classList.add('active') : overlay.classList.remove('active');
        });
    }

    async function updateMedia(data) {
        currentType = data.type;
        if (hls) { hls.destroy(); hls = null; }
        container.innerHTML = "";

        switch (data.type) {
            case 'screenshare':
                const v = document.createElement('video');
                v.id = "shared-video";
                v.className = "content-media";
                v.autoplay = true; v.muted = true; v.playsInline = true;
                container.appendChild(v);
                
                // 最上位の親（window.top）に保存されているストリームがあれば即時反映
                if (window.top && window.top._eqlive_shared_stream) {
                    v.srcObject = window.top._eqlive_shared_stream;
                    console.log("Stream restored from top window memory.");
                }
                break;
            case 'web':
                container.innerHTML = `<iframe src="${data.url}" class="content-media" style="background:#fff"></iframe>`;
                break;
            case 'youtube':
                let vidId = data.url.split('v=')[1]?.split('&')[0] || data.url.split('/').pop();
                container.innerHTML = `<iframe class="content-media" src="https://www.youtube.com/embed/${vidId}?autoplay=1&mute=1" allow="autoplay"></iframe>`;
                break;
            case 'image':
                container.innerHTML = `<img src="${data.url}" class="content-media">`;
                break;
            case 'video':
                const video = document.createElement('video');
                video.className = "content-media"; video.muted = true; video.autoplay = true; video.loop = true;
                container.appendChild(video);
                if (data.url.includes('.m3u8')) {
                    hls = new Hls(); hls.loadSource(data.url); hls.attachMedia(video);
                } else { video.src = data.url; }
                break;
        }
    }

    // 画面キャプチャ開始（最上位の親のメモリに直接保持する）
    async function startCapture() {
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: { width: 1920, height: 1080 } });
            
            // 最上位のwindowオブジェクトに直接変数を生やして保存
            if (window.top) {
                window.top._eqlive_shared_stream = stream;
                console.log("Stream saved to top window memory.");
            }

            // 今開いているこの画面にも即時反映
            const v = document.getElementById('shared-video');
            if (v) {
                v.srcObject = stream;
            }
        } catch (err) { console.error("Capture failed:", err); }
    }

    // ショートカット: Shift + S
    window.addEventListener('keydown', (e) => {
        if (e.shiftKey && e.key.toUpperCase() === 'S') {
            startCapture();
        }
    });

    window.onload = startSync;
</script>
</body>
</html>
