<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQLive - Screen Program</title>
    <style>
        @font-face {
            font-family: 'UDKakugo';
            src: url('assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: black; overflow: hidden;
            font-family: 'UDKakugo', sans-serif;
            font-feature-settings: "palt";
        }
        #screen-container {
            position: relative; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }
        .content-media {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; border: none;
            object-fit: contain; background-color: #000;
        }
        #program-overlay {
            position: absolute; top: 30px; right: 30px;
            display: flex; align-items: center; z-index: 100;
            transition: opacity 0.5s; opacity: 0; pointer-events: none;
            background-color: rgba(0, 0, 0, 0.9); padding: 0px 24px; border-radius: 8px;
        }
        #program-overlay.active { opacity: 1; }
        .program-title { color: white; font-size: 48px; font-weight: bold; letter-spacing: 0.05em; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<div id="screen-container">
    <div id="program-overlay">
        <span id="target-title" class="program-title">---</span>
    </div>
    <div id="media-target" style="width:100%; height:100%;"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974",
        measurementId: "G-BK3MJJ0VR7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let hls = null;
    let currentType = "";
    let currentUrl = ""; // URLの変化も追うための変数
    const container = document.getElementById('media-target');
    const overlay = document.getElementById('program-overlay');
    const titleElement = document.getElementById('target-title');

    // === 🖥️ PC画面共有 (WebRTC受信・Admin側から送られてくる映像を受け取って表示) ===
    const screenServers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    let screenPeerConnection = null;
    let pendingScreenAdminIceCandidates = []; // setRemoteDescription完了前に届いたcandidateを一時保管
    let unsubScreenAdminCandidates = null; // 前回のリスナーを確実に解除するため保持
    let pendingScreenStream = null; // <video>要素がまだ無いタイミングでトラックが届いた場合に一時保持する

    onValue(ref(db, 'broadcast/screen/webrtc/offer'), async (snapshot) => {
        const offerData = snapshot.val();

        // 新しいオファーが来る／Admin側で共有が止められた場合、前回の接続とリスナーは必ず片付ける
        if (unsubScreenAdminCandidates) { unsubScreenAdminCandidates(); unsubScreenAdminCandidates = null; }
        if (screenPeerConnection) {
            screenPeerConnection.close();
            screenPeerConnection = null;
        }
        pendingScreenAdminIceCandidates = [];
        pendingScreenStream = null;

        const v = document.getElementById('shared-video');
        if (!offerData) {
            if (v) v.srcObject = null;
            return;
        }

        screenPeerConnection = new RTCPeerConnection(screenServers);

        screenPeerConnection.oniceconnectionstatechange = () => {
            console.log("[WebRTC:screen][receiver] ICE connection state:", screenPeerConnection.iceConnectionState);
        };
        screenPeerConnection.onconnectionstatechange = () => {
            console.log("[WebRTC:screen][receiver] connection state:", screenPeerConnection.connectionState);
        };

        screenPeerConnection.ontrack = (event) => {
            console.log("[WebRTC:screen][receiver] ontrack発火。トラック数:", event.streams[0] ? event.streams[0].getTracks().length : 0);
            const videoEl = document.getElementById('shared-video');
            if (videoEl) {
                videoEl.srcObject = event.streams[0];
                videoEl.play().catch(e => console.warn("[WebRTC:screen][receiver] 自動再生に失敗:", e));
            } else {
                // まだ「PC画面共有」表示に切り替わっていない（<video>要素が無い）場合は
                // 一時的に保持しておき、updateMedia側で要素が作られた時に適用する
                pendingScreenStream = event.streams[0];
            }
        };

        screenPeerConnection.onicecandidate = event => {
            if (event.candidate) {
                set(ref(db, `broadcast/screen/webrtc/candidates/main/${Date.now()}`), event.candidate.toJSON());
            }
        };

        // AdminからのICE Candidateを受信。setRemoteDescriptionが完了するまでは
        // addIceCandidateできないため、完了前に届いた分は一旦キューに貯めておく
        unsubScreenAdminCandidates = onValue(ref(db, 'broadcast/screen/webrtc/candidates/admin'), (iceSnapshot) => {
            iceSnapshot.forEach((childSnapshot) => {
                const candidate = new RTCIceCandidate(childSnapshot.val());
                if (screenPeerConnection && screenPeerConnection.remoteDescription) {
                    screenPeerConnection.addIceCandidate(candidate).catch(e => console.error("[WebRTC:screen] addIceCandidate失敗:", e));
                } else {
                    pendingScreenAdminIceCandidates.push(candidate);
                }
            });
        });

        const offerDescription = new RTCSessionDescription(offerData);
        await screenPeerConnection.setRemoteDescription(offerDescription);

        const queued = pendingScreenAdminIceCandidates;
        pendingScreenAdminIceCandidates = [];
        for (const c of queued) {
            try { await screenPeerConnection.addIceCandidate(c); } catch (e) { console.error("[WebRTC:screen] addIceCandidate失敗:", e); }
        }

        const answer = await screenPeerConnection.createAnswer();
        await screenPeerConnection.setLocalDescription(answer);

        await set(ref(db, 'broadcast/screen/webrtc/answer'), {
            type: answer.type,
            sdp: answer.sdp
        });
    });

    function startSync() {
        onValue(ref(db, 'broadcast/screen_program'), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            // type、もしくはurlのどちらかが変わったらメディアを更新する
            if (data.type !== currentType || data.url !== currentUrl) {
                updateMedia(data);
            }

            titleElement.innerText = data.title || "";
            data.title ? overlay.classList.add('active') : overlay.classList.remove('active');
        });
    }

    async function updateMedia(data) {
        currentType = data.type;
        currentUrl = data.url || ""; // 現在のURLを保持
        
        if (hls) { hls.destroy(); hls = null; }
        container.innerHTML = "";

        // URLがないタイプ（screenshareなど）を除き、URLが空なら処理をスキップ
        if (data.type !== 'screenshare' && !data.url) return;

        switch (data.type) {
            case 'screenshare':
                const v = document.createElement('video');
                v.id = "shared-video";
                v.className = "content-media";
                v.autoplay = true; v.muted = true; v.playsInline = true;
                container.appendChild(v);
                // WebRTCのontrackがこの要素の生成より先に発火していた場合は、保持しておいたストリームを適用する
                if (pendingScreenStream) {
                    v.srcObject = pendingScreenStream;
                    pendingScreenStream = null;
                    v.play().catch(e => console.warn("[WebRTC:screen][receiver] 自動再生に失敗:", e));
                }
                break;
            case 'web':
                container.innerHTML = `<iframe src="${data.url}" class="content-media" style="background:#fff"></iframe>`;
                break;
            case 'youtube':
                let vidId = data.url.split('v=')[1]?.split('&')[0] || data.url.split('/').pop();
                container.innerHTML = `<iframe class="content-media" src="https://www.youtube.com/embed/${vidId}?autoplay=1&mute=1" allow="autoplay"></iframe>`;
                break;
            case 'image':
                container.innerHTML = `<img src="${data.url}" class="content-media" onerror="console.error('画像の読み込みに失敗しました: ' + this.src)">`;
                break;
            case 'video':
                const video = document.createElement('video');
                video.className = "content-media"; video.muted = true; video.autoplay = true; video.loop = true;
                container.appendChild(video);
                if (data.url.includes('.m3u8')) {
                    hls = new Hls(); hls.loadSource(data.url); hls.attachMedia(video);
                } else { video.src = data.url; }
                break;
        }
    }

    window.onload = startSync;
</script>
</body>
</html>
