<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQLive - Screen Program</title>
    <style>
        @font-face {
            font-family: 'UDKakugo';
            src: url('assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: black; overflow: hidden;
            font-family: 'UDKakugo', sans-serif;
        }

        #screen-container {
            position: relative; width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }

        .content-media {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; border: none;
            object-fit: contain; background-color: #000;
        }

        #program-overlay {
            position: absolute; top: 60px; left: 50px;
            display: flex; align-items: center; color: white; z-index: 100;
            transition: opacity 0.5s; opacity: 0; pointer-events: none;
            filter: drop-shadow(0 0 4px rgba(0,0,0,1)) drop-shadow(0 0 8px rgba(0,0,0,1));
        }

        #program-overlay.active { opacity: 1; }
        .live-icon { width: 140px; height: auto; margin-right: 15px; }
        .program-title { 
            font-size: 48px; font-weight: bold; letter-spacing: 0.08em;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000;
        }

        /* 画面共有ボタン */
        #share-btn {
            position: absolute; z-index: 200;
            padding: 25px 50px; font-size: 28px; font-family: 'UDKakugo';
            background: #0078d4; color: white; border: 2px solid white; border-radius: 12px;
            cursor: pointer; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #share-btn:hover { background: #005a9e; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<div id="screen-container">
    <button id="share-btn">画面共有を開始する</button>

    <div id="program-overlay">
        <img src="assets/live.svg" class="live-icon" alt="投影">
        <span id="target-title" class="program-title">---</span>
    </div>

    <div id="media-target" style="width:100%; height:100%;"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase設定を正しく適用
    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974",
        measurementId: "G-BK3MJJ0VR7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let hls = null;
    let localStream = null;
    let currentType = "";
    let currentUrl = "";

    const container = document.getElementById('media-target');
    const overlay = document.getElementById('program-overlay');
    const titleElement = document.getElementById('target-title');
    const shareBtn = document.getElementById('share-btn');

    function startSync() {
        onValue(ref(db, 'broadcast/screen_program'), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            
            // 状態が変化したときだけ更新
            if (data.type !== currentType || data.url !== currentUrl) {
                updateMedia(data);
            }

            // タイトルは随時更新
            if (data.title) {
                titleElement.innerText = data.title;
                overlay.classList.add('active');
            } else {
                overlay.classList.remove('active');
            }
        });
    }

    async function updateMedia(data) {
        currentType = data.type;
        currentUrl = data.url;

        // クリーンアップ
        if (hls) { hls.destroy(); hls = null; }
        if (localStream) { 
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
        container.innerHTML = "";
        shareBtn.style.display = "none";

        switch (data.type) {
            case 'youtube':
                let vidId = data.url.split('v=')[1] || data.url.split('/').pop();
                container.innerHTML = `<iframe class="content-media" src="https://www.youtube.com/embed/${vidId}?autoplay=1&mute=1&rel=0&controls=0" allow="autoplay; encrypted-media"></iframe>`;
                break;

            case 'image':
                const img = new Image();
                img.src = data.url;
                img.className = "content-media";
                container.appendChild(img);
                break;

            case 'video':
                const video = document.createElement('video');
                video.className = "content-media";
                video.muted = true; video.autoplay = true; video.playsInline = true; video.loop = true;
                container.appendChild(video);
                if (data.url.includes('.m3u8')) {
                    if (Hls.isSupported()) { 
                        hls = new Hls(); hls.loadSource(data.url); hls.attachMedia(video); 
                    }
                } else { video.src = data.url; }
                break;

            case 'screenshare':
                shareBtn.style.display = "block";
                break;
        }
    }

    // 画面共有ボタンのクリックイベント
    shareBtn.addEventListener('click', async () => {
        try {
            localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
            const video = document.createElement('video');
            video.className = "content-media";
            video.autoplay = true;
            video.playsInline = true;
            video.srcObject = localStream;
            container.appendChild(video);
            shareBtn.style.display = "none";
        } catch (err) {
            console.error("ScreenShare Error: " + err);
        }
    });

    window.onload = startSync;
</script>
</body>
</html>
