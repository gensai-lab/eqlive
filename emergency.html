<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>EQLive Emergency - Main</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 1920px; height: 1080px;
            background-image: url('assets/cover/cover.jpg');
            background-size: cover;
            background-position: center;
            overflow: hidden;
            font-family: sans-serif;
            /* 画面全体へのパディングはなし */
        }

        .layout-root {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* メイン画面：マージンで位置を指定 */
        .main-screen {
            width: 1215px;
            height: 675px;
            margin-top: 155px;   /* 上の余白 */
            margin-left: 40px;   /* 左の余白 */
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        /* 右側のグループ */
        .side-group {
            width: 600px;
            display: flex;
            flex-direction: column;
            /* メイン画面との間隔（左40px + メイン1215px + 25px = 1280px付近） */
            margin-left: 25px; 
            margin-top: 40px; /* グループ全体の上に40pxの余白 */
            gap: 20px;        /* 各パーツ間の隙間を20pxに設定 */
        }

        /* 透明な四角形 (1つめ) */
        .spacer-top {
            width: 600px;
            height: 145px;
            background: transparent;
        }

        /* 各パーツの共通設定 */
        .parts-container {
            width: 600px;
            border-radius: 8px;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0.7);
            border: none;
        }

        .ticker-box { height: 135px; }
        .tsunami-box { height: 310px; }

        /* 透明な四角形 (4つめ) */
        .spacer-bottom {
            width: 600px;
            height: 350px;
            background: transparent;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

<div class="layout-root">
    <div class="main-screen" id="main-display">
        </div>

    <div class="side-group">
        <div class="spacer-top"></div>
        
        <div class="parts-container ticker-box">
            <iframe src="parts/ticker.html"></iframe>
        </div>

        <div class="parts-container tsunami-box">
            <iframe src="parts/tsunami-list.html"></iframe>
        </div>

        <div class="spacer-bottom"></div>
    </div>
</div>

</body>
</html>
