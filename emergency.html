<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>EQLive Emergency - Main</title>
    <style>
        body, html { margin: 0; padding: 0; width: 1920px; height: 1080px; background-image: url('assets/cover/cover.jpg'); background-size: cover; overflow: hidden; }
        .layout-root { display: flex; width: 100%; height: 100%; }
        .main-screen { width: 1215px; height: 675px; margin-top: 155px; margin-left: 40px; background-color: #000; border-radius: 8px; overflow: hidden; position: relative; }
        .side-group { width: 600px; display: flex; flex-direction: column; margin-left: 25px; margin-top: 40px; gap: 20px; }
        .spacer-top { width: 600px; height: 145px; }
        .parts-container { width: 600px; border-radius: 8px; overflow: hidden; background-color: #fff; }
        .ticker-box { height: 135px; }
        .tsunami-box { height: 310px; }
        .spacer-bottom { width: 600px; height: 350px; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>
<div class="layout-root">
    <div class="main-screen"><iframe id="main-iframe" src="screen-program.html"></iframe></div>
    <div class="side-group">
        <div class="spacer-top"></div>
        <div class="parts-container ticker-box"><iframe src="parts/ticker.html"></iframe></div>
        <div class="parts-container tsunami-box"><iframe src="parts/tsunami-list.html"></iframe></div>
        <div class="spacer-bottom"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const mainIframe = document.getElementById('main-iframe');
    let currentSrc = "";

    onValue(ref(db, 'broadcast/current'), (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        const source = data.mainSource || 'screen';
        let targetPage = (source === 'camera') ? 'live-only.html' : 'screen-program.html';
        if (currentSrc !== targetPage) {
            mainIframe.src = targetPage;
            currentSrc = targetPage;
        }
    });
</script>
</body>
</html>
