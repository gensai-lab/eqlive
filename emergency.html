<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>EQLive Emergency - Main</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 1920px; height: 1080px;
            background-image: url('assets/cover/cover.jpg');
            background-size: cover;
            background-position: center;
            overflow: hidden;
            font-family: sans-serif;
        }

        .layout-root {
            display: flex;
            padding-top: 155px;
            padding-left: 40px;
            gap: 25px; /* メイン画面と右グループのギャップ */
        }

        /* メイン画面（中継・共有・画像） */
        .main-screen {
            width: 1215px;
            height: 675px;
            background-color: rgba(0, 0, 0, 0.5); /* コンテンツがない時の仮背景 */
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        /* サイドバー（右側の4つのボックス） */
        .side-group {
            width: 600px;
            display: flex;
            flex-direction: column;
        }

        /* 透明な四角形 (1つめ) */
        .spacer-top {
            width: 600px;
            height: 145px;
            background: transparent;
        }

        /* ticker.html (2つめ) */
        .ticker-box {
            width: 600px;
            height: 135px;
            border-radius: 8px;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0.7);
            border: none;
        }

        /* tsunami-list.html (3つめ) */
        .tsunami-box {
            width: 600px;
            height: 310px;
            border-radius: 8px;
            overflow: hidden;
            background-color: rgba(0, 0, 0, 0.7);
            border: none;
            margin-top: 25px; /* パーツ間の余白 */
        }

        /* 透明な四角形 (4つめ) */
        .spacer-bottom {
            width: 600px;
            height: 350px;
            background: transparent;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div class="layout-root">
    <div class="main-screen" id="main-display">
        </div>

    <div class="side-group">
        <div class="spacer-top"></div>
        
        <div class="ticker-box">
            <iframe src="parts/ticker.html"></iframe>
        </div>

        <div class="tsunami-box">
            <iframe src="parts/tsunami-list.html"></iframe>
        </div>

        <div class="spacer-bottom"></div>
    </div>
</div>

<script type="module">
    // 必要に応じてFirebaseからメイン画面のコンテンツを切り替えるスクリプトをここに追加できます
</script>

</body>
</html>
