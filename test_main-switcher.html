<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'UDKakugoLarge';
            src: url('../assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
        }

        :root {
            --warning-red: #DE080A;
            --text-white: #ffffff;
            --main-text-indent: 0px; /* 左端を揃えてスッキリさせる */
            --anim-speed: 0.5s;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: transparent; 
            font-family: 'UDKakugoLarge', sans-serif;
            overflow: hidden;
        }

        .title-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 0px;
            /* しっかりとしたドロップシャドウで視認性を確保 */
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
        }

        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* サブタイトル：少し小さくしてメインを引き立て、背景をダークグレーにして日テレ感を解消 */
        .subtitle-box {
            background-color: #1a1a1a;
            color: var(--text-white);
            font-size: 36px; 
            font-weight: 700;
            padding: 6px 24px;
            border-radius: 0px; /* 角丸をなくす */
            white-space: nowrap;
            font-feature-settings: "palt";
            margin-left: var(--main-text-indent);
            line-height: 1.2;
            display: none;
            animation: slideIn var(--anim-speed) cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* メインタイトル：左端に白のアクセントラインを入れ、角丸を廃止 */
        .main-title-box {
            background-color: var(--warning-red);
            color: var(--text-white);
            font-size: 84px;
            font-weight: 700;
            padding: 10px 40px 10px 30px;
            border-left: 10px solid var(--text-white); /* 白の境界線アクセント */
            border-radius: 0px; /* 角丸をなくす */
            white-space: nowrap;
            font-feature-settings: "palt";
            line-height: 1.1;
            display: none;
            animation: slideIn var(--anim-speed) cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body>
    <div class="title-container">
        <div class="subtitle-box" id="displaySubtitle"></div>
        <div class="main-title-box" id="displayMainTitle"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
            authDomain: "mgl-eqlive.firebaseapp.com",
            databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
            projectId: "mgl-eqlive",
            storageBucket: "mgl-eqlive.firebasestorage.app",
            messagingSenderId: "1060231327645",
            appId: "1:1060231327645:web:642684f4640bbc21d5c974"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let prevMain = "";
        let prevSub = "";

        onValue(ref(db, 'broadcast/current'), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const subEl = document.getElementById('displaySubtitle');
            const mainEl = document.getElementById('displayMainTitle');

            const updateUI = (el, newText, oldText) => {
                if (newText) {
                    if (newText !== oldText) {
                        el.style.display = 'none';
                        void el.offsetWidth;
                        el.innerText = newText;
                        el.style.display = 'block';
                    }
                } else {
                    el.style.display = 'none';
                }
            };

            updateUI(subEl, data.subtitle, prevSub);
            updateUI(mainEl, data.mainTitle, prevMain);

            prevSub = data.subtitle;
            prevMain = data.mainTitle;
        });
    </script>
</body>
</html>
