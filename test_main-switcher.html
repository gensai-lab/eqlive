<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQLive - Live Display</title>
    <style>
        /* フォントの設定 */
        @font-face {
            font-family: 'UDKakugo';
            src: url('assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            font-family: 'UDKakugo', sans-serif;
        }

        #video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 映像・画像表示エリア共通 */
        video, iframe, .live-image-src {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* 映像と静止画はアスペクト比を維持しつつ画面いっぱいにカバー */
        video, .live-image-src {
            object-fit: cover;
        }

        /* YouTubeのコントロールバー・ロゴ表示を完全にブロックするマスク */
        #player-guard-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            background: transparent;
            cursor: none; /* 配信画面にマウスカーソルが乗っても矢印を消す */
        }

        /* 中継テロップ */
        #live-location-overlay {
            position: absolute;
            top: 140px;
            left: 60px;
            display: flex;
            align-items: center;
            color: white;
            z-index: 100;
            transition: opacity 0.3s;
            opacity: 0;
            pointer-events: none;
            filter: drop-shadow(0 0 4px rgba(0,0,0,1)) drop-shadow(0 0 8px rgba(0,0,0,1));
        }

        #live-location-overlay.active {
            opacity: 1;
        }

        .live-icon {
            width: 115px;
            height: auto;
            margin-right: 24px;
        }

        .location-name {
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 0.08em;
            text-shadow: 
                2px 2px 0 #000, -2px -2px 0 #000,
                -2px 2px 0 #000, 2px -2px 0 #000,
                0px 2px 0 #000, 0px -2px 0 #000,
                -2px 0px 0 #000, 2px 0px 0 #000;
        }

        #player-target {
            width: 100%;
            height: 100%;
            background-color: black;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<div id="video-container">
    <div id="player-guard-mask"></div>

    <div id="live-location-overlay">
        <img src="assets/live.svg" class="live-icon" alt="中継">
        <span id="target-location-name" class="location-name">---</span>
    </div>

    <div id="player-target"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let cameraList = [];
    let currentCameraId = "";
    let hls = null;
    let imageRefreshInterval = null; // 静止画定期更新用のタイマー

    async function loadConfig() {
        try {
            const response = await fetch('https://gensai-lab.github.io/eqlive/assets/json/kh-livec.json');
            cameraList = await response.json();
            startSync();
        } catch (e) {
            console.error("JSON Load Error:", e);
        }
    }

    function startSync() {
        onValue(ref(db, 'broadcast/current'), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            // IDが変わった瞬間のみ更新
            if (data.cameraSource !== currentCameraId) {
                updateCamera(data.cameraSource);
            }
        });
    }

    function updateCamera(id) {
        currentCameraId = id;
        const cam = cameraList.find(c => c.id === id);
        const overlay = document.getElementById('live-location-overlay');
        const nameElement = document.getElementById('target-location-name');
        const container = document.getElementById('player-target');

        // 前のHLSインスタンスがあれば確実に破棄
        if (hls) {
            hls.destroy();
            hls = null;
        }

        // 前の静止画リフレッシュタイマーが動いていればクリア
        if (imageRefreshInterval) {
            clearInterval(imageRefreshInterval);
            imageRefreshInterval = null;
        }

        // プレイヤーコンテナの内容をクリア
        container.innerHTML = "";

        if (cam) {
            nameElement.innerText = cam.name;
            overlay.classList.add('active');

            const lowerUrl = cam.url.toLowerCase();

            // ① 【追加】静止画（img形式）への対応判定
            // JSONのtypeが "img" または "image" であるか、URLに拡張子が含まれる場合
            if (cam.type === 'img' || cam.type === 'image' || lowerUrl.includes('.jpg') || lowerUrl.includes('.jpeg') || lowerUrl.includes('.png')) {
                
                const img = document.createElement('img');
                img.className = "live-image-src";
                
                // 初回読み込み時のブラウザキャッシュを回避するためのタイムスタンプ付与
                const cacheBuster = cam.url.includes('?') ? `&t=${Date.now()}` : `?t=${Date.now()}`;
                img.src = cam.url + cacheBuster;
                
                container.appendChild(img);

                // カメラが選ばれている間、10秒（10000ms）ごとに画像を最新のものにバックグラウンドで差し替える
                imageRefreshInterval = setInterval(() => {
                    const nextBuster = cam.url.includes('?') ? `&t=${Date.now()}` : `?t=${Date.now()}`;
                    img.src = cam.url + nextBuster;
                }, 10000);

            // ② YouTubeの場合
            } else if (cam.type === 'youtube' || lowerUrl.includes('youtube.com') || lowerUrl.includes('youtu.be')) {
                let vidId = "";
                
                if (cam.url.includes('watch?v=')) {
                    vidId = cam.url.split('watch?v=')[1].split('&')[0];
                } else if (cam.url.includes('youtu.be/')) {
                    vidId = cam.url.split('youtu.be/')[1].split('?')[0];
                } else if (cam.url.includes('embed/')) {
                    vidId = cam.url.split('embed/')[1].split('?')[0];
                } else {
                    vidId = cam.url;
                }

                const embedUrl = `https://www.youtube.com/embed/${vidId}?autoplay=1&mute=1&controls=0&rel=0&iv_load_policy=3&modestbranding=1`;

                container.innerHTML = `
                    <iframe src="${embedUrl}" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                            allowfullscreen>
                    </iframe>`;

            // ③ HLSストリーミング配信の場合
            } else if (cam.type === 'hls' || lowerUrl.includes('.m3u8')) {
                const video = document.createElement('video');
                video.muted = true;
                video.autoplay = true;
                video.playsInline = true;
                container.appendChild(video);

                if (Hls.isSupported()) {
                    hls = new Hls();
                    hls.loadSource(cam.url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play().catch(e => console.error("Autoplay failed:", e));
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = cam.url;
                    video.addEventListener('loadedmetadata', () => {
                        video.play();
                    });
                }
            
            // ④ その他のWebソース埋め込み
            } else {
                container.innerHTML = `<iframe src="${cam.url}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            }
        } else {
            overlay.classList.remove('active');
        }
    }

    window.onload = loadConfig;
</script>

</body>
</html>
