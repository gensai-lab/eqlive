<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>EQLive Main Switcher</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 1920px; height: 1080px;
            background-color: black;
            overflow: hidden;
            font-family: sans-serif;
        }
        #view-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* === ① L字の背景枠（文字情報・座布団など） === */
        #frame-l-bg {
            position: absolute;
            top: 0; left: 0;
            width: 1920px;
            height: 1080px;
            border: none;
            z-index: 1;
            
            /* フェードによる余韻を残さないため、opacityのtransitionは削除 */
            opacity: 0;
            display: none; /* 完全に描画・イベントをシャットアウト */
            pointer-events: none;
        }
        #frame-l-bg.active {
            opacity: 1;
            display: block;
            pointer-events: auto;
        }

        /* === ② 通常放送（sub-switcher）レイヤー === */
        #frame-sub-switcher {
            position: absolute;
            border: none;
            z-index: 10; /* L字背景より常に前面 */
            
            /* 初期状態：全画面（100%） */
            top: 0px;
            left: 0px;
            width: 1920px;
            height: 1080px;
            transform: scale(1);
            transform-origin: top left;
            
            /* 1.8秒の等速（linear）に統一 */
            transition: 
                top 1.0s linear,
                left 1.0s linear,
                width 1.0s linear,
                height 1.0s linear,
                transform 1.0s linear,
                border-radius 1.0s linear;
        }

        /* === L字ON（l-screenモード）時の変形座標設定 === */
        #frame-sub-switcher.l-mode {
            top: 0px;
            left: 182px;
            width: 1920px;
            height: 1080px;
            transform: scale(0.905); /* 90.5% に縮小 */
            border-bottom-left-radius: 8px;
        }

        /* === 緊急地震速報（最前面） === */
        #frame-eew {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 1300px;
            height: 371px;
            z-index: 999;
            border: none;
            background: transparent;
            pointer-events: none;
        }
        #audio-unlock {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            cursor: pointer;
            font-family: sans-serif;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div id="audio-unlock">
        <div style="margin-bottom: 20px;">音声再生・マイク接続・読み上げ機能を有効にするにはここをクリック</div>
        <div style="font-size: 16px; color: #ccc;">（OBSの場合は「対話」からクリックしてください）</div>
    </div>

    <div id="view-container">
        <iframe id="frame-l-bg" src="l-screen.html"></iframe>
        <iframe id="frame-sub-switcher" src="sub-switcher.html"></iframe>
        <iframe id="frame-eew" src="parts/eew.html"></iframe>
    </div>

    <!-- 音声ソース要素 -->
    <audio id="eew-audio" src="assets/eew-audio.mp3" preload="auto"></audio>
    <audio id="bgm-audio" loop preload="auto"></audio>
    <audio id="mic-audio" autoplay></audio> <!-- WebRTCマイク出力用 -->

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const frameLBg = document.getElementById('frame-l-bg');
    const frameSub = document.getElementById('frame-sub-switcher');
    const eewAudio = document.getElementById('eew-audio');
    const bgmAudio = document.getElementById('bgm-audio');
    const micAudio = document.getElementById('mic-audio');
    const unlockOverlay = document.getElementById('audio-unlock');

    // タイマー管理用変数
    let offTimer = null;
    let ttsLastTimestamp = null;
    
    // WebRTC用変数
    let peerConnection = null;
    const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    // 音声アンロック・初期化処理 (クリック時)
    unlockOverlay.addEventListener('click', () => {
        // 全オーディオ要素をアンロック
        eewAudio.play().then(() => { eewAudio.pause(); eewAudio.currentTime = 0; }).catch(()=>{});
        bgmAudio.play().then(() => { bgmAudio.pause(); }).catch(()=>{});
        micAudio.play().catch(()=>{}); // マイク配信用要素も同じくアンロックしておく（自動再生ブロック対策）

        unlockOverlay.style.display = 'none';
        console.log("Audio Systems Unlocked!");
    });

    // === モード切り替えロジック ===
    function applyLayoutMode(viewType) {
        if (offTimer) { clearTimeout(offTimer); offTimer = null; }
        if (viewType === 'l-screen') {
            frameLBg.classList.add('active');   
            frameSub.classList.add('l-mode');   
        } else {
            frameSub.classList.remove('l-mode'); 
            offTimer = setTimeout(() => {
                frameLBg.classList.remove('active');
                offTimer = null;
            }, 1800);
        }
    }

    const modeRef = ref(db, 'broadcast/current_mode');
    onValue(modeRef, (snapshot) => {
        const mode = snapshot.val();
        if (mode) applyLayoutMode(mode);
        else applyLayoutMode('sub-switcher');
    });

    // 内部iFrameからのEEW音声発火指示
    window.addEventListener('message', (event) => {
        if (event.data === 'playEEWAudio') {
            eewAudio.currentTime = 0; 
            eewAudio.play().catch(e => console.warn("EEW音声の再生に失敗しました。"));
        }
    });

    // === 🎵 追加: BGM再生制御 ===
    onValue(ref(db, 'broadcast/audio/bgm'), (snapshot) => {
        const bgmConfig = snapshot.val();
        if(!bgmConfig) return;

        // URLが変更された場合は読み込み直す
        if (bgmConfig.url && !bgmAudio.src.includes(bgmConfig.url)) {
            bgmAudio.src = bgmConfig.url;
        }

        // 音量設定
        bgmAudio.volume = bgmConfig.volume !== undefined ? bgmConfig.volume : 0.5;

        // 再生・停止制御
        if (bgmConfig.isPlaying) {
            bgmAudio.play().catch(e => console.warn("BGM再生ブロック(クリック前): ", e));
        } else {
            bgmAudio.pause();
        }
    });

    // === 🗣️ 追加: AI音声読み上げ制御 (ResponsiveVoice.js 使用・チャンク逐次読み上げ対応) ===
    let ttsCurrentToken = 0; // このトークンより新しい要求が来たら現在の読み上げを打ち切る
    let responsiveVoiceConfig = { apiKey: '', voice: 'Japanese Female' };
    let rvScriptLoadPromise = null; // スクリプトの二重読み込みを防ぐ

    // ResponsiveVoiceのAPIキー・声はadmin画面から設定可能（settings/responsivevoice）
    onValue(ref(db, 'settings/responsivevoice'), (snapshot) => {
        const conf = snapshot.val();
        if (conf) {
            responsiveVoiceConfig = {
                apiKey: conf.apiKey || '',
                voice: conf.voice || 'Japanese Female'
            };
        }
    });

    function updateTtsStatus(data) {
        set(ref(db, 'broadcast/audio/tts_status'), data).catch(() => {});
    }

    function stopCurrentTtsPlayback() {
        if (window.responsiveVoice && window.responsiveVoice.cancel) {
            try { window.responsiveVoice.cancel(); } catch (e) {}
        }
    }

    // ResponsiveVoice.jsのスクリプトを（APIキーが判明してから）1回だけ動的に読み込む
    function ensureResponsiveVoiceLoaded() {
        if (window.responsiveVoice) return Promise.resolve();
        if (!responsiveVoiceConfig.apiKey) return Promise.reject(new Error('ResponsiveVoiceのAPIキーが設定されていません（admin画面で設定してください）'));
        if (rvScriptLoadPromise) return rvScriptLoadPromise;

        rvScriptLoadPromise = new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = `https://code.responsivevoice.org/responsivevoice.js?key=${encodeURIComponent(responsiveVoiceConfig.apiKey)}`;
            script.onload = () => resolve();
            script.onerror = () => { rvScriptLoadPromise = null; reject(new Error('ResponsiveVoiceスクリプトの読み込みに失敗しました')); };
            document.head.appendChild(script);
        });
        return rvScriptLoadPromise;
    }

    function speakWithResponsiveVoice(text) {
        return new Promise((resolve) => {
            try {
                window.responsiveVoice.speak(text, responsiveVoiceConfig.voice, {
                    onend: () => resolve(),
                    onerror: () => resolve() // 1チャンクが失敗しても後続の読み上げを止めない
                });
            } catch (e) {
                console.error("[TTS] ResponsiveVoice speak失敗:", e);
                resolve();
            }
        });
    }

    async function speakOneChunk(text, token) {
        try {
            await ensureResponsiveVoiceLoaded();
            if (token !== ttsCurrentToken) return; // 待っている間に新しい要求が来ていたら再生しない
            await speakWithResponsiveVoice(text);
        } catch (err) {
            console.error("[TTS] ResponsiveVoiceでの読み上げに失敗しました。APIキー設定(settings/responsivevoice)を確認してください:", err);
        }
    }

    async function speakTTSChunks(chunks, token) {
        const total = chunks.length;

        for (let i = 0; i < total; i++) {
            if (token !== ttsCurrentToken) return; // 新しい要求 or キャンセルで中断
            const chunk = chunks[i];
            updateTtsStatus({
                status: 'playing',
                progress: Math.round((i / total) * 100),
                eta: Math.max(0, Math.round((total - i) * 4)), // 簡易目安（1チャンクあたり約4秒）
                currentText: chunk
            });
            await speakOneChunk(chunk, token);
        }

        if (token === ttsCurrentToken) {
            updateTtsStatus({ status: 'idle', progress: 100, eta: 0, currentText: '完了' });
        }
    }

    onValue(ref(db, 'broadcast/audio/tts'), (snapshot) => {
        const ttsData = snapshot.val();
        if (!ttsData || ttsData.timestamp === ttsLastTimestamp) return;
        ttsLastTimestamp = ttsData.timestamp;

        // 新しい要求が来たら、進行中の読み上げは無条件に打ち切る
        ttsCurrentToken++;
        stopCurrentTtsPlayback();

        if (ttsData.action === 'cancel') {
            updateTtsStatus({ status: 'idle', progress: 0, eta: 0, currentText: '待機中' });
            return;
        }

        // chunks（分割済み）があれば優先使用。無い場合はtextを1チャンクとして扱う（後方互換）
        const chunks = (Array.isArray(ttsData.chunks) && ttsData.chunks.length > 0)
            ? ttsData.chunks
            : (ttsData.text ? [ttsData.text] : []);
        if (chunks.length === 0) return;

        speakTTSChunks(chunks, ttsCurrentToken);
    });

    // === 🎤 追加: WebRTC マイク受信制御 ===
    let pendingAdminIceCandidates = []; // setRemoteDescription完了前に届いたcandidateを一時保管
    let unsubAdminCandidates = null; // 前回のリスナーを確実に解除するため保持

    onValue(ref(db, 'broadcast/audio/webrtc/offer'), async (snapshot) => {
        const offerData = snapshot.val();

        // 新しいオファーが来る／Admin側で停止された場合、前回の接続とリスナーは必ず片付ける
        if (unsubAdminCandidates) { unsubAdminCandidates(); unsubAdminCandidates = null; }
        if (peerConnection) {
            peerConnection.close();
            peerConnection = null;
        }
        pendingAdminIceCandidates = [];

        if (!offerData) {
            micAudio.srcObject = null;
            return;
        }

        // 新しいオファーを受信したら接続構築
        peerConnection = new RTCPeerConnection(servers);

        // トラック受信時にAudio要素にセット
        peerConnection.ontrack = (event) => {
            console.log('[WebRTC/main] ontrack発火。トラック受信:', event.track.kind, event.track.readyState);
            micAudio.srcObject = event.streams[0];
            micAudio.play().catch(e => console.warn('[WebRTC/main] mic-audio再生ブロック:', e));
        };

        // 接続状態を確認できるようログを出しておく（無音になった場合の切り分け用）
        peerConnection.oniceconnectionstatechange = () => {
            console.log('[WebRTC/main] ICE connection state:', peerConnection.iceConnectionState);
        };
        peerConnection.onconnectionstatechange = () => {
            console.log('[WebRTC/main] Connection state:', peerConnection.connectionState);
        };

        // ICE Candidateの処理（Adminへ送信）
        peerConnection.onicecandidate = event => {
            if(event.candidate) {
                set(ref(db, `broadcast/audio/webrtc/candidates/main/${Date.now()}`), event.candidate.toJSON());
            }
        };

        // AdminからのICE Candidateを受信。setRemoteDescriptionが完了するまでは
        // addIceCandidateできない（失敗して音声が繋がらない/途切れる原因になる）ため、
        // 完了前に届いた分は一旦キューに貯めておき、完了後にまとめて追加する
        unsubAdminCandidates = onValue(ref(db, 'broadcast/audio/webrtc/candidates/admin'), (iceSnapshot) => {
            iceSnapshot.forEach((childSnapshot) => {
                const candidate = new RTCIceCandidate(childSnapshot.val());
                if (peerConnection && peerConnection.remoteDescription) {
                    peerConnection.addIceCandidate(candidate).catch(e => console.error("[WebRTC] addIceCandidate失敗:", e));
                } else {
                    pendingAdminIceCandidates.push(candidate);
                }
            });
        });

        // 相手(Admin)の情報をセット
        const offerDescription = new RTCSessionDescription(offerData);
        await peerConnection.setRemoteDescription(offerDescription);

        // キューに貯まっていたcandidateをここでまとめて追加する
        const queued = pendingAdminIceCandidates;
        pendingAdminIceCandidates = [];
        for (const c of queued) {
            try { await peerConnection.addIceCandidate(c); } catch (e) { console.error("[WebRTC] addIceCandidate失敗:", e); }
        }

        // 返答(Answer)を作成してFirebase経由で送り返す
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        const answerData = {
            type: answer.type,
            sdp: answer.sdp
        };
        await set(ref(db, 'broadcast/audio/webrtc/answer'), answerData);
    });

</script>
</body>
</html>
