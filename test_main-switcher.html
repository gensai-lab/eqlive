<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>EQLive Main Switcher</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 1920px; height: 1080px;
            background-color: black;
            overflow: hidden;
            font-family: sans-serif;
        }
        #view-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* === ① L字の背景枠（文字情報・座布団など） === */
        #frame-l-bg {
            position: absolute;
            top: 0; left: 0;
            width: 1920px;
            height: 1080px;
            border: none;
            z-index: 1;
            
            /* フェードによる余韻を残さないため、opacityのtransitionは削除 */
            opacity: 0;
            display: none; /* 完全に描画・イベントをシャットアウト */
            pointer-events: none;
        }
        #frame-l-bg.active {
            opacity: 1;
            display: block;
            pointer-events: auto;
        }

        /* === ② 通常放送（sub-switcher）レイヤー === */
        #frame-sub-switcher {
            position: absolute;
            border: none;
            z-index: 10; /* L字背景より常に前面 */
            
            /* 初期状態：全画面（100%） */
            top: 0px;
            left: 0px;
            width: 1920px;
            height: 1080px;
            transform: scale(1);
            transform-origin: top left;
            
            /* 1.8秒の等速（linear）に統一 */
            transition: 
                top 1.0s linear,
                left 1.0s linear,
                width 1.0s linear,
                height 1.0s linear,
                transform 1.0s linear,
                border-radius 1.0s linear;
        }

        /* === L字ON（l-screenモード）時の変形座標設定 === */
        #frame-sub-switcher.l-mode {
            top: 0px;
            left: 182px;
            width: 1920px;
            height: 1080px;
            transform: scale(0.905); /* 90.5% に縮小 */
            border-bottom-left-radius: 8px;
        }

        /* === 緊急地震速報（最前面） === */
        #frame-eew {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 1300px;
            height: 371px;
            z-index: 999;
            border: none;
            background: transparent;
            pointer-events: none;
        }
        #audio-unlock {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            cursor: pointer;
            font-family: sans-serif;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div id="audio-unlock">
        <div style="margin-bottom: 20px;">音声再生・マイク接続・読み上げ機能を有効にするにはここをクリック</div>
        <div style="font-size: 16px; color: #ccc;">（OBSの場合は「対話」からクリックしてください）</div>
    </div>

    <div id="view-container">
        <iframe id="frame-l-bg" src="l-screen.html"></iframe>
        <iframe id="frame-sub-switcher" src="sub-switcher.html"></iframe>
        <iframe id="frame-eew" src="parts/eew.html"></iframe>
    </div>

    <!-- 音声ソース要素 -->
    <audio id="eew-audio" src="assets/eew-audio.mp3" preload="auto"></audio>
    <audio id="bgm-audio" loop preload="auto"></audio>
    <audio id="mic-audio" autoplay></audio> <!-- WebRTCマイク出力用 -->
    <audio id="tts-audio" preload="auto"></audio> <!-- VoiceText読み上げ再生用 -->

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const frameLBg = document.getElementById('frame-l-bg');
    const frameSub = document.getElementById('frame-sub-switcher');
    const eewAudio = document.getElementById('eew-audio');
    const bgmAudio = document.getElementById('bgm-audio');
    const micAudio = document.getElementById('mic-audio');
    const unlockOverlay = document.getElementById('audio-unlock');

    // タイマー管理用変数
    let offTimer = null;
    let ttsLastTimestamp = null;
    
    // WebRTC用変数
    let peerConnection = null;
    const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    // 音声アンロック・初期化処理 (クリック時)
    unlockOverlay.addEventListener('click', () => {
        // 全オーディオ要素をアンロック
        eewAudio.play().then(() => { eewAudio.pause(); eewAudio.currentTime = 0; }).catch(()=>{});
        bgmAudio.play().then(() => { bgmAudio.pause(); }).catch(()=>{});

        unlockOverlay.style.display = 'none';
        console.log("Audio Systems Unlocked!");
    });

    // === モード切り替えロジック ===
    function applyLayoutMode(viewType) {
        if (offTimer) { clearTimeout(offTimer); offTimer = null; }
        if (viewType === 'l-screen') {
            frameLBg.classList.add('active');   
            frameSub.classList.add('l-mode');   
        } else {
            frameSub.classList.remove('l-mode'); 
            offTimer = setTimeout(() => {
                frameLBg.classList.remove('active');
                offTimer = null;
            }, 1800);
        }
    }

    const modeRef = ref(db, 'broadcast/current_mode');
    onValue(modeRef, (snapshot) => {
        const mode = snapshot.val();
        if (mode) applyLayoutMode(mode);
        else applyLayoutMode('sub-switcher');
    });

    // 内部iFrameからのEEW音声発火指示
    window.addEventListener('message', (event) => {
        if (event.data === 'playEEWAudio') {
            eewAudio.currentTime = 0; 
            eewAudio.play().catch(e => console.warn("EEW音声の再生に失敗しました。"));
        }
    });

    // === 🎵 追加: BGM再生制御 ===
    onValue(ref(db, 'broadcast/audio/bgm'), (snapshot) => {
        const bgmConfig = snapshot.val();
        if(!bgmConfig) return;

        // URLが変更された場合は読み込み直す
        if (bgmConfig.url && !bgmAudio.src.includes(bgmConfig.url)) {
            bgmAudio.src = bgmConfig.url;
        }

        // 音量設定
        bgmAudio.volume = bgmConfig.volume !== undefined ? bgmConfig.volume : 0.5;

        // 再生・停止制御
        if (bgmConfig.isPlaying) {
            bgmAudio.play().catch(e => console.warn("BGM再生ブロック(クリック前): ", e));
        } else {
            bgmAudio.pause();
        }
    });

    // === 🗣️ 追加: AI音声読み上げ制御 (VoiceText Web API 使用・チャンク逐次読み上げ対応) ===
    let ttsCurrentToken = 0; // このトークンより新しい要求が来たら現在の読み上げを打ち切る
    let voicetextConfig = { apiKey: '', speaker: 'hikari' };
    let ttsCurrentAbortController = null;
    let ttsCurrentObjectUrl = null;
    const ttsAudioEl = document.getElementById('tts-audio');

    // VoiceTextのAPIキー・話者名はadmin画面から設定可能（settings/voicetext）
    onValue(ref(db, 'settings/voicetext'), (snapshot) => {
        const conf = snapshot.val();
        if (conf) {
            voicetextConfig = {
                apiKey: conf.apiKey || '',
                speaker: conf.speaker || 'hikari'
            };
        }
    });

    function updateTtsStatus(data) {
        set(ref(db, 'broadcast/audio/tts_status'), data).catch(() => {});
    }

    function stopCurrentTtsPlayback() {
        if (ttsCurrentAbortController) { ttsCurrentAbortController.abort(); ttsCurrentAbortController = null; }
        ttsAudioEl.pause();
        ttsAudioEl.currentTime = 0;
        if (ttsCurrentObjectUrl) { URL.revokeObjectURL(ttsCurrentObjectUrl); ttsCurrentObjectUrl = null; }
    }

    // VoiceText Web APIにテキストを送って音声(mp3)を合成させる
    async function synthesizeVoiceText(text, signal) {
        if (!voicetextConfig.apiKey) throw new Error('VoiceTextのAPIキーが設定されていません（admin画面で設定してください）');

        const params = new URLSearchParams();
        params.set('text', text);
        params.set('speaker', voicetextConfig.speaker);
        params.set('format', 'mp3'); // ファイルサイズを抑えるためmp3を指定（既定はwav）

        const res = await fetch('https://api.voicetext.jp/v1/tts', {
            method: 'POST',
            headers: {
                'Authorization': 'Basic ' + btoa(voicetextConfig.apiKey + ':'),
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: params.toString(),
            signal
        });
        if (!res.ok) {
            let msg = `VoiceText API error: ${res.status}`;
            try {
                const errJson = await res.json();
                if (errJson.error && errJson.error.message) msg += ` - ${errJson.error.message}`;
            } catch (e) {}
            throw new Error(msg);
        }
        return await res.blob();
    }

    function playAudioBlob(blob) {
        return new Promise((resolve) => {
            if (ttsCurrentObjectUrl) { URL.revokeObjectURL(ttsCurrentObjectUrl); }
            const url = URL.createObjectURL(blob);
            ttsCurrentObjectUrl = url;
            ttsAudioEl.src = url;
            ttsAudioEl.onended = () => resolve();
            ttsAudioEl.onerror = () => resolve();
            ttsAudioEl.play().catch(err => {
                console.warn("[TTS] VoiceText音声の再生に失敗しました（クリックによるアンロック前の可能性）:", err);
                resolve();
            });
        });
    }

    async function speakOneChunk(text, token) {
        try {
            ttsCurrentAbortController = new AbortController();
            const blob = await synthesizeVoiceText(text, ttsCurrentAbortController.signal);
            if (token !== ttsCurrentToken) return; // 待っている間に新しい要求が来ていたら再生しない
            await playAudioBlob(blob);
        } catch (err) {
            if (err.name === 'AbortError') return;
            console.error("[TTS] VoiceTextでの音声合成に失敗しました。APIキー設定(settings/voicetext)やCORSの状況を確認してください:", err);
        }
    }

    async function speakTTSChunks(chunks, token) {
        const total = chunks.length;

        for (let i = 0; i < total; i++) {
            if (token !== ttsCurrentToken) return; // 新しい要求 or キャンセルで中断
            const chunk = chunks[i];
            updateTtsStatus({
                status: 'playing',
                progress: Math.round((i / total) * 100),
                eta: Math.max(0, Math.round((total - i) * 4)), // 簡易目安（1チャンクあたり約4秒）
                currentText: chunk
            });
            await speakOneChunk(chunk, token);
        }

        if (token === ttsCurrentToken) {
            updateTtsStatus({ status: 'idle', progress: 100, eta: 0, currentText: '完了' });
        }
    }

    onValue(ref(db, 'broadcast/audio/tts'), (snapshot) => {
        const ttsData = snapshot.val();
        if (!ttsData || ttsData.timestamp === ttsLastTimestamp) return;
        ttsLastTimestamp = ttsData.timestamp;

        // 新しい要求が来たら、進行中の読み上げは無条件に打ち切る
        ttsCurrentToken++;
        stopCurrentTtsPlayback();

        if (ttsData.action === 'cancel') {
            updateTtsStatus({ status: 'idle', progress: 0, eta: 0, currentText: '待機中' });
            return;
        }

        // chunks（分割済み）があれば優先使用。無い場合はtextを1チャンクとして扱う（後方互換）
        const chunks = (Array.isArray(ttsData.chunks) && ttsData.chunks.length > 0)
            ? ttsData.chunks
            : (ttsData.text ? [ttsData.text] : []);
        if (chunks.length === 0) return;

        speakTTSChunks(chunks, ttsCurrentToken);
    });

    // === 🎤 追加: WebRTC マイク受信制御 ===
    onValue(ref(db, 'broadcast/audio/webrtc/offer'), async (snapshot) => {
        const offerData = snapshot.val();
        if (!offerData) {
            // Admin側で停止された場合、切断して終了
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            micAudio.srcObject = null;
            return;
        }

        // 新しいオファーを受信したら接続構築
        peerConnection = new RTCPeerConnection(servers);

        // トラック受信時にAudio要素にセット
        peerConnection.ontrack = (event) => {
            micAudio.srcObject = event.streams[0];
        };

        // ICE Candidateの処理（Adminへ送信）
        peerConnection.onicecandidate = event => {
            if(event.candidate) {
                set(ref(db, `broadcast/audio/webrtc/candidates/main/${Date.now()}`), event.candidate.toJSON());
            }
        };

        // AdminからのICE Candidateを受信
        onValue(ref(db, 'broadcast/audio/webrtc/candidates/admin'), (iceSnapshot) => {
            iceSnapshot.forEach((childSnapshot) => {
                const candidate = new RTCIceCandidate(childSnapshot.val());
                if(peerConnection.remoteDescription) {
                    peerConnection.addIceCandidate(candidate).catch(e => console.error(e));
                }
            });
        });

        // 相手(Admin)の情報をセット
        const offerDescription = new RTCSessionDescription(offerData);
        await peerConnection.setRemoteDescription(offerDescription);

        // 返答(Answer)を作成してFirebase経由で送り返す
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        const answerData = {
            type: answer.type,
            sdp: answer.sdp
        };
        await set(ref(db, 'broadcast/audio/webrtc/answer'), answerData);
    });

</script>
</body>
</html>
