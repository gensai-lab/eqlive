<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>EQLive Main Switcher</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 1920px; height: 1080px;
            background-color: black;
            overflow: hidden;
            font-family: sans-serif;
        }
        #view-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* === ① L字の背景枠（文字情報・座布団など） === */
        #frame-l-bg {
            position: absolute;
            top: 0; left: 0;
            width: 1920px;
            height: 1080px;
            border: none;
            z-index: 1;
            
            /* フェードによる余韻を残さないため、opacityのtransitionは削除 */
            opacity: 0;
            display: none; /* 完全に描画・イベントをシャットアウト */
            pointer-events: none;
        }
        #frame-l-bg.active {
            opacity: 1;
            display: block;
            pointer-events: auto;
        }

        /* === ② 通常放送（sub-switcher）レイヤー === */
        #frame-sub-switcher {
            position: absolute;
            border: none;
            z-index: 10; /* L字背景より常に前面 */
            
            /* 初期状態：全画面（100%） */
            top: 0px;
            left: 0px;
            width: 1920px;
            height: 1080px;
            transform: scale(1);
            transform-origin: top left;
            
            /* 1.8秒の等速（linear）に統一 */
            transition: 
                top 1.0s linear,
                left 1.0s linear,
                width 1.0s linear,
                height 1.0s linear,
                transform 1.0s linear,
                border-radius 1.0s linear;
        }

        /* === L字ON（l-screenモード）時の変形座標設定 === */
        #frame-sub-switcher.l-mode {
            top: 0px;
            left: 182px;
            width: 1920px;
            height: 1080px;
            transform: scale(0.905); /* 90.5% に縮小 */
            border-bottom-left-radius: 8px;
        }

        /* === 緊急地震速報（最前面） === */
        #frame-eew {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 1300px;
            height: 371px;
            z-index: 999;
            border: none;
            background: transparent;
            pointer-events: none;
        }
        #audio-unlock {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            cursor: pointer;
            font-family: sans-serif;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div id="audio-unlock">
        <div style="margin-bottom: 20px;">音声再生・マイク接続・読み上げ機能を有効にするにはここをクリック</div>
        <div style="font-size: 16px; color: #ccc;">（OBSの場合は「対話」からクリックしてください）</div>
    </div>

    <div id="view-container">
        <iframe id="frame-l-bg" src="l-screen.html"></iframe>
        <iframe id="frame-sub-switcher" src="sub-switcher.html"></iframe>
        <iframe id="frame-eew" src="parts/eew.html"></iframe>
    </div>

    <!-- 音声ソース要素 -->
    <audio id="eew-audio" src="assets/eew-audio.mp3" preload="auto"></audio>
    <audio id="bgm-audio" loop preload="auto"></audio>
    <audio id="mic-audio" autoplay></audio> <!-- WebRTCマイク出力用 -->

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const frameLBg = document.getElementById('frame-l-bg');
    const frameSub = document.getElementById('frame-sub-switcher');
    const eewAudio = document.getElementById('eew-audio');
    const bgmAudio = document.getElementById('bgm-audio');
    const micAudio = document.getElementById('mic-audio');
    const unlockOverlay = document.getElementById('audio-unlock');

    // タイマー管理用変数
    let offTimer = null;
    let ttsLastTimestamp = null;
    
    // WebRTC用変数
    let peerConnection = null;
    const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    // 音声アンロック・初期化処理 (クリック時)
    unlockOverlay.addEventListener('click', () => {
        // 全オーディオ要素をアンロック
        eewAudio.play().then(() => { eewAudio.pause(); eewAudio.currentTime = 0; }).catch(()=>{});
        bgmAudio.play().then(() => { bgmAudio.pause(); }).catch(()=>{});
        
        // Web Speech API の初期化ロック解除 (無音を発声)
        const initUtterance = new SpeechSynthesisUtterance('');
        window.speechSynthesis.speak(initUtterance);
        
        unlockOverlay.style.display = 'none';
        console.log("Audio Systems Unlocked!");
    });

    // === モード切り替えロジック ===
    function applyLayoutMode(viewType) {
        if (offTimer) { clearTimeout(offTimer); offTimer = null; }
        if (viewType === 'l-screen') {
            frameLBg.classList.add('active');   
            frameSub.classList.add('l-mode');   
        } else {
            frameSub.classList.remove('l-mode'); 
            offTimer = setTimeout(() => {
                frameLBg.classList.remove('active');
                offTimer = null;
            }, 1800);
        }
    }

    const modeRef = ref(db, 'broadcast/current_mode');
    onValue(modeRef, (snapshot) => {
        const mode = snapshot.val();
        if (mode) applyLayoutMode(mode);
        else applyLayoutMode('sub-switcher');
    });

    // 内部iFrameからのEEW音声発火指示
    window.addEventListener('message', (event) => {
        if (event.data === 'playEEWAudio') {
            eewAudio.currentTime = 0; 
            eewAudio.play().catch(e => console.warn("EEW音声の再生に失敗しました。"));
        }
    });

    // === 🎵 BGM再生制御 ===
    onValue(ref(db, 'broadcast/audio/bgm'), (snapshot) => {
        const bgmConfig = snapshot.val();
        if(!bgmConfig) return;

        // URLが変更された場合は読み込み直す
        if (bgmConfig.url && !bgmAudio.src.includes(bgmConfig.url)) {
            bgmAudio.src = bgmConfig.url;
        }

        // 音量設定
        bgmAudio.volume = bgmConfig.volume !== undefined ? bgmConfig.volume : 0.5;

        // 再生・停止制御
        if (bgmConfig.isPlaying) {
            bgmAudio.play().catch(e => console.warn("BGM再生ブロック(クリック前): ", e));
        } else {
            bgmAudio.pause();
        }
    });

    // === 🗣️ AI音声読み上げ制御と進捗レポーティング ===
    const ttsStatusRef = ref(db, 'broadcast/audio/tts_status');

    onValue(ref(db, 'broadcast/audio/tts'), (snapshot) => {
        const ttsData = snapshot.val();
        if (ttsData && ttsData.text && ttsData.timestamp !== ttsLastTimestamp) {
            ttsLastTimestamp = ttsData.timestamp;
            
            const fullText = ttsData.text;
            const totalLength = fullText.length;
            // ざっくりとした読み上げ速度（1秒あたり約7文字と仮定）
            const charsPerSecond = 7;
            const initialEta = Math.ceil(totalLength / charsPerSecond);

            // 生成開始のステータスをFirebaseへ送信
            set(ttsStatusRef, {
                status: 'generating',
                progress: 0,
                eta: initialEta,
                currentText: "音声データを準備中..."
            });

            const utterance = new SpeechSynthesisUtterance(fullText);
            utterance.lang = 'ja-JP';

            // 読み上げ開始時
            utterance.onstart = () => {
                set(ttsStatusRef, {
                    status: 'playing',
                    progress: 0,
                    eta: initialEta,
                    currentText: fullText.substring(0, 20) + (totalLength > 20 ? "..." : "")
                });
            };

            // 単語・文の区切り到達時（進捗計算）
            utterance.onboundary = (event) => {
                // charIndex は現在読み上げている箇所の先頭インデックス
                const charIndex = event.charIndex;
                const progressPercent = Math.min(100, Math.floor((charIndex / totalLength) * 100));
                
                const remainingChars = totalLength - charIndex;
                const currentEta = Math.ceil(remainingChars / charsPerSecond);

                // 現在読み上げている箇所から20文字程度を抽出
                const readingStr = fullText.substring(charIndex, charIndex + 25) + (remainingChars > 25 ? "..." : "");

                set(ttsStatusRef, {
                    status: 'playing',
                    progress: progressPercent,
                    eta: currentEta,
                    currentText: readingStr
                });
            };

            // 読み上げ完了時
            utterance.onend = () => {
                set(ttsStatusRef, {
                    status: 'idle',
                    progress: 100,
                    eta: 0,
                    currentText: "待機中"
                });
            };

            // 読み上げエラー時
            utterance.onerror = (e) => {
                console.error("TTS Error:", e);
                set(ttsStatusRef, {
                    status: 'idle',
                    progress: 0,
                    eta: 0,
                    currentText: "読み上げエラーが発生しました"
                });
            };

            window.speechSynthesis.speak(utterance);
        }
    });

    // === 🎤 WebRTC マイク受信制御 ===
    onValue(ref(db, 'broadcast/audio/webrtc/offer'), async (snapshot) => {
        const offerData = snapshot.val();
        if (!offerData) {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            micAudio.srcObject = null;
            return;
        }

        peerConnection = new RTCPeerConnection(servers);

        peerConnection.ontrack = (event) => {
            micAudio.srcObject = event.streams[0];
        };

        peerConnection.onicecandidate = event => {
            if(event.candidate) {
                set(ref(db, `broadcast/audio/webrtc/candidates/main/${Date.now()}`), event.candidate.toJSON());
            }
        };

        onValue(ref(db, 'broadcast/audio/webrtc/candidates/admin'), (iceSnapshot) => {
            iceSnapshot.forEach((childSnapshot) => {
                const candidate = new RTCIceCandidate(childSnapshot.val());
                if(peerConnection.remoteDescription) {
                    peerConnection.addIceCandidate(candidate).catch(e => console.error(e));
                }
            });
        });

        const offerDescription = new RTCSessionDescription(offerData);
        await peerConnection.setRemoteDescription(offerDescription);

        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        const answerData = {
            type: answer.type,
            sdp: answer.sdp
        };
        await set(ref(db, 'broadcast/audio/webrtc/answer'), answerData);
    });

</script>
</body>
</html>
