<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>EQLive Main Switcher</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 1920px; height: 1080px;
            background-color: black;
            overflow: hidden;
            font-family: sans-serif;
        }
        #view-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* === ① L字の背景枠（文字情報・座布団など） === */
        #frame-l-bg {
            position: absolute;
            top: 0; left: 0;
            width: 1920px;
            height: 1080px;
            border: none;
            z-index: 1;
            
            /* フェードによる余韻を残さないため、opacityのtransitionは削除 */
            opacity: 0;
            display: none; /* 完全に描画・イベントをシャットアウト */
            pointer-events: none;
        }
        #frame-l-bg.active {
            opacity: 1;
            display: block;
            pointer-events: auto;
        }

        /* === ② 通常放送（sub-switcher）レイヤー === */
        #frame-sub-switcher {
            position: absolute;
            border: none;
            z-index: 10; /* L字背景より常に前面 */
            
            /* 初期状態：全画面（100%） */
            top: 0px;
            left: 0px;
            width: 1920px;
            height: 1080px;
            transform: scale(1);
            transform-origin: top left;
            
            /* 1.8秒の等速（linear）に統一 */
            transition: 
                top 1.8s linear,
                left 1.8s linear,
                width 1.8s linear,
                height 1.8s linear,
                transform 1.8s linear,
                border-radius 1.8s linear;
        }

        /* === L字ON（l-screenモード）時の変形座標設定 === */
        #frame-sub-switcher.l-mode {
            top: 0px;
            left: 182px;
            width: 1920px;
            height: 1080px;
            transform: scale(0.905); /* 90.5% に縮小 */
            border-bottom-left-radius: 8px;
        }

        /* === 緊急地震速報（最前面） === */
        #frame-eew {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 1300px;
            height: 371px;
            z-index: 999;
            border: none;
            background: transparent;
            pointer-events: none;
        }
        #audio-unlock {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            cursor: pointer;
            font-family: sans-serif;
        }

        /* === 自由配置画像用レイヤー === */
        #free-image-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            z-index: 500;
            pointer-events: none;
        }
        .custom-free-image {
            position: absolute;
            object-fit: contain;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="audio-unlock">音声再生を有効にするにはここをクリック（OBSの場合は「対話」から）</div>

    <div id="view-container">
        <iframe id="frame-l-bg" src="l-screen.html"></iframe>
        
        <iframe id="frame-sub-switcher" src="sub-switcher.html"></iframe>
        
        <div id="free-image-layer"></div>

        <iframe id="frame-eew" src="parts/eew.html"></iframe>
    </div>

    <audio id="eew-audio" src="assets/eew-audio.mp3" preload="auto"></audio>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const frameLBg = document.getElementById('frame-l-bg');
    const frameSub = document.getElementById('frame-sub-switcher');
    const eewAudio = document.getElementById('eew-audio');
    const unlockOverlay = document.getElementById('audio-unlock');
    const imageLayer = document.getElementById('free-image-layer');

    // タイマー管理用変数
    let offTimer = null;

    // 音声アンロック処理
    unlockOverlay.addEventListener('click', () => {
        eewAudio.play().then(() => {
            eewAudio.pause();
            eewAudio.currentTime = 0;
            unlockOverlay.style.display = 'none';
            console.log("Audio Unlocked!");
        }).catch(err => console.error("Unlock failed:", err));
    });

    // === モード切り替えロジック（タイマー制御付き） ===
    function applyLayoutMode(viewType) {
        // 既存のOFF予約タイマーがあれば二重動作を防ぐためクリア
        if (offTimer) {
            clearTimeout(offTimer);
            offTimer = null;
        }

        if (viewType === 'l-screen') {
            // 【ONにするとき】：瞬時にL字背景を出して、subの縮小を開始
            frameLBg.classList.add('active');   
            frameSub.classList.add('l-mode');   
        } else {
            // 【OFFにするとき】：subを全画面に戻し始め、1.8秒（1800ms）後にL字背景をパッと消す
            frameSub.classList.remove('l-mode'); 
            
            offTimer = setTimeout(() => {
                frameLBg.classList.remove('active');
                offTimer = null;
            }, 1800); // 1.8秒の移動アニメーション完了と同時に実行
        }
    }

    const modeRef = ref(db, 'broadcast/current_mode');
    onValue(modeRef, (snapshot) => {
        const mode = snapshot.val();
        if (mode) applyLayoutMode(mode);
        else applyLayoutMode('sub-switcher');
    });

    // === 自由配置画像リストの同期反映 ===
    const freeImagesRef = ref(db, 'broadcast/free_images');
    onValue(freeImagesRef, (snapshot) => {
        const imagesData = snapshot.val();
        imageLayer.innerHTML = "";
        if (imagesData) {
            Object.keys(imagesData).forEach(id => {
                const imgConf = imagesData[id];
                if (imgConf && imgConf.visible && imgConf.url) {
                    const img = document.createElement('img');
                    img.id = `img-node-${id}`;
                    img.className = 'custom-free-image';
                    img.src = imgConf.url;
                    img.style.left = `${imgConf.x !== undefined ? imgConf.x : 0}px`;
                    img.style.top = `${imgConf.y !== undefined ? imgConf.y : 0}px`;
                    img.style.width = `${imgConf.width !== undefined ? imgConf.width : 300}px`;
                    img.style.height = `${imgConf.height !== undefined ? imgConf.height : 'auto'}`;
                    img.style.opacity = (imgConf.opacity !== undefined) ? imgConf.opacity : 1;
                    imageLayer.appendChild(img);
                }
            });
        }
    });

    window.addEventListener('message', (event) => {
        if (event.data === 'playEEWAudio') {
            eewAudio.currentTime = 0; 
            eewAudio.play().catch(e => {
                console.warn("再生に失敗しました。");
            });
        }
    });
</script>
</body>
</html>
