<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>EQLive Main Switcher</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 1920px; height: 1080px;
            background-color: black;
            overflow: hidden;
            font-family: sans-serif;
        }
        #view-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* === ① L字の背景枠（文字情報・座布団など） === */
        /* sub-switcherの背面に配置し、L字ONの時だけ表示させます */
        #frame-l-bg {
            position: absolute;
            top: 0; left: 0;
            width: 1920px;
            height: 1080px;
            border: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.4s ease-out;
            pointer-events: none;
        }
        #frame-l-bg.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* === ② 通常放送（sub-switcher）レイヤー 【主役】 === */
        #frame-sub-switcher {
            position: absolute;
            border: none;
            z-index: 10; /* L字背景より常に前面 */
            
            /* 初期状態：全画面（100%） */
            top: 0px;
            left: 0px;
            width: 1920px;
            height: 1080px;
            transform: scale(1);
            transform-origin: top left;
            
            /* 座標・サイズ・角丸・変形すべてを同じイージングで同期させて滑らかに動かす */
            transition: 
                top 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                left 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                width 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                height 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                border-radius 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* === L字ON（l-screenモード）時の変形座標設定 === */
        /* l-screen.htmlの #main-content の仕様（left: 182px, width: 90.5%, height: 90.5%）に完全同期 */
        #frame-sub-switcher.l-mode {
            top: 0px;
            left: 182px;
            width: 1920px;  /* 内部の1920x1080の解像度・レイアウトを維持 */
            height: 1080px;
            transform: scale(0.905); /* 90.5% に縮小 */
            border-bottom-left-radius: 8px; /* l-screen側のデザインに合わせて左下を角丸に */
        }

        /* === 緊急地震速報（最前面） === */
        #frame-eew {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 1300px;
            height: 371px;
            z-index: 999;
            border: none;
            background: transparent;
            pointer-events: none;
        }
        #audio-unlock {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            cursor: pointer;
            font-family: sans-serif;
        }

        /* === 自由配置画像用レイヤー === */
        #free-image-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            z-index: 500;
            pointer-events: none;
        }
        .custom-free-image {
            position: absolute;
            object-fit: contain;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="audio-unlock">音声再生を有効にするにはここをクリック（OBSの場合は「対話」から）</div>

    <div id="view-container">
        <iframe id="frame-l-bg" src="l-screen.html"></iframe>
        
        <iframe id="frame-sub-switcher" src="sub-switcher.html"></iframe>
        
        <div id="free-image-layer"></div>

        <iframe id="frame-eew" src="parts/eew.html"></iframe>
    </div>

    <audio id="eew-audio" src="assets/eew-audio.mp3" preload="auto"></audio>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const frameLBg = document.getElementById('frame-l-bg');
    const frameSub = document.getElementById('frame-sub-switcher');
    const eewAudio = document.getElementById('eew-audio');
    const unlockOverlay = document.getElementById('audio-unlock');
    const imageLayer = document.getElementById('free-image-layer');

    // 音声アンロック処理
    unlockOverlay.addEventListener('click', () => {
        eewAudio.play().then(() => {
            eewAudio.pause();
            eewAudio.currentTime = 0;
            unlockOverlay.style.display = 'none';
            console.log("Audio Unlocked!");
        }).catch(err => console.error("Unlock failed:", err));
    });

    // === クラスを切り替えることで、フェードを挟まずダイナミックに移動・縮小させる ===
    function applyLayoutMode(viewType) {
        if (viewType === 'l-screen') {
            frameLBg.classList.add('active');   // 背景座布団を表示
            frameSub.classList.add('l-mode');   // sub-switcherをL字指定の座標(左182px, 90.5%)へ移動・縮小
        } else {
            frameLBg.classList.remove('active'); // 背景座布団を非表示
            frameSub.classList.remove('l-mode'); // sub-switcherを全画面(100%)の位置へ戻す
        }
    }

    const modeRef = ref(db, 'broadcast/current_mode');
    onValue(modeRef, (snapshot) => {
        const mode = snapshot.val();
        if (mode) applyLayoutMode(mode);
        else applyLayoutMode('sub-switcher');
    });

    // === 自由配置画像リストの同期反映 ===
    const freeImagesRef = ref(db, 'broadcast/free_images');
    onValue(freeImagesRef, (snapshot) => {
        const imagesData = snapshot.val();
        imageLayer.innerHTML = "";
        if (imagesData) {
            Object.keys(imagesData).forEach(id => {
                const imgConf = imagesData[id];
                if (imgConf && imgConf.visible && imgConf.url) {
                    const img = document.createElement('img');
                    img.id = `img-node-${id}`;
                    img.className = 'custom-free-image';
                    img.src = imgConf.url;
                    img.style.left = `${imgConf.x !== undefined ? imgConf.x : 0}px`;
                    img.style.top = `${imgConf.y !== undefined ? imgConf.y : 0}px`;
                    img.style.width = `${imgConf.width !== undefined ? imgConf.width : 300}px`;
                    img.style.height = `${imgConf.height !== undefined ? imgConf.height : 'auto'}`;
                    img.style.opacity = (imgConf.opacity !== undefined) ? imgConf.opacity : 1;
                    imageLayer.appendChild(img);
                }
            });
        }
    });

    window.addEventListener('message', (event) => {
        if (event.data === 'playEEWAudio') {
            eewAudio.currentTime = 0; 
            eewAudio.play().catch(e => {
                console.warn("再生に失敗しました。");
            });
        }
    });
</script>
</body>
</html>
