<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQLive - Live Display</title>
    <style>
        /* フォントの設定 */
        @font-face {
            font-family: 'UDKakugo';
            src: url('assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            font-family: 'UDKakugo', sans-serif;
        }

        #video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 映像表示エリア */
        video, iframe, img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        
        video {
            object-fit: cover;
        }

        /* 静止画ライブカメラの表示スタイル（画面に合わせて綺麗に収める） */
        img {
            object-fit: contain; /* 必要に応じて画面全体を埋める場合は cover に変更してください */
        }

        /* YouTubeのコントロールバー・ロゴ表示を完全にブロックするマスク */
        #player-guard-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 50;
            background: transparent;
            cursor: none; /* 配信画面にマウスカーソルが乗っても矢印を消す */
        }

        /* 中継テロップ */
        #live-location-overlay {
            position: absolute;
            top: 200px;
            left: 60px;
            display: flex;
            align-items: flex-start; /* アイコンの上端とテキストグループの上端を合わせる */
            color: white;
            z-index: 100;
            transition: opacity 0.3s;
            opacity: 0;
            pointer-events: none;
            filter: drop-shadow(0 0 4px rgba(0,0,0,1)) drop-shadow(0 0 8px rgba(0,0,0,1));
        }

        #live-location-overlay.active {
            opacity: 1;
        }

        .live-icon {
            width: 115px;
            height: auto;
            margin-right: 24px;
            margin-top: -2px; /* アイコンと地名の文字（1行目）の中心を合わせる微調整 */
        }

        /* テキストグループの配置調整（上揃えにして高さを固定） */
        .location-text-group {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            margin-top: 0; 
        }

        /* 地名のスタイル設定 */
        .location-name {
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 0.08em;
            line-height: 1.0; /* 行高を1.0に固定して無駄な上下の余白をカット */
            text-shadow: 
                2px 2px 0 #000, -2px -2px 0 #000,
                -2px 2px 0 #000, 2px -2px 0 #000,
                0px 2px 0 #000, 0px -2px 0 #000,
                -2px 0px 0 #000, 2px 0px 0 #000;
        }

        /* 注釈テキスト（絶対配置にして、地名の表示領域や親要素の高さに影響させない） */
        .location-note {
            position: absolute;
            top: 56px; /* ★地名のフォントサイズ(48px)＋隙間(8px)の位置に固定 */
            left: 0;
            white-space: nowrap;
            font-size: 24px;
            font-weight: bold;
            color: #dddddd;
            line-height: 1.6;
            letter-spacing: 0.04em;
            display: none; /* 初期状態は非表示 */
            text-shadow: 
                2px 2px 0 #000, -2px -2px 0 #000,
                -2px 2px 0 #000, 2px -2px 0 #000,
                0px 2px 0 #000, 0px -2px 0 #000,
                -2px 0px 0 #000, 2px 0px 0 #000;
        }

        /* YouTubeの時だけ注記を表示 */
        .location-note.show {
            display: block;
        }

        #player-target {
            width: 100%;
            height: 100%;
            background-color: black;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<div id="video-container">
    <div id="player-guard-mask"></div>

    <div id="live-location-overlay">
        <img src="assets/live.svg" class="live-icon" alt="中継">
        <div class="location-text-group">
            <span id="target-location-name" class="location-name">---</span>
            <span id="target-location-note" class="location-note">(YouTube配信より)</span>
        </div>
    </div>

    <div id="player-target"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let cameraList = [];
    let currentCameraId = "";
    let hls = null;
    let imageRefreshInterval = null; // 静止画更新用のタイマー管理変数

    async function loadConfig() {
        try {
            const response = await fetch('https://gensai-lab.github.io/eqlive/assets/json/kh-livec.json');
            cameraList = await response.json();
            startSync();
        } catch (e) {
            console.error("JSON Load Error:", e);
        }
    }

    function startSync() {
        onValue(ref(db, 'broadcast/current'), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            // IDが変わった瞬間のみ更新
            if (data.cameraSource !== currentCameraId) {
                updateCamera(data.cameraSource);
            }
        });
    }

    function updateCamera(id) {
        currentCameraId = id;
        const cam = cameraList.find(c => c.id === id);
        const overlay = document.getElementById('live-location-overlay');
        const nameElement = document.getElementById('target-location-name');
        const noteElement = document.getElementById('target-location-note');
        const container = document.getElementById('player-target');

        // 前のHLSインスタンスがあれば破棄
        if (hls) {
            hls.destroy();
            hls = null;
        }

        // 前の静止画定期更新タイマーがあればクリア
        if (imageRefreshInterval) {
            clearInterval(imageRefreshInterval);
            imageRefreshInterval = null;
        }

        container.innerHTML = "";

        if (cam) {
            nameElement.innerText = cam.name;
            overlay.classList.add('active');

            const lowerUrl = cam.url.toLowerCase();

            // ① YouTubeの場合（typeがyoutube、またはURLで判定）
            if (cam.type === 'youtube' || lowerUrl.includes('youtube.com') || lowerUrl.includes('youtu.be')) {
                
                // YouTube配信なので注記を追加
                noteElement.classList.add('show');

                let vidId = "";
                if (cam.url.includes('watch?v=')) {
                    vidId = cam.url.split('watch?v=')[1].split('&')[0];
                } else if (cam.url.includes('youtu.be/')) {
                    vidId = cam.url.split('youtu.be/')[1].split('?')[0];
                } else if (cam.url.includes('embed/')) {
                    vidId = cam.url.split('embed/')[1].split('?')[0];
                } else {
                    vidId = cam.url;
                }

                const embedUrl = `https://www.youtube.com/embed/${vidId}?autoplay=1&mute=1&controls=0&rel=0&iv_load_policy=3&modestbranding=1`;

                container.innerHTML = `
                    <iframe src="${embedUrl}" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                            allowfullscreen>
                    </iframe>`;

            // ② HLSストリーミング配信の場合
            } else if (cam.type === 'hls' || lowerUrl.includes('.m3u8')) {
                
                // YouTubeではないので注記を非表示に
                noteElement.classList.remove('show');

                const video = document.createElement('video');
                video.muted = true;
                video.autoplay = true;
                video.playsInline = true;
                container.appendChild(video);

                if (Hls.isSupported()) {
                    hls = new Hls();
                    hls.loadSource(cam.url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play().catch(e => console.error("Autoplay failed:", e));
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = cam.url;
                    video.addEventListener('loadedmetadata', () => {
                        video.play();
                    });
                }
            
            // ③ 静止画カメラ（URLが .jpg / .jpeg で終わる、またはtypeがwebでURLが画像配信の場合）
            } else if (cam.type === 'web' && (lowerUrl.includes('.jpg') || lowerUrl.includes('.jpeg') || lowerUrl.includes('.png'))) {
    
                noteElement.classList.remove('show');

                const img = document.createElement('img');
                // プロキシの後ろにパラメータを安全に繋ぐため、? ではなく & を使用
                img.src = `${cam.url}&_t=${Date.now()}`;
                img.alt = cam.name;
                container.appendChild(img);

                // 5秒（5000ミリ秒）ごとにURLのタイムスタンプを書き換えて再読み込み
                 imageRefreshInterval = setInterval(() => {
                 img.src = `${cam.url}&_t=${Date.now()}`;
                }, 5000);
                
            // ④ その他のWebソース埋め込み
            } else {
                // 注記を非表示に
                noteElement.classList.remove('show');
                container.innerHTML = `<iframe src="${cam.url}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            }
        } else {
            overlay.classList.remove('active');
            noteElement.classList.remove('show');
        }
    }

    window.onload = loadConfig;
</script>

</body>
</html>
