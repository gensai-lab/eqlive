<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>EQLive 報道画面（送出・映像のみ）</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
/* =========================================================================
   Canvas — 他の送出ページと同じ 1920x1080 固定キャンバス
   (main-switcher.html から iframe で読み込まれる前提。単体で開いても動作する)
   ========================================================================= */
body,html{
  margin:0;padding:0;width:1920px;height:1080px;
  background-color:#000;overflow:hidden;
}
*{box-sizing:border-box}

/* =========================================================================
   メインコンテンツ（カメラ or 画面送出プログラム）
   このファイルは映像のみを担当する。見出し・Ticker・文字スーパー・時計・
   L字の枠合わせは Sub-Switcher 側（既存の parts/*.html・l-screen.html）に任せる。

   シーン切り替え・素材送出・クリア時にフェードするよう、2枚のレイヤーを
   常時重ねておき、新しいコンテンツを裏に描画してからクロスフェードする。
   ========================================================================= */
#main-target{position:absolute;inset:0;width:100%;height:100%;background:#000}
.media-layer{
  position:absolute;inset:0;width:100%;height:100%;background:#000;
  opacity:0;transition:opacity .7s ease;
}
.media-layer.visible{opacity:1}
.media-layer video,.media-layer iframe,.media-layer img{
  position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain;background:#000;
}
#main-target.mode-camera .media-layer video,#main-target.mode-camera .media-layer img{object-fit:cover}

.preview-placeholder{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#02035e;color:#fff;font-size:48px;font-family:sans-serif;
  text-align:center;padding:0 40px;
}
</style>
</head>
<body>

<div id="main-target">
  <div class="media-layer" id="layer-a"></div>
  <div class="media-layer" id="layer-b"></div>
</div>

<script type="module">
/* =========================================================================
   Firebase — news-admin.html と同一プロジェクト・同一パスを参照する
   ========================================================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
  authDomain: "mgl-eqlive.firebaseapp.com",
  databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
  projectId: "mgl-eqlive",
  storageBucket: "mgl-eqlive.firebasestorage.app",
  messagingSenderId: "1060231327645",
  appId: "1:1060231327645:web:642684f4640bbc21d5c974"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* =========================================================================
   State — 2枚のレイヤー(a/b)を交互に使ってクロスフェードする
   ========================================================================= */
const FADE_MS = 700; // CSSのtransition時間と合わせる

const mainTarget = document.getElementById('main-target');
const layers = { a: document.getElementById('layer-a'), b: document.getElementById('layer-b') };
const hlsMap = { a: null, b: null };
let activeKey = 'a';
let currentMediaKey = '';
let cameras = [];

function clearLayer(key) {
  if (hlsMap[key]) { try { hlsMap[key].destroy(); } catch (_) {} hlsMap[key] = null; }
  layers[key].innerHTML = '';
}

// buildFn(container) がその中にメディアを組み立てる。
// hls.Hls インスタンスを作った場合は返り値として返すと、フェードアウト後に
// 自動で破棄される。
function swapTo(buildFn, isCamera) {
  const nextKey = activeKey === 'a' ? 'b' : 'a';
  const prevKey = activeKey;

  clearLayer(nextKey);
  const hlsInstance = buildFn(layers[nextKey]);
  if (hlsInstance) hlsMap[nextKey] = hlsInstance;
  mainTarget.classList.toggle('mode-camera', isCamera);

  // 1フレーム待ってからクラスを切り替えることで、確実にtransitionが発火するようにする
  requestAnimationFrame(() => {
    layers[nextKey].classList.add('visible');
    layers[prevKey].classList.remove('visible');
  });

  activeKey = nextKey;
  setTimeout(() => clearLayer(prevKey), FADE_MS + 100);
}

/* =========================================================================
   カメラ一覧の取得（live-only.html と同じソース・同じフォールバック手順）
   ========================================================================= */
async function fetchKactuifCameras() {
  const targetUrl = 'https://kactuif.ikunocam.net/data';
  try {
    const r = await fetch(targetUrl);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    return (d.streams || []).map(s => ({ id: s.id, name: s.name, area: '', genre: 'akki', type: s.type || 'youtube', url: s.url }));
  } catch (e) {
    try {
      const r2 = await fetch('https://corsproxy.io/?url=' + encodeURIComponent(targetUrl));
      if (!r2.ok) throw new Error(`HTTP ${r2.status}`);
      const d2 = await r2.json();
      return (d2.streams || []).map(s => ({ id: s.id, name: s.name, area: '', genre: 'akki', type: s.type || 'youtube', url: s.url }));
    } catch (_) { return []; }
  }
}
async function loadCameras() {
  let kh = [];
  try {
    const r = await fetch('https://gensai-lab.github.io/eqlive/assets/json/kh-livec.json');
    if (r.ok) kh = await r.json();
  } catch (e) { console.warn('[news-screen] kh-livec.json 取得失敗:', e); }
  const extra = await fetchKactuifCameras();
  cameras = [...kh, ...extra];
}

function extractYoutubeId(url) {
  if (!url) return '';
  if (url.includes('embed/')) return url.split('embed/')[1].split(/[?&]/)[0];
  if (url.includes('watch?v=')) return url.split('watch?v=')[1].split('&')[0];
  if (url.includes('youtu.be/')) return url.split('youtu.be/')[1].split(/[?&]/)[0];
  return url.trim();
}

/* =========================================================================
   メインコンテンツの描画（カメラ / 画面送出プログラム 共通）
   ========================================================================= */
function renderCamera(camId) {
  const key = 'camera:' + camId;
  if (key === currentMediaKey) return;
  currentMediaKey = key;

  const cam = cameras.find(c => c.id === camId);
  swapTo(container => {
    if (!cam) { container.innerHTML = '<div class="preview-placeholder">ライブカメラ未選択</div>'; return null; }

    if (cam.type === 'youtube' || (cam.url || '').includes('youtube.com') || (cam.url || '').includes('youtu.be')) {
      const id = extractYoutubeId(cam.url);
      container.innerHTML = id
        ? `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0&rel=0&iv_load_policy=3&modestbranding=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`
        : '<div class="preview-placeholder">YouTube URLを確認してください</div>';
      return null;
    }
    if (cam.type === 'hls' || (cam.url || '').includes('.m3u8')) {
      const v = document.createElement('video');
      v.autoplay = true; v.muted = true; v.playsInline = true;
      container.appendChild(v);
      if (window.Hls && Hls.isSupported()) {
        const h = new Hls(); h.loadSource(cam.url); h.attachMedia(v);
        return h;
      } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
        v.src = cam.url;
      }
      return null;
    }
    if (cam.type === 'web' || (cam.url || '').match(/\.(jpg|jpeg|png)$/i)) {
      container.innerHTML = `<img src="${cam.url}">`;
      return null;
    }
    container.innerHTML = `<iframe src="${cam.url}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    return null;
  }, true);
}

function renderScreenProgram(sp) {
  const key = 'screen:' + (sp.type || '') + ':' + (sp.url || '');
  if (key === currentMediaKey) return;
  currentMediaKey = key;

  swapTo(container => {
    const type = sp.type || 'image';
    if (!sp.url) { container.innerHTML = '<div class="preview-placeholder">送出準備中</div>'; return null; }

    if (type === 'youtube') {
      const id = extractYoutubeId(sp.url);
      container.innerHTML = id
        ? `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0&rel=0" allow="autoplay; encrypted-media"></iframe>`
        : '<div class="preview-placeholder">YouTube URLを確認してください</div>';
      return null;
    }
    if (type === 'web') {
      container.innerHTML = `<iframe src="${sp.url}" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" style="background:#fff"></iframe>`;
      return null;
    }
    if (type === 'video') {
      const v = document.createElement('video');
      v.autoplay = true; v.muted = sp.muted !== false; v.loop = !!sp.loop; v.playsInline = true;
      container.appendChild(v);
      if (sp.url.includes('.m3u8')) {
        if (window.Hls && Hls.isSupported()) {
          const h = new Hls(); h.loadSource(sp.url); h.attachMedia(v);
          return h;
        }
        v.src = sp.url;
      } else {
        v.src = sp.url;
      }
      return null;
    }
    container.innerHTML = `<img src="${sp.url}">`;
    return null;
  }, false);
}

/* =========================================================================
   broadcast/current — メインソース切替のみを見る
   ========================================================================= */
let latestScreenProgram = {};

onValue(ref(db, 'broadcast/current'), snap => {
  const cur = snap.val() || {};
  if (cur.mainSource === 'camera') {
    renderCamera(cur.cameraSource);
  } else {
    renderScreenProgram(latestScreenProgram);
  }
});

onValue(ref(db, 'broadcast/screen_program'), snap => {
  latestScreenProgram = snap.val() || {};
  if (!mainTarget.classList.contains('mode-camera')) {
    renderScreenProgram(latestScreenProgram);
  }
});

/* =========================================================================
   起動
   ========================================================================= */
loadCameras();
</script>
</body>
</html>
