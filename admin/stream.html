<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQLive 配信管理パネル</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #1e272e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .panel {
            background-color: #2f3640;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { font-size: 1.5rem; margin-bottom: 10px; }
        .current-status {
            font-size: 1.2rem;
            margin: 20px 0;
            padding: 10px;
            border-radius: 6px;
            background-color: #3f4449;
            font-weight: bold;
        }
        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        .btn-start { background-color: #e74c3c; color: white; }
        .btn-stop { background-color: #2ecc71; color: white; }
    </style>
</head>
<body>

    <div class="panel">
        <h1>EQLive 配信ステータス管理</h1>
        <p>ボタンを押すと、公式ホームページの表示がリアルタイムで即時切り替わります。</p>
        
        <div id="currentStatus" class="current-status">現在の状態: 読込中...</div>

        <button class="btn-start" onclick="setStatus('LIVE')">🚨 災害配信モード（開始）</button>
        <button class="btn-stop" onclick="setStatus('NORMAL')">🟢 平時モード（終了）</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

        // 共有いただいたFirebaseのコンフィグを設定
        const firebaseConfig = {
            apiKey: "AIzaSyDkKyt6-FTaVf0xMiXAk7zhtwEkaHl6k04",
            authDomain: "eqlive-steamswitch.firebaseapp.com",
            databaseURL: "https://eqlive-steamswitch-default-rtdb.firebaseio.com",
            projectId: "eqlive-steamswitch",
            storageBucket: "eqlive-steamswitch.firebasestorage.app",
            messagingSenderId: "157690859091",
            appId: "1:157690859091:web:59b39d35608ce38a3780a6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const statusRef = ref(db, 'status/eqlive_status');

        // 現在の状況を画面にリアルタイム表示
        onValue(statusRef, (snapshot) => {
            const data = snapshot.val();
            const statusDiv = document.getElementById('currentStatus');
            if (data === "LIVE") {
                statusDiv.innerText = "現在の状態: 🚨 配信中 (LIVE)";
                statusDiv.style.color = "#e74c3c";
            } else {
                statusDiv.innerText = "現在の状態: 🟢 平時 (NORMAL)";
                statusDiv.style.color = "#2ecc71";
            }
        });

        // ボタンが押されたらFirebaseに書き込む関数
        window.setStatus = function(value) {
            set(statusRef, value).then(() => {
                alert(`ステータスを ${value} に変更しました。`);
            }).catch((error) => {
                alert("エラーが発生しました。Firebaseのセキュリティルールが『テストモード』になっているか確認してください。: " + error.message);
            });
        }
    </script>
</body>
</html>
