<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQLive Admin v2.0 - Pro</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-blue: #0078d4;
            --accent-red: #d13438;
            --text-color: #ffffff;
            --border-color: #333;
            --nav-width: 200px;
        }

        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        /* Header */
        header { 
            padding: 10px 20px; 
            background: #000; 
            border-bottom: 2px solid var(--accent-blue); 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            flex-shrink: 0;
        }

        .header-logo { font-size: 18px; font-weight: bold; }
        .header-logo span { color: #888; font-size: 12px; margin-left: 5px; }

        .status-badge { 
            padding: 4px 10px; 
            border-radius: 4px; 
            font-weight: bold; 
            font-size: 12px; 
            white-space: nowrap;
        }
        .status-normal { background: var(--accent-blue); }
        .status-special { background: var(--accent-red); animation: blink 1s infinite; }

        @keyframes blink { 50% { opacity: 0.5; } }

        /* Main Layout */
        main { display: flex; flex: 1; overflow: hidden; flex-direction: row; }

        /* Navigation */
        nav { 
            width: var(--nav-width); 
            background: #181818; 
            border-right: 1px solid var(--border-color); 
            display: flex; 
            flex-direction: column; 
            flex-shrink: 0;
        }

        nav button { 
            background: transparent; 
            border: none; 
            color: #aaa; 
            padding: 18px 20px; 
            text-align: left; 
            font-size: 15px; 
            cursor: pointer; 
            border-left: 4px solid transparent;
            transition: 0.2s;
        }

        nav button.active { 
            background: #252525; 
            color: white; 
            border-left-color: var(--accent-blue); 
        }

        /* Content Area */
        .content { flex: 1; padding: 20px; overflow-y: auto; box-sizing: border-box; }
        .tab-content { display: none; max-width: 1000px; margin: 0 auto; }
        .tab-content.active { display: block; }

        h2 { font-size: 20px; margin-top: 0; margin-bottom: 20px; color: var(--accent-blue); }

        .card { 
            background: var(--card-bg); 
            border-radius: 8px; 
            padding: 20px; 
            margin-bottom: 20px; 
            border: 1px solid var(--border-color); 
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 15px; 
            margin-bottom: 20px;
        }

        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 13px; font-weight: bold; }
        
        input, select, textarea { 
            width: 100%; 
            background: #2d2d2d; 
            border: 1px solid var(--border-color); 
            color: white; 
            padding: 12px; 
            border-radius: 6px; 
            font-size: 16px;
            box-sizing: border-box; 
        }

        button.primary { 
            background: var(--accent-blue); 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px;
            width: 100%;
        }

        /* Table Optimization */
        .scroll-table { 
            height: 50vh; 
            overflow-y: auto; 
            border: 1px solid var(--border-color); 
            background: #1a1a1a; 
            border-radius: 6px;
        }
        table { width: 100%; border-collapse: collapse; }
        th { background: #252525; position: sticky; top: 0; padding: 12px; text-align: left; border-bottom: 2px solid var(--border-color); z-index: 10; font-size: 13px; }
        td { padding: 14px 12px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        tr:hover { background: #333; }
        tr.selected { background: #004a83 !important; }

        @media (max-width: 900px) {
            main { flex-direction: column; }
            nav { 
                width: 100%; 
                flex-direction: row; 
                border-right: none; 
                border-bottom: 1px solid var(--border-color); 
                overflow-x: auto;
            }
            nav button { 
                flex: 1; 
                text-align: center; 
                padding: 15px 5px; 
                font-size: 13px; 
                border-left: none; 
                border-bottom: 4px solid transparent; 
                white-space: nowrap;
            }
            nav button.active { border-bottom-color: var(--accent-blue); }
            .content { padding: 15px; }
            .scroll-table { height: 40vh; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-logo">EQLive Admin<span>v2.0 Pro</span></div>
    <div id="global-status" class="status-badge status-normal">NORMAL MODE</div>
</header>

<main>
    <nav>
        <button onclick="showTab('broadcast')" id="btn-broadcast" class="active">放送制御</button>
        <button onclick="showTab('screen')" id="btn-screen">投影制御</button>
        <button onclick="showTab('camera')" id="btn-camera">カメラ切替</button>
        <button onclick="showTab('ticker')" id="btn-ticker">テロップ</button>
    </nav>

    <div class="content">
        <div id="tab-broadcast" class="tab-content active">
            <h2>放送制御</h2>
            <div class="grid">
                <div class="card">
                    <label>放送モード</label>
                    <select id="field-mode">
                        <option value="normal">通常時 (Normal)</option>
                        <option value="special">特番 (Special)</option>
                        <option value="training">訓練 (Training)</option>
                    </select>
                </div>
                <div class="card">
                    <label>レイアウト</label>
                    <select id="field-layout">
                        <option value="normal">全画面動画</option>
                        <option value="l_shape">L字放送</option>
                        <option value="tsunami">津波マップ</option>
                        <option value="news">ニュース枠</option>
                    </select>
                </div>
                <div class="card">
                    <label>配信担当</label>
                    <select id="field-statusType">
                        <option value="bot">自動 (Bot)</option>
                        <option value="ningen">手動 (Ningen)</option>
                    </select>
                </div>
            </div>
            <button class="primary" onclick="syncToFirebase()">設定を反映</button>
        </div>

        <div id="tab-screen" class="tab-content">
            <h2>投影制御 (Screen Program)</h2>
            <div class="card">
                <label>投影種別</label>
                <select id="field-screen-type">
                    <option value="none">オフ (None)</option>
                    <option value="youtube">YouTube</option>
                    <option value="image">画像 (URL)</option>
                    <option value="video">動画 (URL/HLS)</option>
                    <option value="screenshare">画面共有 (Screen Share)</option>
                </select>
            </div>
            <div class="card">
                <label>投影ソースURL / ファイルパス</label>
                <input type="text" id="field-screen-url" placeholder="https://www.youtube.com/watch?v=... または画像URL">
            </div>
            <div class="card">
                <label>投影タイトル（テロップ表示名）</label>
                <input type="text" id="field-screen-title" placeholder="例：〇〇地震の解説資料">
            </div>
            <button class="primary" onclick="syncToFirebase()">投影を反映</button>
        </div>

        <div id="tab-camera" class="tab-content">
            <h2>ライブカメラ切替</h2>
            <div class="card" style="padding:12px;">
                <label>現在選択中:</label>
                <input type="text" id="field-cameraId" readonly style="border:none; background:transparent; font-weight:bold; color:var(--accent-blue); padding:0;">
            </div>
            <div class="scroll-table">
                <table id="camera-table">
                    <thead>
                        <tr><th>地点名</th><th>ID</th><th>Type</th></tr>
                    </thead>
                    <tbody id="camera-list-body"></tbody>
                </table>
                <div id="camera-loading">読み込み中...</div>
            </div>
        </div>

        <div id="tab-ticker" class="tab-content">
            <h2>テロップ管理</h2>
            <div class="card">
                <label>メインタイトル</label>
                <input type="text" id="field-mainTitle" placeholder="例：地震速報">
                <label style="margin-top:15px;">サブタイトル</label>
                <input type="text" id="field-subtitle" placeholder="例：避難を心がけてください">
            </div>
            <div class="card">
                <label>詳細テキスト (L字下部)</label>
                <textarea id="field-leftText" rows="4" placeholder="ここに情報を入力"></textarea>
            </div>
            <button class="primary" onclick="syncToFirebase()">テキスト送信</button>
        </div>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974",
        measurementId: "G-BK3MJJ0VR7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let cameraList = [];

    window.showTab = function(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        document.getElementById('btn-' + tabId).classList.add('active');
    };

    // Firebaseデータの購読
    onValue(ref(db, 'broadcast'), (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        // 放送設定
        document.getElementById('field-mode').value = data.current.mode || 'normal';
        document.getElementById('field-layout').value = data.current.layoutMode || 'normal';
        document.getElementById('field-statusType').value = data.current.statusType || 'bot';
        document.getElementById('field-cameraId').value = data.current.cameraSource || '';
        document.getElementById('field-mainTitle').value = data.current.mainTitle || '';
        document.getElementById('field-subtitle').value = data.current.subtitle || '';
        document.getElementById('field-leftText').value = data.l_shape?.leftText || '';

        // 投影設定 (Screen Program)
        if (data.screen_program) {
            document.getElementById('field-screen-type').value = data.screen_program.type || 'none';
            document.getElementById('field-screen-url').value = data.screen_program.url || '';
            document.getElementById('field-screen-title').value = data.screen_program.title || '';
        }

        const statusBadge = document.getElementById('global-status');
        statusBadge.innerText = (data.current.mode || 'NORMAL').toUpperCase() + " MODE";
        statusBadge.className = "status-badge status-" + (data.current.mode === 'special' ? 'special' : 'normal');
        
        highlightSelectedCamera(data.current.cameraSource);
    });

    // Firebaseへの更新同期
    window.syncToFirebase = function() {
        const updates = {};
        // 放送設定
        updates['broadcast/current/mode'] = document.getElementById('field-mode').value;
        updates['broadcast/current/layoutMode'] = document.getElementById('field-layout').value;
        updates['broadcast/current/statusType'] = document.getElementById('field-statusType').value;
        updates['broadcast/current/mainTitle'] = document.getElementById('field-mainTitle').value;
        updates['broadcast/current/subtitle'] = document.getElementById('field-subtitle').value;
        updates['broadcast/l_shape/leftText'] = document.getElementById('field-leftText').value;

        // 投影設定
        updates['broadcast/screen_program/type'] = document.getElementById('field-screen-type').value;
        updates['broadcast/screen_program/url'] = document.getElementById('field-screen-url').value;
        updates['broadcast/screen_program/title'] = document.getElementById('field-screen-title').value;

        updates['broadcast/current/updatedAt'] = Date.now();

        update(ref(db), updates).then(() => {
            alert("設定を送信しました。");
        });
    };

    async function initCameraSwitcher() {
        const loadingMsg = document.getElementById('camera-loading');
        try {
            const res = await fetch('https://gensai-lab.github.io/eqlive/assets/json/kh-livec.json');
            cameraList = await res.json();
            const tbody = document.getElementById('camera-list-body');
            tbody.innerHTML = ""; 

            cameraList.forEach(cam => {
                const tr = document.createElement('tr');
                tr.setAttribute('data-id', cam.id);
                tr.innerHTML = `
                    <td style="font-weight:bold;">${cam.name}</td>
                    <td style="color:#888; font-size:12px;">${cam.id}</td>
                    <td><span style="font-size:10px; background:#444; padding:2px 5px; border-radius:3px;">${cam.type}</span></td>
                `;
                tr.onclick = () => {
                    update(ref(db, 'broadcast/current'), { 
                        cameraSource: cam.id,
                        updatedAt: Date.now()
                    });
                };
                tbody.appendChild(tr);
            });
            loadingMsg.style.display = "none";
        } catch (e) {
            loadingMsg.innerHTML = `<span style="color:var(--accent-red)">読み込みエラー</span>`;
        }
    }

    function highlightSelectedCamera(selectedId) {
        document.querySelectorAll('#camera-list-body tr').forEach(tr => {
            if (tr.getAttribute('data-id') === selectedId) {
                tr.classList.add('selected');
            } else {
                tr.classList.remove('selected');
            }
        });
    }

    window.onload = initCameraSwitcher;
</script>
</body>
</html>
