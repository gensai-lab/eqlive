<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQLive Admin Pro</title>
    <style>
        :root {
            --bg-color: #0f0f0f; --card-bg: #1a1a1a;
            --accent-blue: #0078d4; --accent-red: #d13438;
            --text-color: #f5f5f5; --border-color: #2d2d2d;
            --nav-width: 240px;
        }
        body { font-family: sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { display: none; padding: 0 15px; height: 50px; background: #000; border-bottom: 1px solid var(--border-color); align-items: center; justify-content: space-between; }
        .menu-toggle { background: transparent; border: none; color: white; font-size: 24px; cursor: pointer; }
        main { display: flex; flex: 1; overflow: hidden; position: relative; }
        nav { width: var(--nav-width); background: #111; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 1000; }
        nav button { background: transparent; border: none; color: #888; padding: 18px 20px; text-align: left; font-size: 14px; font-weight: 600; cursor: pointer; border-left: 4px solid transparent; }
        nav button.active { background: #1a1a1a; color: white; border-left-color: var(--accent-blue); }
        .content { flex: 1; padding: 24px; overflow-y: auto; }
        .tab-content { display: none; max-width: 800px; margin: 0 auto; }
        .tab-content.active { display: block; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); position: relative;}
        h2 { font-size: 20px; margin-top: 0; margin-bottom: 20px; border-left: 4px solid var(--accent-blue); padding-left: 10px; }
        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 11px; font-weight: bold; }
        .btn-group { display: flex; gap: 10px; }
        button.primary { background: var(--accent-blue); color: white; border: none; padding: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; flex: 1; }
        button.secondary { background: #333; color: white; border: none; padding: 16px; border-radius: 8px; cursor: pointer; flex: 1; }
        button.danger { background: var(--accent-red); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 12px;}
        .scroll-table { height: 350px; overflow-y: auto; background: #111; border-radius: 8px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #222; position: sticky; top: 0; padding: 12px; text-align: left; font-size: 11px; color: #666; }
        td { padding: 14px 12px; border-bottom: 1px solid var(--border-color); font-size: 14px; cursor: pointer; }
        tr.selected { background: rgba(0, 120, 212, 0.2); color: var(--accent-blue); font-weight: bold; }
        input[type="text"], select { width: 100%; padding: 12px; background: #111; color: white; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; margin-bottom: 10px; }
        .l-item-card { border-left: 4px solid #444; margin-bottom: 15px; padding-left: 15px; background: #222; padding: 15px; border-radius: 8px; }
        .l-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    </style>
</head>
<body>

<header>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <div class="header-logo">EQLive Admin Pro</div>
</header>

<main>
    <nav id="side-nav">
        <button onclick="changeTab('tsunami')" id="btn-tsunami" class="active">津波制御</button>
        <button onclick="changeTab('camera')" id="btn-camera">カメラ切替</button>
        <button onclick="changeTab('lshape')" id="btn-lshape">L字設定</button>
        <button onclick="changeTab('broadcast')" id="btn-broadcast">放送設定</button>
        <div style="margin-top: auto; padding: 20px; font-size: 10px; color: #444;">Kactuif v2.4</div>
    </nav>

    <div class="content">
        <div id="tab-tsunami" class="tab-content active">
            <h2>津波リスト操作</h2>
            <div class="card">
                <label>ページ送り自動/手動</label>
                <div style="display:flex; align-items:center; justify-content:space-between; background:#252525; padding:15px; border-radius:8px; margin-bottom:20px;">
                    <span id="auto-status-text">自動送り：---</span>
                    <button class="secondary" style="width:100px;" onclick="toggleAutoPage()">切替</button>
                </div>
                <div class="btn-group">
                    <button id="btn-prev" class="primary" onclick="manualPageMove('prev')">前のページ</button>
                    <button id="btn-next" class="primary" onclick="manualPageMove('next')">次のページ</button>
                </div>
            </div>
        </div>

        <div id="tab-camera" class="tab-content">
            <h2>ライブカメラ選択</h2>
            <div class="card">
                <label>現在選択中</label>
                <input type="text" id="field-cameraId" readonly style="color:var(--accent-blue); font-weight: bold;">
            </div>
            <div class="scroll-table">
                <table>
                    <thead><tr><th>地点名</th><th>タイプ</th></tr></thead>
                    <tbody id="camera-list-body"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-lshape" class="tab-content">
            <h2>L字表示設定</h2>
            <div class="card">
                <label>左側縦書きテロップ</label>
                <input type="text" id="field-l-leftText" placeholder="例：備えは、知ることから。">
            </div>
            <h2>情報カード（上部スライド）</h2>
            <div id="l-items-container"></div>
            <button class="secondary" style="width:100%; margin-bottom: 20px;" onclick="addLItem()">＋ 新しい情報を追加</button>
            <button class="primary" style="width:100%;" onclick="saveLShape()">L字設定を保存</button>
        </div>

        <div id="tab-broadcast" class="tab-content">
            <h2>マスター・スイッチャー（L字切替）</h2>
            <div class="card">
                <label>番組全体表示モード</label>
                <div class="btn-group">
                    <button id="btn-mode-sub" class="secondary" onclick="updateMainMode('sub-switcher')">通常（全画面）</button>
                    <button id="btn-mode-l" class="secondary" onclick="updateMainMode('l-screen')">L字表示中</button>
                </div>
            </div>

            <h2>画面共有ソース設定</h2>
            <div class="card">
                <label>投影タイトル</label>
                <input type="text" id="field-screen-title">
                <label>メディアの種類</label>
                <select id="select-screen-type">
                    <option value="screenshare">PC画面共有</option>
                    <option value="image">画像URL</option>
                    <option value="video">動画URL</option>
                    <option value="youtube">YouTube</option>
                </select>
                <label>URL / ソース</label>
                <input type="text" id="field-screen-url">
                <button class="primary" style="width:100%;" onclick="updateScreenProgram()">ソース更新</button>
            </div>

            <h2>テロップ / レイアウト</h2>
            <div class="card">
                <label>メインタイトル</label>
                <input type="text" id="field-mainTitle">
                <button class="primary" style="width:100%; margin-bottom:15px;" onclick="updateTitles()">更新</button>
                
                <label>表示シーン（sub-switcher）</label>
                <div class="btn-group">
                    <button id="btn-lay-live" class="secondary" onclick="updateLayout('live')">ライブカメラ</button>
                    <button id="btn-lay-emer" class="secondary" onclick="updateLayout('emergency')">緊急特番</button>
                </div>
            </div>

            <h2>メイン画面ソース / 配信主体</h2>
            <div class="card">
                <label>緊急特番時のソース</label>
                <div class="btn-group" style="margin-bottom:15px;">
                    <button id="btn-src-screen" class="secondary" onclick="updateMainSource('screen')">画面共有</button>
                    <button id="btn-src-camera" class="secondary" onclick="updateMainSource('camera')">ライブカメラ</button>
                </div>
                <label>配信主体</label>
                <div class="btn-group">
                    <button id="btn-dist-bot" class="secondary" onclick="updateDistributor('bot')">Bot配信</button>
                    <button id="btn-dist-human" class="secondary" onclick="updateDistributor('ningen')">有人配信</button>
                </div>
            </div>
        </div>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // ==========================================
    // 1. 設定・URLまとめ
    // ==========================================
    const CONFIG = {
        CAMERA_LIST_URL: 'assets/json/kh-livec.json',
        FIREBASE: {
            apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
            authDomain: "mgl-eqlive.firebaseapp.com",
            databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
            projectId: "mgl-eqlive",
            storageBucket: "mgl-eqlive.firebasestorage.app",
            messagingSenderId: "1060231327645",
            appId: "1:1060231327645:web:642684f4640bbc21d5c974"
        },
        PATHS: {
            BROADCAST: 'broadcast',
            CURRENT: 'broadcast/current',
            L_SHAPE: 'broadcast/l_shape',
            SCREEN: 'broadcast/screen_program',
            MODE: 'broadcast/current_mode',
            TSUNAMI: 'broadcast/tsunami_config'
        }
    };

    const app = initializeApp(CONFIG.FIREBASE);
    const db = getDatabase(app);

    // ==========================================
    // 2. 初期化 & カメラリスト取得
    // ==========================================
    async function initCameras() {
        try {
            const res = await fetch(CONFIG.CAMERA_LIST_URL);
            if (!res.ok) throw new Error("Load failed");
            const list = await res.json();
            const tbody = document.getElementById('camera-list-body');
            tbody.innerHTML = "";
            list.forEach(cam => {
                const tr = document.createElement('tr');
                tr.setAttribute('data-id', cam.id);
                tr.innerHTML = `<td>${cam.name}</td><td style="color:#666; font-size:10px;">${cam.type}</td>`;
                tr.onclick = () => update(ref(db, CONFIG.PATHS.CURRENT), { cameraSource: cam.id });
                tbody.appendChild(tr);
            });
            // 読み込み後に現在の選択状態を反映
            syncCurrentState();
        } catch (e) {
            console.error("Camera List Error:", e);
        }
    }

    // ==========================================
    // 3. データ同期
    // ==========================================
    function syncCurrentState() {
        onValue(ref(db, CONFIG.PATHS.BROADCAST), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const cur = data.current || {};
            const screen = data.screen_program || {};
            const mode = data.current_mode || 'sub-switcher';
            const lshape = data.l_shape || { leftText: "", topItems: [] };

            // モード・レイアウト・ソースの強調表示
            updateBtnClass('btn-mode-sub', mode === 'sub-switcher');
            updateBtnClass('btn-mode-l', mode === 'l-screen');
            updateBtnClass('btn-lay-live', cur.layoutMode === 'live');
            updateBtnClass('btn-lay-emer', cur.layoutMode === 'emergency');
            updateBtnClass('btn-src-screen', cur.mainSource === 'screen');
            updateBtnClass('btn-src-camera', cur.mainSource === 'camera');
            updateBtnClass('btn-dist-bot', cur.distributor === 'bot');
            updateBtnClass('btn-dist-human', cur.distributor === 'ningen');

            // フィールド同期（フォーカス時は除く）
            if(document.activeElement.id !== 'field-mainTitle') document.getElementById('field-mainTitle').value = cur.mainTitle || '';
            if(document.activeElement.id !== 'field-screen-title') document.getElementById('field-screen-title').value = screen.title || '';
            if(document.activeElement.id !== 'field-screen-url') document.getElementById('field-screen-url').value = screen.url || '';
            document.getElementById('select-screen-type').value = screen.type || 'screenshare';
            
            // カメラ選択
            document.getElementById('field-cameraId').value = cur.cameraSource || '';
            document.querySelectorAll('#camera-list-body tr').forEach(tr => {
                tr.classList.toggle('selected', tr.getAttribute('data-id') === cur.cameraSource);
            });

            // 津波
            const isAuto = data.tsunami_config?.autoPage !== false;
            const statusEl = document.getElementById('auto-status-text');
            statusEl.innerText = isAuto ? "自動送り：ON" : "自動送り：OFF";
            statusEl.style.color = isAuto ? "var(--accent-blue)" : "var(--accent-red)";

            // L字（初回または同期時のみ）
            if (!window.lItemsEditing) {
                document.getElementById('field-l-leftText').value = lshape.leftText || "";
                renderLItems(lshape.topItems || []);
            }
        });
    }

    function updateBtnClass(id, isActive) {
        const btn = document.getElementById(id);
        if (btn) btn.className = isActive ? 'primary' : 'secondary';
    }

    // ==========================================
    // 4. アクション関数
    // ==========================================
    window.updateMainMode = (mode) => set(ref(db, CONFIG.PATHS.MODE), mode);
    window.updateLayout = (mode) => update(ref(db, CONFIG.PATHS.CURRENT), { layoutMode: mode });
    window.updateMainSource = (source) => update(ref(db, CONFIG.PATHS.CURRENT), { mainSource: source });
    window.updateDistributor = (type) => update(ref(db, CONFIG.PATHS.CURRENT), { distributor: type });
    window.updateTitles = () => update(ref(db, CONFIG.PATHS.CURRENT), { mainTitle: document.getElementById('field-mainTitle').value });
    window.toggleAutoPage = () => {
        const isAuto = document.getElementById('auto-status-text').innerText.includes("ON");
        update(ref(db, CONFIG.PATHS.TSUNAMI), { autoPage: !isAuto });
    };
    window.manualPageMove = (dir) => update(ref(db, CONFIG.PATHS.TSUNAMI), { manualTrigger: { direction: dir, timestamp: Date.now() } });
    
    window.updateScreenProgram = () => {
        update(ref(db, CONFIG.PATHS.SCREEN), {
            title: document.getElementById('field-screen-title').value,
            type: document.getElementById('select-screen-type').value,
            url: document.getElementById('field-screen-url').value
        });
    };

    // --- L字アイテム操作 ---
    window.addLItem = () => {
        window.lItemsEditing = true;
        const container = document.getElementById('l-items-container');
        container.appendChild(createItemDOM("", "", container.children.length));
    };
    window.saveLShape = () => {
        const topItems = Array.from(document.querySelectorAll('.l-item-card')).map(card => ({
            genre: card.querySelector('.l-genre-input').value,
            text: card.querySelector('.l-text-input').value
        }));
        set(ref(db, CONFIG.PATHS.L_SHAPE), {
            leftText: document.getElementById('field-l-leftText').value,
            topItems: topItems
        }).then(() => {
            alert("保存完了");
            window.lItemsEditing = false;
        });
    };

    function renderLItems(items) {
        const container = document.getElementById('l-items-container');
        container.innerHTML = "";
        items.forEach((item, index) => container.appendChild(createItemDOM(item.genre, item.text, index)));
    }

    function createItemDOM(genre = "", text = "", index) {
        const div = document.createElement('div');
        div.className = "l-item-card";
        div.innerHTML = `<div class="l-item-header"><label>#${index+1}</label><button class="danger" onclick="this.closest('.l-item-card').remove()">削除</button></div>
                         <input type="text" class="l-genre-input" value="${genre}" placeholder="ジャンル">
                         <input type="text" class="l-text-input" value="${text}" placeholder="内容">`;
        div.querySelectorAll('input').forEach(i => i.onfocus = () => window.lItemsEditing = true);
        return div;
    }

    // UI操作用
    window.toggleMenu = () => document.getElementById('side-nav').classList.toggle('open');
    window.changeTab = (id) => {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + id).classList.add('active');
        document.getElementById('btn-' + id).classList.add('active');
    };

    window.onload = initCameras;
</script>
</body>
</html>
