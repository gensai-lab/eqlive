<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQLive Admin Pro</title>
    <style>
        :root {
            --bg-color: #0f0f0f; --card-bg: #1a1a1a;
            --accent-blue: #0078d4; --accent-red: #d13438;
            --text-color: #f5f5f5; --border-color: #2d2d2d;
            --nav-width: 240px;
        }
        body { font-family: sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { display: none; padding: 0 15px; height: 50px; background: #000; border-bottom: 1px solid var(--border-color); align-items: center; justify-content: space-between; }
        .menu-toggle { background: transparent; border: none; color: white; font-size: 24px; cursor: pointer; }
        main { display: flex; flex: 1; overflow: hidden; position: relative; }
        nav { width: var(--nav-width); background: #111; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; transition: transform 0.3s ease; z-index: 1000; }
        nav button { background: transparent; border: none; color: #888; padding: 18px 20px; text-align: left; font-size: 14px; font-weight: 600; cursor: pointer; border-left: 4px solid transparent; }
        nav button.active { background: #1a1a1a; color: white; border-left-color: var(--accent-blue); }
        .content { flex: 1; padding: 24px; overflow-y: auto; }
        .tab-content { display: none; max-width: 800px; margin: 0 auto; }
        .tab-content.active { display: block; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); position: relative;}
        h2 { font-size: 20px; margin-top: 0; margin-bottom: 20px; border-left: 4px solid var(--accent-blue); padding-left: 10px; }
        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 11px; font-weight: bold; }
        .btn-group { display: flex; gap: 10px; }
        button.primary { background: var(--accent-blue); color: white; border: none; padding: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; flex: 1; }
        button.secondary { background: #333; color: white; border: none; padding: 16px; border-radius: 8px; cursor: pointer; flex: 1; }
        button.danger { background: var(--accent-red); color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 12px;}
        button:disabled { opacity: 0.3; }
        .scroll-table { height: 350px; overflow-y: auto; background: #111; border-radius: 8px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #222; position: sticky; top: 0; padding: 12px; text-align: left; font-size: 11px; color: #666; }
        td { padding: 14px 12px; border-bottom: 1px solid var(--border-color); font-size: 14px; cursor: pointer; }
        tr.selected { background: rgba(0, 120, 212, 0.2); color: var(--accent-blue); font-weight: bold; }
        input[type="text"] { width: 100%; padding: 12px; background: #111; color: white; border: 1px solid var(--border-color); border-radius: 8px; box-sizing: border-box; margin-bottom: 10px; }
        
        /* L字カード用スタイル */
        .l-item-card { border-left: 4px solid #444; margin-bottom: 15px; padding-left: 15px; background: #222; padding: 15px; border-radius: 8px; }
        .l-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

        @media (max-width: 768px) { header { display: flex; } nav { position: absolute; transform: translateX(-100%); } nav.open { transform: translateX(0); } .btn-group { flex-direction: column; } }
    </style>
</head>
<body>

<header>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <div class="header-logo">EQLive Admin</div>
    <div style="width: 24px;"></div>
</header>

<main>
    <nav id="side-nav">
        <button onclick="changeTab('tsunami')" id="btn-tsunami" class="active">津波制御</button>
        <button onclick="changeTab('camera')" id="btn-camera">カメラ切替</button>
        <button onclick="changeTab('lshape')" id="btn-lshape">L字設定</button>
        <button onclick="changeTab('broadcast')" id="btn-broadcast">放送設定</button>
        <div style="margin-top: auto; padding: 20px; font-size: 10px; color: #444;">Kactuif v2.2</div>
    </nav>

    <div class="content">
        <div id="tab-tsunami" class="tab-content active">
            <h2>津波リスト操作</h2>
            <div class="card">
                <label>ページ送り自動/手動</label>
                <div style="display:flex; align-items:center; justify-content:space-between; background:#252525; padding:15px; border-radius:8px; margin-bottom:20px;">
                    <span id="auto-status-text">自動送り：ON</span>
                    <button class="secondary" style="width:100px;" onclick="toggleAutoPage()">切替</button>
                </div>
                <label>手動操作（自動送りOFF時）</label>
                <div class="btn-group">
                    <button id="btn-prev" class="primary" onclick="manualPageMove('prev')" disabled>前のページ</button>
                    <button id="btn-next" class="primary" onclick="manualPageMove('next')" disabled>次のページ</button>
                </div>
            </div>
        </div>

        <div id="tab-camera" class="tab-content">
            <h2>ライブカメラ選択</h2>
            <div class="card">
                <label>現在選択中</label>
                <input type="text" id="field-cameraId" readonly style="color:var(--accent-blue); font-weight: bold;">
            </div>
            <div class="scroll-table">
                <table>
                    <thead><tr><th>地点名</th><th>タイプ</th></tr></thead>
                    <tbody id="camera-list-body"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-lshape" class="tab-content">
            <h2>L字表示設定</h2>
            <div class="card">
                <label>左側縦書きテロップ</label>
                <input type="text" id="field-l-leftText" placeholder="例：備えは、知ることから。みんなの減災ラボ">
            </div>

            <h2>情報カード（上部スライド）</h2>
            <div id="l-items-container">
                </div>
            <button class="secondary" style="width:100%; margin-bottom: 20px;" onclick="addLItem()">＋ 新しい情報を追加</button>
            <button class="primary" style="width:100%; position: sticky; bottom: 0; box-shadow: 0 -5px 15px rgba(0,0,0,0.5);" onclick="saveLShape()">L字設定をすべて保存</button>
        </div>

        <div id="tab-broadcast" class="tab-content">
            <h2>テロップ編集（title.html）</h2>
            <div class="card">
                <label>サブタイトル</label>
                <input type="text" id="field-subtitle" placeholder="例：ニュース特報">
                <label>メインタイトル</label>
                <input type="text" id="field-mainTitle" placeholder="例：大規模な津波の恐れ">
                <button class="primary" style="width:100%; margin-top: 10px;" onclick="updateTitles()">テロップを更新</button>
            </div>

            <h2>全体レイアウト（sub-switcher）</h2>
            <div class="card">
                <label>表示シーン</label>
                <div class="btn-group">
                    <button id="btn-lay-live" class="secondary" onclick="updateLayout('live')">通常ライブカメラ</button>
                    <button id="btn-lay-emer" class="secondary" onclick="updateLayout('emergency')">緊急特番モード</button>
                </div>
            </div>

            <h2>メイン画面ソース（emergency内）</h2>
            <div class="card">
                <label>コンテンツ選択</label>
                <div class="btn-group">
                    <button id="btn-src-screen" class="secondary" onclick="updateMainSource('screen')">画面共有</button>
                    <button id="btn-src-camera" class="secondary" onclick="updateMainSource('camera')">ライブカメラ</button>
                </div>
            </div>

            <h2>配信主体（parts/time表示）</h2>
            <div class="card">
                <label>バッジ切り替え</label>
                <div class="btn-group">
                    <button id="btn-dist-bot" class="secondary" onclick="updateDistributor('bot')">Bot配信</button>
                    <button id="btn-dist-human" class="secondary" onclick="updateDistributor('ningen')">有人配信</button>
                </div>
            </div>
        </div>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.toggleMenu = () => document.getElementById('side-nav').classList.toggle('open');
    window.changeTab = (id) => {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + id).classList.add('active');
        document.getElementById('btn-' + id).classList.add('active');
        if (window.innerWidth <= 768) toggleMenu();
    };

    // Firebase リアルタイム更新監視
    onValue(ref(db, 'broadcast'), (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        const current = data.current || {};
        const tsunami = data.tsunami_config || {};
        const lshape = data.l_shape || { leftText: "", topItems: [] };

        // 津波設定
        const isAuto = tsunami.autoPage !== false;
        document.getElementById('auto-status-text').innerText = isAuto ? "自動送り：ON" : "自動送り：OFF";
        document.getElementById('auto-status-text').style.color = isAuto ? "var(--accent-blue)" : "var(--accent-red)";
        document.getElementById('btn-prev').disabled = document.getElementById('btn-next').disabled = isAuto;

        // カメラ設定
        document.getElementById('field-cameraId').value = current.cameraSource || '';
        highlightSelectedCamera(current.cameraSource);

        // テロップ内容
        document.getElementById('field-subtitle').value = current.subtitle || '';
        document.getElementById('field-mainTitle').value = current.mainTitle || '';

        // L字設定の反映（一度だけ実行、または手動更新を考慮して空の場合のみ反映）
        const lTitleField = document.getElementById('field-l-leftText');
        if (document.activeElement !== lTitleField) {
            lTitleField.value = lshape.leftText || "";
        }
        
        // カードリストの描画（編集中の衝突を避けるため、初回か明示的な同期が必要な場合のみ）
        if (!window.lItemsEditing) {
            renderLItems(lshape.topItems || []);
        }

        // レイアウト選択状態
        const lay = current.layoutMode || 'live';
        document.getElementById('btn-lay-live').className = (lay === 'live') ? 'primary' : 'secondary';
        document.getElementById('btn-lay-emer').className = (lay === 'emergency') ? 'primary' : 'secondary';

        // メイン画面ソース状態
        const src = current.mainSource || 'screen';
        document.getElementById('btn-src-screen').className = (src === 'screen') ? 'primary' : 'secondary';
        document.getElementById('btn-src-camera').className = (src === 'camera') ? 'primary' : 'secondary';

        // 配信主体状態
        const dist = current.distributor || 'bot';
        document.getElementById('btn-dist-bot').className = (dist === 'bot') ? 'primary' : 'secondary';
        document.getElementById('btn-dist-human').className = (dist === 'ningen') ? 'primary' : 'secondary';
    });

    // --- L字設定ロジック ---
    function renderLItems(items) {
        const container = document.getElementById('l-items-container');
        container.innerHTML = "";
        items.forEach((item, index) => {
            container.appendChild(createItemDOM(item.genre, item.text, index));
        });
    }

    function createItemDOM(genre = "", text = "", index) {
        const div = document.createElement('div');
        div.className = "l-item-card";
        div.innerHTML = `
            <div class="l-item-header">
                <label>情報 #${index + 1}</label>
                <button class="danger" onclick="removeLItem(this)">削除</button>
            </div>
            <label>ジャンル</label>
            <input type="text" class="l-genre-input" value="${genre}" placeholder="例：地震">
            <label>内容</label>
            <input type="text" class="l-text-input" value="${text}" placeholder="例：現在、大きな地震は発生していません">
        `;
        // 入力開始したら自動同期を止める
        div.querySelectorAll('input').forEach(input => {
            input.onfocus = () => { window.lItemsEditing = true; };
        });
        return div;
    }

    window.addLItem = () => {
        window.lItemsEditing = true;
        const container = document.getElementById('l-items-container');
        container.appendChild(createItemDOM("", "", container.children.length));
    };

    window.removeLItem = (btn) => {
        window.lItemsEditing = true;
        btn.closest('.l-item-card').remove();
    };

    window.saveLShape = () => {
        const leftText = document.getElementById('field-l-leftText').value;
        const cards = document.querySelectorAll('.l-item-card');
        const topItems = Array.from(cards).map(card => ({
            genre: card.querySelector('.l-genre-input').value,
            text: card.querySelector('.l-text-input').value
        }));

        set(ref(db, 'broadcast/l_shape'), {
            leftText: leftText,
            topItems: topItems
        }).then(() => {
            alert("L字設定を保存しました。");
            window.lItemsEditing = false;
        });
    };

    // --- その他既存機能 ---
    window.updateTitles = () => {
        update(ref(db, 'broadcast/current'), {
            subtitle: document.getElementById('field-subtitle').value,
            mainTitle: document.getElementById('field-mainTitle').value
        });
    };

    window.toggleAutoPage = () => {
        const isAuto = document.getElementById('auto-status-text').innerText.includes("ON");
        update(ref(db, 'broadcast/tsunami_config'), { autoPage: !isAuto });
    };

    window.manualPageMove = (dir) => {
        update(ref(db, 'broadcast/tsunami_config'), { manualTrigger: { direction: dir, timestamp: Date.now() } });
    };

    window.updateLayout = (mode) => {
        update(ref(db, 'broadcast/current'), { layoutMode: mode });
    };

    window.updateMainSource = (source) => {
        update(ref(db, 'broadcast/current'), { mainSource: source });
    };

    window.updateDistributor = (type) => {
        update(ref(db, 'broadcast/current'), { distributor: type });
    };

    async function initCameras() {
        try {
            const res = await fetch('https://gensai-lab.github.io/eqlive/assets/json/kh-livec.json');
            const list = await res.json();
            const tbody = document.getElementById('camera-list-body');
            tbody.innerHTML = "";
            list.forEach(cam => {
                const tr = document.createElement('tr');
                tr.setAttribute('data-id', cam.id);
                tr.innerHTML = `<td>${cam.name}</td><td style="color:#666; font-size:10px;">${cam.type}</td>`;
                tr.onclick = () => update(ref(db, 'broadcast/current'), { cameraSource: cam.id });
                tbody.appendChild(tr);
            });
        } catch (e) { console.error("Camera list load failed", e); }
    }

    function highlightSelectedCamera(id) {
        document.querySelectorAll('#camera-list-body tr').forEach(tr => {
            tr.classList.toggle('selected', tr.getAttribute('data-id') === id);
        });
    }

    window.onload = initCameras;
</script>
</body>
</html>
