<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQLive Admin Pro</title>
    <style>
        :root {
            --bg-color: #0f0f0f; --card-bg: #1a1a1a;
            --accent-blue: #0078d4; --accent-red: #d13438;
            --text-color: #f5f5f5; --border-color: #2d2d2d;
            --nav-width: 240px;
        }
        body { font-family: sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        nav { width: var(--nav-width); background: #111; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        nav button { background: transparent; border: none; color: #888; padding: 20px; text-align: left; cursor: pointer; border-left: 4px solid transparent; }
        nav button.active { background: #1a1a1a; color: white; border-left-color: var(--accent-blue); }
        .content { flex: 1; padding: 24px; overflow-y: auto; }
        .tab-content { display: none; max-width: 800px; margin: 0 auto; }
        .tab-content.active { display: block; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 12px; font-weight: bold; }
        input, select { width: 100%; background: #252525; border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 8px; margin-bottom: 16px; }
        .btn-group { display: flex; gap: 10px; }
        button.primary { background: var(--accent-blue); color: white; border: none; padding: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; flex: 1; }
        button.secondary { background: #333; color: white; border: none; padding: 16px; border-radius: 8px; cursor: pointer; flex: 1; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
    </style>
</head>
<body>

<nav>
    <button onclick="changeTab('tsunami')" id="btn-tsunami" class="active">津波制御</button>
    <button onclick="changeTab('broadcast')">放送制御</button>
</nav>

<div class="content">
    <div id="tab-tsunami" class="tab-content active">
        <h2>津波リスト制御</h2>
        <div class="card">
            <label>ヘッダー種別</label>
            <select id="field-tsunami-grade">
                <option value="ot">大津波警報 (ot)</option>
                <option value="kt">津波警報 (kt)</option>
                <option value="ct">津波注意報 (ct)</option>
            </select>
            <button class="primary" onclick="syncTsunamiConfig()">ヘッダー反映</button>

            <hr style="border:0; border-top:1px solid #333; margin:20px 0;">

            <label>送り設定</label>
            <div style="display:flex; align-items:center; justify-content:space-between; background:#252525; padding:15px; border-radius:8px;">
                <span id="auto-status-text">自動送り：ON</span>
                <button id="btn-toggle-auto" class="secondary" style="width:100px;" onclick="toggleAutoPage()">切替</button>
            </div>

            <label style="margin-top:20px;">手動操作</label>
            <div class="btn-group">
                <button id="btn-prev" class="secondary" onclick="manualPageMove('prev')" disabled>前へ</button>
                <button id="btn-next" class="secondary" onclick="manualPageMove('next')" disabled>次へ</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.changeTab = (id) => {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + id).classList.add('active');
    };

    onValue(ref(db, 'broadcast/tsunami_config'), (snapshot) => {
        const config = snapshot.val();
        if (!config) return;
        document.getElementById('field-tsunami-grade').value = config.grade || 'ot';
        
        const isAuto = config.autoPage !== false;
        const statusText = document.getElementById('auto-status-text');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');

        if (isAuto) {
            statusText.innerText = "自動送り：ON"; statusText.style.color = "var(--accent-blue)";
            btnPrev.disabled = btnNext.disabled = true;
        } else {
            statusText.innerText = "自動送り：OFF"; statusText.style.color = "var(--accent-red)";
            btnPrev.disabled = btnNext.disabled = false;
        }
    });

    window.syncTsunamiConfig = () => {
        update(ref(db, 'broadcast/tsunami_config'), { grade: document.getElementById('field-tsunami-grade').value });
    };

    window.toggleAutoPage = () => {
        const isAuto = document.getElementById('auto-status-text').innerText.includes("ON");
        update(ref(db, 'broadcast/tsunami_config'), { autoPage: !isAuto });
    };

    window.manualPageMove = (dir) => {
        update(ref(db, 'broadcast/tsunami_config'), { 
            manualTrigger: { direction: dir, timestamp: Date.now() } 
        });
    };
</script>
</body>
</html>
