<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQLive Command Center - Admin 2.0</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-blue: #0078d4;
            --accent-red: #d13438;
            --text-color: #ffffff;
            --border-color: #333;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header */
        header {
            padding: 15px 25px;
            background: #000;
            border-bottom: 2px solid var(--accent-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
        }

        .status-normal { background: var(--accent-blue); }
        .status-special { background: var(--accent-red); animation: blink 1s infinite; }

        @keyframes blink { 50% { opacity: 0.5; } }

        /* Main Layout */
        main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar Tabs */
        nav {
            width: 200px;
            background: #181818;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        nav button {
            background: transparent;
            border: none;
            color: #aaa;
            padding: 20px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            border-left: 4px solid transparent;
        }

        nav button.active {
            background: #252525;
            color: white;
            border-left-color: var(--accent-blue);
        }

        /* Content Area */
        .content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }

        h2 { margin-top: 0; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }

        /* Form Elements */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 14px; }
        input, select, textarea {
            width: 100%;
            background: #2d2d2d;
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button.primary {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Camera List Table */
        .scroll-table { height: 400px; overflow-y: auto; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #252525; position: sticky; top: 0; padding: 10px; text-align: left; }
        td { padding: 8px 10px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        tr:hover { background: #2d2d2d; cursor: pointer; }
        tr.selected { background: #004a83; }

    </style>
</head>
<body>

<header>
    <div style="font-size: 20px; font-weight: bold;">EQLive Admin <span style="color:#888; font-size:14px;">v2.0</span></div>
    <div id="global-status" class="status-badge status-normal">NORMAL MODE</div>
</header>

<main>
    <nav>
        <button onclick="showTab('broadcast')" id="btn-broadcast" class="active">放送制御</button>
        <button onclick="showTab('camera')" id="btn-camera">カメラ切替</button>
        <button onclick="showTab('ticker')" id="btn-ticker">テロップ・情報</button>
    </nav>

    <div class="content">
        <div id="tab-broadcast" class="tab-content active">
            <h2>放送制御パネル</h2>
            <div class="grid">
                <div class="card">
                    <label>放送モード</label>
                    <select id="field-mode" onchange="syncToFirebase()">
                        <option value="normal">通常時 (Normal)</option>
                        <option value="special">特番 (Special)</option>
                        <option value="training">訓練 (Training)</option>
                    </select>
                </div>
                <div class="card">
                    <label>レイアウト</label>
                    <select id="field-layout" onchange="syncToFirebase()">
                        <option value="normal">全画面動画</option>
                        <option value="l_shape">L字放送</option>
                        <option value="tsunami">津波マップ</option>
                        <option value="news">ニュース枠</option>
                    </select>
                </div>
                <div class="card">
                    <label>オペレーター</label>
                    <select id="field-statusType" onchange="syncToFirebase()">
                        <option value="bot">自動 (Bot)</option>
                        <option value="ningen">手動 (Ningen)</option>
                    </select>
                </div>
            </div>
            <div class="card">
                <label>番組スケジュール連動</label>
                <div style="display:flex; align-items:center; gap:20px;">
                    <button id="btn-weather" onclick="toggleWeather()" class="primary" style="background:#444;">天気予報モード: OFF</button>
                    <span style="color:#888;">※毎時55分に自動でONにする機能のテスト用</span>
                </div>
            </div>
        </div>

        <div id="tab-camera" class="tab-content">
            <h2>ライブカメラ・スイッチャー</h2>
            <div class="card">
                <label>現在選択中のカメラID</label>
                <input type="text" id="field-cameraId" readonly style="font-weight:bold; color:var(--accent-blue);">
            </div>
            <div class="scroll-table">
                <table id="camera-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>地点名</th>
                            <th>URL</th>
                        </tr>
                    </thead>
                    <tbody id="camera-list-body">
                        </tbody>
                </table>
            </div>
        </div>

        <div id="tab-ticker" class="tab-content">
            <h2>テロップ・テキスト管理</h2>
            <div class="card">
                <div class="form-group">
                    <label>メインタイトル</label>
                    <input type="text" id="field-mainTitle" onchange="syncToFirebase()">
                </div>
                <div class="form-group">
                    <label>サブタイトル</label>
                    <input type="text" id="field-subtitle" onchange="syncToFirebase()">
                </div>
            </div>
            <div class="card">
                <label>下部テロップ (L字用など)</label>
                <textarea id="field-leftText" rows="3" onchange="syncToFirebase()"></textarea>
            </div>
        </div>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let cameraList = [];
    let isWeather = false;

    // --- タブ切り替えロジック ---
    window.showTab = function(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        document.getElementById('btn-' + tabId).classList.add('active');
    };

    // --- Firebaseデータ読み込み (初期表示) ---
    onValue(ref(db, 'broadcast'), (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        const current = data.current;
        document.getElementById('field-mode').value = current.mode;
        document.getElementById('field-layout').value = current.layoutMode;
        document.getElementById('field-statusType').value = current.statusType;
        document.getElementById('field-cameraId').value = current.cameraSource;
        document.getElementById('field-mainTitle').value = current.mainTitle;
        document.getElementById('field-subtitle').value = current.subtitle;
        document.getElementById('field-leftText').value = data.l_shape.leftText;

        // ヘッダーの状態表示更新
        const statusBadge = document.getElementById('global-status');
        if(current.mode === 'special') {
            statusBadge.innerText = "SPECIAL MODE";
            statusBadge.className = "status-badge status-special";
        } else {
            statusBadge.innerText = current.mode.toUpperCase() + " MODE";
            statusBadge.className = "status-badge status-normal";
        }

        // 天気フラグ
        isWeather = data.schedule.isWeatherTime;
        const wBtn = document.getElementById('btn-weather');
        wBtn.innerText = `天気予報モード: ${isWeather ? 'ON' : 'OFF'}`;
        wBtn.style.background = isWeather ? '#d13438' : '#444';
    });

    // --- Firebaseへ保存 ---
    window.syncToFirebase = function() {
        const updates = {};
        updates['broadcast/current/mode'] = document.getElementById('field-mode').value;
        updates['broadcast/current/layoutMode'] = document.getElementById('field-layout').value;
        updates['broadcast/current/statusType'] = document.getElementById('field-statusType').value;
        updates['broadcast/current/mainTitle'] = document.getElementById('field-mainTitle').value;
        updates['broadcast/current/subtitle'] = document.getElementById('field-subtitle').value;
        updates['broadcast/l_shape/leftText'] = document.getElementById('field-leftText').value;
        updates['broadcast/current/updatedAt'] = Date.now();

        update(ref(db), updates);
    };

    window.toggleWeather = function() {
        update(ref(db, 'broadcast/schedule'), { isWeatherTime: !isWeather });
    };

    // --- カメラリスト読み込みとスイッチ ---
    async function initCameraSwitcher() {
        try {
            const res = await fetch('assets/json/kh-livec.json');
            cameraList = await res.json();
            const tbody = document.getElementById('camera-list-body');
            
            cameraList.forEach(cam => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${cam.id}</td><td>${cam.name}</td><td>${cam.url.substring(0,30)}...</td>`;
                tr.onclick = () => {
                    update(ref(db, 'broadcast/current'), { cameraSource: cam.id });
                    // 選択状態の見た目更新
                    document.querySelectorAll('#camera-table tr').forEach(r => r.classList.remove('selected'));
                    tr.classList.add('selected');
                };
                tbody.appendChild(tr);
            });
        } catch (e) { console.error("Camera JSON load failed", e); }
    }

    initCameraSwitcher();
</script>

</body>
</html>
