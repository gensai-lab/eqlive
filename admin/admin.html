<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kactuif EQLive Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="apple-touch-icon" href="https://gensai-lab.github.io/eqlive/assets/logo/app-icon.png">
    <style>
        :root {
            --bg-color: #0a0a0a; --sidebar-bg: #151515; --card-bg: #1e1e1e;
            --accent-blue: #005AFF; --accent-red: #d13438; --accent-green: #107c10;
            --text-main: #ffffff; --text-sub: #aaaaaa;
            --header-height: 60px; --nav-width: 260px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; font-family: 'BIZ UDPGothic', sans-serif;
            background: var(--bg-color); color: var(--text-main);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* --- Header --- */
        header {
            height: var(--header-height); background: #000; border-bottom: 1px solid #333;
            display: flex; align-items: center; justify-content: space-between; padding: 0 15px; 
            z-index: 1200; /* ナビより上に設定 */
            flex-shrink: 0;
        }
        .menu-toggle { background: none; border: none; color: white; cursor: pointer; display: none; padding: 8px; }
        .header-logo img { height: 28px; }

        /* --- Layout --- */
        main { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* Sidebar Navigation */
        nav {
            width: var(--nav-width); background: var(--sidebar-bg); border-right: 1px solid #333;
            display: flex; flex-direction: column; overflow-y: auto; transition: transform 0.3s ease;
            z-index: 1100;
        }
        
        .nav-item {
            background: none; border: none; color: var(--text-sub); padding: 14px 20px;
            text-align: left; font-size: 14px; cursor: pointer; border-left: 4px solid transparent;
            display: flex; align-items: center; gap: 12px; transition: 0.2s;
            font-family: inherit;
        }
        .nav-item i { font-size: 20px; }
        .nav-item.active { background: rgba(0, 90, 255, 0.1); color: white; border-left-color: var(--accent-blue); }
        .nav-item:hover { background: #252525; }

        /* --- Content Area --- */
        .content { flex: 1; padding: 25px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .tab-content { display: none; max-width: 1000px; margin: 0 auto; }
        .tab-content.active { display: block; }

        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; }
        
        h2 { font-size: 18px; margin: 0 0 18px 0; display: flex; align-items: center; gap: 10px; color: var(--accent-blue); }
        label { display: block; color: var(--text-sub); font-size: 12px; margin-bottom: 8px; font-weight: bold; }
        
        input, select, textarea {
            width: 100%; padding: 14px; background: #000; border: 1px solid #444; 
            color: white; border-radius: 8px; font-size: 16px; margin-bottom: 15px; font-family: inherit;
        }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        button.primary { background: var(--accent-blue); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; flex: 1; font-weight: bold; font-family: inherit; }
        button.secondary { background: #333; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; flex: 1; font-family: inherit; }
        button.danger { background: var(--accent-red); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; flex: 1; font-family: inherit; }

        /* --- Responsive & Fixes --- */
        @media (max-width: 900px) {
            .menu-toggle { display: flex; }
            nav { 
                position: absolute; left: 0; 
                top: 0; /* ヘッダーの下ではなく上から配置（z-indexで調整） */
                padding-top: var(--header-height); /* メニュー項目がヘッダーと重ならないように */
                height: 100%; transform: translateX(-100%); 
            }
            nav.open { transform: translateX(0); box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
            .content { padding: 15px; }
            .nav-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; }
            .nav-overlay.active { display: block; }
        }
    </style>
</head>
<body>

<header>
    <button class="menu-toggle" onclick="toggleNav()"><i class="material-icons">menu</i></button>
    <div class="header-logo">
        <img src="https://gensai-lab.github.io/eqlive/assets/logo/logo-ptn1_white.svg" alt="EQLive">
    </div>
    <div style="width:40px;"></div>
</header>

<div class="nav-overlay" id="nav-overlay" onclick="toggleNav()"></div>

<main>
    <nav id="side-nav">
        <button class="nav-item active" onclick="switchTab('main')"><i class="material-icons">dashboard</i>メイン画面</button>
        <button class="nav-item" onclick="switchTab('mode')"><i class="material-icons">person_search</i>配信モード選択</button>
        <button class="nav-item" onclick="switchTab('display')"><i class="material-icons">screenshot_monitor</i>画面表示</button>
        <button class="nav-item" onclick="switchTab('title')"><i class="material-icons">subtitles</i>タイトル</button>
        <button class="nav-item" onclick="switchTab('ticker')"><i class="material-icons">view_carousel</i>Ticker</button>
        <button class="nav-item" onclick="switchTab('l-shape')"><i class="material-icons">view_quilt</i>L字設定</button>
        <button class="nav-item" onclick="switchTab('camera')"><i class="material-icons">videocam</i>ライブカメラ</button>
        <button class="nav-item" onclick="switchTab('tsunami')"><i class="material-icons">tsunami</i>津波制御</button>
        <button class="nav-item" onclick="window.open('https://gensai-lab.studio.site/', '_blank')"><i class="material-icons">description</i>原稿 ↗</button>
    </nav>

    <div class="content">
        <div id="tab-main" class="tab-content active">
            <h2>ダッシュボード</h2>
            <div class="card">
                <label>配信ステータス</label>
                <p id="stat-dist">担当: --</p>
                <p id="stat-mode">モード: --</p>
                <p id="stat-cam">カメラ: --</p>
            </div>
        </div>

        <div id="tab-mode" class="tab-content">
            <h2>配信担当選択</h2>
            <div class="card">
                <label>配信主体 (distributor)</label>
                <select id="input-distributor" onchange="toggleNingen()">
                    <option value="bot">🤖 自動 (Bot)</option>
                    <option value="ningen">👤 有人 (人間)</option>
                </select>
                <div id="ningen-area" style="display:none;">
                    <label>担当者</label>
                    <select id="input-operator">
                        <option value="Kabeya">壁谷 來夢</option>
                        <option value="Tsuboguchi">坪口 冬真</option>
                    </select>
                </div>
                <button class="primary" onclick="saveDist()">設定を反映</button>
            </div>
        </div>

        <div id="tab-display" class="tab-content">
            <h2>画面ソース・レイアウト</h2>
            <div class="card">
                <label>基本モード</label>
                <div class="btn-group">
                    <button id="btn-lay-live" class="secondary" onclick="updateFB('current/layoutMode','live')">通常</button>
                    <button id="btn-lay-emer" class="secondary" onclick="updateFB('current/layoutMode','emergency')">有事</button>
                </div>
            </div>
            <div class="card">
                <label>L字表示</label>
                <div class="btn-group">
                    <button id="btn-m-sub" class="secondary" onclick="updateFB('current_mode','sub-switcher')">OFF</button>
                    <button id="btn-m-l" class="secondary" onclick="updateFB('current_mode','l-screen')">ON</button>
                </div>
            </div>
            <div class="card">
                <label>メインソース</label>
                <select id="input-mainSource" onchange="updateFB('current/mainSource', this.value)">
                    <option value="camera">📹 ライブカメラ</option>
                    <option value="screen">📺 画面投影</option>
                </select>
            </div>
        </div>

        <div id="tab-title" class="tab-content">
            <h2>タイトル編集</h2>
            <div class="card">
                <label>メインタイトル</label>
                <input type="text" id="input-mainTitle">
                <label>サブタイトル</label>
                <input type="text" id="input-subtitle">
                <div class="btn-group">
                    <button class="primary" onclick="saveTitle()">反映</button>
                    <button class="danger" onclick="clearTitle()">クリア</button>
                </div>
            </div>
        </div>

        <div id="tab-ticker" class="tab-content">
            <h2>Ticker本文</h2>
            <div class="card">
                <input type="text" id="input-tic-g" placeholder="ジャンル">
                <input type="text" id="input-tic-1" placeholder="1行目">
                <input type="text" id="input-tic-2" placeholder="2行目">
                <button class="primary" onclick="saveTicker()">反映</button>
            </div>
        </div>

        <div id="tab-l-shape" class="tab-content">
            <h2>L字詳細設定</h2>
            <div class="card">
                <label>左側縦書きテキスト</label>
                <input type="text" id="input-l-leftText">
            </div>
            <div id="l-items-container"></div>
            <button class="secondary" style="width:100%; margin-bottom:10px;" onclick="addLItem()">＋ カード追加</button>
            <button class="primary" style="width:100%;" onclick="saveLShape()">Firebaseへ保存</button>
        </div>

        <div id="tab-camera" class="tab-content">
            <h2>カメラ切替</h2>
            <div class="card">
                <div id="cam-list" style="height:400px; overflow-y:auto; background:#000; border-radius:8px;"></div>
            </div>
        </div>

        <div id="tab-tsunami" class="tab-content">
            <h2>津波制御</h2>
            <div class="card">
                <div id="tsu-status" style="text-align:center; padding:15px; font-weight:bold; margin-bottom:10px;">--</div>
                <div class="btn-group">
                    <button class="primary" onclick="triggerTsu('prev')">前へ</button>
                    <button class="primary" onclick="triggerTsu('next')">次へ</button>
                </div>
            </div>
        </div>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- UI Logic ---
    window.toggleNav = () => {
        document.getElementById('side-nav').classList.toggle('open');
        document.getElementById('nav-overlay').classList.toggle('active');
    };

    window.switchTab = (id) => {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById(`tab-${id}`).classList.add('active');
        event.currentTarget.classList.add('active');
        if(window.innerWidth <= 900) toggleNav();
    };

    window.toggleNingen = () => {
        document.getElementById('ningen-area').style.display = 
            (document.getElementById('input-distributor').value === 'ningen') ? 'block' : 'none';
    };

    // --- Firebase Write ---
    window.updateFB = (path, val) => set(ref(db, `broadcast/${path}`), val);

    window.saveDist = () => {
        const d = document.getElementById('input-distributor').value;
        const o = document.getElementById('input-operator').value;
        update(ref(db, 'broadcast/current'), { distributor: d, operator: (d==='bot'?"System":o) });
    };

    window.saveTitle = () => {
        update(ref(db, 'broadcast/current'), {
            mainTitle: document.getElementById('input-mainTitle').value,
            subtitle: document.getElementById('input-subtitle').value
        });
    };

    window.clearTitle = () => update(ref(db, 'broadcast/current'), { mainTitle: "", subtitle: "" });

    window.saveTicker = () => {
        update(ref(db, 'broadcast/manual_news'), {
            genre: document.getElementById('input-tic-g').value,
            line1: document.getElementById('input-tic-1').value,
            line2: document.getElementById('input-tic-2').value
        });
    };

    // --- L-Shape Logic (修正済：階層構造で保存) ---
    let localLItems = [];
    window.addLItem = () => { localLItems.push({genre:"", text:""}); renderLItems(); };
    window.removeLItem = (i) => { localLItems.splice(i,1); renderLItems(); };

    function renderLItems() {
        const container = document.getElementById('l-items-container');
        container.innerHTML = "";
        localLItems.forEach((item, i) => {
            const div = document.createElement('div');
            div.style.cssText = "background:#2a2a2a; padding:15px; border-radius:8px; margin-bottom:10px; border:1px solid #444;";
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                    <label>カード #${i}</label>
                    <button class="danger" style="padding:4px 8px; font-size:10px;" onclick="removeLItem(${i})">削除</button>
                </div>
                <input type="text" value="${item.genre}" placeholder="ジャンル" onchange="localLItems[${i}].genre=this.value">
                <input type="text" value="${item.text}" placeholder="内容" onchange="localLItems[${i}].text=this.value">
            `;
            container.appendChild(div);
        });
    }

    window.saveLShape = () => {
        // topItemsを配列ではなく、指定の階層構造オブジェクトとして保存
        const topItemsObj = {};
        localLItems.forEach((item, index) => {
            topItemsObj[index] = {
                genre: item.genre,
                text: item.text
            };
        });

        // 既存のデータを上書きして構造を維持
        set(ref(db, 'broadcast/l_shape'), {
            leftText: document.getElementById('input-l-leftText').value,
            topItems: topItemsObj
        }).then(() => alert("L字設定を更新しました"));
    };

    window.triggerTsu = (dir) => {
        update(ref(db, 'broadcast/tsunami_config/manualTrigger'), { direction: dir, timestamp: Date.now() });
    };

    // --- Data Sync ---
    onValue(ref(db, 'broadcast'), (snapshot) => {
        const data = snapshot.val();
        if(!data) return;

        const cur = data.current || {};
        document.getElementById('stat-dist').innerText = `担当: ${cur.distributor} (${cur.operator})`;
        document.getElementById('stat-mode').innerText = `モード: ${cur.layoutMode}`;
        document.getElementById('stat-cam').innerText = `カメラ: ${cur.cameraSource}`;

        const setBtn = (id, cond) => {
            const el = document.getElementById(id);
            if(el) el.className = cond ? "primary" : "secondary";
        };
        setBtn('btn-lay-live', cur.layoutMode === 'live');
        setBtn('btn-lay-emer', cur.layoutMode === 'emergency');
        setBtn('btn-m-sub', data.current_mode === 'sub-switcher');
        setBtn('btn-m-l', data.current_mode === 'l-screen');

        const syncField = (id, val) => {
            const el = document.getElementById(id);
            if(el && document.activeElement !== el) el.value = val || "";
        };
        syncField('input-mainTitle', cur.mainTitle);
        syncField('input-subtitle', cur.subtitle);
        syncField('input-tic-g', data.manual_news.genre);
        syncField('input-tic-1', data.manual_news.line1);
        syncField('input-tic-2', data.manual_news.line2);

        // L-Shape Sync
        if(data.l_shape && document.activeElement.tagName !== 'INPUT') {
            syncField('input-l-leftText', data.l_shape.leftText);
            const items = data.l_shape.topItems;
            if(items) {
                // オブジェクト形式(0:{...}, 1:{...})を配列に戻して管理
                localLItems = Object.keys(items).map(key => items[key]);
                renderLItems();
            }
        }
    });

    async function init() {
        const res = await fetch("https://gensai-lab.github.io/eqlive/assets/json/kh-livec.json");
        const cams = await res.json();
        const list = document.getElementById('cam-list');
        cams.forEach(c => {
            const d = document.createElement('div');
            d.style.cssText = "padding:15px; border-bottom:1px solid #222; cursor:pointer;";
            d.innerHTML = `<div>${c.name}</div><small style="color:#666">${c.id} / ${c.type}</small>`;
            d.onclick = () => updateFB('current/cameraSource', c.id);
            list.appendChild(d);
        });
    }
    init();
</script>
</body>
</html>
