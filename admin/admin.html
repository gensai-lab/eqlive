<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQLive Admin Pro</title>
    <style>
        :root {
            --bg-color: #0f0f0f; --card-bg: #1a1a1a;
            --accent-blue: #0078d4; --accent-red: #d13438;
            --text-color: #f5f5f5; --border-color: #2d2d2d;
            --nav-width: 240px;
            --header-height: 60px;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background: var(--bg-color); color: var(--text-color); 
            margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; 
        }

        header { 
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; height: var(--header-height); 
            background: #000; border-bottom: 1px solid var(--border-color); 
            flex-shrink: 0; z-index: 1100;
        }

        .menu-toggle { 
            background: transparent; border: none; color: white; 
            font-size: 28px; cursor: pointer; padding: 5px 10px;
        }

        .header-logo { font-weight: bold; font-size: 18px; letter-spacing: 1px; }

        main { display: flex; flex: 1; overflow: hidden; position: relative; }

        nav { 
            width: var(--nav-width); background: #111; 
            border-right: 1px solid var(--border-color); 
            display: flex; flex-direction: column; 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }

        nav button { 
            background: transparent; border: none; color: #888; 
            padding: 20px; text-align: left; font-size: 15px; font-weight: 600; 
            cursor: pointer; border-left: 4px solid transparent; transition: 0.2s;
        }

        nav button.active { background: #1a1a1a; color: white; border-left-color: var(--accent-blue); }

        .content { flex: 1; padding: 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .tab-content { display: none; max-width: 900px; margin: 0 auto; }
        .tab-content.active { display: block; }

        .card { 
            background: var(--card-bg); border-radius: 12px; padding: 20px; 
            margin-bottom: 20px; border: 1px solid var(--border-color); 
        }

        h2 { font-size: 18px; margin: 0 0 20px 0; border-left: 4px solid var(--accent-blue); padding-left: 12px; }
        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 12px; font-weight: bold; }

        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        button { font-family: inherit; transition: opacity 0.2s; border: none; border-radius: 8px; cursor: pointer; }
        button:active { opacity: 0.7; }
        button.primary { background: var(--accent-blue); color: white; padding: 14px; font-weight: bold; flex: 1; }
        button.secondary { background: #333; color: white; padding: 14px; flex: 1; }
        button.danger { background: var(--accent-red); color: white; padding: 8px 12px; font-size: 12px;}
        
        input[type="text"], select { 
            width: 100%; padding: 14px; background: #000; color: white; 
            border: 1px solid var(--border-color); border-radius: 8px; 
            box-sizing: border-box; margin-bottom: 15px; font-size: 16px;
        }

        .scroll-table { height: 400px; overflow-y: auto; background: #000; border-radius: 8px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #222; position: sticky; top: 0; padding: 12px; text-align: left; font-size: 12px; color: #777; z-index: 10; }
        td { padding: 15px 12px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        tr.selected { background: rgba(0, 120, 212, 0.25); color: var(--accent-blue); font-weight: bold; }

        .l-item-card { border-left: 4px solid #444; margin-bottom: 15px; padding: 15px; background: #222; border-radius: 8px; }
        .l-item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }

        @media (max-width: 900px) {
            nav { position: absolute; height: 100%; transform: translateX(-100%); }
            nav.open { transform: translateX(0); box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
            .content { padding: 15px; }
            .btn-group { flex-direction: column; }
            .btn-group button { width: 100%; }
        }

        #overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 999;
        }
        #overlay.active { display: block; }
    </style>
</head>
<body>

<header>
    <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    <div class="header-logo">EQLive Admin</div>
    <div style="width: 48px;"></div>
</header>

<div id="overlay" onclick="toggleMenu()"></div>

<main>
    <nav id="side-nav">
        <button onclick="changeTab('tsunami')" id="btn-tsunami" class="active">🌊 津波制御</button>
        <button onclick="changeTab('camera')" id="btn-camera">📹 カメラ切替</button>
        <button onclick="changeTab('lshape')" id="btn-lshape">📺 L字設定</button>
        <button onclick="changeTab('broadcast')" id="btn-broadcast">📡 放送設定</button>
        <div style="margin-top: auto; padding: 20px; font-size: 11px; color: #555; text-align: center; border-top: 1px solid #222;">Kactuif Admin v2.6</div>
    </nav>

    <div class="content">
        <div id="tab-tsunami" class="tab-content active">
            <h2>津波リスト操作</h2>
            <div class="card">
                <label>ページ送り設定</label>
                <div style="display:flex; align-items:center; justify-content:space-between; background:#252525; padding:15px; border-radius:8px; margin-bottom:20px;">
                    <span id="auto-status-text" style="font-weight: bold;">自動送り：---</span>
                    <button class="secondary" style="width:80px; padding:10px;" onclick="toggleAutoPage()">切替</button>
                </div>
                <div class="btn-group">
                    <button id="btn-prev" class="primary" onclick="manualPageMove('prev')">前のページ</button>
                    <button id="btn-next" class="primary" onclick="manualPageMove('next')">次のページ</button>
                </div>
            </div>
        </div>

        <div id="tab-camera" class="tab-content">
            <h2>ライブカメラ選択</h2>
            <div class="card">
                <label>選択中のID</label>
                <input type="text" id="field-cameraId" readonly style="color:var(--accent-blue); font-weight: bold; background:#111;">
            </div>
            <div class="scroll-table">
                <table>
                    <thead><tr><th>地点名</th><th>種別</th></tr></thead>
                    <tbody id="camera-list-body"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-lshape" class="tab-content">
            <h2>L字表示詳細設定</h2>
            <div class="card">
                <label>左側縦書きテロップ（キャッチコピー等）</label>
                <input type="text" id="field-l-leftText" placeholder="例：備えは、知ることから。">
            </div>
            <h2>情報カード（スライド）</h2>
            <div id="l-items-container"></div>
            <button class="secondary" style="width:100%; margin-bottom: 15px;" onclick="addLItem()">＋ 情報を追加</button>
            <button class="primary" style="width:100%;" onclick="saveLShape()">L字設定をFirebaseに保存</button>
        </div>

        <div id="tab-broadcast" class="tab-content">
            <h2>番組マスター・スイッチャー</h2>
            <div class="card">
                <label>メイン画面モード（全体）</label>
                <div class="btn-group">
                    <button id="btn-mode-sub" class="secondary" onclick="updateMainMode('sub-switcher')">通常 (16:9)</button>
                    <button id="btn-mode-l" class="secondary" onclick="updateMainMode('l-screen')">L字型画面</button>
                </div>
            </div>

            <h2>画面共有ソース (screen-program)</h2>
            <div class="card">
                <label>オーバーレイ・タイトル</label>
                <input type="text" id="field-screen-title" placeholder="例：今後の津波の予想">
                <label>投影メディア種別</label>
                <select id="select-screen-type">
                    <option value="screenshare">PC画面共有</option>
                    <option value="image">画像URL</option>
                    <option value="video">動画URL (mp4/m3u8)</option>
                    <option value="youtube">YouTube URL</option>
                </select>
                <label>ソースURL</label>
                <input type="text" id="field-screen-url" placeholder="https://...">
                <button class="primary" style="width:100%;" onclick="updateScreenProgram()">ソースを反映</button>
            </div>

            <h2>特番レイアウト設定</h2>
            <div class="card">
                <label>テロップ：メインタイトル</label>
                <input type="text" id="field-mainTitle" placeholder="例：緊急地震速報">
                <label>テロップ：サブタイトル</label>
                <input type="text" id="field-subTitle" placeholder="例：強い揺れに警戒してください">
                <button class="primary" style="width:100%; margin-bottom:20px;" onclick="updateTitles()">タイトル・字幕更新</button>

                <label>サブスイッチャー表示シーン</label>
                <div class="btn-group">
                    <button id="btn-lay-live" class="secondary" onclick="updateLayout('live')">通常カメラのみ</button>
                    <button id="btn-lay-emer" class="secondary" onclick="updateLayout('emergency')">緊急特番レイアウト</button>
                </div>
                <label>特番時の小画面ソース</label>
                <div class="btn-group">
                    <button id="btn-src-screen" class="secondary" onclick="updateMainSource('screen')">画面共有</button>
                    <button id="btn-src-camera" class="secondary" onclick="updateMainSource('camera')">ライブカメラ</button>
                </div>
            </div>
            
            <div class="card">
                <label>配信主体表示</label>
                <div class="btn-group">
                    <button id="btn-dist-bot" class="secondary" onclick="updateDistributor('bot')">🤖 自動(Bot)</button>
                    <button id="btn-dist-human" class="secondary" onclick="updateDistributor('ningen')">👤 有人</button>
                </div>
            </div>
        </div>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const CONFIG = {
        CAMERA_LIST_URL: 'https://gensai-lab.github.io/eqlive/assets/json/kh-livec.json',
        FIREBASE: {
            apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
            authDomain: "mgl-eqlive.firebaseapp.com",
            databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
            projectId: "mgl-eqlive",
            storageBucket: "mgl-eqlive.firebasestorage.app",
            messagingSenderId: "1060231327645",
            appId: "1:1060231327645:web:642684f4640bbc21d5c974"
        },
        PATHS: {
            BROADCAST: 'broadcast',
            CURRENT: 'broadcast/current',
            L_SHAPE: 'broadcast/l_shape',
            SCREEN: 'broadcast/screen_program',
            MODE: 'broadcast/current_mode',
            TSUNAMI: 'broadcast/tsunami_config'
        }
    };

    const app = initializeApp(CONFIG.FIREBASE);
    const db = getDatabase(app);

    window.toggleMenu = () => {
        document.getElementById('side-nav').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('active');
    };

    window.changeTab = (id) => {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + id).classList.add('active');
        document.getElementById('btn-' + id).classList.add('active');
        if (window.innerWidth <= 900) toggleMenu();
    };

    async function initCameras() {
        try {
            const res = await fetch(CONFIG.CAMERA_LIST_URL);
            const list = await res.json();
            const tbody = document.getElementById('camera-list-body');
            tbody.innerHTML = "";
            list.forEach(cam => {
                const tr = document.createElement('tr');
                tr.setAttribute('data-id', cam.id);
                tr.innerHTML = `<td>${cam.name}</td><td style="color:#777; font-size:11px;">${cam.type}</td>`;
                tr.onclick = () => update(ref(db, CONFIG.PATHS.CURRENT), { cameraSource: cam.id });
                tbody.appendChild(tr);
            });
            syncCurrentState();
        } catch (e) { console.error("Camera List Load Failed"); }
    }

    function syncCurrentState() {
        onValue(ref(db, CONFIG.PATHS.BROADCAST), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const cur = data.current || {};
            const screen = data.screen_program || {};
            const mode = data.current_mode || 'sub-switcher';
            const lshape = data.l_shape || { leftText: "", topItems: [] };

            const setBtn = (id, active) => {
                const el = document.getElementById(id);
                if(el) el.className = active ? 'primary' : 'secondary';
            };

            setBtn('btn-mode-sub', mode === 'sub-switcher');
            setBtn('btn-mode-l', mode === 'l-screen');
            setBtn('btn-lay-live', cur.layoutMode === 'live');
            setBtn('btn-lay-emer', cur.layoutMode === 'emergency');
            setBtn('btn-src-screen', cur.mainSource === 'screen');
            setBtn('btn-src-camera', cur.mainSource === 'camera');
            setBtn('btn-dist-bot', cur.distributor === 'bot');
            setBtn('btn-dist-human', cur.distributor === 'ningen');

            const syncField = (id, val) => {
                const el = document.getElementById(id);
                if (el && document.activeElement !== el) el.value = val || '';
            };

            syncField('field-mainTitle', cur.mainTitle);
            syncField('field-subTitle', cur.subtitle); // サブタイトルの同期
            syncField('field-screen-title', screen.title);
            syncField('field-screen-url', screen.url);
            document.getElementById('select-screen-type').value = screen.type || 'screenshare';
            
            document.getElementById('field-cameraId').value = cur.cameraSource || '';
            document.querySelectorAll('#camera-list-body tr').forEach(tr => {
                tr.classList.toggle('selected', tr.getAttribute('data-id') === cur.cameraSource);
            });

            const isAuto = data.tsunami_config?.autoPage !== false;
            document.getElementById('auto-status-text').innerText = isAuto ? "自動送り：ON" : "自動送り：OFF";
            document.getElementById('auto-status-text').style.color = isAuto ? "var(--accent-blue)" : "var(--accent-red)";
            document.getElementById('btn-prev').disabled = document.getElementById('btn-next').disabled = isAuto;

            if (!window.lItemsEditing) {
                document.getElementById('field-l-leftText').value = lshape.leftText || "";
                renderLItems(lshape.topItems || []);
            }
        });
    }

    window.updateMainMode = (mode) => set(ref(db, CONFIG.PATHS.MODE), mode);
    window.updateLayout = (mode) => update(ref(db, CONFIG.PATHS.CURRENT), { layoutMode: mode });
    window.updateMainSource = (source) => update(ref(db, CONFIG.PATHS.CURRENT), { mainSource: source });
    window.updateDistributor = (type) => update(ref(db, CONFIG.PATHS.CURRENT), { distributor: type });
    
    // メインタイトルとサブタイトルを同時に更新
    window.updateTitles = () => {
        update(ref(db, CONFIG.PATHS.CURRENT), { 
            mainTitle: document.getElementById('field-mainTitle').value,
            subtitle: document.getElementById('field-subTitle').value 
        }).then(() => alert("テロップを更新しました"));
    };
    
    window.updateScreenProgram = () => {
        update(ref(db, CONFIG.PATHS.SCREEN), {
            title: document.getElementById('field-screen-title').value,
            type: document.getElementById('select-screen-type').value,
            url: document.getElementById('field-screen-url').value
        }).then(() => alert("同期しました"));
    };

    window.toggleAutoPage = () => {
        const isAuto = document.getElementById('auto-status-text').innerText.includes("ON");
        update(ref(db, CONFIG.PATHS.TSUNAMI), { autoPage: !isAuto });
    };

    window.manualPageMove = (dir) => {
        update(ref(db, CONFIG.PATHS.TSUNAMI), { manualTrigger: { direction: dir, timestamp: Date.now() } });
    };

    function renderLItems(items) {
        const container = document.getElementById('l-items-container');
        container.innerHTML = "";
        items.forEach((item, index) => container.appendChild(createItemDOM(item.genre, item.text, index)));
    }

    function createItemDOM(genre = "", text = "", index) {
        const div = document.createElement('div');
        div.className = "l-item-card";
        div.innerHTML = `<div class="l-item-header"><label>情報 #${index+1}</label><button class="danger" onclick="this.closest('.l-item-card').remove()">削除</button></div>
                         <input type="text" class="l-genre-input" value="${genre}" placeholder="ジャンル">
                         <input type="text" class="l-text-input" value="${text}" placeholder="内容">`;
        div.querySelectorAll('input').forEach(i => i.onfocus = () => window.lItemsEditing = true);
        return div;
    }

    window.addLItem = () => {
        window.lItemsEditing = true;
        document.getElementById('l-items-container').appendChild(createItemDOM("", "", 99));
    };

    window.saveLShape = () => {
        const topItems = Array.from(document.querySelectorAll('.l-item-card')).map(card => ({
            genre: card.querySelector('.l-genre-input').value,
            text: card.querySelector('.l-text-input').value
        }));
        set(ref(db, CONFIG.PATHS.L_SHAPE), {
            leftText: document.getElementById('field-l-leftText').value,
            topItems: topItems
        }).then(() => {
            alert("保存しました");
            window.lItemsEditing = false;
        });
    };

    window.onload = initCameras;
</script>
</body>
</html>
