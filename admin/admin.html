<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQLive Admin v2.0</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-blue: #0078d4;
            --accent-red: #d13438;
            --text-color: #ffffff;
            --border-color: #333;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 15px 25px; background: #000; border-bottom: 2px solid var(--accent-blue); display: flex; justify-content: space-between; align-items: center; }
        .status-badge { padding: 5px 12px; border-radius: 4px; font-weight: bold; font-size: 14px; }
        .status-normal { background: var(--accent-blue); }
        .status-special { background: var(--accent-red); animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }
        main { display: flex; flex: 1; overflow: hidden; }
        nav { width: 200px; background: #181818; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        nav button { background: transparent; border: none; color: #aaa; padding: 20px; text-align: left; font-size: 16px; cursor: pointer; border-left: 4px solid transparent; }
        nav button.active { background: #252525; color: white; border-left-color: var(--accent-blue); }
        .content { flex: 1; padding: 30px; overflow-y: auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: var(--card-bg); border-radius: 8px; padding: 20px; margin-bottom: 25px; border: 1px solid var(--border-color); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 14px; }
        input, select, textarea { width: 100%; background: #2d2d2d; border: 1px solid var(--border-color); color: white; padding: 10px; border-radius: 4px; box-sizing: border-box; }
        button.primary { background: var(--accent-blue); color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        /* Table Styles */
        .scroll-table { height: 500px; overflow-y: auto; border: 1px solid var(--border-color); background: #1a1a1a; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #252525; position: sticky; top: 0; padding: 12px; text-align: left; border-bottom: 2px solid var(--border-color); }
        td { padding: 10px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        tr:hover { background: #333; cursor: pointer; }
        tr.selected { background: #004a83 !important; }
        #camera-loading { padding: 20px; text-align: center; color: #888; }
    </style>
</head>
<body>

<header>
    <div style="font-size: 20px; font-weight: bold;">EQLive Admin <span style="color:#888; font-size:14px;">v2.0</span></div>
    <div id="global-status" class="status-badge status-normal">NORMAL MODE</div>
</header>

<main>
    <nav>
        <button onclick="showTab('broadcast')" id="btn-broadcast" class="active">放送制御</button>
        <button onclick="showTab('camera')" id="btn-camera">カメラ切替</button>
        <button onclick="showTab('ticker')" id="btn-ticker">テロップ・情報</button>
    </nav>

    <div class="content">
        <div id="tab-broadcast" class="tab-content active">
            <h2>放送制御パネル</h2>
            <div class="grid">
                <div class="card">
                    <label>放送モード</label>
                    <select id="field-mode">
                        <option value="normal">通常時 (Normal)</option>
                        <option value="special">特番 (Special)</option>
                        <option value="training">訓練 (Training)</option>
                    </select>
                </div>
                <div class="card">
                    <label>レイアウト</label>
                    <select id="field-layout">
                        <option value="normal">全画面動画</option>
                        <option value="l_shape">L字放送</option>
                        <option value="tsunami">津波マップ</option>
                        <option value="news">ニュース枠</option>
                    </select>
                </div>
                <div class="card">
                    <label>オペレーター</label>
                    <select id="field-statusType">
                        <option value="bot">自動 (Bot)</option>
                        <option value="ningen">手動 (Ningen)</option>
                    </select>
                </div>
            </div>
            <button class="primary" onclick="syncToFirebase()">設定を更新</button>
        </div>

        <div id="tab-camera" class="tab-content">
            <h2>ライブカメラ・スイッチャー</h2>
            <div class="card">
                <label>現在選択中のカメラID</label>
                <input type="text" id="field-cameraId" readonly style="font-weight:bold; color:var(--accent-blue);">
            </div>
            <div class="scroll-table">
                <table id="camera-table">
                    <thead>
                        <tr>
                            <th>地点名</th>
                            <th>ID</th>
                            <th>タイプ</th>
                        </tr>
                    </thead>
                    <tbody id="camera-list-body">
                        </tbody>
                </table>
                <div id="camera-loading">カメラリストを読み込んでいます...</div>
            </div>
        </div>

        <div id="tab-ticker" class="tab-content">
            <h2>テロップ・テキスト管理</h2>
            <div class="card">
                <div style="margin-bottom:15px;">
                    <label>メインタイトル</label>
                    <input type="text" id="field-mainTitle">
                </div>
                <div>
                    <label>サブタイトル</label>
                    <input type="text" id="field-subtitle">
                </div>
            </div>
            <div class="card">
                <label>下部テキスト (L字用)</label>
                <textarea id="field-leftText" rows="4"></textarea>
            </div>
            <button class="primary" onclick="syncToFirebase()">テキストを更新</button>
        </div>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974",
        measurementId: "G-BK3MJJ0VR7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let cameraList = [];

    // --- タブ切り替え ---
    window.showTab = function(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        document.getElementById('btn-' + tabId).classList.add('active');
    };

    // --- Firebaseデータ受信 ---
    onValue(ref(db, 'broadcast'), (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        document.getElementById('field-mode').value = data.current.mode;
        document.getElementById('field-layout').value = data.current.layoutMode;
        document.getElementById('field-statusType').value = data.current.statusType;
        document.getElementById('field-cameraId').value = data.current.cameraSource;
        document.getElementById('field-mainTitle').value = data.current.mainTitle;
        document.getElementById('field-subtitle').value = data.current.subtitle;
        document.getElementById('field-leftText').value = data.l_shape.leftText;

        const statusBadge = document.getElementById('global-status');
        statusBadge.innerText = data.current.mode.toUpperCase() + " MODE";
        statusBadge.className = "status-badge status-" + (data.current.mode === 'special' ? 'special' : 'normal');
        
        highlightSelectedCamera(data.current.cameraSource);
    });

    // --- Firebaseデータ送信 ---
    window.syncToFirebase = function() {
        const updates = {};
        updates['broadcast/current/mode'] = document.getElementById('field-mode').value;
        updates['broadcast/current/layoutMode'] = document.getElementById('field-layout').value;
        updates['broadcast/current/statusType'] = document.getElementById('field-statusType').value;
        updates['broadcast/current/mainTitle'] = document.getElementById('field-mainTitle').value;
        updates['broadcast/current/subtitle'] = document.getElementById('field-subtitle').value;
        updates['broadcast/l_shape/leftText'] = document.getElementById('field-leftText').value;
        updates['broadcast/current/updatedAt'] = Date.now();

        update(ref(db), updates).then(() => alert("更新完了"));
    };

    // --- カメラリスト生成 ---
    async function initCameraSwitcher() {
        const loadingMsg = document.getElementById('camera-loading');
        try {
            // パスを再確認してください
            const res = await fetch('assets/json/kh-livec.json');
            if (!res.ok) throw new Error("JSON file not found");
            
            cameraList = await res.json();
            const tbody = document.getElementById('camera-list-body');
            tbody.innerHTML = ""; // クリア

            cameraList.forEach(cam => {
                const tr = document.createElement('tr');
                tr.setAttribute('data-id', cam.id);
                tr.innerHTML = `
                    <td style="font-weight:bold;">${cam.name}</td>
                    <td style="color:#888;">${cam.id}</td>
                    <td><span style="font-size:10px; background:#444; padding:2px 5px; border-radius:3px;">${cam.type}</span></td>
                `;
                tr.onclick = () => {
                    update(ref(db, 'broadcast/current'), { cameraSource: cam.id });
                };
                tbody.appendChild(tr);
            });
            loadingMsg.style.display = "none";
        } catch (e) {
            loadingMsg.innerText = "エラー: assets/json/kh-livec.json が見つかりません。";
            console.error(e);
        }
    }

    function highlightSelectedCamera(selectedId) {
        document.querySelectorAll('#camera-list-body tr').forEach(tr => {
            if (tr.getAttribute('data-id') === selectedId) {
                tr.classList.add('selected');
            } else {
                tr.classList.remove('selected');
            }
        });
    }

    // 起動
    window.onload = initCameraSwitcher;

</script>
</body>
</html>
