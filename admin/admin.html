<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQLive Admin v2.0 - Pro</title>
    <style>
        :root {
            --bg-color: #121212; --card-bg: #1e1e1e; --accent-blue: #0078d4;
            --accent-red: #d13438; --text-color: #ffffff; --border-color: #333; --nav-width: 200px;
        }
        body { font-family: sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 10px 20px; background: #000; border-bottom: 2px solid var(--accent-blue); display: flex; justify-content: space-between; align-items: center; }
        .header-logo { font-size: 18px; font-weight: bold; }
        main { display: flex; flex: 1; overflow: hidden; }
        nav { width: var(--nav-width); background: #181818; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        nav button { background: transparent; border: none; color: #aaa; padding: 18px 20px; text-align: left; cursor: pointer; border-left: 4px solid transparent; }
        nav button.active { background: #252525; color: white; border-left-color: var(--accent-blue); }
        .content { flex: 1; padding: 20px; overflow-y: auto; }
        .tab-content { display: none; max-width: 900px; margin: 0 auto; }
        .tab-content.active { display: block; }
        .card { background: var(--card-bg); border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 13px; font-weight: bold; }
        input, select, textarea { width: 100%; background: #2d2d2d; border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 6px; font-size: 16px; box-sizing: border-box; margin-bottom: 10px; }
        button.primary { background: var(--accent-blue); color: white; border: none; padding: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        
        /* カメラテーブル用 */
        .scroll-table { height: 400px; overflow-y: auto; background: #1a1a1a; border-radius: 6px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #252525; position: sticky; top: 0; padding: 12px; text-align: left; border-bottom: 2px solid var(--border-color); font-size: 13px; }
        td { padding: 12px; border-bottom: 1px solid var(--border-color); font-size: 14px; cursor: pointer; }
        tr:hover { background: #333; }
        tr.selected { background: #004a83 !important; }
    </style>
</head>
<body>

<header><div class="header-logo">EQLive Admin<span>v2.0 Pro</span></div></header>

<main>
    <nav>
        <button onclick="showTab('broadcast')" id="btn-broadcast" class="active">放送制御</button>
        <button onclick="showTab('screen')" id="btn-screen">投影制御</button>
        <button onclick="showTab('camera')" id="btn-camera">カメラ切替</button>
        <button onclick="showTab('ticker')" id="btn-ticker">テロップ</button>
    </nav>

    <div class="content">
        <div id="tab-broadcast" class="tab-content active">
            <h2>放送制御</h2>
            <div class="card">
                <label>配信モード</label>
                <select id="field-mode"><option value="normal">通常</option><option value="special">特番</option></select>
                <label>担当</label>
                <select id="field-statusType"><option value="bot">自動 (Bot)</option><option value="ningen">手動 (Ningen)</option></select>
            </div>
            <button class="primary" onclick="syncBroadcast()">反映</button>
        </div>

        <div id="tab-screen" class="tab-content">
            <h2>投影制御</h2>
            <div class="card">
                <label>種別</label>
                <select id="field-screen-type"><option value="none">None</option><option value="youtube">YouTube</option><option value="image">Image</option><option value="screenshare">ScreenShare</option></select>
                <label>URL</label>
                <input type="text" id="field-screen-url">
            </div>
            <button class="primary" onclick="syncScreen()">投影反映</button>
        </div>

        <div id="tab-camera" class="tab-content">
            <h2>ライブカメラ切替</h2>
            <div class="card"><label>現在選択中:</label><input type="text" id="field-cameraId" readonly></div>
            <div class="scroll-table">
                <table>
                    <thead><tr><th>地点名</th><th>ID</th><th>タイプ</th></tr></thead>
                    <tbody id="camera-list-body"></tbody>
                </table>
            </div>
        </div>

        <div id="tab-ticker" class="tab-content">
            <h2>テロップ管理 (manual_news)</h2>
            <div class="card">
                <label>ジャンル (2〜4文字)</label>
                <input type="text" id="field-news-genre" placeholder="鉄道情報">
                <label>本文 1行目</label>
                <input type="text" id="field-news-line1" placeholder="JR山手線">
                <label>本文 2行目</label>
                <input type="text" id="field-news-line2" placeholder="全線で運転見合わせ">
            </div>
            <button class="primary" onclick="syncTicker()">テロップ送信</button>
            <button style="margin-top:10px; background:#444;" class="primary" onclick="clearTicker()">テロップ消去 (SVGに戻す)</button>
        </div>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.showTab = function(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        document.getElementById('btn-' + tabId).classList.add('active');
    };

    // Firebaseデータの初期同期
    onValue(ref(db, 'broadcast'), (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        
        if (data.current) {
            document.getElementById('field-mode').value = data.current.mode || 'normal';
            document.getElementById('field-statusType').value = data.current.statusType || 'bot';
            document.getElementById('field-cameraId').value = data.current.cameraSource || '';
            highlightSelectedCamera(data.current.cameraSource);
        }
        if (data.manual_news) {
            document.getElementById('field-news-genre').value = data.manual_news.genre || "";
            document.getElementById('field-news-line1').value = data.manual_news.line1 || "";
            document.getElementById('field-news-line2').value = data.manual_news.line2 || "";
        }
    });

    // 放送制御反映
    window.syncBroadcast = () => {
        update(ref(db, 'broadcast/current'), {
            mode: document.getElementById('field-mode').value,
            statusType: document.getElementById('field-statusType').value,
            updatedAt: Date.now()
        }).then(() => alert("放送設定を更新しました"));
    };

    // テロップ反映
    window.syncTicker = () => {
        set(ref(db, 'broadcast/manual_news'), {
            genre: document.getElementById('field-news-genre').value,
            line1: document.getElementById('field-news-line1').value,
            line2: document.getElementById('field-news-line2').value
        }).then(() => alert("テロップを更新しました"));
    };

    // テロップ消去
    window.clearTicker = () => {
        set(ref(db, 'broadcast/manual_news'), null).then(() => alert("テロップを消去しました"));
    };

    // カメラリスト初期化
    async function initCameraSwitcher() {
        try {
            const res = await fetch('https://gensai-lab.github.io/eqlive/assets/json/kh-livec.json');
            const cameraList = await res.json();
            const tbody = document.getElementById('camera-list-body');
            tbody.innerHTML = "";
            cameraList.forEach(cam => {
                const tr = document.createElement('tr');
                tr.setAttribute('data-id', cam.id);
                tr.innerHTML = `<td>${cam.name}</td><td>${cam.id}</td><td>${cam.type}</td>`;
                tr.onclick = () => {
                    update(ref(db, 'broadcast/current'), { cameraSource: cam.id, updatedAt: Date.now() });
                };
                tbody.appendChild(tr);
            });
        } catch (e) { console.error("Camera List Load Error"); }
    }

    function highlightSelectedCamera(id) {
        document.querySelectorAll('#camera-list-body tr').forEach(tr => {
            tr.classList.toggle('selected', tr.getAttribute('data-id') === id);
        });
    }

    window.onload = initCameraSwitcher;
</script>
</body>
</html>
