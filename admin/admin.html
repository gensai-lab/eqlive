<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQLive Admin v2.0 - Pro</title>
    <style>
        :root {
            --bg-color: #121212; --card-bg: #1e1e1e; --accent-blue: #0078d4;
            --accent-red: #d13438; --text-color: #ffffff; --border-color: #333; --nav-width: 200px;
        }
        body { font-family: sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 10px 20px; background: #000; border-bottom: 2px solid var(--accent-blue); display: flex; justify-content: space-between; align-items: center; }
        .header-logo { font-size: 18px; font-weight: bold; }
        main { display: flex; flex: 1; overflow: hidden; }
        nav { width: var(--nav-width); background: #181818; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        nav button { background: transparent; border: none; color: #aaa; padding: 18px 20px; text-align: left; cursor: pointer; border-left: 4px solid transparent; }
        nav button.active { background: #252525; color: white; border-left-color: var(--accent-blue); }
        .content { flex: 1; padding: 20px; overflow-y: auto; }
        .tab-content { display: none; max-width: 800px; margin: 0 auto; }
        .tab-content.active { display: block; }
        .card { background: var(--card-bg); border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        label { display: block; margin-bottom: 8px; color: #aaa; font-size: 13px; font-weight: bold; }
        input, select, textarea { width: 100%; background: #2d2d2d; border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 6px; font-size: 16px; box-sizing: border-box; margin-bottom: 15px; }
        button.primary { background: var(--accent-blue); color: white; border: none; padding: 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        .toggle-container { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; background: #333; padding: 10px; border-radius: 6px; }
        input[type="checkbox"] { width: auto; margin: 0; }
    </style>
</head>
<body>

<header><div class="header-logo">EQLive Admin<span>v2.0 Pro</span></div></header>

<main>
    <nav>
        <button onclick="showTab('broadcast')" id="btn-broadcast" class="active">放送制御</button>
        <button onclick="showTab('screen')" id="btn-screen">投影制御</button>
        <button onclick="showTab('ticker')" id="btn-ticker">テロップ</button>
    </nav>

    <div class="content">
        <div id="tab-broadcast" class="tab-content active">
            <h2>放送制御</h2>
            <div class="card">
                <label>放送モード</label>
                <select id="field-mode"><option value="normal">通常</option><option value="special">特番</option></select>
                <label>レイアウト</label>
                <select id="field-layout"><option value="normal">全画面</option><option value="l_shape">L字</option></select>
            </div>
            <button class="primary" onclick="syncBroadcast()">反映</button>
        </div>

        <div id="tab-screen" class="tab-content">
            <h2>投影制御</h2>
            <div class="card">
                <label>種別</label>
                <select id="field-screen-type"><option value="none">None</option><option value="youtube">YouTube</option><option value="image">Image</option><option value="screenshare">ScreenShare</option></select>
                <label>URL</label>
                <input type="text" id="field-screen-url">
            </div>
            <button class="primary" onclick="syncScreen()">反映</button>
        </div>

        <div id="tab-ticker" class="tab-content">
            <h2>テロップ管理 (600x135)</h2>
            <div class="toggle-container">
                <input type="checkbox" id="field-ticker-active">
                <label style="margin:0;">有事情報を表示する（OFFでデフォルトSVG表示）</label>
            </div>
            <div class="card">
                <label>ジャンル（例：鉄道情報、津波観測）</label>
                <input type="text" id="field-ticker-genre" placeholder="鉄道情報">
                
                <label>本文 1行目</label>
                <input type="text" id="field-ticker-line1" placeholder="JR山手線">

                <label>本文 2行目</label>
                <input type="text" id="field-ticker-line2" placeholder="全線で運転見合わせ">
            </div>
            <button class="primary" onclick="syncTicker()">テロップ更新</button>
        </div>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974",
        measurementId: "G-BK3MJJ0VR7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.showTab = function(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tabId).classList.add('active');
        document.getElementById('btn-' + tabId).classList.add('active');
    };

    // 初期値読み込み
    onValue(ref(db, 'broadcast'), (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        if (data.ticker) {
            document.getElementById('field-ticker-active').checked = data.ticker.active;
            document.getElementById('field-ticker-genre').value = data.ticker.genre || "";
            document.getElementById('field-ticker-line1').value = data.ticker.line1 || "";
            document.getElementById('field-ticker-line2').value = data.ticker.line2 || "";
        }
    });

    window.syncTicker = function() {
        const updates = {};
        updates['broadcast/ticker/active'] = document.getElementById('field-ticker-active').checked;
        updates['broadcast/ticker/genre'] = document.getElementById('field-ticker-genre').value;
        updates['broadcast/ticker/line1'] = document.getElementById('field-ticker-line1').value;
        updates['broadcast/ticker/line2'] = document.getElementById('field-ticker-line2').value;
        update(ref(db), updates).then(() => alert("テロップを更新しました"));
    };

    window.syncBroadcast = function() { /* 既存の放送制御ロジック */ };
    window.syncScreen = function() { /* 既存の投影制御ロジック */ };

</script>
</body>
</html>
