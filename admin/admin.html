<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kactuif EQLive Admin Pro</title>
    <link rel="apple-touch-icon" href="https://gensai-lab.github.io/eqlive/assets/logo/app-icon.png">
    <style>
        :root {
            --bg-color: #0a0a0a; --sidebar-bg: #151515; --card-bg: #1e1e1e;
            --accent-blue: #0078d4; --accent-red: #d13438; --accent-green: #107c10;
            --text-main: #ffffff; --text-sub: #aaaaaa;
            --header-height: 60px; --nav-width: 240px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0; font-family: 'A-OTF UD Shin Go NT', -apple-system, sans-serif;
            background: var(--bg-color); color: var(--text-main);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        /* --- Header & Navigation --- */
        header {
            height: var(--header-height); background: #000; border-bottom: 1px solid #333;
            display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 1100;
        }
        .menu-toggle { background: none; border: none; color: white; font-size: 24px; cursor: pointer; display: none; }
        .header-logo img { height: 30px; }

        main { display: flex; flex: 1; overflow: hidden; }
        nav {
            width: var(--nav-width); background: var(--sidebar-bg); border-right: 1px solid #333;
            display: flex; flex-direction: column; overflow-y: auto; transition: transform 0.3s ease;
        }
        nav button {
            background: none; border: none; color: var(--text-sub); padding: 16px 20px;
            text-align: left; font-size: 14px; cursor: pointer; border-left: 4px solid transparent;
        }
        nav button.active { background: #252525; color: white; border-left-color: var(--accent-blue); }

        /* --- Content Area --- */
        .content { flex: 1; padding: 20px; overflow-y: auto; }
        .tab-content { display: none; max-width: 1000px; margin: 0 auto; }
        .tab-content.active { display: block; }

        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; }
        
        h2 { font-size: 18px; margin: 0 0 15px 0; display: flex; align-items: center; gap: 8px; }
        h2::before { content: ''; width: 4px; height: 18px; background: var(--accent-blue); border-radius: 2px; }

        label { display: block; color: var(--text-sub); font-size: 12px; margin-bottom: 8px; font-weight: bold; }
        input, select, textarea {
            width: 100%; padding: 12px; background: #000; border: 1px solid #444; 
            color: white; border-radius: 8px; font-size: 16px; margin-bottom: 15px;
        }

        .btn-group { display: flex; gap: 10px; }
        button.primary { background: var(--accent-blue); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; flex: 1; font-weight: bold; }
        button.secondary { background: #333; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; flex: 1; }
        button.danger { background: var(--accent-red); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; flex: 1; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }

        /* --- Components --- */
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-active { background: var(--accent-green); }
        .badge-none { background: #444; }

        .camera-list { height: 300px; overflow-y: auto; border: 1px solid #333; border-radius: 8px; }
        .camera-item { padding: 12px; border-bottom: 1px solid #333; cursor: pointer; display: flex; justify-content: space-between; }
        .camera-item:hover { background: #2a2a2a; }
        .camera-item.selected { background: rgba(0, 120, 212, 0.2); color: var(--accent-blue); font-weight: bold; }

        .l-card { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #444; }

        /* --- Responsive --- */
        @media (max-width: 900px) {
            .menu-toggle { display: block; }
            nav { position: absolute; left: 0; top: 0; height: 100%; transform: translateX(-100%); z-index: 1050; }
            nav.open { transform: translateX(0); }
            .nav-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 1040; }
            .nav-overlay.active { display: block; }
        }
    </style>
</head>
<body>

<header>
    <button class="menu-toggle" onclick="toggleNav()">☰</button>
    <div class="header-logo">
        <img src="https://gensai-lab.github.io/eqlive/assets/logo/logo-ptn1_white.svg" alt="EQLive Logo">
    </div>
    <div id="connection-status" class="status-badge badge-active">SYNC</div>
</header>

<div class="nav-overlay" id="nav-overlay" onclick="toggleNav()"></div>

<main>
    <nav id="side-nav">
        <button class="menu-item active" onclick="switchTab('main')">① メイン画面</button>
        <button class="menu-item" onclick="switchTab('mode')">② 配信モード選択</button>
        <button class="menu-item" onclick="switchTab('display')">③ 画面表示</button>
        <button class="menu-item" onclick="switchTab('title')">④ タイトル</button>
        <button class="menu-item" onclick="switchTab('ticker')">⑤ Ticker</button>
        <button class="menu-item" onclick="switchTab('l-shape')">⑥ L字設定</button>
        <button class="menu-item" onclick="switchTab('camera')">⑦ ライブカメラ</button>
        <button class="menu-item" onclick="switchTab('tsunami')">⑧ 津波制御</button>
        <button class="menu-item" onclick="window.open('https://gensai-lab.studio.site/', '_blank')">⑨ 原稿 ↗</button>
        <div style="margin-top:auto; padding:15px; font-size:10px; color:#555; text-align:center;">Kactuif System v3.0</div>
    </nav>

    <div class="content">
        <div id="tab-main" class="tab-content active">
            <h2>ダッシュボード</h2>
            <div class="grid">
                <div class="card">
                    <label>現在のライブ映像</label>
                    <div id="live-embed" style="aspect-ratio: 16/9; background:#000; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#555;">
                        配信中の場合ここに埋め込み
                    </div>
                </div>
                <div class="card">
                    <label>システムステータス</label>
                    <p id="stat-distributor">担当者: --</p>
                    <p id="stat-layout">モード: --</p>
                    <p id="stat-camera">カメラID: --</p>
                    <p id="stat-emergency">警報状態: <span id="alert-badge" class="status-badge badge-none">正常時</span></p>
                </div>
            </div>
        </div>

        <div id="tab-mode" class="tab-content">
            <h2>配信担当選択</h2>
            <div class="card">
                <label>配信主体 (distributor)</label>
                <select id="input-distributor" onchange="toggleNingenSelect()">
                    <option value="bot">🤖 自動 (Bot)</option>
                    <option value="ningen">👤 有人 (人間)</option>
                </select>
                
                <div id="ningen-select-area" style="display:none;">
                    <label>担当者名</label>
                    <select id="input-operator">
                        <option value="">-- 選択してください --</option>
                        <option value="Kabeya">壁谷 來夢 (代表)</option>
                        <option value="Tsuboguchi">坪口 冬真 (副代表)</option>
                    </select>
                </div>
                <button class="primary" onclick="saveDistributor()">設定を反映</button>
            </div>
        </div>

        <div id="tab-display" class="tab-content">
            <h2>画面構成・ソース切替</h2>
            <div class="card">
                <label>基本レイアウト (layoutMode)</label>
                <div class="btn-group">
                    <button id="btn-layout-live" class="secondary" onclick="updateFB('current/layoutMode', 'live')">通常放送</button>
                    <button id="btn-layout-emergency" class="secondary" onclick="updateFB('current/layoutMode', 'emergency')">有事放送</button>
                </div>
            </div>
            <div class="card">
                <label>L字表示 (current_mode)</label>
                <div class="btn-group" style="margin-bottom:10px;">
                    <button id="btn-mode-sub" class="secondary" onclick="updateFB('current_mode', 'sub-switcher')">L字なし</button>
                    <button id="btn-mode-l" class="secondary" onclick="updateFB('current_mode', 'l-screen')">L字あり</button>
                </div>
                <a href="javascript:switchTab('l-shape')" id="link-to-l" style="font-size:12px; color:var(--accent-blue); display:none;">➔ L字の詳細設定へ</a>
            </div>
            <div class="card">
                <label>メインソース (mainSource)</label>
                <select id="input-mainSource" onchange="updateFB('current/mainSource', this.value)">
                    <option value="camera">📹 ライブカメラ</option>
                    <option value="screen">📺 画面共有・投影</option>
                </select>
            </div>
            <div id="screen-options" class="card" style="display:none;">
                <label>投影タイプ</label>
                <select id="input-screen-type">
                    <option value="screenshare">PC画面共有</option>
                    <option value="image">画像投影</option>
                    <option value="video">映像投影</option>
                    <option value="youtube">YouTube投影</option>
                    <option value="web">Webサイト投影</option>
                </select>
                <label>ソースURL / オーバーレイ・タイトル</label>
                <input type="text" id="input-screen-url" placeholder="https://...">
                <input type="text" id="input-screen-title" placeholder="タイトル（今後の予想など）">
                <button class="primary" onclick="saveScreenProgram()">投影実行</button>
            </div>
        </div>

        <div id="tab-title" class="tab-content">
            <h2>テロップタイトル編集</h2>
            <div class="card">
                <label>メインタイトル</label>
                <input type="text" id="input-mainTitle">
                <label>サブタイトル</label>
                <input type="text" id="input-subtitle">
                <div class="btn-group">
                    <button class="primary" onclick="saveTitles()">更新</button>
                    <button class="danger" onclick="clearTitles()">一括削除</button>
                </div>
            </div>
        </div>

        <div id="tab-ticker" class="tab-content">
            <h2>ニュースティッカー (有事用)</h2>
            <div class="card">
                <label>ジャンル</label>
                <input type="text" id="input-ticker-genre" placeholder="地震速報、津波情報など">
                <label>本文1行目</label>
                <input type="text" id="input-ticker-l1">
                <label>本文2行目</label>
                <input type="text" id="input-ticker-l2">
                <button class="primary" onclick="saveTicker()">反映</button>
            </div>
        </div>

        <div id="tab-l-shape" class="tab-content">
            <h2>L字放送 詳細設定</h2>
            <div class="card">
                <label>左側縦書きテロップ</label>
                <input type="text" id="input-l-leftText" placeholder="備えは、知ることから。">
            </div>
            <div id="l-items-list">
                </div>
            <button class="secondary" style="width:100%; margin-bottom:15px;" onclick="addLItem()">＋ カードを追加</button>
            <button class="primary" style="width:100%;" onclick="saveLShape()">Firebaseに保存</button>
        </div>

        <div id="tab-camera" class="tab-content">
            <h2>ライブカメラ切替</h2>
            <div class="card">
                <label>現在選択中</label>
                <input type="text" id="current-cam-display" readonly style="background:#111; color:var(--accent-blue);">
                <div class="camera-list" id="camera-list-ui"></div>
            </div>
        </div>

        <div id="tab-tsunami" class="tab-content">
            <h2>津波リスト・ページ制御</h2>
            <div class="card">
                <label>ページ送りモード</label>
                <div id="tsunami-auto-status" style="padding:15px; background:#111; border-radius:8px; margin-bottom:15px; text-align:center; font-weight:bold;">
                    --
                </div>
                <div class="btn-group" style="margin-bottom:20px;">
                    <button id="btn-tsu-auto" class="secondary" onclick="updateFB('tsunami_config/autoPage', true)">自動送り</button>
                    <button id="btn-tsu-manual" class="secondary" onclick="updateFB('tsunami_config/autoPage', false)">手動送り</button>
                </div>
                <label>手動操作</label>
                <div class="btn-group">
                    <button id="btn-tsu-prev" class="primary" onclick="triggerTsunamiPage('prev')">前のページ</button>
                    <button id="btn-tsu-next" class="primary" onclick="triggerTsunamiPage('next')">次のページ</button>
                </div>
            </div>
        </div>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- UI Logic ---
    window.toggleNav = () => {
        document.getElementById('side-nav').classList.toggle('open');
        document.getElementById('nav-overlay').classList.toggle('active');
    };

    window.switchTab = (id) => {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
        document.getElementById(`tab-${id}`).classList.add('active');
        event.currentTarget.classList.add('active');
        if(window.innerWidth <= 900) toggleNav();
    };

    window.toggleNingenSelect = () => {
        const val = document.getElementById('input-distributor').value;
        document.getElementById('ningen-select-area').style.display = (val === 'ningen') ? 'block' : 'none';
    };

    // --- Firebase Actions ---
    window.updateFB = (path, value) => {
        set(ref(db, `broadcast/${path}`), value);
    };

    window.saveDistributor = () => {
        const dist = document.getElementById('input-distributor').value;
        const oper = document.getElementById('input-operator').value;
        if(dist === 'ningen' && !oper) { alert("担当者を選択してください"); return; }
        update(ref(db, 'broadcast/current'), {
            distributor: dist,
            operator: oper || "System-Bot"
        });
    };

    window.saveTitles = () => {
        update(ref(db, 'broadcast/current'), {
            mainTitle: document.getElementById('input-mainTitle').value,
            subtitle: document.getElementById('input-subtitle').value
        });
    };

    window.clearTitles = () => {
        update(ref(db, 'broadcast/current'), { mainTitle: "", subtitle: "" });
    };

    window.saveTicker = () => {
        update(ref(db, 'broadcast/manual_news'), {
            genre: document.getElementById('input-ticker-genre').value,
            line1: document.getElementById('input-ticker-l1').value,
            line2: document.getElementById('input-ticker-l2').value
        });
    };

    window.saveScreenProgram = () => {
        update(ref(db, 'broadcast/screen_program'), {
            type: document.getElementById('input-screen-type').value,
            url: document.getElementById('input-screen-url').value,
            title: document.getElementById('input-screen-title').value
        });
    };

    window.triggerTsunamiPage = (dir) => {
        update(ref(db, 'broadcast/tsunami_config/manualTrigger'), {
            direction: dir,
            timestamp: Date.now()
        });
    };

    // --- L-Shape Cards Logic ---
    let lItemsLocal = [];
    window.addLItem = () => {
        lItemsLocal.push({ genre: "", text: "" });
        renderLItems();
    };

    window.removeLItem = (i) => {
        lItemsLocal.splice(i, 1);
        renderLItems();
    };

    function renderLItems() {
        const container = document.getElementById('l-items-list');
        container.innerHTML = "";
        lItemsLocal.forEach((item, i) => {
            const div = document.createElement('div');
            div.className = "l-card";
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                    <label>カード #${i}</label>
                    <button class="danger" style="padding:4px 8px; font-size:10px;" onclick="removeLItem(${i})">削除</button>
                </div>
                <input type="text" value="${item.genre}" placeholder="ジャンル" onchange="lItemsLocal[${i}].genre=this.value">
                <input type="text" value="${item.text}" placeholder="内容" onchange="lItemsLocal[${i}].text=this.value">
            `;
            container.appendChild(div);
        });
    }

    window.saveLShape = () => {
        set(ref(db, 'broadcast/l_shape'), {
            leftText: document.getElementById('input-l-leftText').value,
            topItems: lItemsLocal
        }).then(() => alert("保存しました"));
    };

    // --- Camera List ---
    async function loadCameras() {
        const res = await fetch("https://gensai-lab.github.io/eqlive/assets/json/kh-livec.json");
        const cameras = await res.json();
        const container = document.getElementById('camera-list-ui');
        container.innerHTML = "";
        cameras.forEach(cam => {
            const div = document.createElement('div');
            div.className = "camera-item";
            div.id = `cam-${cam.id}`;
            div.innerHTML = `<span>${cam.name}</span><small style="color:#666">${cam.type}</small>`;
            div.onclick = () => updateFB('current/cameraSource', cam.id);
            container.appendChild(div);
        });
    }

    // --- Data Sync ---
    onValue(ref(db, 'broadcast'), (snapshot) => {
        const data = snapshot.val();
        if(!data) return;

        // Dashboard stats
        document.getElementById('stat-distributor').innerText = `担当者: ${data.current.distributor} (${data.current.operator || '--'})`;
        document.getElementById('stat-layout').innerText = `モード: ${data.current.layoutMode}`;
        document.getElementById('stat-camera').innerText = `カメラID: ${data.current.cameraSource}`;
        
        // Buttons highlight
        const activeClass = (id, condition) => {
            const el = document.getElementById(id);
            if(el) el.className = condition ? "primary" : "secondary";
        };
        activeClass('btn-layout-live', data.current.layoutMode === 'live');
        activeClass('btn-layout-emergency', data.current.layoutMode === 'emergency');
        activeClass('btn-mode-sub', data.current_mode === 'sub-switcher');
        activeClass('btn-mode-l', data.current_mode === 'l-screen');
        document.getElementById('link-to-l').style.display = (data.current_mode === 'l-screen') ? 'block' : 'none';

        // Inputs sync (only if not focused)
        const sync = (id, val) => {
            const el = document.getElementById(id);
            if(el && document.activeElement !== el) el.value = val || "";
        };
        sync('input-mainTitle', data.current.mainTitle);
        sync('input-subtitle', data.current.subtitle);
        sync('input-mainSource', data.current.mainSource);
        document.getElementById('screen-options').style.display = (data.current.mainSource === 'screen') ? 'block' : 'none';
        
        sync('input-ticker-genre', data.manual_news.genre);
        sync('input-ticker-l1', data.manual_news.line1);
        sync('input-ticker-l2', data.manual_news.line2);

        // Tsunami sync
        const isAuto = data.tsunami_config.autoPage !== false;
        const tsuText = document.getElementById('tsunami-auto-status');
        tsuText.innerText = isAuto ? "自動送り：ON" : "自動送り：OFF";
        tsuText.style.color = isAuto ? "var(--accent-green)" : "var(--accent-red)";
        activeClass('btn-tsu-auto', isAuto);
        activeClass('btn-tsu-manual', !isAuto);
        document.getElementById('btn-tsu-prev').disabled = document.getElementById('btn-tsu-next').disabled = isAuto;

        // Camera highlight
        document.getElementById('current-cam-display').value = data.current.cameraSource;
        document.querySelectorAll('.camera-item').forEach(el => el.classList.remove('selected'));
        const activeCam = document.getElementById(`cam-${data.current.cameraSource}`);
        if(activeCam) activeCam.classList.add('selected');

        // L-Shape items sync
        if(data.l_shape) {
            sync('input-l-leftText', data.l_shape.leftText);
            if(!document.activeElement.classList.contains('l-item-input')) {
                lItemsLocal = data.l_shape.topItems || [];
                renderLItems();
            }
        }
    });

    window.onload = loadCameras;
</script>
</body>
</html>
