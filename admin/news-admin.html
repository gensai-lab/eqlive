<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EQLive 報道スイッチャー</title>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
/* =========================================================================
   Design tokens
   ========================================================================= */
@font-face{font-family:EQLiveUD;src:url('https://gensai-lab.github.io/eqlive/assets/fonts/FOT-UDKakugo_LargePr6-M.otf') format('opentype');font-weight:500;font-display:swap}
@font-face{font-family:EQLiveUD;src:url('https://gensai-lab.github.io/eqlive/assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');font-weight:700;font-display:swap}
@font-face{font-family:EQLiveUD;src:url('https://gensai-lab.github.io/eqlive/assets/fonts/FOT-UDKakugo_LargePr6-B.otf') format('opentype');font-weight:800;font-display:swap}

:root{
  /* surfaces */
  --bg:#0a0b0d;
  --panel:#16181c;
  --panel-2:#1e2126;
  --panel-3:#25282e;
  --border:#2c2f35;
  --border-soft:#22252a;

  /* text */
  --text:#f2f4f7;
  --muted:#9aa1ab;
  --muted-2:#6b7178;

  /* brand */
  --blue:#005AFF;
  --blue-soft:rgba(0,90,255,.16);
  --green:#1fae5f;
  --red:#e2453f;
  --amber:#f0a400;

  /* metrics */
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;
  --shadow-sm:0 2px 8px rgba(0,0,0,.25);
  --shadow-lg:0 16px 40px rgba(0,0,0,.35);
  --header:64px;
  --sidebar:420px;
  --gap:10px;
}

/* =========================================================================
   Base / reset
   ========================================================================= */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:'BIZ UDPGothic',sans-serif;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:var(--blue-soft)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#32363c;border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

input,select,textarea{
  width:100%;background:#0e0f12;color:var(--text);
  border:1px solid #363b42;border-radius:var(--radius-sm);
  padding:9px 10px;outline:none;transition:border-color .12s,box-shadow .12s;
}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
textarea{min-height:88px;resize:vertical}
.label{display:block;color:var(--muted);font-size:11.5px;margin:0 0 6px;font-weight:700;letter-spacing:.01em}

/* =========================================================================
   Login screen
   ========================================================================= */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#101318,#07080a 60%);z-index:9999;padding:20px}
.login-box{width:min(420px,100%);background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:30px}
.login-box h1{margin:0 0 6px;font-size:22px;letter-spacing:.01em}
.login-box p{margin:0 0 24px;color:var(--muted);font-size:13px;line-height:1.6}
#login-btn{width:100%;margin-top:16px}
#login-error{color:#ff8484;margin-top:12px;display:none;font-size:12px;line-height:1.6}

/* =========================================================================
   App shell / layout
   ========================================================================= */
.app{display:none;height:100vh;flex-direction:column}
.app.visible{display:flex}

.header{
  height:var(--header);flex:0 0 auto;background:#08090b;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 20px;
}
.header-title{display:flex;align-items:center;gap:14px}
.header-title .brand{font-weight:800;font-size:22px;letter-spacing:.01em}
.header-title .tag{padding:6px 10px;border-radius:var(--radius-sm);background:var(--panel-2);color:#cfd5db;font-size:13px;font-variant-numeric:tabular-nums}
.header-right{display:flex;align-items:center;gap:10px}
.live-dot{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--border);border-radius:999px;font-size:12px;color:var(--muted)}
.live-dot i{font-size:10px;color:#35d46b}

.main{display:flex;flex:1;min-height:0}

/* =========================================================================
   Sidebar / tabs
   ========================================================================= */
.sidebar{width:var(--sidebar);background:#111316;border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;flex:0 0 50px;border-bottom:1px solid var(--border);background:#0d0f11}
.tab{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  background:transparent;color:var(--muted);border:0;border-right:1px solid var(--border-soft);
  font-size:13px;font-weight:700;position:relative;transition:color .12s,background .12s;
}
.tab .material-icons{font-size:17px}
.tab:last-child{border-right:0}
.tab:hover{color:#d7dbe0;background:#141619}
.tab.active{color:#fff;background:var(--panel)}
.tab.active::after{content:'';position:absolute;left:14%;right:14%;bottom:0;height:2px;background:var(--blue);border-radius:2px 2px 0 0}

.side-scroll{overflow:auto;padding:14px 16px 28px}

/* =========================================================================
   Panels & common building blocks
   ========================================================================= */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-md);padding:15px;margin-bottom:12px}
.panel h3{font-size:13px;margin:0 0 12px;display:flex;align-items:center;gap:7px;color:#e7eaee}
.panel h3 .material-icons{font-size:16px;color:var(--muted)}
.subtle{color:var(--muted);font-size:11.5px;line-height:1.65}
.tiny{font-size:10.5px;color:var(--muted-2)}
.hr{height:1px;background:var(--border);margin:13px 0}
.empty{padding:28px 10px;text-align:center;color:var(--muted-2);font-size:12px;border:1px dashed var(--border);border-radius:var(--radius-md)}

.section-title{font-size:11.5px;color:#c6cbd2;font-weight:700;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between}

.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.row.wrap{flex-wrap:wrap}
.row.wrap>*{flex:1 1 160px}
.col{display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.badge{display:inline-block;font-size:10px;border-radius:999px;padding:3px 8px;border:1px solid #3a3f46;color:#cbd1d8;background:#111318;font-weight:700}
.badge.blue{border-color:#204a96;background:var(--blue-soft);color:#bcd2ff}
.badge.green{border-color:#1d6b41;background:rgba(31,174,95,.15);color:#a4ecc4}
.badge.red{border-color:#7b2d2d;background:rgba(226,54,54,.14);color:#ffb4b0}

/* =========================================================================
   Buttons
   ========================================================================= */
.btn{
  border:1px solid #40454c;border-radius:var(--radius-sm);background:var(--panel-3);color:#fff;
  padding:10px 13px;font-weight:700;font-size:13px;transition:filter .12s,border-color .12s,background .12s;
}
.btn:hover{filter:brightness(1.1)}
.btn:active{filter:brightness(.95)}
.btn.primary{background:var(--blue);border-color:var(--blue)}
.btn.green{background:var(--green);border-color:var(--green)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--panel-2)}
.btn.small{padding:7px 9px;font-size:11.5px}
.btn.big{padding:13px 14px;font-size:15px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* =========================================================================
   Mode cards
   ========================================================================= */
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-card{border:1px solid var(--border);border-radius:var(--radius-md);background:#0f1114;padding:14px;text-align:left;transition:border-color .12s,box-shadow .12s}
.mode-card:hover{border-color:#454b53}
.mode-card.active{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.mode-card .material-icons{font-size:22px;margin-bottom:9px;color:var(--muted)}
.mode-card.active .material-icons{color:var(--blue)}
.mode-card strong{display:block;font-size:14.5px}
.mode-card span{display:block;color:var(--muted);font-size:11px;margin-top:5px;line-height:1.5}

/* =========================================================================
   Scene sequence strip
   ========================================================================= */
.scene-line{display:flex;align-items:center;gap:6px;overflow:auto;padding-bottom:3px}
.scene-node{flex:0 0 auto}
.scene-node button{max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seq-arrow{color:#6b7178;font-size:15px}

/* =========================================================================
   Lists
   ========================================================================= */
.list{display:flex;flex-direction:column;gap:6px}
.list-item{background:#0f1114;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;transition:border-color .12s,background .12s}
.list-item:hover{border-color:#454b53}
.list-item.active{border-color:var(--blue);background:var(--blue-soft)}
.list-main{display:flex;align-items:center;justify-content:space-between;gap:10px}
.list-main strong{font-size:13px}
.list-main span{font-size:10px;color:var(--muted)}

/* =========================================================================
   Stage / live preview
   ========================================================================= */
.stage{flex:1;min-width:0;display:flex;flex-direction:column;background:#3a3d41}
.stage-top{padding:13px 18px;border-bottom:1px solid #52565b;background:#2c2f33;display:flex;justify-content:space-between;align-items:center;gap:12px}
.stage-top .title{font-size:13px;color:#fff}
.stage-actions{display:flex;gap:8px;align-items:center}
.stage-body{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;min-height:0;overflow:auto}
.preview-frame{position:relative;width:min(100%,1100px);aspect-ratio:16/9;background:#000;box-shadow:var(--shadow-lg);border-radius:4px;overflow:hidden}
.preview-frame iframe,.preview-frame video,.preview-frame img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain;background:#000}
.preview-overlay{position:absolute;left:0;right:0;bottom:0;padding:14px 18px;background:linear-gradient(transparent,rgba(0,0,0,.86));pointer-events:none}
.preview-overlay .main-title{font-family:EQLiveUD,'BIZ UDPGothic',sans-serif;font-weight:800;font-size:clamp(16px,2.1vw,29px);text-shadow:0 2px 5px #000}
.preview-overlay .sub{font-family:EQLiveUD,'BIZ UDPGothic',sans-serif;font-size:clamp(11px,1.2vw,17px);margin-top:4px;color:#e7ebef;text-shadow:0 1px 4px #000}
.preview-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#02035e;color:#fff;font-size:clamp(28px,4vw,62px);font-family:EQLiveUD,'BIZ UDPGothic',sans-serif;text-align:center;padding:0 20px}
.preview-placeholder.small{font-size:clamp(19px,2.5vw,36px)}

.statusbar{padding:9px 18px;background:#17191c;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px}
.statusbar .state{color:#8fe1ad}
.statusbar .path{color:#8a9098;font-family:ui-monospace,monospace}

.material-preview{border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:#08090a;aspect-ratio:16/9;position:relative}
.material-preview iframe,.material-preview video,.material-preview img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain}

.detail-title{font-size:17px;margin:0 0 3px}
.detail-sub{color:var(--muted);font-size:11px;margin-bottom:16px}
.drag-note{font-size:10px;color:var(--muted-2);margin-top:7px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* =========================================================================
   Figma-style controls: slider, color swatch, switch
   ========================================================================= */
.field{margin-bottom:11px}
.field-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.field-head .label{margin:0}
.field-value{
  font-variant-numeric:tabular-nums;font-size:11.5px;color:#d7dbe0;background:#0e0f12;
  border:1px solid #363b42;border-radius:var(--radius-sm);padding:3px 8px;min-width:44px;text-align:center;
}

.slider-row{display:flex;align-items:center;gap:10px}
.slider-row input[type=range]{
  -webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:99px;
  background:linear-gradient(90deg,var(--blue) var(--fill,50%),#33383f var(--fill,50%));outline:none;
}
.slider-row input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;
  border:3px solid var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.5);cursor:pointer;margin-top:0;
}
.slider-row input[type=range]::-moz-range-thumb{
  width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--blue);cursor:pointer;
}
.slider-row input[type=range]::-moz-range-track{height:4px;border-radius:99px;background:#33383f}
.slider-num{width:56px;flex:0 0 auto;text-align:center;padding:7px 4px;font-variant-numeric:tabular-nums}

.color-field{display:flex;align-items:center;gap:9px}
.color-field input[type=color]{
  -webkit-appearance:none;appearance:none;width:36px;height:36px;padding:0;border-radius:9px;
  border:1px solid #3a3f46;background:none;cursor:pointer;flex:0 0 auto;
}
.color-field input[type=color]::-webkit-color-swatch-wrapper{padding:3px}
.color-field input[type=color]::-webkit-color-swatch{border:0;border-radius:6px}
.color-field .hex{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--muted);letter-spacing:.02em}

.switch-row{display:flex;align-items:center;gap:10px;padding:2px 0}
.switch{position:relative;display:inline-flex;flex:0 0 auto;width:38px;height:22px}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch .track{position:absolute;inset:0;background:#33383f;border-radius:999px;transition:background .15s}
.switch .track::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.switch input:checked~.track{background:var(--blue)}
.switch input:checked~.track::after{transform:translateX(16px)}
.switch-label{font-size:12.5px;color:#dfe3e8}

.field-group{border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;background:rgba(255,255,255,.012)}
.field-group-title{font-size:10.5px;font-weight:700;color:var(--muted-2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}

/* =========================================================================
   Responsive
   ========================================================================= */
@media(max-width:1000px){:root{--sidebar:360px}.stage-body{padding:14px}}
@media(max-width:800px){
  :root{--sidebar:100%}
  .main{flex-direction:column}
  .sidebar{width:100%;height:56%;border-right:0;border-bottom:1px solid var(--border)}
  .stage{height:44%}
  .header-title .brand{font-size:17px}
  .header-title .tag{font-size:11px}
  .stage-body{padding:8px}
}
</style>
</head>
<body>

<!-- =========================================================================
     Login screen
     ========================================================================= -->
<div id="login">
  <div class="login-box">
    <h1>EQLive 報道スイッチャー</h1>
    <p>EQLive の報道番組制作・送出を行う管理ツール</p>
    <label class="label">メールアドレス / ユーザーID</label>
    <input id="login-id" type="text" autocomplete="username" placeholder="Firebase Authenticationのメールアドレス（またはユーザーID）">
    <label class="label" style="margin-top:12px">パスワード</label>
    <input id="login-pass" type="password" autocomplete="current-password" placeholder="パスワード">
    <button id="login-btn" class="btn primary big">ログイン</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- =========================================================================
     App shell
     ========================================================================= -->
<div id="app" class="app">
  <div class="header">
    <div class="header-title">
      <div class="brand">EQLive 報道スイッチャー</div>
      <div class="tag" id="program-clock">--.--.-- --:--:--</div>
    </div>
    <div class="header-right">
      <div class="live-dot"><i class="material-icons">fiber_manual_record</i><span id="auth-state">接続中</span></div>
      <button class="btn small" id="admin-back">Adminに戻る</button>
    </div>
  </div>

  <div class="main">
    <aside class="sidebar">
      <div class="tabs">
        <button class="tab active" data-tab="mode"><i class="material-icons">tune</i>モード</button>
        <button class="tab" data-tab="scene"><i class="material-icons">view_carousel</i>シーン</button>
        <button class="tab" data-tab="output"><i class="material-icons">cast</i>画面送出</button>
        <button class="tab" data-tab="material"><i class="material-icons">palette</i>素材編集</button>
      </div>
      <div id="side-mode" class="side-scroll"></div>
      <div id="side-scene" class="side-scroll" style="display:none"></div>
      <div id="side-output" class="side-scroll" style="display:none"></div>
      <div id="side-material" class="side-scroll" style="display:none"></div>
    </aside>

    <section class="stage">
      <div class="stage-top">
        <div class="title" id="stage-title">送出プレビュー</div>
        <div class="stage-actions">
          <span class="badge blue" id="mode-badge">ライブカメラ</span>
          <button class="btn small" id="refresh-preview">プレビュー更新</button>
        </div>
      </div>
      <div class="stage-body"><div class="preview-frame" id="preview"></div></div>
      <div class="statusbar">
        <div class="state" id="status-text">待機中</div>
        <div class="path" id="status-path">broadcast/current</div>
      </div>
    </section>
  </div>
</div>

<script type="module">
/* =========================================================================
   Firebase setup
   ========================================================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue, set, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
  authDomain: "mgl-eqlive.firebaseapp.com",
  databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
  projectId: "mgl-eqlive",
  storageBucket: "mgl-eqlive.firebasestorage.app",
  messagingSenderId: "1060231327645",
  appId: "1:1060231327645:web:642684f4640bbc21d5c974"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

/* =========================================================================
   Constants / global state
   ========================================================================= */
const FONT_URLS = {
  B:  'https://gensai-lab.github.io/eqlive/assets/fonts/FOT-UDKakugo_LargePr6-B.otf',
  DB: 'https://gensai-lab.github.io/eqlive/assets/fonts/FOT-UDKakugo_LargePr6-DB.otf',
  M:  'https://gensai-lab.github.io/eqlive/assets/fonts/FOT-UDKakugo_LargePr6-M.otf'
};
const PREPARE_URL = 'https://gensai-lab.github.io/eqlive/assets/image/prepare.png';
const SWITCHER_PATH = 'broadcast/reporter_switcher';

let broadcast = {};
let switcher = {};
let cameras = [];
let hls = null;
let activeTab = 'mode';
let sceneIndex = 0;
let preloader = null;
let scheduleTimer = null;
let preloadedSceneId = null;
let editingMaterialId = null;
let editingSceneId = null;

/* =========================================================================
   Small utilities
   ========================================================================= */
const $ = id => document.getElementById(id);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[c]));

const dbSet    = (path, val) => set(ref(db, path), val).catch(e => { console.error(e); alert('Firebaseへの保存に失敗しました。権限・ログイン状態を確認してください。'); });
const dbUpdate = (path, val) => update(ref(db, path), val).catch(e => { console.error(e); alert('Firebaseの更新に失敗しました。'); });
const dbRemove = path => remove(ref(db, path)).catch(e => { console.error(e); alert('削除に失敗しました。'); });

function localDateInput(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmt(ts) {
  if (!ts) return '--';
  return new Date(ts).toLocaleString('ja-JP', { hour12: false });
}
function nowString() {
  return new Date().toLocaleString('ja-JP', {
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
  });
}
function uid(prefix) { return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`; }

function materials() { return Object.entries(switcher.materials || {}).map(([id, v]) => ({ id, ...v })); }
function scenes()    { return Object.entries(switcher.scenes || {}).map(([id, v]) => ({ id, ...v })).sort((a, b) => (a.order ?? 0) - (b.order ?? 0)); }
function activeCamera()               { return cameras.find(c => c.id === broadcast?.current?.cameraSource); }
function activeScene()                { return scenes()[sceneIndex] || scenes()[0] || null; }

/* -- Figma-style slider / swatch helpers (purely presentational, additive) -- */
// Keeps a <input type=range> (the value the rest of the app reads) in sync
// with a companion numeric field, and forwards changes both ways so the
// existing live-preview listeners keep working untouched.
function bindSlider(rangeId, numId) {
  const r = $(rangeId), n = $(numId);
  if (!r || !n) return;
  const paintFill = () => {
    const pct = ((r.value - r.min) / (r.max - r.min)) * 100;
    r.style.setProperty('--fill', pct + '%');
  };
  paintFill();
  r.addEventListener('input', () => { n.value = r.value; paintFill(); });
  n.addEventListener('input', () => {
    let v = Math.max(Number(r.min), Math.min(Number(r.max), Number(n.value) || 0));
    r.value = v; paintFill();
    r.dispatchEvent(new Event('input', { bubbles: true }));
  });
}
function bindHex(colorId, hexId) {
  const c = $(colorId), h = $(hexId);
  if (!c || !h) return;
  h.textContent = c.value;
  c.addEventListener('input', () => { h.textContent = c.value; });
}

/* =========================================================================
   Camera list loading
   ========================================================================= */
async function loadCameras() {
  let kh = [];
  try {
    const r = await fetch('https://gensai-lab.github.io/eqlive/assets/json/kh-livec.json');
    if (r.ok) kh = await r.json();
  } catch (e) { console.warn(e); }

  let extra = [];
  try {
    const r = await fetch('https://kactuif.ikunocam.net/data');
    if (r.ok) {
      const d = await r.json();
      extra = (d.streams || []).map(s => ({ id: s.id, name: s.name, area: '', genre: 'akki', type: s.type || 'youtube', url: s.url }));
    }
  } catch (e) {
    try {
      const r = await fetch('https://corsproxy.io/?url=' + encodeURIComponent('https://kactuif.ikunocam.net/data'));
      if (r.ok) {
        const d = await r.json();
        extra = (d.streams || []).map(s => ({ id: s.id, name: s.name, area: '', genre: 'akki', type: s.type || 'youtube', url: s.url }));
      }
    } catch (_) { /* optional source */ }
  }
  cameras = [...kh, ...extra];
}

/* =========================================================================
   Seed data / persistence
   ========================================================================= */
function ensureSeed() {
  if (!switcher.scenes || Object.keys(switcher.scenes).length === 0) {
    const ids = ['scene_op', 'scene_studio', 'scene_news1', 'scene_news2', 'scene_weather'];
    const defaults = [
      ['OP', 'op', 1, null, 'OP', ''],
      ['スタジオ', 'studio', 2, null, 'スタジオ', ''],
      ['ニュース①', 'news', 3, null, 'ニュース①', '見出しを登録してください'],
      ['ニュース②', 'news', 4, null, 'ニュース②', '見出しを登録してください'],
      ['天気予報', 'weather', 5, null, '天気予報', '']
    ];
    const obj = {};
    defaults.forEach((d, i) => { obj[ids[i]] = { name: d[0], type: d[1], order: d[2], materialId: null, title: d[4], subtitle: d[5] }; });
    switcher.scenes = obj;
  }
  if (!switcher.materials) switcher.materials = {};
}
function writeSwitcher() { return dbSet(SWITCHER_PATH, switcher); }

/* =========================================================================
   Broadcast actions
   ========================================================================= */
function setMode(type) {
  if (type === 'camera') {
    const cam = activeCamera() || cameras[0];
    if (!cam) { alert('ライブカメラを読み込めていません。'); return; }
    dbUpdate('broadcast/current', { mainSource: 'camera', cameraSource: cam.id });
    setStatus('ライブカメラを送出しました', `broadcast/current → camera:${cam.id}`);
  } else {
    const s = activeScene();
    if (!s) { alert('シーンがありません。'); return; }
    sendScene(s);
  }
}
function sendScene(scene) {
  const m = activeMaterialForScene(scene);
  const p = materialToScreenProgram(m, scene);
  const current = { mainSource: 'screen', mainTitle: scene.title || '', subtitle: scene.subtitle || '' };
  dbUpdate('broadcast/current', current);
  dbSet('broadcast/screen_program', p);
  setStatus(`「${scene.name}」を送出しました`, `broadcast/screen_program (${p.type})`);
  renderPreview();
}
function materialToScreenProgram(m, scene) {
  if (!m) return { type: 'image', title: scene?.title || '', url: PREPARE_URL };
  if (m.type === 'title') return { type: 'image', title: m.title || scene?.title || '', url: buildTitleSvgData(m) };
  const p = { type: m.type || 'image', title: m.title || scene?.title || '', url: m.url || PREPARE_URL };
  if (m.type === 'video') { p.loop = m.loop !== false; p.muted = m.muted !== false; }
  return p;
}
function outputMaterial(m) {
  const p = materialToScreenProgram(m, { title: m?.title || '' });
  dbUpdate('broadcast/current', { mainSource: 'screen', mainTitle: m?.title || '', subtitle: m?.subtitle || '' });
  dbSet('broadcast/screen_program', p);
  setStatus(`素材「${m?.name || '未選択'}」を送出`, `broadcast/screen_program (${p.type})`);
}
function sendPrepare() {
  dbUpdate('broadcast/current', { mainSource: 'screen', mainTitle: '', subtitle: '' });
  dbSet('broadcast/screen_program', { type: 'image', title: '', url: PREPARE_URL });
  setStatus('準備中画面を送出', 'broadcast/screen_program → prepare.png');
}
function sendBlack() {
  dbUpdate('broadcast/current', { mainSource: 'screen', mainTitle: '', subtitle: '' });
  dbSet('broadcast/screen_program', {
    type: 'image', title: '',
    url: 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><rect width="1920" height="1080" fill="#000"/></svg>')
  });
  setStatus('黒画面を送出', 'broadcast/screen_program → black');
}
function setStatus(text, path) { $('status-text').textContent = text; $('status-path').textContent = path; }

/* =========================================================================
   Title-card SVG builder
   ========================================================================= */
function buildTitleSvgData(m) {
  const title = esc(m.title || '');
  const sub = esc(m.subtitle || '');
  const bg = esc(m.background || '#0b1536');
  const accent = esc(m.accent || '#005AFF');
  const titleSize = Math.max(42, Math.min(120, Number(m.titleSize) || 86));
  const subSize = Math.max(20, Math.min(60, Number(m.subtitleSize) || 38));
  const weight = m.fontWeight === 'B' ? '800' : m.fontWeight === 'M' ? '500' : '700';
  const fontFamily = 'EQLiveUD, BIZ UDPGothic, sans-serif';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <style>
        @font-face{font-family:EQLiveUD;src:url('${FONT_URLS.B}') format('opentype');font-weight:800}
        @font-face{font-family:EQLiveUD;src:url('${FONT_URLS.DB}') format('opentype');font-weight:700}
        @font-face{font-family:EQLiveUD;src:url('${FONT_URLS.M}') format('opentype');font-weight:500}
        .t{font-family:${fontFamily};font-weight:${weight}}
      </style>
      <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="${bg}"/><stop offset="1" stop-color="#07090e"/></linearGradient>
    </defs>
    <rect width="1920" height="1080" fill="url(#g)"/>
    <rect x="0" y="0" width="18" height="1080" fill="${accent}"/>
    <text x="110" y="500" class="t" fill="#fff" font-size="${titleSize}">${title}</text>
    <text x="110" y="590" class="t" fill="#d9e0ea" font-size="${subSize}">${sub}</text>
    <rect x="110" y="630" width="420" height="8" rx="4" fill="${accent}"/>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

/* =========================================================================
   Live preview (stage)
   ========================================================================= */
function renderPreview() {
  const p = $('preview');
  if (hls) { try { hls.destroy(); } catch (_) {} hls = null; }
  const cur = broadcast.current || {};
  const sp = broadcast.screen_program || {};
  const cam = activeCamera();

  $('mode-badge').textContent = cur.mainSource === 'screen' ? '報道画面' : 'ライブカメラ';
  $('stage-title').textContent = cur.mainSource === 'screen' ? (sp.title || '報道画面プレビュー') : `ライブカメラ：${cam?.name || '未選択'}`;
  p.innerHTML = '';

  if (cur.mainSource === 'camera') {
    if (!cam) { p.innerHTML = '<div class="preview-placeholder small">ライブカメラを選択してください</div>'; return; }
    if (cam.type === 'youtube') {
      const id = extractYoutubeId(cam.url);
      p.innerHTML = id
        ? `<iframe src="https://www.youtube.com/embed/${esc(id)}?autoplay=1&mute=1&controls=1&rel=0" allow="autoplay; encrypted-media"></iframe>`
        : '<div class="preview-placeholder small">YouTube URLを確認してください</div>';
    } else {
      const v = document.createElement('video');
      v.autoplay = true; v.muted = true; v.playsInline = true; v.controls = false;
      p.appendChild(v);
      if (window.Hls && Hls.isSupported() && cam.url) {
        hls = new Hls(); hls.loadSource(cam.url); hls.attachMedia(v);
      } else if (cam.url) {
        v.src = cam.url;
        v.addEventListener('error', () => { p.innerHTML = '<div class="preview-placeholder small">カメラ映像を読み込めませんでした</div>'; });
      }
    }
  } else {
    const type = sp.type || 'image';
    if (type === 'youtube') {
      const id = extractYoutubeId(sp.url);
      p.innerHTML = id
        ? `<iframe src="https://www.youtube.com/embed/${esc(id)}?autoplay=1&mute=1&controls=1&rel=0" allow="autoplay; encrypted-media"></iframe>`
        : '<div class="preview-placeholder small">YouTube URLを確認してください</div>';
    } else if (type === 'web') {
      p.innerHTML = sp.url ? `<iframe src="${esc(sp.url)}" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>` : '<div class="preview-placeholder">プレビュー画面</div>';
    } else if (type === 'video') {
      p.innerHTML = sp.url ? `<video src="${esc(sp.url)}" autoplay ${sp.loop ? 'loop' : ''} ${sp.muted !== false ? 'muted' : ''} playsinline controls></video>` : '<div class="preview-placeholder">プレビュー画面</div>';
    } else {
      p.innerHTML = sp.url ? `<img src="${esc(sp.url)}" alt="">` : '<div class="preview-placeholder">プレビュー画面</div>';
    }
    if (cur.mainTitle || cur.subtitle) {
      const o = document.createElement('div');
      o.className = 'preview-overlay';
      o.innerHTML = `<div class="main-title">${esc(cur.mainTitle || '')}</div><div class="sub">${esc(cur.subtitle || '')}</div>`;
      p.appendChild(o);
    }
  }
}
function extractYoutubeId(url) {
  if (!url) return '';
  if (url.includes('embed/')) return url.split('embed/')[1].split(/[?&]/)[0];
  if (url.includes('watch?v=')) return url.split('watch?v=')[1].split('&')[0];
  if (url.includes('youtu.be/')) return url.split('youtu.be/')[1].split(/[?&]/)[0];
  return url.trim();
}

  $('scene-prev').onclick = () => { if (sceneIndex > 0) { sceneIndex--; renderScene(); renderPreview(); } };

    $('scene-save').onclick = () => {
      Object.assign(s, {
        name: $('scene-name').value.trim() || '新しいシーン',

        title: $('scene-title').value,
        subtitle: $('scene-sub').value,
        materialId: $('scene-material').value || null
      });
      switcher.scenes[s.id] = s;
      writeSwitcher();
      renderAll();

}
function addScene() {
  const ss = scenes();
  const id = uid('scene');
  switcher.scenes[id] = { name: '新しいシーン', type: 'news', order: ss.length + 1, materialId: null, title: '', subtitle: '' };
  sceneIndex = ss.length;
  writeSwitcher().then(renderAll);
}
function deleteScene() {
  const s = activeScene();
  if (!s || !confirm(`「${s.name}」を削除しますか？`)) return;
  delete switcher.scenes[s.id];
  const ss = scenes();
  ss.forEach((x, i) => { x.order = i + 1; switcher.scenes[x.id] = x; });
  sceneIndex = Math.max(0, sceneIndex - 1);
  writeSwitcher().then(renderAll);
}
function moveScene(dir) {
  const ss = scenes();
  const i = sceneIndex, j = i + dir;
  if (j < 0 || j >= ss.length) return;
  const a = ss[i], b = ss[j];
  const temp = a.order; a.order = b.order; b.order = temp;
  switcher.scenes[a.id] = a; switcher.scenes[b.id] = b;
  sceneIndex = j;
  writeSwitcher().then(renderAll);
}

    <div class="panel">
      <h3><i class="material-icons">text_fields</i>報道見出し・テロップ</h3>
      <label class="label">メインタイトル</label><input id="out-main" value="${esc(cur.mainTitle || '')}">
      <label class="label">サブタイトル</label><input id="out-sub" value="${esc(cur.subtitle || '')}">
      <div class="row" style="margin-top:8px"><button class="btn primary" id="out-title">タイトルを反映</button><button class="btn red" id="out-clear">クリア</button></div>
      <div class="hr"></div>
      <label class="label">Ticker ジャンル</label><input id="out-tg" value="${esc(broadcast.ticker?.genre || '')}">
      <label class="label">Ticker 1行目</label><input id="out-t1" value="${esc(broadcast.ticker?.line1 || '')}">
      <label class="label">Ticker 2行目</label><input id="out-t2" value="${esc(broadcast.ticker?.line2 || '')}">
      <button class="btn" style="margin-top:8px" id="out-ticker">Tickerを更新</button>
    </div>

    <div class="panel">
      <h3><i class="material-icons">grid_view</i>レイアウト制御</h3>
      <div class="row"><button class="btn ${cur.layoutMode === 'live' ? 'primary' : ''}" id="out-normal">通常放送</button><button class="btn ${cur.layoutMode === 'emergency' ? 'red' : ''}" id="out-emergency">有事放送</button></div>
      <div class="row" style="margin-top:8px"><button class="btn ${broadcast.current_mode === 'sub-switcher' ? 'primary' : ''}" id="out-l-off">L字 OFF</button><button class="btn ${broadcast.current_mode === 'l-screen' ? 'red' : ''}" id="out-l-on">L字 ON</button></div>
      <div class="row" style="margin-top:8px"><button class="btn ${cur.timeVisible !== false ? 'primary' : ''}" id="out-time-on">時計 ON</button><button class="btn ${cur.timeVisible === false ? 'primary' : ''}" id="out-time-off">時計 OFF</button></div>
    </div>

    <div class="panel">
      <h3><i class="material-icons">closed_caption</i>文字スーパー（10秒固定送出）</h3>
      <textarea id="out-super" placeholder="1行目&#10;2行目"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn primary" id="out-super-send">送出</button><button class="btn red" id="out-super-stop">停止</button></div>
    </div>`;

  document.querySelectorAll('[data-send-scene]').forEach(b => b.onclick = () => { const s = ss.find(x => x.id === b.dataset.sendScene); if (s) { sceneIndex = ss.indexOf(s); sendScene(s); renderOutput(); } });
  $('output-material-send').onclick = () => { const m = ms.find(x => x.id === $('output-material').value); if (m) outputMaterial(m); };
  $('out-title').onclick = () => { dbUpdate('broadcast/current', { mainTitle: $('out-main').value, subtitle: $('out-sub').value }); setStatus('見出しを反映しました', 'broadcast/current'); renderPreview(); };
  $('out-clear').onclick = () => { dbUpdate('broadcast/current', { mainTitle: '', subtitle: '' }); renderPreview(); };
  $('out-ticker').onclick = () => { dbUpdate('broadcast/ticker', { active: true, genre: $('out-tg').value, line1: $('out-t1').value, line2: $('out-t2').value }); setStatus('Tickerを更新しました', 'broadcast/ticker'); };
  $('out-normal').onclick = () => dbUpdate('broadcast/current', { layoutMode: 'live' });
  $('out-emergency').onclick = () => dbUpdate('broadcast/current', { layoutMode: 'emergency' });
  $('out-l-off').onclick = () => dbSet('broadcast/current_mode', 'sub-switcher');
  $('out-l-on').onclick = () => dbSet('broadcast/current_mode', 'l-screen');
  $('out-time-on').onclick = () => dbUpdate('broadcast/current', { timeVisible: true });
  $('out-time-off').onclick = () => dbUpdate('broadcast/current', { timeVisible: false });
  $('out-super-send').onclick = () => {
    const t = $('out-super').value.trim();
    if (!t) return;
    dbSet('broadcast/text_super_sequence', { cards: [{ id: uid('card'), text: t }], genre: null, currentIndex: 0, interval: 10, status: 'playing', timestamp: Date.now() });
    setStatus('文字スーパーを送出', 'broadcast/text_super_sequence');
  };
  $('out-super-stop').onclick = () => dbSet('broadcast/text_super_sequence', { cards: [], genre: null, currentIndex: -1, interval: 10, status: 'stopped', timestamp: Date.now() });
}

/* =========================================================================
   Sidebar: 素材編集 タブ（Figma風コントロール）
   ========================================================================= */
function renderMaterial() {
  const ms = materials();
  const m = ms.find(x => x.id === editingMaterialId) || ms[0] || null;
  editingMaterialId = m?.id || null;

  $('side-material').innerHTML = `
    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <div><h3 style="margin:0"><i class="material-icons">perm_media</i>素材一覧</h3><div class="tiny" style="margin-top:3px">画像・動画・YouTube・Web・見出し画面</div></div>
        <button class="btn primary small" id="mat-add">＋追加</button>
      </div>
      <div class="list" style="margin-top:10px">
        ${ms.map(x => `<button class="list-item ${x.id === editingMaterialId ? 'active' : ''}" style="text-align:left;width:100%" data-mat="${esc(x.id)}"><div class="list-main"><strong>${esc(x.name)}</strong><span>${esc(x.type || 'image')}</span></div><div class="tiny" style="margin-top:5px">${esc(x.title || x.url || '')}</div></button>`).join('')}
        ${ms.length === 0 ? '<div class="empty">素材がありません。「＋追加」から作成してください。</div>' : ''}
      </div>
    </div>

    ${m ? `<div class="panel">
      <div class="detail-title">${esc(m.name)}</div>
      <div class="detail-sub">素材編集</div>

      <div class="field-group">
        <div class="field-group-title">基本情報</div>
        <label class="label">名称</label><input id="mat-name" value="${esc(m.name || '')}">
        <label class="label" style="margin-top:9px">種類</label>
        <select id="mat-type">
          <option value="image" ${m.type === 'image' ? 'selected' : ''}>画像</option>
          <option value="video" ${m.type === 'video' ? 'selected' : ''}>映像</option>
          <option value="youtube" ${m.type === 'youtube' ? 'selected' : ''}>YouTube</option>
          <option value="web" ${m.type === 'web' ? 'selected' : ''}>Web</option>
          <option value="title" ${m.type === 'title' ? 'selected' : ''}>報道見出し画面（自動生成）</option>
        </select>
        <label class="label" style="margin-top:9px">URL（画像・映像・YouTube・Web）</label>
        <input id="mat-url" value="${esc(m.url || '')}" placeholder="https://...">
      </div>

      <div class="field-group">
        <div class="field-group-title">テキスト</div>
        <label class="label">見出し</label><input id="mat-title" value="${esc(m.title || '')}">
        <label class="label" style="margin-top:9px">サブ見出し</label><input id="mat-sub" value="${esc(m.subtitle || '')}">
        <label class="label" style="margin-top:9px">フォント</label>
        <select id="mat-weight">
          <option value="M" ${m.fontWeight === 'M' ? 'selected' : ''}>Medium</option>
          <option value="DB" ${m.fontWeight === 'DB' ? 'selected' : ''}>DemiBold</option>
          <option value="B" ${m.fontWeight === 'B' ? 'selected' : ''}>Bold</option>
        </select>

        <div class="field" style="margin-top:12px">
          <div class="field-head"><label class="label">タイトルサイズ</label><span class="field-value" id="mat-tsize-unit">${m.titleSize || 86}px</span></div>
          <div class="slider-row">
            <input type="range" id="mat-tsize" min="42" max="120" value="${m.titleSize || 86}">
            <input type="number" id="mat-tsize-num" class="slider-num" min="42" max="120" value="${m.titleSize || 86}">
          </div>
        </div>
        <div class="field">
          <div class="field-head"><label class="label">サブサイズ</label><span class="field-value" id="mat-ssize-unit">${m.subtitleSize || 38}px</span></div>
          <div class="slider-row">
            <input type="range" id="mat-ssize" min="20" max="60" value="${m.subtitleSize || 38}">
            <input type="number" id="mat-ssize-num" class="slider-num" min="20" max="60" value="${m.subtitleSize || 38}">
          </div>
        </div>
      </div>

      <div class="field-group">
        <div class="field-group-title">カラー</div>
        <div class="grid2">
          <div><label class="label">文字色</label><div class="color-field"><input id="mat-color" type="color" value="${esc(m.color || '#ffffff')}"><span class="hex" id="mat-color-hex">${esc(m.color || '#ffffff')}</span></div></div>
          <div><label class="label">背景色</label><div class="color-field"><input id="mat-bg" type="color" value="${esc(m.background || '#0b1536')}"><span class="hex" id="mat-bg-hex">${esc(m.background || '#0b1536')}</span></div></div>
        </div>
        <div style="margin-top:10px"><label class="label">アクセント</label><div class="color-field"><input id="mat-accent" type="color" value="${esc(m.accent || '#005AFF')}"><span class="hex" id="mat-accent-hex">${esc(m.accent || '#005AFF')}</span></div></div>
      </div>

      <div class="field-group">
        <div class="field-group-title">動画オプション</div>
        <div class="switch-row"><label class="switch"><input id="mat-loop" type="checkbox" ${m.loop !== false ? 'checked' : ''}><span class="track"></span></label><span class="switch-label">動画をループ</span></div>
        <div class="switch-row" style="margin-top:8px"><label class="switch"><input id="mat-muted" type="checkbox" ${m.muted !== false ? 'checked' : ''}><span class="track"></span></label><span class="switch-label">動画をミュート</span></div>
      </div>

      <label class="label">プレビュー</label>
      <div id="mat-preview" class="material-preview"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" id="mat-save">保存</button>
        <button class="btn" id="mat-send">この素材を送出</button>
        <button class="btn red" id="mat-delete">削除</button>
      </div>
    </div>` : '<div class="panel"><div class="empty">素材を選択してください。</div></div>'}`;

  $('mat-add').onclick = () => {
    const id = uid('mat');
    switcher.materials[id] = {
      name: '新規素材', type: 'title', url: '', title: 'ニュース見出し', subtitle: '',
      fontWeight: 'DB', color: '#ffffff', titleSize: 86, subtitleSize: 38,
      background: '#0b1536', accent: '#005AFF', loop: true, muted: true
    };
    editingMaterialId = id;
    writeSwitcher().then(renderMaterial);
  };
  document.querySelectorAll('[data-mat]').forEach(b => b.onclick = () => { editingMaterialId = b.dataset.mat; renderMaterial(); });

  if (m) {
    const readMatForm = () => ({
      ...m,
      name: $('mat-name').value.trim() || '無題素材',
      type: $('mat-type').value,
      url: $('mat-url').value,
      title: $('mat-title').value,
      subtitle: $('mat-sub').value,
      fontWeight: $('mat-weight').value,
      color: $('mat-color').value,
      titleSize: Number($('mat-tsize').value) || 86,
      subtitleSize: Number($('mat-ssize').value) || 38,
      background: $('mat-bg').value,
      accent: $('mat-accent').value,
      loop: $('mat-loop').checked,
      muted: $('mat-muted').checked
    });
    const updateM = () => { const v = readMatForm(); Object.assign(m, v); switcher.materials[m.id] = m; };

    $('mat-save').onclick = () => { updateM(); writeSwitcher().then(renderAll); };
    $('mat-send').onclick = () => { updateM(); writeSwitcher().then(() => outputMaterial(m)); };
    $('mat-delete').onclick = () => {
      if (confirm(`「${m.name}」を削除しますか？`)) {
        delete switcher.materials[m.id];
        editingMaterialId = null;
        writeSwitcher().then(renderAll);
      }
    };

    // Figma風スライダー・カラー表示のバインド(表示同期のみ。保存されるデータ構造は変更なし)
    bindSlider('mat-tsize', 'mat-tsize-num');
    bindSlider('mat-ssize', 'mat-ssize-num');
    bindHex('mat-color', 'mat-color-hex');
    bindHex('mat-bg', 'mat-bg-hex');
    bindHex('mat-accent', 'mat-accent-hex');

    ['mat-type', 'mat-url', 'mat-title', 'mat-sub', 'mat-weight', 'mat-color', 'mat-tsize', 'mat-ssize', 'mat-bg', 'mat-accent', 'mat-loop', 'mat-muted'].forEach(id => {
      $(id)?.addEventListener('input', () => {
        renderMaterialPreview(readMatForm());
        if ($('mat-tsize-unit')) $('mat-tsize-unit').textContent = $('mat-tsize').value + 'px';
        if ($('mat-ssize-unit')) $('mat-ssize-unit').textContent = $('mat-ssize').value + 'px';
      });
    });
    renderMaterialPreview(readMatForm());
  }
}
function renderMaterialPreview(m) {
  const p = $('mat-preview');
  if (!p) return;
  p.innerHTML = '';
  const temp = { ...m };
  if (temp.type === 'title') {
    p.innerHTML = `<img src="${buildTitleSvgData(temp)}">`;
  } else if (temp.type === 'youtube') {
    const id = extractYoutubeId(temp.url);
    p.innerHTML = id ? `<iframe src="https://www.youtube.com/embed/${esc(id)}?mute=1&controls=1&rel=0"></iframe>` : '<div class="preview-placeholder small">YouTube</div>';
  } else if (temp.type === 'web') {
    p.innerHTML = temp.url ? `<iframe src="${esc(temp.url)}"></iframe>` : '<div class="preview-placeholder small">Web</div>';
  } else if (temp.type === 'video') {
    p.innerHTML = temp.url ? `<video src="${esc(temp.url)}" controls ${temp.loop ? 'loop' : ''} ${temp.muted ? 'muted' : ''}></video>` : '<div class="preview-placeholder small">VIDEO</div>';
  } else {
    p.innerHTML = temp.url ? `<img src="${esc(temp.url)}">` : '<div class="preview-placeholder small">IMAGE</div>';
  }
}

/* =========================================================================
   Clock / scene scheduler
   ========================================================================= */
function updateClock() { const el = $('program-clock'); if (el) el.textContent = nowString(); }
function renderAll() { renderMode(); renderScene(); renderOutput(); renderMaterial(); renderPreview(); updateClock(); }
function armSchedule() {
  clearTimeout(scheduleTimer);
  scheduleTimer = null;
  preloadedSceneId = null;
  if (!switcher.schedule?.enabled) return;
  const s = scenes().find(x => x.id === switcher.schedule.sceneId);
  if (!s) return;
  const ts = Number(switcher.schedule.triggerAt);
  if (ts <= Date.now()) return;
  const prep = ts - (switcher.schedule.preload !== false ? 10000 : 0);
  if (switcher.schedule.preload !== false) {
    setTimeout(() => preloadScene(s), Math.max(0, prep - Date.now()));
  }
  scheduleTimer = setTimeout(() => {
    sendScene(s);
    switcher.schedule.lastTriggeredAt = Date.now();
    writeSwitcher();
  }, Math.max(0, ts - Date.now()));
}
function preloadScene(scene) {
  const m = activeMaterialForScene(scene);
  if (!m) return;
  preloadedSceneId = scene.id;
  if (m.type === 'image' || m.type === 'title') {
    preloader = new Image();
    preloader.src = m.type === 'title' ? buildTitleSvgData(m) : m.url || '';
  } else if (m.type === 'video') {
    preloader = document.createElement('video');
    preloader.preload = 'auto'; preloader.muted = true; preloader.src = m.url || ''; preloader.load();
  }
  setStatus(`「${scene.name}」を事前読み込み中`, `schedule preloading → ${scene.id}`);
}

/* =========================================================================
   Auth
   ========================================================================= */
onAuthStateChanged(auth, async user => {
  const err = $('login-error');
  if (user) {
    $('login').style.display = 'none';
    $('app').classList.add('visible');
    $('auth-state').textContent = user.email || '接続中';
    try {
      await loadCameras();
      onValue(ref(db, 'broadcast'), snap => {
        broadcast = snap.val() || {};
        try {
          if (activeTab === 'output' || activeTab === 'mode') renderAll(); else renderPreview();
        } catch (e) {
          console.error('[EQLive Reporter Switcher] render error:', e);
          setStatus('画面初期化エラー', e?.message || String(e));
        }
      }, error => {
        console.error('[EQLive Reporter Switcher] broadcast read error:', error);
        const msg = error?.code === 'PERMISSION_DENIED' ? 'Firebase Realtime Databaseの読み取り権限がありません。Rulesを確認してください。' : `Firebase読み取りエラー: ${error?.message || error}`;
        setStatus(msg, 'broadcast');
      });
      onValue(ref(db, SWITCHER_PATH), snap => {
        switcher = snap.val() || {};
        ensureSeed();
        if (!snap.exists() || !switcher.scenes || Object.keys(switcher.scenes).length === 0) {
          writeSwitcher();
        }
        armSchedule();
        try { renderAll(); } catch (e) {
          console.error('[EQLive Reporter Switcher] switcher render error:', e);
          setStatus('画面初期化エラー', e?.message || String(e));
        }
      }, error => {
        console.error('[EQLive Reporter Switcher] switcher read error:', error);
        const msg = error?.code === 'PERMISSION_DENIED' ? 'Firebase Realtime Databaseの読み取り権限がありません。broadcast/reporter_switcher のRulesを確認してください。' : `Firebase読み取りエラー: ${error?.message || error}`;
        setStatus(msg, SWITCHER_PATH);
      });
    } catch (e) {
      console.error('[EQLive Reporter Switcher] startup error:', e);
      $('auth-state').textContent = '初期化エラー';
      setStatus('ログインは成功しましたが、初期化に失敗しました', e?.message || String(e));
    }
  } else {
    $('login').style.display = 'flex';
    $('app').classList.remove('visible');
    $('auth-state').textContent = '未ログイン';
  }
});

$('login-btn').onclick = async () => {
  const rawId = $('login-id').value.trim();
  const pw = $('login-pass').value;
  const err = $('login-error');
  if (!rawId || !pw) {
    err.textContent = 'メールアドレス（またはユーザーID）とパスワードを入力してください。';
    err.style.display = 'block';
    return;
  }

  // Firebase Authentication に登録されているメールアドレスをそのまま使用。
  // 従来のEQLive管理画面と同じ「ユーザーID」形式（@なし）にも対応する。
  const email = rawId.includes('@') ? rawId : `${rawId}@kactuif.internal`;
  err.style.display = 'none';

  try {
    await signInWithEmailAndPassword(auth, email, pw);
  } catch (e) {
    console.error('[EQLive Reporter Switcher] Firebase Auth error:', e);
    const messages = {
      'auth/invalid-credential': 'メールアドレスまたはパスワードが正しくありません。',
      'auth/invalid-login-credentials': 'メールアドレスまたはパスワードが正しくありません。',
      'auth/user-not-found': 'Firebase Authenticationに登録されているユーザーが見つかりません。',
      'auth/wrong-password': 'パスワードが正しくありません。',
      'auth/too-many-requests': 'ログイン試行回数が多すぎます。しばらく待ってから再試行してください。',
      'auth/network-request-failed': 'Firebaseへの接続に失敗しました。ネットワーク接続を確認してください。',
      'auth/operation-not-allowed': 'Firebase Authenticationの「メール/パスワード」ログインが有効になっていません。',
      'auth/invalid-email': 'メールアドレスの形式が正しくありません。'
    };
    err.textContent = messages[e?.code] || `ログインに失敗しました。(${e?.code || 'unknown-error'})`;
    err.style.display = 'block';
  }
};
$('login-pass').addEventListener('keydown', e => { if (e.key === 'Enter') $('login-btn').click(); });

/* =========================================================================
   Boot
   ========================================================================= */
setInterval(() => { $('program-clock').textContent = nowString(); }, 1000);
window.addEventListener('keydown', e => {
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;
  if (activeTab === 'scene') {
    if (e.key === 'ArrowLeft') { e.preventDefault(); moveScene(-1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); moveScene(1); }
  }
});
window.addEventListener('beforeunload', () => { if (hls) try { hls.destroy(); } catch (_) {} });

afterStart();
function afterStart() { switchTab('mode'); $('program-clock').textContent = nowString(); }
</script>
