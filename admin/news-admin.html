<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EQLive 報道スイッチャー</title>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
@font-face{font-family:EQLiveUD;src:url('https://gensai-lab.github.io/eqlive/assets/fonts/FOT-UDKakugo_LargePr6-M.otf') format('opentype');font-weight:500;font-display:swap}
@font-face{font-family:EQLiveUD;src:url('https://gensai-lab.github.io/eqlive/assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');font-weight:700;font-display:swap}
@font-face{font-family:EQLiveUD;src:url('https://gensai-lab.github.io/eqlive/assets/fonts/FOT-UDKakugo_LargePr6-B.otf') format('opentype');font-weight:800;font-display:swap}
:root{--bg:#0b0c0e;--panel:#15171a;--panel2:#1d2024;--border:#30343a;--text:#f5f7fa;--muted:#9ea5ad;--blue:#005AFF;--blue2:#0b74ff;--green:#16a34a;--red:#e23636;--amber:#f0a400;--shadow:0 12px 30px rgba(0,0,0,.28);--header:68px;--sidebar:440px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:'BIZ UDPGothic',sans-serif;height:100vh;overflow:hidden}
button,input,select,textarea{font:inherit} button{cursor:pointer}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#070809;z-index:9999;padding:20px}
.login-box{width:min(420px,100%);background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:28px}
.login-box h1{margin:0 0 8px;font-size:24px;letter-spacing:.02em}.login-box p{margin:0 0 22px;color:var(--muted);font-size:13px}
.label{display:block;color:var(--muted);font-size:12px;margin:0 0 7px;font-weight:700}
input,select,textarea{width:100%;background:#08090b;color:var(--text);border:1px solid #3a3f46;border-radius:7px;padding:10px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,90,255,.18)}
textarea{min-height:96px;resize:vertical}
.app{display:none;height:100vh;flex-direction:column}.app.visible{display:flex}
.header{height:var(--header);background:#050607;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex:0 0 auto}
.header-title{display:flex;align-items:center;gap:14px}.header-title .brand{font-weight:800;font-size:25px;letter-spacing:.02em}.header-title .tag{padding:7px 10px;border-radius:6px;background:#1c1f23;color:#dce2e8;font-size:14px}
.header-right{display:flex;align-items:center;gap:10px}.clock{font-variant-numeric:tabular-nums;color:#cbd1d7;font-size:13px}.live-dot{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid #3a3f46;border-radius:999px;font-size:12px}.live-dot i{font-size:10px;color:#35d46b}
.main{display:flex;flex:1;min-height:0}
.sidebar{width:var(--sidebar);background:#121416;border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;flex:0 0 52px;border-bottom:1px solid var(--border)}.tab{flex:1;background:#17191c;color:#aeb4bc;border:0;border-right:1px solid var(--border);font-size:15px;font-weight:700}.tab.active{background:#23272c;color:#fff;box-shadow:inset 0 -3px 0 var(--blue)}.tab:last-child{border-right:0}
.side-scroll{overflow:auto;padding:14px 16px 24px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:13px}.panel h3{font-size:14px;margin:0 0 13px}.subtle{color:var(--muted);font-size:11px;line-height:1.6}
.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.row.wrap{flex-wrap:wrap}.row.wrap>*{flex:1 1 160px}.col{display:flex;flex-direction:column;gap:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{border:1px solid #454a51;border-radius:7px;background:#252a30;color:#fff;padding:10px 12px;font-weight:700;transition:.15s}.btn:hover{filter:brightness(1.08)}.btn.primary{background:var(--blue);border-color:var(--blue)}.btn.green{background:var(--green);border-color:var(--green)}.btn.red{background:var(--red);border-color:var(--red)}.btn.ghost{background:transparent}.btn.small{padding:6px 8px;font-size:11px}.btn.big{padding:13px 14px;font-size:15px}.btn:disabled{opacity:.4;cursor:not-allowed}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode-card{border:1px solid #3a4048;border-radius:8px;background:#101215;padding:14px;text-align:left}.mode-card.active{border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,90,255,.15)}.mode-card .icon{font-size:22px;margin-bottom:8px}.mode-card strong{display:block;font-size:15px}.mode-card span{display:block;color:var(--muted);font-size:11px;margin-top:5px}
.seq-list{display:flex;gap:6px;flex-wrap:wrap}.seq-item{display:flex;align-items:center;gap:5px}.seq-chip{padding:9px 11px;background:#0d0f12;border:1px solid #343940;border-radius:6px;font-size:12px}.seq-chip.active{background:rgba(0,90,255,.17);border-color:var(--blue);color:#fff}.seq-arrow{color:#7e858e;font-size:15px}
.list{display:flex;flex-direction:column;gap:7px}.list-item{background:#101215;border:1px solid #333940;border-radius:7px;padding:10px}.list-item.active{border-color:var(--blue);background:rgba(0,90,255,.10)}.list-main{display:flex;align-items:center;justify-content:space-between;gap:10px}.list-main strong{font-size:13px}.list-main span{font-size:10px;color:var(--muted)}
.stage{flex:1;min-width:0;display:flex;flex-direction:column;background:#3e4145}.stage-top{padding:14px 18px;border-bottom:1px solid #55585d;background:#303337;display:flex;justify-content:space-between;align-items:center;gap:12px}.stage-top .title{font-size:13px;color:#fff}.stage-actions{display:flex;gap:8px}.stage-body{flex:1;display:flex;align-items:center;justify-content:center;padding:26px;min-height:0;overflow:auto}.preview-frame{position:relative;width:min(100%, 1100px);aspect-ratio:16/9;background:#000;box-shadow:0 12px 40px rgba(0,0,0,.35);overflow:hidden}.preview-frame iframe,.preview-frame video,.preview-frame img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain;background:#000}.preview-overlay{position:absolute;left:0;right:0;bottom:0;padding:14px 18px;background:linear-gradient(transparent,rgba(0,0,0,.84));pointer-events:none}.preview-overlay .main-title{font-family:EQLiveUD,'BIZ UDPGothic',sans-serif;font-weight:800;font-size:clamp(16px,2.1vw,29px);text-shadow:0 2px 5px #000}.preview-overlay .sub{font-family:EQLiveUD,'BIZ UDPGothic',sans-serif;font-size:clamp(11px,1.2vw,17px);margin-top:4px;color:#e7ebef;text-shadow:0 1px 4px #000}
.preview-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#02035e;color:#fff;font-size:clamp(28px,4vw,62px);font-family:EQLiveUD,'BIZ UDPGothic',sans-serif}.preview-placeholder.small{font-size:clamp(19px,2.5vw,36px)}
.statusbar{padding:10px 18px;background:#1b1d21;border-top:1px solid #30343a;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px}.statusbar .state{color:#8fe1ad}.statusbar .path{color:#969da5;font-family:ui-monospace,monospace}
.section-title{font-size:12px;color:#cbd0d7;font-weight:700;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}.tiny{font-size:10px;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:8px}.toggle input{width:16px;margin:0}.timer-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hr{height:1px;background:#30343a;margin:12px 0}
.material-preview{border:1px solid #343940;border-radius:8px;overflow:hidden;background:#08090a;aspect-ratio:16/9;position:relative}.material-preview iframe,.material-preview video,.material-preview img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain}
.drag-note{font-size:10px;color:#777f88;margin-top:7px}.kbd{font-family:ui-monospace,monospace;padding:2px 5px;border:1px solid #42484f;border-radius:4px;background:#111318}
.detail-title{font-size:18px;margin:0 0 4px}.detail-sub{color:var(--muted);font-size:11px;margin-bottom:15px}
.bottom-actions{position:sticky;bottom:0;margin:12px -16px -12px;padding:10px 16px;background:linear-gradient(transparent,#121416 18%);display:flex;gap:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.empty{padding:26px 10px;text-align:center;color:#79818a;font-size:12px;border:1px dashed #3b4148;border-radius:8px}
.scene-line{display:flex;align-items:center;gap:6px;overflow:auto;padding-bottom:2px}.scene-line .scene-node{flex:0 0 auto}.scene-node button{max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;font-size:10px;border-radius:999px;padding:3px 7px;border:1px solid #3d434a;color:#cbd1d8;background:#111318}.badge.blue{border-color:#235ebd;background:rgba(0,90,255,.15)}.badge.green{border-color:#206b3c;background:rgba(22,163,74,.14)}.badge.red{border-color:#7b2d2d;background:rgba(226,54,54,.12)}
@media(max-width:1000px){:root{--sidebar:360px}.stage-body{padding:14px}}
@media(max-width:800px){:root{--sidebar:100%}.main{flex-direction:column}.sidebar{width:100%;height:56%;border-right:0;border-bottom:1px solid var(--border)}.stage{height:44%}.header-title .brand{font-size:18px}.header-title .tag{font-size:11px}.stage-body{padding:8px}}
</style>
</head>
<body>
<div id="login">
  <div class="login-box">
    <h1>EQLive 報道スイッチャー</h1>
    <p>EQLive の報道番組制作・送出を行う管理ツール</p>
    <label class="label">メールアドレス / ユーザーID</label>
    <input id="login-id" type="text" autocomplete="username" placeholder="Firebase Authenticationのメールアドレス（またはユーザーID）">
    <label class="label" style="margin-top:12px">パスワード</label>
    <input id="login-pass" type="password" autocomplete="current-password" placeholder="パスワード">
    <button id="login-btn" class="btn primary big" style="width:100%;margin-top:14px">ログイン</button>
    <div id="login-error" class="subtle" style="color:#ff7272;margin-top:10px;display:none"></div>
  </div>
</div>

<div id="app" class="app">
  <div class="header">
    <div class="header-title">
      <div class="brand">EQLive 報道スイッチャー</div>
      <div class="tag" id="program-clock">--.--.-- --:--:--</div>
    </div>
    <div class="header-right">
      <div class="live-dot"><i class="material-icons">fiber_manual_record</i><span id="auth-state">接続中</span></div>
      <button class="btn small" id="admin-back">Adminに戻る</button>
    </div>
  </div>
  <div class="main">
    <aside class="sidebar">
      <div class="tabs">
        <button class="tab active" data-tab="mode">モード</button>
        <button class="tab" data-tab="scene">シーン</button>
        <button class="tab" data-tab="output">画面送出</button>
        <button class="tab" data-tab="material">素材編集</button>
      </div>
      <div id="side-mode" class="side-scroll"></div>
      <div id="side-scene" class="side-scroll" style="display:none"></div>
      <div id="side-output" class="side-scroll" style="display:none"></div>
      <div id="side-material" class="side-scroll" style="display:none"></div>
    </aside>
    <section class="stage">
      <div class="stage-top">
        <div class="title" id="stage-title">送出プレビュー</div>
        <div class="stage-actions"><span class="badge blue" id="mode-badge">ライブカメラ</span><button class="btn small" id="refresh-preview">プレビュー更新</button></div>
      </div>
      <div class="stage-body"><div class="preview-frame" id="preview"></div></div>
      <div class="statusbar"><div class="state" id="status-text">待機中</div><div class="path" id="status-path">broadcast/current</div></div>
    </section>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue, set, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
  authDomain: "mgl-eqlive.firebaseapp.com",
  databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
  projectId: "mgl-eqlive",
  storageBucket: "mgl-eqlive.firebasestorage.app",
  messagingSenderId: "1060231327645",
  appId: "1:1060231327645:web:642684f4640bbc21d5c974"
};
const app=initializeApp(firebaseConfig); const db=getDatabase(app); const auth=getAuth(app);
const FONT_URLS={B:'https://gensai-lab.github.io/eqlive/assets/fonts/FOT-UDKakugo_LargePr6-B.otf',DB:'https://gensai-lab.github.io/eqlive/assets/fonts/FOT-UDKakugo_LargePr6-DB.otf',M:'https://gensai-lab.github.io/eqlive/assets/fonts/FOT-UDKakugo_LargePr6-M.otf'};
const PREPARE_URL='https://gensai-lab.github.io/eqlive/assets/image/prepare.png';
const SWITCHER_PATH='broadcast/reporter_switcher';
let broadcast={}; let switcher={}; let cameras=[]; let hls=null; let activeTab='mode'; let sceneIndex=0; let preloader=null; let scheduleTimer=null; let preloadedSceneId=null;
let editingMaterialId=null; let editingSceneId=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dbSet=(path,val)=>set(ref(db,path),val).catch(e=>{console.error(e);alert('Firebaseへの保存に失敗しました。権限・ログイン状態を確認してください。');});
const dbUpdate=(path,val)=>update(ref(db,path),val).catch(e=>{console.error(e);alert('Firebaseの更新に失敗しました。');});
const dbRemove=path=>remove(ref(db,path)).catch(e=>{console.error(e);alert('削除に失敗しました。');});

function localDateInput(ts){const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;}
function fmt(ts){if(!ts)return '--'; const d=new Date(ts); return d.toLocaleString('ja-JP',{hour12:false});}
function nowString(){return new Date().toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});}
function uid(prefix){return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2,7)}`}
function materials(){return Object.entries(switcher.materials||{}).map(([id,v])=>({id,...v}));}
function scenes(){return Object.entries(switcher.scenes||{}).map(([id,v])=>({id,...v})).sort((a,b)=>(a.order??0)-(b.order??0));}
function activeCamera(){return cameras.find(c=>c.id===broadcast?.current?.cameraSource);}
function activeScene(){return scenes()[sceneIndex] || scenes()[0] || null;}
function activeMaterialForScene(scene){return scene?.materialId ? materials().find(m=>m.id===scene.materialId):null;}

function switchTab(tab){activeTab=tab; document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab)); ['mode','scene','output','material'].forEach(k=>{$('side-'+k).style.display=k===tab?'block':'none'}); renderAll();}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
$('admin-back').onclick=()=>location.href='./admin.html';
$('refresh-preview').onclick=renderPreview;

async function loadCameras(){
  let kh=[]; try{const r=await fetch('https://gensai-lab.github.io/eqlive/assets/json/kh-livec.json'); if(r.ok) kh=await r.json();}catch(e){console.warn(e)}
  let extra=[]; try{const r=await fetch('https://kactuif.ikunocam.net/data'); if(r.ok){const d=await r.json(); extra=(d.streams||[]).map(s=>({id:s.id,name:s.name,area:'',genre:'akki',type:s.type||'youtube',url:s.url}));}}catch(e){
    try{const r=await fetch('https://corsproxy.io/?url='+encodeURIComponent('https://kactuif.ikunocam.net/data')); if(r.ok){const d=await r.json(); extra=(d.streams||[]).map(s=>({id:s.id,name:s.name,area:'',genre:'akki',type:s.type||'youtube',url:s.url}));}}catch(_){/* optional source */}
  }
  cameras=[...kh,...extra];
}

function ensureSeed(){
  if(!switcher.scenes || Object.keys(switcher.scenes).length===0){
    const ids=['scene_op','scene_studio','scene_news1','scene_news2','scene_weather'];
    const defaults=[
      ['OP','op',1,null,'OP',''],['スタジオ','studio',2,null,'スタジオ',''],
      ['ニュース①','news',3,null,'ニュース①','見出しを登録してください'],['ニュース②','news',4,null,'ニュース②','見出しを登録してください'],['天気予報','weather',5,null,'天気予報','']
    ];
    const obj={}; defaults.forEach((d,i)=>{obj[ids[i]]={name:d[0],type:d[1],order:d[2],materialId:null,title:d[4],subtitle:d[5]};});
    switcher.scenes=obj;
  }
  if(!switcher.materials) switcher.materials={};
}

function writeSwitcher(){return dbSet(SWITCHER_PATH,switcher);}
function setMode(type){
  if(type==='camera'){ const cam=activeCamera()||cameras[0]; if(!cam){alert('ライブカメラを読み込めていません。');return} dbUpdate('broadcast/current',{mainSource:'camera',cameraSource:cam.id}); setStatus('ライブカメラを送出しました',`broadcast/current → camera:${cam.id}`); }
  else { const s=activeScene(); if(!s){alert('シーンがありません。');return} sendScene(s); }
}
function sendScene(scene){
  const m=activeMaterialForScene(scene);
  const p=materialToScreenProgram(m,scene);
  const current={mainSource:'screen',mainTitle:scene.title||'',subtitle:scene.subtitle||''};
  dbUpdate('broadcast/current',current); dbSet('broadcast/screen_program',p);
  setStatus(`「${scene.name}」を送出しました`,`broadcast/screen_program (${p.type})`);
  renderPreview();
}
function materialToScreenProgram(m,scene){
  if(!m){return {type:'image',title:scene?.title||'',url:PREPARE_URL};}
  if(m.type==='title'){return {type:'image',title:m.title||scene?.title||'',url:buildTitleSvgData(m)}}
  const p={type:m.type||'image',title:m.title||scene?.title||'',url:m.url||PREPARE_URL}; if(m.type==='video'){p.loop=m.loop!==false;p.muted=m.muted!==false;} return p;
}
function buildTitleSvgData(m){
  const title=esc(m.title||''); const sub=esc(m.subtitle||''); const bg=esc(m.background||'#0b1536'); const accent=esc(m.accent||'#005AFF');
  const titleSize=Math.max(42,Math.min(120,Number(m.titleSize)||86)); const subSize=Math.max(20,Math.min(60,Number(m.subtitleSize)||38)); const weight=m.fontWeight==='B'?'800':m.fontWeight==='M'?'500':'700';
  const fontFamily='EQLiveUD, BIZ UDPGothic, sans-serif';
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><style>@font-face{font-family:EQLiveUD;src:url('${FONT_URLS.B}') format('opentype');font-weight:800}@font-face{font-family:EQLiveUD;src:url('${FONT_URLS.DB}') format('opentype');font-weight:700}@font-face{font-family:EQLiveUD;src:url('${FONT_URLS.M}') format('opentype');font-weight:500}.t{font-family:${fontFamily};font-weight:${weight}}</style><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="${bg}"/><stop offset="1" stop-color="#07090e"/></linearGradient></defs><rect width="1920" height="1080" fill="url(#g)"/><rect x="0" y="0" width="18" height="1080" fill="${accent}"/><text x="110" y="500" class="t" fill="#fff" font-size="${titleSize}">${title}</text><text x="110" y="590" class="t" fill="#d9e0ea" font-size="${subSize}">${sub}</text><rect x="110" y="630" width="420" height="8" rx="4" fill="${accent}"/></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function outputMaterial(m){ const p=materialToScreenProgram(m,{title:m?.title||''}); dbUpdate('broadcast/current',{mainSource:'screen',mainTitle:m?.title||'',subtitle:m?.subtitle||''}); dbSet('broadcast/screen_program',p); setStatus(`素材「${m?.name||'未選択'}」を送出`,`broadcast/screen_program (${p.type})`); }
function sendPrepare(){dbUpdate('broadcast/current',{mainSource:'screen',mainTitle:'',subtitle:''}); dbSet('broadcast/screen_program',{type:'image',title:'',url:PREPARE_URL}); setStatus('準備中画面を送出','broadcast/screen_program → prepare.png');}
function sendBlack(){dbUpdate('broadcast/current',{mainSource:'screen',mainTitle:'',subtitle:''}); dbSet('broadcast/screen_program',{type:'image',title:'',url:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080"><rect width="1920" height="1080" fill="#000"/></svg>')}); setStatus('黒画面を送出','broadcast/screen_program → black');}
function setStatus(text,path){$('status-text').textContent=text;$('status-path').textContent=path}

function renderPreview(){
  const p=$('preview'); if(hls){try{hls.destroy()}catch(_){ } hls=null}
  const cur=broadcast.current||{}; const sp=broadcast.screen_program||{}; const cam=activeCamera();
  $('mode-badge').textContent=cur.mainSource==='screen'?'報道画面':'ライブカメラ';
  $('stage-title').textContent=cur.mainSource==='screen'?(sp.title||'報道画面プレビュー'):`ライブカメラ：${cam?.name||'未選択'}`;
  p.innerHTML='';
  if(cur.mainSource==='camera'){
    if(!cam){p.innerHTML='<div class="preview-placeholder small">ライブカメラを選択してください</div>';return}
    if(cam.type==='youtube'){
      const id=extractYoutubeId(cam.url); p.innerHTML=id?`<iframe src="https://www.youtube.com/embed/${esc(id)}?autoplay=1&mute=1&controls=1&rel=0" allow="autoplay; encrypted-media"></iframe>`:'<div class="preview-placeholder small">YouTube URLを確認してください</div>';
    } else {
      const v=document.createElement('video');v.autoplay=true;v.muted=true;v.playsInline=true;v.controls=false;p.appendChild(v);
      if(window.Hls && Hls.isSupported() && cam.url){hls=new Hls();hls.loadSource(cam.url);hls.attachMedia(v)} else if(cam.url){v.src=cam.url;v.addEventListener('error',()=>{p.innerHTML='<div class="preview-placeholder small">カメラ映像を読み込めませんでした</div>'})}
    }
  } else {
    const type=sp.type||'image'; if(type==='youtube'){const id=extractYoutubeId(sp.url);p.innerHTML=id?`<iframe src="https://www.youtube.com/embed/${esc(id)}?autoplay=1&mute=1&controls=1&rel=0" allow="autoplay; encrypted-media"></iframe>`:'<div class="preview-placeholder small">YouTube URLを確認してください</div>'}
    else if(type==='web'){p.innerHTML=sp.url?`<iframe src="${esc(sp.url)}" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>`:'<div class="preview-placeholder">プレビュー画面</div>'}
    else if(type==='video'){p.innerHTML=sp.url?`<video src="${esc(sp.url)}" autoplay ${sp.loop?'loop':''} ${sp.muted!==false?'muted':''} playsinline controls></video>`:'<div class="preview-placeholder">プレビュー画面</div>'}
    else {p.innerHTML=sp.url?`<img src="${esc(sp.url)}" alt="">`:'<div class="preview-placeholder">プレビュー画面</div>'}
    if(cur.mainTitle||cur.subtitle){const o=document.createElement('div');o.className='preview-overlay';o.innerHTML=`<div class="main-title">${esc(cur.mainTitle||'')}</div><div class="sub">${esc(cur.subtitle||'')}</div>`;p.appendChild(o)}
  }
}
function extractYoutubeId(url){if(!url)return''; if(url.includes('embed/'))return url.split('embed/')[1].split(/[?&]/)[0]; if(url.includes('watch?v='))return url.split('watch?v=')[1].split('&')[0]; if(url.includes('youtu.be/'))return url.split('youtu.be/')[1].split(/[?&]/)[0]; return url.trim()}

function renderAll(){renderMode();renderScene();renderOutput();renderMaterial();renderPreview();updateClock();}
function armSchedule(){clearTimeout(scheduleTimer);scheduleTimer=null;preloadedSceneId=null; if(!switcher.schedule?.enabled) return; const s=scenes().find(x=>x.id===switcher.schedule.sceneId);if(!s)return;const ts=Number(switcher.schedule.triggerAt);if(ts<=Date.now()){return} const prep=ts-(switcher.schedule.preload!==false?10000:0); if(switcher.schedule.preload!==false){setTimeout(()=>preloadScene(s),Math.max(0,prep-Date.now()))} scheduleTimer=setTimeout(()=>{sendScene(s);switcher.schedule.lastTriggeredAt=Date.now();writeSwitcher();},Math.max(0,ts-Date.now()));}
function preloadScene(scene){const m=activeMaterialForScene(scene);if(!m)return;preloadedSceneId=scene.id; if(m.type==='image'||m.type==='title'){preloader=new Image();preloader.src=m.type==='title'?buildTitleSvgData(m):m.url||''} else if(m.type==='video'){preloader=document.createElement('video');preloader.preload='auto';preloader.muted=true;preloader.src=m.url||'';preloader.load()} setStatus(`「${scene.name}」を事前読み込み中`,`schedule preloading → ${scene.id}`)}

onAuthStateChanged(auth,async user=>{
  const err=$('login-error');
  if(user){
    $('login').style.display='none';$('app').classList.add('visible');$('auth-state').textContent=user.email||'接続中';
    try{
      await loadCameras();
      onValue(ref(db,'broadcast'),snap=>{
        broadcast=snap.val()||{};
        try{ if(activeTab==='output'||activeTab==='mode')renderAll();else renderPreview(); }
        catch(e){ console.error('[EQLive Reporter Switcher] render error:',e); setStatus('画面初期化エラー',e?.message||String(e)); }
      }, error=>{
        console.error('[EQLive Reporter Switcher] broadcast read error:',error);
        const msg=error?.code==='PERMISSION_DENIED'?'Firebase Realtime Databaseの読み取り権限がありません。Rulesを確認してください。':`Firebase読み取りエラー: ${error?.message||error}`;
        setStatus(msg,'broadcast');
      });
      onValue(ref(db,SWITCHER_PATH),snap=>{
        switcher=snap.val()||{};
        ensureSeed();
        if(!snap.exists() || !switcher.scenes || Object.keys(switcher.scenes).length===0){
          writeSwitcher();
        }
        armSchedule();
        try{renderAll()}catch(e){console.error('[EQLive Reporter Switcher] switcher render error:',e);setStatus('画面初期化エラー',e?.message||String(e));}
      }, error=>{
        console.error('[EQLive Reporter Switcher] switcher read error:',error);
        const msg=error?.code==='PERMISSION_DENIED'?'Firebase Realtime Databaseの読み取り権限がありません。broadcast/reporter_switcher のRulesを確認してください。':`Firebase読み取りエラー: ${error?.message||error}`;
        setStatus(msg,SWITCHER_PATH);
      });
    }catch(e){
      console.error('[EQLive Reporter Switcher] startup error:',e);
      $('auth-state').textContent='初期化エラー';
      setStatus('ログインは成功しましたが、初期化に失敗しました',e?.message||String(e));
    }
  }else{
    $('login').style.display='flex';$('app').classList.remove('visible');$('auth-state').textContent='未ログイン';
  }
});
$('login-btn').onclick=async()=>{
  const rawId=$('login-id').value.trim();
  const pw=$('login-pass').value;
  const err=$('login-error');
  if(!rawId||!pw){
    err.textContent='メールアドレス（またはユーザーID）とパスワードを入力してください。';
    err.style.display='block';
    return;
  }

  // Firebase Authentication に登録されているメールアドレスをそのまま使用。
  // 従来のEQLive管理画面と同じ「ユーザーID」形式（@なし）にも対応する。
  const email=rawId.includes('@')?rawId:`${rawId}@kactuif.internal`;
  err.style.display='none';

  try{
    await signInWithEmailAndPassword(auth,email,pw);
  }catch(e){
    console.error('[EQLive Reporter Switcher] Firebase Auth error:',e);
    const messages={
      'auth/invalid-credential':'メールアドレスまたはパスワードが正しくありません。',
      'auth/invalid-login-credentials':'メールアドレスまたはパスワードが正しくありません。',
      'auth/user-not-found':'Firebase Authenticationに登録されているユーザーが見つかりません。',
      'auth/wrong-password':'パスワードが正しくありません。',
      'auth/too-many-requests':'ログイン試行回数が多すぎます。しばらく待ってから再試行してください。',
      'auth/network-request-failed':'Firebaseへの接続に失敗しました。ネットワーク接続を確認してください。',
      'auth/operation-not-allowed':'Firebase Authenticationの「メール/パスワード」ログインが有効になっていません。',
      'auth/invalid-email':'メールアドレスの形式が正しくありません。'
    };
    err.textContent=messages[e?.code]||`ログインに失敗しました。(${e?.code||'unknown-error'})`;
    err.style.display='block';
  }
};
$('login-pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('login-btn').click()});
setInterval(()=>{$('program-clock').textContent=nowString()},1000);
window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(activeTab==='scene'){if(e.key==='ArrowLeft'){e.preventDefault();moveScene(-1)} if(e.key==='ArrowRight'){e.preventDefault();moveScene(1)}}});
window.addEventListener('beforeunload',()=>{if(hls)try{hls.destroy()}catch(_){} });

afterStart();
function afterStart(){switchTab('mode');$('program-clock').textContent=nowString()}
</script>
