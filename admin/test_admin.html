<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQLive 地震情報 文字スーパー生成ツール (Kactuif)</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 24px;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #004494;
        }
        button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }
        .output-area {
            margin-top: 30px;
        }
        pre {
            background-color: #2b2b2b;
            color: #f8f8f2;
            padding: 20px;
            border-radius: 6px;
            font-size: 15px;
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.5;
            font-family: "MS Gothic", "Courier New", monospace;
        }
        .note {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>EQLive 文字スーパー自動生成</h1>
    
    <div class="form-group">
        <label for="apiKey">DMDATA APIキー</label>
        <input type="text" id="apiKey" placeholder="APIキーを入力してください">
        <div class="note">※APIキーはブラウザにのみ保存され、外部サーバーには送信されません。</div>
    </div>
    
    <button id="fetchBtn" onclick="fetchEarthquakeData()">最新の地震情報を取得</button>

    <div class="output-area">
        <label>生成結果（コピーして文字スーパー用システムへ）</label>
        <pre id="output">情報を取得するとここに表示されます。</pre>
    </div>
</div>

<script>
    // ページ読み込み時に保存されたAPIキーを復元
    document.addEventListener("DOMContentLoaded", () => {
        const savedKey = localStorage.getItem("dmdata_api_key");
        if (savedKey) {
            document.getElementById("apiKey").value = savedKey;
        }
    });

    // 日時文字列を「午前/午後X時X分」にフォーマット
    function formatTime(isoString) {
        const date = new Date(isoString);
        const h = date.getHours();
        const m = date.getMinutes();
        const ampm = h < 12 ? '午前' : '午後';
        let dispH = h % 12;
        if (dispH === 0) dispH = 12;
        return `${ampm}${dispH}時${m}分`;
    }

    // 震度の強さ表現を判定
    function getIntensityText(maxInt) {
        if (["5-", "5+", "6-", "6+", "7"].includes(maxInt)) return "強い";
        if (maxInt === "4") return "やや強い";
        return "";
    }

    // 震度記号の変換
    function convertInt(intStr) {
        const map = {
            "7": "7", "6+": "6強", "6-": "6弱",
            "5+": "5強", "5-": "5弱", "4": "4",
            "3": "3", "2": "2", "1": "1"
        };
        return map[intStr] || intStr;
    }

    // 震度のリスト表示フォーマット
    function formatIntensity(items) {
        const order = ["7", "6+", "6-", "5+", "5-", "4", "3", "2", "1"];
        const grouped = {};
        order.forEach(int => grouped[int] = []);
        
        items.forEach(item => {
            if (grouped[item.maxInt]) {
                grouped[item.maxInt].push(item.name);
            }
        });
        
        let out = "";
        order.forEach(int => {
            if (grouped[int].length > 0) {
                let line = `震度${convertInt(int)}`;
                const names = grouped[int];
                for (let i = 0; i < names.length; i++) {
                    if (i % 3 === 0) {
                        if (i === 0) {
                            line += ` ${names[i]}`;
                        } else {
                            out += line + "\n";
                            line = `    ${names[i]}`;
                        }
                    } else {
                        line += ` ${names[i]}`;
                    }
                }
                out += line + "\n\n";
            }
        });
        return out.trim() + "\n";
    }

    // 津波情報の判定文
    function getTsunamiText(comments) {
        let text = "この地震による津波の心配はありません";
        if (comments && comments.forecast && comments.forecast.text) {
            if (!comments.forecast.text.includes("津波の心配はありません")) {
                text = "この地震で津波情報が発表されています";
            }
        }
        return text;
    }

    // 震度速報 (VXSE51) 生成
    function generateVXSE51(data) {
        let out = "【震度速報】\n";
        const time = formatTime(data.targetDateTime);
        
        // 震度速報は震源地が不明なため、最大震度観測都道府県をフォールバックとして使用
        let region = "不明な地方";
        if (data.body.intensity && data.body.intensity.prefectures && data.body.intensity.prefectures.length > 0) {
            region = data.body.intensity.prefectures[0].name + "など";
        }

        const maxInt = data.body.intensity.maxInt;
        const intText = getIntensityText(maxInt);
        
        out += "＜カード1＞\n";
        out += `${time}ごろ${region}で\n`;
        if (intText) {
            out += `${intText}地震がありました\n\n`;
        } else {
            out += `地震がありました\n\n`;
        }
        
        out += "＜カード2＞\n";
        out += "強い・長い揺れを感じた沿岸部では\n念のため津波に注意してください\n\n";
        
        out += "＜カード3以降＞\n";
        if (data.body.intensity && data.body.intensity.regions) {
            out += formatIntensity(data.body.intensity.regions);
        }
        return out;
    }

    // 震源に関する情報 (VXSE52) 生成
    function generateVXSE52(data, data51) {
        let out = "【震源に関する情報】\n";
        const time = formatTime(data.targetDateTime);
        const eq = data.body.earthquake;
        const region = eq && eq.hypocenter ? eq.hypocenter.name : "不明な地方";
        
        out += "＜カード1＞\n";
        out += `${time}ごろ${region}で\n`;
        out += "地震がありました\n\n";
        
        out += "＜カード2＞\n";
        let depth = eq && eq.hypocenter && eq.hypocenter.depth ? eq.hypocenter.depth.value : "";
        if (depth === "0") depth = "ごく浅い";
        else if (depth) depth = depth + "キロ";
        else depth = "不明";
        
        let mag = eq && eq.magnitude ? eq.magnitude.value : "不明";
        
        out += `震源は${region} 深さ${depth}\n`;
        out += `マグニチュード${mag}\n\n`;
        
        out += "＜カード3＞\n";
        out += getTsunamiText(data.body.comments) + "\n\n";
        
        out += "＜カード4以降＞\n";
        // VXSE52には震度情報がないため、VXSE51の情報を活用
        if (data51 && data51.body && data51.body.intensity && data51.body.intensity.regions) {
            out += formatIntensity(data51.body.intensity.regions);
        } else {
            out += "震度情報はありません\n";
        }
        
        return out;
    }

    // 震源・震度に関する情報 (VXSE53) 生成
    function generateVXSE53(data) {
        let out = "【震源・震度に関する情報】\n";
        const time = formatTime(data.targetDateTime);
        const eq = data.body.earthquake;
        const region = eq && eq.hypocenter ? eq.hypocenter.name : "不明な地方";
        
        const maxInt = data.body.intensity ? data.body.intensity.maxInt : "1";
        const intText = getIntensityText(maxInt);
        
        out += "＜カード1＞\n";
        out += `${time}ごろ${region}で\n`;
        if (intText) {
            out += `${intText}地震がありました\n\n`;
        } else {
            out += `地震がありました\n\n`;
        }
        
        out += "＜カード2＞\n";
        let depth = eq && eq.hypocenter && eq.hypocenter.depth ? eq.hypocenter.depth.value : "";
        if (depth === "0") depth = "ごく浅い";
        else if (depth) depth = depth + "キロ";
        else depth = "不明";
        
        let mag = eq && eq.magnitude ? eq.magnitude.value : "不明";
        
        out += `震源は${region} 深さ${depth}\n`;
        out += `マグニチュード${mag}\n\n`;
        
        out += "＜カード3＞\n";
        out += getTsunamiText(data.body.comments) + "\n\n";
        
        out += "＜カード4以降＞\n";
        if (data.body.intensity && data.body.intensity.cities) {
            out += formatIntensity(data.body.intensity.cities);
        } else {
            out += "震度情報はありません\n";
        }
        
        return out;
    }

    // データ取得のメイン処理
    async function fetchEarthquakeData() {
        const apiKey = document.getElementById("apiKey").value.trim();
        if (!apiKey) {
            alert("DMDATAのAPIキーを入力してください。");
            return;
        }
        // 次回以降入力の手間を省くため保存
        localStorage.setItem("dmdata_api_key", apiKey);

        const btn = document.getElementById("fetchBtn");
        btn.disabled = true;
        btn.textContent = "取得中...";
        const output = document.getElementById("output");
        output.textContent = "DMDATAから電文を取得しています...";

        try {
            const encodedKey = btoa(apiKey + ":");
            const headers = { "Authorization": `Basic ${encodedKey}` };

            // まず最新の地震関連の電文リストを取得[cite: 10, 11]
            const listRes = await fetch("https://api.dmdata.jp/v2/telegram?type=VXSE51,VXSE52,VXSE53&format=json&limit=50", { headers });
            const listData = await listRes.json();

            if (listData.status === "error") {
                throw new Error(listData.error.message);
            }

            // 直近のeventIdを特定し、関連する電文を収集
            let targetEventId = null;
            const events = { VXSE51: null, VXSE52: null, VXSE53: null };

            for (const item of listData.items) {
                if (!item.eventId) continue;
                if (!targetEventId) targetEventId = item.eventId;
                
                if (item.eventId === targetEventId && !events[item.type]) {
                    events[item.type] = item;
                }
            }

            if (!targetEventId) {
                output.textContent = "直近の地震情報が見つかりませんでした。";
                btn.disabled = false;
                btn.textContent = "最新の地震情報を取得";
                return;
            }

            // 各電文のJSON本体データを取得[cite: 10]
            const fetchJson = async (id) => {
                const r = await fetch(`https://data.api.dmdata.jp/v1/${id}`, { headers });
                return await r.json();
            };

            const telegrams = {};
            if (events.VXSE51) telegrams.VXSE51 = await fetchJson(events.VXSE51.id);
            if (events.VXSE52) telegrams.VXSE52 = await fetchJson(events.VXSE52.id);
            if (events.VXSE53) telegrams.VXSE53 = await fetchJson(events.VXSE53.id);

            let resultText = "";

            // 取得できたものから順番にテキストを出力
            if (telegrams.VXSE51) {
                resultText += generateVXSE51(telegrams.VXSE51) + "\n----------------------------------------\n\n";
            }
            if (telegrams.VXSE52) {
                resultText += generateVXSE52(telegrams.VXSE52, telegrams.VXSE51) + "\n----------------------------------------\n\n";
            }
            if (telegrams.VXSE53) {
                resultText += generateVXSE53(telegrams.VXSE53);
            }

            if (resultText === "") {
                resultText = "処理可能なデータがありませんでした。";
            }

            output.textContent = resultText.trim();

        } catch (e) {
            console.error(e);
            output.textContent = "エラーが発生しました: " + e.message;
        } finally {
            btn.disabled = false;
            btn.textContent = "最新の地震情報を取得";
        }
    }
</script>
</body>
</html>
