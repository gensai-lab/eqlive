<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-title" content="EQLive 原稿">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <title>EQLive 原稿ツール</title>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d0d0d;
            --header-bg: #141414;
            --footer-bg: #141414;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
            --accent-yellow: #fff200;
            --accent-magenta: #ff00ff;
            --accent-red: #ff0000;
            --border-color: #262626;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            /* 本文以外のデフォルトフォント（プロポーショナル） */
            font-family: 'BIZ UDPGothic', sans-serif;
            letter-spacing: 0.02em;
        }

        /* ヘッダー構造 */
        header {
            background-color: var(--header-bg);
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            user-select: none;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
        }

        .brand-badge {
            background-color: #262626;
            color: #cccccc;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid #3c3c3c;
        }

        /* 戻る・進むページネーション */
        .page-control {
            display: flex;
            gap: 8px;
        }

        .page-btn {
            background-color: #262626;
            border: 1px solid #444444;
            color: #ffffff;
            padding: 4px 14px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'BIZ UDPGothic', sans-serif;
            transition: background 0.15s, opacity 0.15s;
        }
        .page-btn:hover { background-color: #333333; }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .admin-btn {
            background: none;
            border: 1px solid #555555;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s;
        }
        .admin-btn:hover { background-color: #222222; }

        /* メインディスプレイ（左上寄せレイアウト） */
        main {
            flex: 1;
            padding: 30px 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* 左寄せ */
            justify-content: flex-start; /* 上寄せ */
        }

        /* 本文表示エリア（等幅フォント設定） */
        .manuscript-content {
            width: 100%;
            font-family: 'BIZ UDGothic', monospace; /* 本文は等幅 */
            font-size: calc(20px + 1vw); /* 画面幅に応じて適切にレスポンシブ縮尺 */
            line-height: 1.7;
            font-weight: 700;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* テキストカラー・ルビ設定 */
        .c-yellow { color: var(--accent-yellow); }
        .c-magenta { color: var(--accent-magenta); }
        .c-red { color: var(--accent-red); }
        
        ruby { padding: 0 1px; }
        rt { font-size: 0.45em; color: #00ffcc; font-family: 'BIZ UDPGothic', sans-serif; font-weight: 700; }

        /* リストテーブル形式（到達予想・地震切替用） */
        .m-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }
        .m-table tr {
            border-bottom: 2px solid #ffffff;
        }
        .m-table tr.selected {
            color: var(--accent-yellow);
            border-bottom: 2px solid var(--accent-yellow);
        }
        .m-table td {
            padding: 12px 0 6px 0;
            vertical-align: bottom;
        }
        .m-table td:nth-child(2) { padding-left: 20px; }
        .m-table td:last-child { text-align: right; }

        /* フッター（ボトムタブ一覧） */
        footer {
            background-color: var(--footer-bg);
            height: 64px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            user-select: none;
        }

        .nav-container {
            display: flex;
            align-items: center;
            height: 100%;
            width: 100%;
            padding: 0;
        }

        .nav-btn {
            flex: 1;
            height: 100%;
            background: none;
            border: none;
            color: #ffffff;
            font-size: calc(13px + 0.4vw); /* レスポンシブ文字サイズ */
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'BIZ UDPGothic', sans-serif;
            transition: background 0.15s, color 0.15s;
            border-right: 1px solid #222222;
        }
        .nav-btn:last-child { border-right: none; }
        .nav-btn:hover { background-color: rgba(255, 255, 255, 0.03); }
        .nav-btn.active { color: var(--accent-yellow); }

        /* レスポンシブ微調整 */
        @media (max-width: 600px) {
            main { padding: 20px 20px; }
            header { padding: 0 10px; }
            .brand-badge { display: none; }
            .m-table td { padding: 8px 0 4px 0; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <span class="brand-logo">EQLive</span>
        <span class="brand-badge">原稿ツール</span>
    </div>
    
    <div class="page-control">
        <button id="prev-btn" class="page-btn" onclick="movePage(-1)">戻る</button>
        <button id="next-btn" class="page-btn" onclick="movePage(1)">進む</button>
    </div>

    <button class="admin-btn" onclick="location.href='admin.html'">Adminページ</button>
</header>

<main>
    <div id="manuscript-display" class="manuscript-content"></div>
</main>

<footer>
    <div class="nav-container">
        <button id="tab-eq" class="nav-btn" onclick="switchTab('eq')">地震</button>
        <button id="tab-shindo" class="nav-btn" onclick="switchTab('shindo')">震度</button>
        <button id="tab-tsu" class="nav-btn" onclick="switchTab('tsu')">津波</button>
        <button id="tab-yosou" class="nav-btn" onclick="switchTab('yosou')">到達予想</button>
        <button id="tab-yobikake" class="nav-btn" onclick="switchTab('yobikake')">呼びかけ</button>
        <button id="tab-eew" class="nav-btn" onclick="switchTab('eew')">EEW</button>
        <button id="tab-switch" class="nav-btn" onclick="switchTab('switch')">地震切替</button>
    </div>
</footer>

<ruby>現在<rt>げんざい</rt></ruby><ruby>倒壊<rt>とうかい</rt></ruby>しかかっている<ruby>建物<rt>たてもの</rt></ruby>や、ひび<ruby>割れ<rt>われ</rt></ruby>が<ruby>入った<rt>はいった</rt></ruby><ruby>斜面<rt>しゃめん</rt></ruby>、<ruby>崖<rt>がけ</rt></ruby>などには<ruby>絶対<rt>ぜったい</rt></ruby>に<ruby>近づかないで<rt>ちかづかないで</rt></ruby>ください。<ruby>揺れ<rt>ゆれ</rt></ruby>が<ruby>収まっても<rt>おさまっても</rt></ruby><ruby>当分<rt>とうぶん</rt></ruby>の<ruby>間<rt>あいだ</rt></ruby><ruby>警戒<rt>けいかい</rt></ruby>が<ruby>必要<rt>ひつよう</rt></ruby>です。`
            }
        ],
        tsu: [
            {
                content: `<span class="c-yellow">今すぐ避難！今すぐ避難！</span>

<tr><td>鹿児島県西部</td><td>第１波の到達を確認</td><td>５ｍ</td></tr>
<tr><td>宮崎県</td><td>午前１０時５０分</td><td>５ｍ</td></tr>
<tr><td>鹿児島県東部</td><td>午前１１時００分</td><td>５ｍ</td></tr>

        yobikake: [

        switch: [
            {
                content: `<table class="m-table">

<tr><td>０２日午前０９時５２分</td><td>千葉県北西部</td><td>Ｍ２．２</td><td>津波なし</td></tr>
<tr><td>０２日午前０９時５２分</td><td>長野県北部</td><td>Ｍ２．5</td><td>津波なし</td></tr>
<tr><td>０２日午前０９時５２分</td><td>北海道石狩地方南部</td><td>Ｍ３．８</td><td>津波なし</td></tr>
<tr><td>０２日午前０９時５２分</td><td>愛知県西部</td><td>Ｍ３．１</td><td>津波なし</td></tr>
<tr><td>０２日午前０９時５２分</td><td>愛知県西部</td><td>Ｍ１．２</td><td>津波なし</td></tr>
<tr><td>０２日午前０９時５２分</td><td>沖縄本島近海</td><td>Ｍ４．０</td><td>津波なし</td></tr>
<tr><td>０２日午前０９時５２分</td><td>神奈川県東部</td><td>Ｍ１．６</td><td>津波なし</td></tr>
</table>`

    let currentTab = 'eq';
    let currentPageIndex = 0;

    // --- タブ切り替え関数 ---
    window.switchTab = (tabId) => {
        currentTab = tabId;
        currentPageIndex = 0; // タブ移動時は必ず1ページ目から

        // ナビゲーションのアクティブクラス更新
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab-${tabId}`).classList.add('active');

        renderPage();
    };

    // --- 戻る・進む移動処理 ---
    window.movePage = (direction) => {
        const pages = database[currentTab];
        const newIndex = currentPageIndex + direction;

        if (newIndex >= 0 && newIndex < pages.length) {
            currentPageIndex = newIndex;
            renderPage();
        }
    };

    // --- 画面レンダリング ---
    function renderPage() {
        const pages = database[currentTab];
        const pageData = pages[currentPageIndex];
        
        // メイン画面の書き換え
        const displayEl = document.getElementById('manuscript-display');
        displayEl.innerHTML = pageData.content;

        // ボタンの無効化（Disabled）制御
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        prevBtn.disabled = (currentPageIndex === 0);
        nextBtn.disabled = (currentPageIndex === pages.length - 1);
    }

    // 初回読み込み
    switchTab('eq');
</script>

</body>
</html>
