<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-title" content="EQLive 原稿">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <title>EQLive 原稿ツール</title>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d0d0d;
            --header-bg: #141414;
            --footer-bg: #141414;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
            --accent-yellow: #fff200;
            --accent-magenta: #ff00ff;
            --accent-red: #ff0000;
            --border-color: #262626;
            --status-green: #00ff66;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            /* 本文以外のデフォルトフォント（プロポーショナル） */
            font-family: 'BIZ UDPGothic', sans-serif;
            letter-spacing: 0.02em;
        }

        /* ヘッダー構造 */
        header {
            background-color: var(--header-bg);
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            user-select: none;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
        }

        .brand-badge {
            background-color: #262626;
            color: #cccccc;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid #3c3c3c;
        }

        .api-status {
            font-size: 11px;
            color: var(--status-green);
            display: flex;
            align-items: center;
            gap: 5px;
            background-color: rgba(0, 255, 102, 0.05);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 102, 0.2);
        }

        .api-pulse {
            width: 6px;
            height: 6px;
            background-color: var(--status-green);
            border-radius: 50%;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.4; } to { opacity: 1; }
        }

        /* 戻る・進むページネーション */
        .page-control {
            display: flex;
            gap: 8px;
        }

        .page-btn {
            background-color: #262626;
            border: 1px solid #444444;
            color: #ffffff;
            padding: 4px 14px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'BIZ UDPGothic', sans-serif;
            transition: background 0.15s, opacity 0.15s;
        }
        .page-btn:hover { background-color: #333333; }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .admin-btn {
            background: none;
            border: 1px solid #555555;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s;
        }
        .admin-btn:hover { background-color: #222222; }

        /* メインディスプレイ（左上寄せレイアウト） */
        main {
            flex: 1;
            padding: 30px 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* 左寄せ */
            justify-content: flex-start; /* 上寄せ */
        }

        /* 本文表示エリア（等幅フォント設定） */
        .manuscript-content {
            width: 100%;
            font-family: 'BIZ UDGothic', monospace; /* 本文は等幅 */
            font-size: calc(18px + 1vw); /* 画面幅に応じて適切にレスポンシブ縮尺 */
            line-height: 1.7;
            font-weight: 700;
            white-space: pre-wrap;
            word-break: break-all;
        }

        /* テキストカラー・ルビ設定 */
        .c-yellow { color: var(--accent-yellow); }
        .c-magenta { color: var(--accent-magenta); }
        .c-red { color: var(--accent-red); }
        
        ruby { padding: 0 1px; }
        rt { font-size: 0.45em; color: #00ffcc; font-family: 'BIZ UDPGothic', sans-serif; font-weight: 700; }

        /* リストテーブル形式（到達予想・地震切替用） */
        .m-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }
        .m-table tr {
            border-bottom: 2px solid #ffffff;
        }
        .m-table tr.selected {
            color: var(--accent-yellow);
            border-bottom: 2px solid var(--accent-yellow);
        }
        .m-table td {
            padding: 12px 0 6px 0;
            vertical-align: bottom;
        }
        .m-table td:nth-child(2) { padding-left: 20px; }
        .m-table td:last-child { text-align: right; }

        /* フッター（ボトムタブ一覧） */
        footer {
            background-color: var(--footer-bg);
            height: 64px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            user-select: none;
        }

        .nav-container {
            display: flex;
            align-items: center;
            height: 100%;
            width: 100%;
            padding: 0;
        }

        .nav-btn {
            flex: 1;
            height: 100%;
            background: none;
            border: none;
            color: #ffffff;
            font-size: calc(13px + 0.4vw); /* レスポンシブ文字サイズ */
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'BIZ UDPGothic', sans-serif;
            transition: background 0.15s, color 0.15s;
            border-right: 1px solid #222222;
        }
        .nav-btn:last-child { border-right: none; }
        .nav-btn:hover { background-color: rgba(255, 255, 255, 0.03); }
        .nav-btn.active { color: var(--accent-yellow); }

        /* レスポンシブ微調整 */
        @media (max-width: 600px) {
            main { padding: 20px 20px; }
            header { padding: 0 10px; }
            .brand-badge { display: none; }
            .m-table td { padding: 8px 0 4px 0; }
            .api-status { display: none; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <span class="brand-logo">EQLive</span>
        <span class="brand-badge">原稿ツール</span>
        <div class="api-status"><div class="api-pulse"></div>P2P連携中 (1s)</div>
    </div>
    
    <div class="page-control">
        <button id="prev-btn" class="page-btn" onclick="movePage(-1)">戻る</button>
        <button id="next-btn" class="page-btn" onclick="movePage(1)">進む</button>
    </div>

    <button class="admin-btn" onclick="location.href='admin.html'">Adminページ</button>
</header>

<main>
    <div id="manuscript-display" class="manuscript-content"></div>
</main>

<footer>
    <div class="nav-container">
        <button id="tab-eq" class="nav-btn" onclick="switchTab('eq')">地震</button>
        <button id="tab-shindo" class="nav-btn" onclick="switchTab('shindo')">震度</button>
        <button id="tab-tsu" class="nav-btn" onclick="switchTab('tsu')">津波</button>
        <button id="tab-yosou" class="nav-btn" onclick="switchTab('yosou')">到達予想</button>
        <button id="tab-yobikake" class="nav-btn" onclick="switchTab('yobikake')">呼びかけ</button>
        <button id="tab-eew" class="nav-btn" onclick="switchTab('eew')">EEW</button>
        <button id="tab-switch" class="nav-btn" onclick="switchTab('switch')">地震切替</button>
    </div>
</footer>

<script>
    // --- 漢字自動ふりがな（ルビ）辞書マッピング構造 ---
    const rubyDict = {
        "震度": "しんど", "強": "きょう", "弱": "じゃく", "地震": "じしん", "津波": "つなみ",
        "大津波警報": "おおつなみけいほう", "津波警報": "つなみけいほう", "津波注意報": "つなみちゅういほう",
        "沖縄": "おきなわ", "那覇": "なは", "宜野湾": "ぎのわん", "浦添": "うらそえ", "名護": "なご",
        "糸満": "いとまん", "沖縄市": "おきなわし", "豊見城": "とみぐすく", "うるま": "うるま",
        "宮古島": "みやこじま", "南城": "なんじょう", "国頭": "くにがみ", "大宜味": "おおぎみ",
        "東村": "ひがしそん", "今帰仁": "なきじん", "本部": "もとぶ", "恩納": "おんな", "宜野座": "ぎのざ",
        "金武": "きん", "伊江": "いえ", "読谷": "よみたん", "嘉手納": "かでな", "北谷": "ちゃたん",
        "北中城": "きたなかぐすく", "中城": "なかぐすく", "西原": "にしはら", "与那原": "よなばる",
        "南風原": "はえばる", "渡嘉敷": "とかしき", "座間味": "ざまみ", "粟国": "あぐに", "渡名喜": "となき",
        "南大東": "みなみだいとう", "北大東": "きただいとう", "伊平屋": "いへや", "伊平屋村": "いへやそん",
        "伊勝名": "いぜな", "伊江村": "いえそん", "久米島": "くめじま", "八重瀬": "やえせ", "多良間": "たらま",
        "石垣": "いしがき", "竹富": "たけとみ", "与那国": "よなぐに", "東京": "とうきょう", "千葉": "ちば",
        "神奈川": "かながわ", "埼玉": "さいたま", "茨城": "いばらき", "栃木": "とちぎ", "群馬": "ぐんま",
        "岩手": "いわて", "宮城": "みやぎ", "福島": "ふくしま", "青森": "あおもり", "秋田": "あきた",
        "山形": "やまがた", "北海道": "ほっかいどう", "新潟": "にいがた", "長野": "ながの", "山梨": "やまなし",
        "静岡": "しずおか", "愛知": "あいち", "岐阜": "ぎふ", "三重": "みえ", "富山": "とやま",
        "石川": "いしかわ", "福井": "ふくい", "滋賀": "しが", "京都": "きょうと", "大阪": "おおさか",
        "兵庫": "ひょうご", "奈良": "なら", "和歌山": "わかやま", "鳥取": "とっとり", "島根": "しまね",
        "岡山": "おかやま", "広島": "ひろしま", "山口": "やまぐち", "徳島": "とくしま", "香川": "かがわ",
        "愛媛": "えひめ", "高知": "こうち", "福岡": "ふくおか", "佐賀": "さが", "長崎": "ながさき",
        "熊本": "くまもと", "大分": "おおいた", "宮崎": "みやぎ", "鹿児島": "かごしま", "奄美": "あまみ",
        "トカラ": "とから", "大東島": "だいとうじま", "八重山": "やえやま", "沿岸": "えんがん",
        "到達": "とうたつ", "予想": "よそう", "時刻": "じこく", "高さ": "たかさ", "確認": "かくにん",
        "現在": "げんざい", "倒壊": "とうかい", "建物": "たてもの", "割れ": "われ", "入った": "はいった",
        "斜面": "しゃめん", "崖": "がけ", "絶対": "ぜったい", "近づかないで": "ちかづかないで",
        "揺れ": "ゆれ", "収まっても": "おさまっても", "当分": "とうぶん", "間": "あいだ", "警戒": "けいかい",
        "必要": "ひつよう", "北部": "ほくぶ", "周辺離島": "しゅうへんりとう", "強い": "つよい", "観測": "かんそく"
    };

    // テキスト内の指定文字に一括でルビを適用するパーサー関数
    function applyRuby(text) {
        let parsed = text;
        // 辞書のキーの長い順にソートして置換の衝突を防止
        const sortedKeys = Object.keys(rubyDict).sort((a, b) => b.length - a.length);
        sortedKeys.forEach(key => {
            const regex = new RegExp(key, 'g');
            parsed = parsed.replace(regex, `<ruby>${key}<rt>${rubyDict[key]}</rt></ruby>`);
        });
        return parsed;
    }

    // --- 内部表示制御用の初期固定モックデータベース ---
    let database = {
        eq: [{ content: "地震情報を読み込み中..." }],
        shindo: [{ content: "震度情報を読み込み中..." }],
        tsu: [{ content: "津波予報は発表されていません。" }],
        yosou: [{ content: "津波到達予想データはありません。" }],
        yobikake: [{
            content: `<span class="c-yellow">緊急地震速報が発表された時</span>
▼緊急地震速報です。強い揺れに警戒してください。
▼倒れやすい家具などからは、離れてください。
▼テーブルや机の下に隠れてください。`
        }],
        eew: [{ content: "現在、緊急地震速報（警報）は発表されていません。" }],
        switch: [{ content: "<table class='m-table'><tr><td>履歴がありません</td></tr></table>" }]
    };

    let currentTab = 'eq';
    let currentPageIndex = 0;

    // --- タブ切り替え関数 ---
    window.switchTab = (tabId) => {
        currentTab = tabId;
        currentPageIndex = 0;
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab-${tabId}`).classList.add('active');
        renderPage();
    };

    // --- ページ移動処理 ---
    window.movePage = (direction) => {
        const pages = database[currentTab];
        const newIndex = currentPageIndex + direction;
        if (newIndex >= 0 && newIndex < pages.length) {
            currentPageIndex = newIndex;
            renderPage();
        }
    };

    // --- 画面描画システム ---
    function renderPage() {
        const pages = database[currentTab] || [{ content: "" }];
        const pageData = pages[currentPageIndex] || { content: "" };
        
        const displayEl = document.getElementById('manuscript-display');
        displayEl.innerHTML = pageData.content;

        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        prevBtn.disabled = (currentPageIndex === 0);
        nextBtn.disabled = (currentPageIndex === pages.length - 1);
    }

    // --- P2P地震情報 APIリアルタイム連携部 ---
    const P2P_API_URL = "https://api.p2pquake.net/v2/history?format=json&limit=15";
    let lastInfoId = null;

    async function fetchP2PData() {
        try {
            const response = await fetch(P2P_API_URL);
            if (!response.ok) return;
            const data = await response.json();
            if (!data || data.length === 0) return;

            // 最新データのIDチェック（更新がない場合はパス）
            if (data[0].id === lastInfoId) return;
            lastInfoId = data[0].id;

            // ターゲットコードのみ抽出加工
            processEarthquakeAndTsunami(data);
            processEEW(data);
            
            // 現在のタブ情報を再描画
            renderPage();
        } catch (error) {
            console.error("P2P API データの取得に失敗しました:", error);
        }
    }

    // 551(地震情報)・552(津波予報) 解析
    function processEarthquakeAndTsunami(data) {
        // 1. 地震切替用（最大8件）の構築
        const eqList = data.filter(item => item.code === 551).slice(0, 8);
        if (eqList.length > 0) {
            let tableHtml = `<table class="m-table">`;
            eqList.forEach((eq, index) => {
                const time = eq.earthquake.time;
                const name = eq.earthquake.hypocenter.name || "調査中";
                const maxScale = formatScale(eq.earthquake.maxScale);
                const magnitude = eq.earthquake.hypocenter.magnitude >= 0 ? `Ｍ${eq.earthquake.hypocenter.magnitude.toFixed(1)}` : "不明";
                const domesticTsunami = formatTsunamiText(eq.earthquake.domesticTsunami);
                
                const isSelected = index === 0 ? 'class="selected"' : '';
                tableHtml += `<tr ${isSelected}><td>${time}</td><td>${name}</td><td>${magnitude}</td><td>震度${maxScale}</td><td>${domesticTsunami}</td></tr>`;
            });
            tableHtml += `</table>`;
            database.switch = [{ content: tableHtml }];

            // 最新の1件を各タブへ割り当て
            const latestEq = eqList[0];
            const eqTime = latestEq.earthquake.time;
            const eqName = latestEq.earthquake.hypocenter.name || "調査中";
            const eqDepth = latestEq.earthquake.hypocenter.depth >= 0 ? `約${latestEq.earthquake.hypocenter.depth}キロ` : "調査中";
            const eqMag = latestEq.earthquake.hypocenter.magnitude >= 0 ? `マグニチュード${latestEq.earthquake.hypocenter.magnitude.toFixed(1)}` : "不明";
            const eqScale = formatScale(latestEq.earthquake.maxScale);
            const tsunamiStatus = formatTsunamiManuscript(latestEq.earthquake.domesticTsunami);

            // 地震タブ原稿
            database.eq = [{
                content: `${eqTime}ごろ、${eqName}で
最大震度${eqScale}を観測する強い地震がありました。

震源：${eqName}　　深さ：${eqDepth}
規模：${eqMag}

${tsunamiStatus}`
            }];

            // 震度タブ原稿（ルビ自動パース）
            let shindoContent = "";
            const pointsByScale = {};
            latestEq.points.forEach(p => {
                const scaleStr = formatScale(p.scale);
                if (!pointsByScale[scaleStr]) pointsByScale[scaleStr] = [];
                pointsByScale[scaleStr].push(p.addr);
            });

            const sortedScales = Object.keys(pointsByScale).sort((a, b) => b - a);
            if (sortedScales.length > 0) {
                sortedScales.forEach(scale => {
                    const placeList = pointsByScale[scale].slice(0, 15).join("　");
                    shindoContent += `<span class="c-yellow">震度${scale}</span>\n${placeList}\n\n\n`;
                });
                shindoContent += `今後も揺れの強かった地域では、当分の間警戒が必要です。`;
            } else {
                shindoContent = `震度細分詳細情報は発表されていません。`;
            }
            // 震度全文字に自動ルビ処理
            database.shindo = [{ content: applyRuby(shindoContent) }];
        }

        // 2. 津波予報(552)の抽出パース
        const tsunamiData = data.find(item => item.code === 552);
        if (tsunamiData && tsunamiData.areas) {
            let tsuMain = `<span class="c-yellow">今すぐ避難！今すぐ避難！</span>\n津波予報が発表されています。\n\n`;
            let yosouHtml = `<table class="m-table">`;

            tsunamiData.areas.forEach(area => {
                const name = area.name;
                const grade = area.grade; // majorWarning, warning, advisory
                let colorClass = "";
                let gradeText = "";
                
                if (grade === "majorWarning") { colorClass = "c-magenta"; gradeText = "大津波警報"; }
                else if (grade === "warning") { colorClass = "c-red"; gradeText = "津波警報"; }
                else { colorClass = "c-yellow"; gradeText = "津波注意報"; }

                tsuMain += `<span class="${colorClass}">▼${name}（${gradeText}）</span>\n`;
                yosouHtml += `<tr class="${grade === 'majorWarning' || grade === 'warning' ? 'selected' : ''}">
                    <td><span class="${colorClass}">${gradeText}</span></td><td>${name}</td><td>第１波到達：確認中</td>
                </tr>`;
            });
            yosouHtml += `</table>`;

            database.tsu = [{ content: tsuMain + `\nただちに海岸から離れ、高い場所へ避難してください。` }];
            database.yosou = [{ content: yosouHtml }];
        }
    }

    // 556(緊急地震速報 警報) 解析
    function processEEW(data) {
        const eewData = data.find(item => item.code === 556);
        if (eewData && eewData.earthquake) {
            const title = eewData.test ? "【緊急地震速報（テスト配信）】" : "<span class='c-yellow'>緊急地震速報（警報）</span>";
            const epic = eewData.earthquake.hypocenter.name || "震源地特定中";
            const areas = eewData.areas ? eewData.areas.map(a => a.name).join("　") : "強い揺れに警戒";
            
            database.eew = [{
                content: `${title}\n${epic}で地震発生　強い揺れが予想されます。\n\n警戒地域：\n${areas}\n\n倒れやすい家具から離れ、机の下に身を隠してください。`
            }];
        }
    }

    // P2P地震情報の震度値を放送表記にコンバート
    function formatScale(scale) {
        const dict = { 10: "1", 20: "2", 30: "3", 40: "4", 45: "5弱", 50: "5強", 55: "6弱", 60: "6強", 70: "7" };
        return dict[scale] || "不明";
    }

    function formatTsunamiText(code) {
        const dict = { "None": "津波なし", "Unknown": "不明", "Checking": "調査中", "NonEffective": "海面変動", "Watch": "津波注意報", "Warning": "津波警報" };
        return dict[code] || "情報なし";
    }

    function formatTsunamiManuscript(code) {
        if (code === "Warning" || code === "Watch") {
            return `この地震で<span class="c-magenta">大津波警報</span>または<span class="c-red">津波警報・注意報</span>が出ています。`;
        } else if (code === "NonEffective") {
            return `この地震により、多少の海面変動があるかもしれませんが、津波の心配はありません。`;
        } else {
            return `この地震による津波の心配はありません。`;
        }
    }

    // --- 毎秒（1秒ごと）最速バックグラウンド同期実行ループ ---
    setInterval(fetchP2PData, 1000);

    // 初回起動処理
    switchTab('eq');
    fetchP2PData();
</script>
