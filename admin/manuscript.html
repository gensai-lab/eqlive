<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-title" content="EQLive 原稿">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <title>EQLive 原稿ツール</title>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --header-bg: #000000;
            --footer-bg: #141414;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
            --accent-purple: #ff00ff; /* 大津波警報 */
            --accent-red: #ff0000;    /* 津波警報・ニュース赤 */
            --accent-yellow: #fff200; /* 選択中黄色 */
            --border-color: #222222;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            font-family: 'BIZ UDPGothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* ヘッダー */
        header {
            background-color: var(--header-bg);
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: -0.02em;
        }

        .brand-badge {
            background-color: #262626;
            color: #ffffff;
            font-size: 11px;
            font-weight: bold;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid #3c3c3c;
        }

        .admin-btn {
            background: none;
            border: 1px solid #555555;
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            padding: 5px 14px;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .admin-btn:hover {
            background-color: #222222;
        }

        /* メイン原稿表示エリア */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            overflow-y: auto;
            position: relative;
        }

        .manuscript-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* スクリーンショットのテキストスタイルを徹底再現 */
        .manuscript-text {
            font-size: 34px;
            line-height: 1.8;
            font-weight: bold;
            letter-spacing: 0.06em;
            white-space: pre-wrap;
            color: var(--text-main);
        }

        /* 原稿内の特殊色強調クラス */
        .pts-otsunami { color: var(--accent-purple); }
        .pts-tsunami { color: var(--accent-red); }
        .pts-shindo { color: var(--text-main); }

        /* フッター（ボトムナビゲーション） */
        footer {
            background-color: var(--footer-bg);
            height: 64px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .nav-container {
            display: flex;
            align-items: center;
            height: 100%;
            width: 100%;
            max-width: 1000px;
            padding: 0 10px;
        }

        .nav-btn {
            flex: 1;
            height: 100%;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            transition: background 0.2s;
        }

        .nav-btn:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .nav-btn.active {
            color: var(--accent-yellow);
        }

        .nav-divider {
            color: #333333;
            font-size: 14px;
            user-select: none;
            padding: 0 5px;
        }

        /* クイックツールチップ（機能用ホバー） */
        .action-hint {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 11px;
            color: #444444;
            user-select: none;
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <span class="brand-logo">EQLive</span>
        <span class="brand-badge">原稿ツール</span>
    </div>
    <button class="admin-btn" onclick="location.href='index.html'">Adminページ</button>
</header>

<main>
    <div class="action-hint">※画面クリックでプレーンテキストをコピー / Ticker自動連携</div>
    <div class="manuscript-container">
        <div id="display-text" class="manuscript-text" onclick="copyCurrentText()"></div>
    </div>
</main>

<footer>
    <div class="nav-container">
        <button id="btn-eq" class="nav-btn active" onclick="switchTab('eq')">地震</button>
        <div class="nav-divider">|</div>
        <button id="btn-shindo" class="nav-btn" onclick="switchTab('shindo')">震度</button>
        <div class="nav-divider">|</div>
        <button id="btn-tsu" class="nav-btn" onclick="switchTab('tsu')">津波</button>
        <div class="nav-divider">|</div>
        <button id="btn-yosou" class="nav-btn" onclick="switchTab('yosou')">到達予想</button>
        <div class="nav-divider">|</div>
        <button id="btn-weather" class="nav-btn" onclick="switchTab('weather')">気象情報</button>
        <div class="nav-divider">|</div>
        <button id="btn-eew" class="nav-btn" onclick="switchTab('eew')">EEW</button>
        <div class="nav-divider">|</div>
        <button id="btn-switch" class="nav-btn" onclick="switchTab('switch')">地震切替</button>
    </div>
</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- 各メニューに対応する本格的な放送原稿データベース ---
    const manuscripts = {
        eq: `午前１０時３７分ごろ、沖縄本島近海で
最大震度６強を観測する強い地震がありました。

震源：沖縄本島近海　　深さ：約２０キロ
規模：マグニチュード９．０

この地震で<span class="pts-otsunami">大津波警報</span>・<span class="pts-tsunami">津波警報</span>が出ています。`,

        shindo: `各地の震度情報です。
<span class="pts-shindo">震度６強</span>を、沖縄本島地方で観測しました。

また、<span class="pts-shindo">震度６弱</span>を宮古島地方、
<span class="pts-shindo">震度５強</span>を八重山地方で観測しています。
揺れの強かった地域の方は、倒壊の危険がある建物から直ちに離れてください。`,

        tsu: `<span class="pts-otsunami">大津波警報</span>が発表されている沿岸をお伝えします。
沖縄本島地方。予想される津波の高さは巨大、１０メートル以上です！

ただちに避難してください！急いで高台や避難ビルの最上階など、より高い安全な場所へ逃げてください！決して様子を見に海岸や川に近づかないでください！`,

        yosou: `津波の到達予想時刻と予想される高さです。
沖縄本島地方那覇港、すでに到達しているとみられます。
宮古島地方、午前１０時５０分。

津波は第１波よりも、第２波、第３波が高くなることがあります。
一度津波が引いても、警報が解除されるまで絶対に避難をやめないでください。`,

        weather: `気象庁から、防災気象情報をお伝えします。
現在、大雨による災害の危険度が急激に高まっています。

土砂災害警戒情報が発表されている自治体では、崖の近くや沢沿いなど危険な場所にいる方は、周囲の状況を確認し、手遅れになる前に頑丈な建物の２階以上などへ退避してください。`,

        eew: `【緊急地震速報】
先ほど、強い揺れが予想される緊急地震速報が発表されました。

強い揺れに警戒してください。
倒れやすい家具から離れ、机の下に隠れるなど、まずは身の安全を確保してください。自動車を運転中の方は、ハザードランプを点灯し緩やかに減速してください。`,

        switch: `【複数の地震発生に関する情報】
現在、連続して強い地震が発生している可能性があります。

先ほどの地震の揺れに加え、余震によるさらなる建物の倒壊や土砂崩れに厳重な警戒が必要です。避難所へ移動される際は、周囲の足元や斜面の状況に十分注意して行動してください。`
    };

    let currentTab = 'eq';

    // --- タブ切り替え制御 ---
    window.switchTab = (tabId) => {
        currentTab = tabId;
        
        // 全ボタンの選択状態を解除
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        // 選択されたボタンをハイライト
        document.getElementById(`btn-${tabId}`).classList.add('active');
        
        // 原稿テキストを書き換え
        const displayEl = document.getElementById('display-text');
        displayEl.innerHTML = manuscripts[tabId];

        // 【実戦機能】タブを切り替えた瞬間、自動でFirebaseのTicker用データにも下書きを転送
        autoSyncToTicker(tabId);
    };

    // --- クリップボードコピー ---
    window.copyCurrentText = () => {
        const el = document.getElementById('display-text');
        if (!el) return;
        
        // HTMLタグ（spanなど）を排除して純粋な文字だけを抽出
        const plainText = el.innerText;
        
        navigator.clipboard.writeText(plainText).then(() => {
            // 視覚的にコピー成功を知らせるために一瞬背景を少し明るくする演出
            const mainEl = document.querySelector('main');
            mainEl.style.backgroundColor = '#1a1a1a';
            setTimeout(() => { mainEl.style.backgroundColor = '#0d0d0d'; }, 150);
        });
    };

    // --- 選択した原稿をFirebaseへ簡易連携するシステム ---
    function autoSyncToTicker(tabId) {
        const el = document.getElementById('display-text');
        const rawText = el.innerText;
        const lines = rawText.split('\n').filter(l => l.trim() !== "");
        
        let genre = "地震情報";
        if (tabId === 'tsu' || tabId === 'yosou') genre = "津波情報";
        if (tabId === 'weather') genre = "気象情報";
        if (tabId === 'eew') genre = "緊急地震速報";

        const line1 = lines[0] ? lines[0].substring(0, 40) : "";
        const line2 = lines[1] ? lines[1].substring(0, 40) : "落ち着いて行動してください。";

        // FirebaseのTickerノードをバックグラウンドで同時更新
        update(ref(db, 'broadcast/manual_news'), {
            genre: genre,
            line1: line1,
            line2: line2
        }).catch(e => console.log("Firebase自動同期休止中:", e.message));
    }

    // 初期起動時に最初のタブ「地震」をロード
    switchTab('eq');
</script>
</body>
</html>
