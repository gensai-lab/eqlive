<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-title" content="EQLive 原稿">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <title>EQLive 原稿ツール</title>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d0d0d;
            --header-bg: #141414;
            --footer-bg: #141414;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
            --accent-yellow: #fff200;
            --accent-magenta: #ff00ff;
            --accent-red: #ff0000;
            --border-color: #262626;
            --status-green: #00ff66;
            --status-red: #ff3333;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            font-family: 'BIZ UDPGothic', sans-serif;
            letter-spacing: 0.02em;
        }

        /* ヘッダー */
        header {
            background-color: var(--header-bg);
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            user-select: none;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
        }

        .brand-badge {
            background-color: #262626;
            color: #cccccc;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid #3c3c3c;
        }

        .api-status {
            font-size: 11px;
            color: var(--status-green);
            display: flex;
            align-items: center;
            gap: 5px;
            background-color: rgba(0, 255, 102, 0.05);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 102, 0.2);
        }
        .api-status.disconnected {
            color: var(--status-red);
            background-color: rgba(255, 51, 51, 0.05);
            border: 1px solid rgba(255, 51, 51, 0.2);
        }

        .api-pulse {
            width: 6px;
            height: 6px;
            background-color: var(--status-green);
            border-radius: 50%;
        }

        /* 戻る・進むボタン */
        .page-control {
            display: flex;
            gap: 8px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .page-btn {
            background-color: #262626;
            border: 1px solid #444444;
            color: #ffffff;
            padding: 2px 12px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'BIZ UDPGothic', sans-serif;
        }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .admin-btn {
            background: none;
            border: 1px solid #555555;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
        }

        /* メイン原稿表示域 */
        main {
            flex: 1;
            padding: 40px 50px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .manuscript-content {
            width: 100%;
            font-family: 'BIZ UDGothic', monospace;
            font-size: 32px;
            line-height: 1.6;
            font-weight: 700;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .c-yellow { color: var(--accent-yellow); }
        .c-magenta { color: var(--accent-magenta); }
        .c-red { color: var(--accent-red); }
        
        ruby { padding: 0 1px; }
        rt { font-size: 0.4em; color: #ffffff; font-family: 'BIZ UDPGothic', sans-serif; font-weight: 700; }

        /* リスト・テーブル構造調整（スクショ再現） */
        .m-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 28px;
        }
        .m-table tr {
            border-bottom: 2px solid #ffffff;
        }
        .m-table tr.selected {
            color: var(--accent-yellow);
        }
        .m-table td {
            padding: 10px 10px;
            vertical-align: middle;
        }
        .m-table td:first-child { padding-left: 0; }
        .m-table td:last-child { padding-right: 0; }

        /* フッタータブ */
        footer {
            background-color: var(--footer-bg);
            height: 64px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            user-select: none;
        }

        .nav-container {
            display: flex;
            align-items: center;
            height: 100%;
            width: 100%;
        }

        .nav-btn {
            flex: 1;
            height: 100%;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'BIZ UDPGothic', sans-serif;
            border-right: 1px solid #222222;
        }
        .nav-btn:last-child { border-right: none; }
        .nav-btn.active { color: var(--accent-yellow); }

        @media (max-width: 800px) {
            .manuscript-content { font-size: 22px; }
            .m-table { font-size: 18px; }
            .page-control { position: static; transform: none; }
            .api-status { display: none; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <span class="brand-logo">EQLive</span>
        <span class="brand-badge">原稿ツール</span>
        <div id="connection-status" class="api-status"><div class="api-pulse"></div>EQLive リアルタイム同期中</div>
    </div>
    
    <div class="page-control">
        <button id="prev-btn" class="page-btn" onclick="movePage(-1)">戻る</button>
        <button id="next-btn" class="page-btn" onclick="movePage(1)">進む</button>
    </div>

    <button class="admin-btn" onclick="location.href='admin.html'">Adminページ</button>
</header>

<main>
    <div id="manuscript-display" class="manuscript-content"></div>
</main>

<footer>
    <div class="nav-container">
        <button id="tab-eq" class="nav-btn" onclick="switchTab('eq')">地震</button>
        <button id="tab-shindo" class="nav-btn" onclick="switchTab('shindo')">震度</button>
        <button id="tab-tsu" class="nav-btn" onclick="switchTab('tsu')">津波</button>
        <button id="tab-yosou" class="nav-btn" onclick="switchTab('yosou')">到達予想</button>
        <button id="tab-yobikake" class="nav-btn" onclick="switchTab('yobikake')">呼びかけ</button>
        <button id="tab-eew" class="nav-btn" onclick="switchTab('eew')">EEW</button>
        <button id="tab-switch" class="nav-btn" onclick="switchTab('switch')">地震切替</button>
    </div>
</footer>

<script>
    // ルビ辞書
    const rubyDict = {
        "沖縄市": "おきなわし", "糸満市": "いとまんし", "豊見城市": "とみぐすくし", "南城市": "なんじょうし",
        "那覇市": "なはし", "宜野湾市": "ぎのわんし", "浦添市": "うらそえし", "名護市": "なごし", 
        "うるま市": "うるまし", "宮古島市": "みやこじまし", "国頭村": "くにがみそん", "大宜味村": "おおぎみそん", 
        "東村": "ひがしそん", "今帰仁村": "なきじんそん", "座間味村": "ざまみそん", "多良間村": "たらまそん", 
        "久米島町": "くめじまちょう", "粟国村": "あぐにそん", "伊平屋村": "いへやそん", "伊江村": "いえそん",
        "石垣市": "いしがきし", "竹富町": "たけとみちょう", "与那国町": "よなぐにちょう"
    };

    function applyRuby(text) {
        let parsed = text;
        Object.keys(rubyDict).forEach(key => {
            const regex = new RegExp(key, 'g');
            parsed = parsed.replace(regex, `<ruby>${key}<rt>${rubyDict[key]}</rt></ruby>`);
        });
        return parsed;
    }

    // 各タブごとのデータ（初期モックはスクショの文字列を完全追従）
    let database = {
        eq: [{
            content: `午前１０時３７分ごろ、沖縄本島近海で
最大震度６強を観測する強い地震がありました。

震源：沖縄本島近海　　深さ：約２０キロ
規模：マグニチュード９．０

この地震で<span class="c-magenta">大津波警報</span>・<span class="c-red">津波警報</span>が出ています。`
        }],
        shindo: [{
            content: `<span class="c-yellow">震度６強</span>
<ruby>沖縄市<rt>おきなわし</rt></ruby>　糸満市　豊見城市　南城市

<span class="c-yellow">震度６弱</span>
那覇市　宜野湾市　浦添市　名護市　うるま市　宮古島市　国頭村
大宜味村　東村　今帰仁村

<span class="c-yellow">震度５強</span>
座間味村　多良間村　久米島町　粟国村　伊平屋村　伊島名村　（続く）`
        }],
        tsu: [{
            content: `<span class="c-yellow">今すぐ避難！今すぐ避難！</span>
<span class="c-magenta">大津波警報</span>・<span class="c-red">津波警報</span>が出ました。
東日本大震災クラスの巨大な地震が来ます。
今すぐ、可能な限り高いところへ逃げること！
<span class="c-magenta">大津波警報</span>が発表されたのは、次の沿岸です。

<span class="c-magenta">大津波警報</span>
▼沖縄本島近海
▼大東島地方
▼奄美群島・トカラ列島
▼宮古島・八重山地方　（続く）`
        }],
        yosou: [{
            content: `<span class="c-magenta">大津波警報</span>
<table class="m-table">
<tr class="selected"><td>沖縄本島地方</td><td>第１波の到達を確認</td><td>１０ｍ超</td></tr>
<tr class="selected"><td>大東島地方</td><td>第１波の到達を確認</td><td>１０ｍ超</td></tr>
<tr class="selected"><td>奄美群島・トカラ列島</td><td>第１波の到達を確認</td><td>１０ｍ</td></tr>
<tr class="selected"><td>宮古島・八重山地方</td><td>第１波の到達を確認</td><td>５ｍ</td></tr>
<tr><td>種子島・屋久島地方</td><td>第１波の到達を確認</td><td>５ｍ</td></tr>
<tr><td>鹿児島県西部</td><td>第１波の到達を確認</td><td>５ｍ</td></tr>
<tr><td>宮崎県</td><td>午前１０時５０分</td><td>５ｍ</td></tr>
<tr><td>鹿児島県東部</td><td>午前１１時００分</td><td>５ｍ</td></tr>
<tr><td>大分県豊後水道沿岸</td><td>午前１１時１０分</td><td>５ｍ</td></tr>
<tr><td>高知県</td><td>午前１１時１０分</td><td>５ｍ</td><td>（続く）</td></tr>
</table>`
        }],
        yobikake: [{
            content: `<span class="c-yellow">緊急地震速報が発表された時</span>
▼緊急地震速報です。（地域名）では、強い揺れに警戒してください。
▼倒れやすい家具などからは、離れてください。
▼テーブルや机の下に隠れてください。`
        }],
        eew: [{
            content: `<span class="c-yellow">緊急地震速報（警報）</span>
沖縄本島近海で地震　　推定規模：マグニチュード８．６
沖縄　鹿児島　宮崎　熊本`
        }],
        switch: [{
            content: `<table class="m-table">
<tr class="selected" style="border-bottom: 2px solid var(--accent-yellow);"><td>０２日午前１０時３７分</td><td>沖縄本島近海</td><td>Ｍ９．０</td><td>津波情報</td></tr>
<tr><td>０２日午前０９時５２分</td><td>千葉県北西部</td><td>Ｍ２．２</td><td>津波なし</td></tr>
<tr><td>０２日午前０９時５２分</td><td>長野県北部</td><td>Ｍ２．５</td><td>津波なし</td></tr>
<tr><td>０２日午前０９時５2分</td><td>北海道石狩地方南部</td><td>Ｍ３．８</td><td>津波なし</td></tr>
<tr><td>０２日午前０９時５２分</td><td>愛知県西部</td><td>Ｍ３．１</td><td>津波なし</td></tr>
<tr><td>０２日午前０９時５２分</td><td>愛知県西部</td><td>Ｍ１．２</td><td>津波なし</td></tr>
<tr><td>０２日午前０９時５２分</td><td>沖縄本島近海</td><td>Ｍ４．０</td><td>津波なし</td></tr>
<tr><td>０２日午前０９時５２分</td><td>神奈川県東部</td><td>Ｍ１．６</td><td>津波なし</td></tr>
<tr><td>０２日午前０９時５２分</td><td>西表島近海</td><td>Ｍ２．５</td><td>津波なし</td></tr>
<tr><td>０２日午前０９時５２分</td><td>山口県西部</td><td>Ｍ２．８</td><td>津波なし</td></tr>
<tr><td>０２日午前０９時５２分</td><td>三陸沖</td><td>Ｍ６．１</td><td>海面変動</td></tr>
</table>`
        }]
    };

    let currentTab = 'eq';
    let currentPageIndex = 0;

    window.switchTab = (tabId) => {
        currentTab = tabId;
        currentPageIndex = 0;
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        const targetTab = document.getElementById(`tab-${tabId}`);
        if (targetTab) targetTab.classList.add('active');
        renderPage();
    };

    window.movePage = (direction) => {
        const pages = database[currentTab];
        const newIndex = currentPageIndex + direction;
        if (newIndex >= 0 && newIndex < pages.length) {
            currentPageIndex = newIndex;
            renderPage();
        }
    };

    function renderPage() {
        const pages = database[currentTab] || [{ content: "" }];
        const pageData = pages[currentPageIndex] || { content: "" };
        const displayEl = document.getElementById('manuscript-display');
        if (displayEl) displayEl.innerHTML = pageData.content;

        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        if (prevBtn && nextBtn) {
            prevBtn.disabled = (currentPageIndex === 0);
            nextBtn.disabled = (currentPageIndex === pages.length - 1);
        }
    }

    // --- 同期処理：WebSocket ＋ HTTPポーリングの2重系に変更 ---
    const P2P_WS_URL = "wss://api.p2pquake.net/v2/ws";
    const P2P_HTTP_URL = "https://api.p2pquake.net/v2/history?limit=10"; // format=jsonを除去した正しいエンドポイント
    let ws = null;

    // 1. WebSocket接続の開始
    function connectWebSocket() {
        ws = new WebSocket(P2P_WS_URL);
        const statusEl = document.getElementById('connection-status');

        ws.onopen = () => {
            if (statusEl) {
                statusEl.className = "api-status";
                statusEl.innerHTML = `<div class="api-pulse" style="background-color:var(--status-green);"></div>EQLive リアルタイム同期中`;
            }
        };

        ws.onmessage = (event) => {
            const packet = JSON.parse(event.data);
            processIncomingData(packet, false);
        };

        ws.onclose = () => {
            if (statusEl) {
                statusEl.className = "api-status disconnected";
                statusEl.innerHTML = `<div class="api-pulse" style="background-color:var(--status-red);"></div>同期切断（再接続中）`;
            }
            setTimeout(connectWebSocket, 5000); // 5秒後に再接続トライ
        };
    }

    // 2. HTTPポーリング（バックアップライン：10秒周期）
    async function fetchBackupData() {
        try {
            const res = await fetch(P2P_HTTP_URL);
            if (!res.ok) return;
            const data = await res.json();
            if (Array.isArray(data)) {
                // 配列の最新データを逆順で処理して反映
                data.reverse().forEach(packet => processIncomingData(packet, true));
            }
        } catch (e) {
            console.error("バックアップデータの取得に失敗しました", e);
        }
    }

    // 内部データストック用のID記憶
    let processedIds = new Set();

    // 共通データ処理エンジン
    function processIncomingData(packet, isBackup = false) {
        if (!packet || !packet.id) return;
        if (processedIds.has(packet.id)) return; // 処理済みデータはスキップ
        processedIds.add(packet.id);

        if (packet.code === 551) {
            parse551(packet);
        } else if (packet.code === 552) {
            parse552(packet);
        } else if (packet.code === 556) {
            parse556(packet);
        }
    }

    // --- 551: 地震情報解析 ---
    function parse551(packet) {
        const eq = packet.earthquake;
        if (!eq) return;

        const time = eq.time || "不明";
        const name = eq.hypocenter.name || "調査中";
        const depth = eq.hypocenter.depth >= 0 ? `約${eq.hypocenter.depth}キロ` : "調査中";
        const mag = eq.hypocenter.magnitude >= 0 ? `マグニチュード${eq.hypocenter.magnitude.toFixed(1)}` : "不明";
        const maxScale = formatScale(eq.maxScale);
        
        let tsunamiScript = "この地震による津波の心配はありません。";
        if (eq.domesticTsunami === "Warning" || eq.domesticTsunami === "Watch") {
            tsunamiScript = `この地震で<span class="c-magenta">大津波警報</span>・<span class="c-red">津波警報</span>が出ています。`;
        } else if (eq.domesticTsunami === "NonEffective") {
            tsunamiScript = `この地震により、多少の海面変動があるかもしれませんが、津波の心配はありません。`;
        }

        // 地震タブ更新
        database.eq = [{
            content: `${time}ごろ、${name}で
最大震度${maxScale}を観測する強い地震がありました。

震源：${name}　　深さ：${depth}
規模：${mag}

${tsunamiScript}`
        }];

        // 震度タブ更新
        if (packet.points && packet.points.length > 0) {
            let shindoMap = {};
            packet.points.forEach(p => {
                const sStr = formatScale(p.scale);
                if (!shindoMap[sStr]) shindoMap[sStr] = [];
                shindoMap[sStr].push(p.addr);
            });

            let shindoManuscript = "";
            Object.keys(shindoMap).sort((a,b)=>b.localeCompare(a, undefined, {numeric:true})).forEach(scale => {
                shindoManuscript += `<span class="c-yellow">震度${scale}</span>\n${shindoMap[scale].join("　")}\n\n`;
            });
            database.shindo = [{ content: applyRuby(shindoManuscript) }];
        }

        // リスト（地震切替）の一番上に追加するロジック
        updateSwitchTable(time, name, eq.hypocenter.magnitude, eq.domesticTsunami);
        renderPage();
    }

    // --- 552: 津波予報解析 ---
    function parse552(packet) {
        if (!packet.areas || packet.areas.length === 0) return;

        let tsuContent = `<span class="c-yellow">今すぐ避難！今すぐ避難！</span>\n<span class="c-magenta">津波予報</span>が出ました。\n今すぐ、可能な限り高いところへ逃げること！\n\n`;
        let yosouHtml = `<table class="m-table">`;

        packet.areas.forEach(area => {
            let color = "c-yellow";
            let label = "津波注意報";
            if (area.grade === "majorWarning") { color = "c-magenta"; label = "大津波警報"; }
            if (area.grade === "warning") { color = "c-red"; label = "津波警報"; }

            tsuContent += `<span class="${color}">${label}</span>\n▼${area.name}\n`;
            yosouHtml += `<tr class="selected"><td>${area.name}</td><td>第１波の到達を確認</td><td>高さ：調査中</td></tr>`;
        });
        yosouHtml += `</table>`;

        database.tsu = [{ content: tsuContent }];
        database.yosou = [{ content: yosouHtml }];
        renderPage();
    }

    // --- 556: EEW解析 ---
    function parse556(packet) {
        if (!packet.earthquake) return;
        const name = packet.earthquake.hypocenter.name || "震源特定中";
        const mag = packet.earthquake.hypocenter.magnitude >= 0 ? `マグニチュード${packet.earthquake.hypocenter.magnitude.toFixed(1)}` : "";
        const areas = packet.areas ? packet.areas.map(a => a.name).join("　") : "";

        database.eew = [{
            content: `<span class="c-yellow">緊急地震速報（警報）</span>
${name}で地震　　推定規模：${mag}
${areas}`
        }];
        renderPage();
    }

    function formatScale(scale) {
        const dict = { 10: "1", 20: "2", 30: "3", 40: "4", 45: "5弱", 50: "5強", 55: "6弱", 60: "6強", 70: "7" };
        return dict[scale] || "不明";
    }

    function updateSwitchTable(time, name, mag, tsunamiCode) {
        const mStr = mag >= 0 ? `Ｍ${mag.toFixed(1)}` : "Ｍ不明";
        let tStr = "津波なし";
        if (tsunamiCode === "Warning" || tsunamiCode === "Watch") tStr = "津波情報";
        if (tsunamiCode === "NonEffective") tStr = "海面変動";

        // スクリントップのリスト構造を動的に上書き
        let currentHtml = database.switch[0].content;
        let newRow = `<tr class="selected" style="border-bottom: 2px solid var(--accent-yellow);"><td>${time}</td><td>${name}</td><td>${mStr}</td><td>${tStr}</td></tr>`;
        
        // 過去の古い行のselectedクラスを除去して結合
        currentHtml = currentHtml.replace('class="selected" style="border-bottom: 2px solid var(--accent-yellow);"', '');
        let tableRows = currentHtml.replace('<table class="m-table">', '').replace('</table>', '');
        
        database.switch = [{ content: `<table class="m-table">${newRow}${tableRows}</table>` }];
    }

    // メイン初期化
    switchTab('eq');
    connectWebSocket();
    
    // バックアップ用HTTP自動ポーリングを10秒に1回まわす
    setInterval(fetchBackupData, 10000);
    fetchBackupData(); // 初回起動時にも実行
</script>

</body>
</html>
