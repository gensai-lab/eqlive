<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-title" content="EQLive 原稿">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <title>EQLive 原稿ツール</title>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d0d0d;
            --header-bg: #141414;
            --footer-bg: #141414;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
            --accent-yellow: #fff200;
            --accent-magenta: #ff00ff;
            --accent-red: #ff0000;
            --border-color: #262626;
            --status-green: #00ff66;
            --status-red: #ff3333;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            font-family: 'BIZ UDPGothic', sans-serif;
            letter-spacing: 0.04em;
        }

        /* ヘッダー */
        header {
            background-color: var(--header-bg);
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            user-select: none;
            position: relative;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo { font-size: 24px; color: #ffffff; }
        .brand-badge {
            background-color: #262626;
            color: #cccccc;
            font-size: 11px;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid #3c3c3c;
        }

        .incoming-alert {
            display: none;
            background-color: var(--accent-red);
            color: #ffffff;
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 4px;
            animation: flash 1s infinite alternate;
        }

        @keyframes flash { from { opacity: 0.4; } to { opacity: 1; } }

        .history-warning-banner {
            display: none;
            position: absolute;
            bottom: -36px;
            left: 0;
            width: 100%;
            height: 36px;
            background-color: #e67e22;
            color: #ffffff;
            font-size: 13px;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .split-toggle-btn {
            background-color: #262626;
            border: 1px solid #555555;
            color: #ffffff;
            padding: 5px 14px;
            font-size: 13px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'BIZ UDPGothic', sans-serif;
        }
        .split-toggle-btn.active {
            background-color: var(--status-green);
            color: #000000;
            border-color: var(--status-green);
        }

        .admin-btn {
            background: none;
            border: 1px solid #555555;
            color: #ffffff;
            font-size: 13px;
            padding: 5px 14px;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
        }

        /* メインワークスペース（左右スプリット対応） */
        .workspace-container {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            position: relative;
        }

        /* 独立ペイン内のコンテンツエリア */
        .pane-body {
            flex: 1;
            padding: 30px 40px;
            overflow-y: auto;
        }

        /* ペインごとのインラインヘッダー（2分割時のみ実用） */
        .pane-header {
            background-color: #111111;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #222;
        }

        .pane-title {
            font-size: 14px;
            color: var(--accent-yellow);
        }

        .pane-control { display: flex; gap: 6px; }
        .pane-btn {
            background-color: #262626;
            border: 1px solid #444444;
            color: #ffffff;
            padding: 2px 10px;
            font-size: 11px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* ペイン専用の個別ミニタブバー */
        .pane-tabs {
            display: flex;
            background-color: #161616;
            border-bottom: 1px solid var(--border-color);
        }
        .pane-tabs button {
            flex: 1;
            background: none;
            border: none;
            color: #888888;
            padding: 10px 0;
            font-size: 14px;
            cursor: pointer;
            font-family: 'BIZ UDPGothic', sans-serif;
            border-right: 1px solid #222;
        }
        .pane-tabs button:last-child { border-right: none; }
        .pane-tabs button.active {
            color: var(--accent-yellow);
            background-color: rgba(255, 242, 0, 0.04);
        }

        /* 右ペイン（初期状態は非表示） */
        #right-pane {
            display: none;
            border-left: 2px solid var(--border-color);
        }

        .manuscript-content {
            width: 100%;
            font-size: 38px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .c-yellow { color: var(--accent-yellow); }
        .c-magenta { color: var(--accent-magenta); }
        .c-red { color: var(--accent-red); }
        
        ruby { padding: 0 1px; }
        rt { font-size: 0.45em; color: #00ffcc; font-family: 'BIZ UDPGothic', sans-serif; font-weight: normal; }

        /* リスト・テーブル構造 */
        .m-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 32px;
        }
        .m-table tr {
            border-bottom: 2px solid #ffffff;
            cursor: pointer;
        }
        .m-table tr:hover { background-color: rgba(255, 255, 255, 0.02); }
        .m-table tr.selected { color: var(--accent-yellow); }
        .m-table td { padding: 14px 10px; vertical-align: middle; }
        .m-table td:first-child { padding-left: 0; }
        .m-table td:last-child { padding-right: 0; }

        /* フッター（1画面モード時の標準グローバルナビ） */
        footer {
            background-color: var(--footer-bg);
            height: 64px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            user-select: none;
            flex-shrink: 0;
        }

        .nav-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .nav-btn {
            flex: 1;
            height: 100%;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'BIZ UDPGothic', sans-serif;
            border-right: 1px solid #222222;
            position: relative;
        }
        .nav-btn:last-child { border-right: none; }
        .nav-btn.active { color: var(--accent-yellow); background-color: rgba(255,242,0,0.03); }

        .nav-badge {
            display: none;
            position: absolute;
            top: 10px;
            right: 14px;
            width: 8px;
            height: 8px;
            background-color: var(--accent-red);
            border-radius: 50%;
        }

        @media (max-width: 1024px) {
            .manuscript-content { font-size: 26px; }
            .m-table { font-size: 22px; }
            .workspace-container { flex-direction: column; }
            #right-pane { border-left: none; border-top: 2px solid var(--border-color); }
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <span class="brand-logo">EQLive</span>
        <span class="brand-badge">原稿ツール</span>
        <div id="incoming-tag" class="incoming-alert">【新規入電】</div>
    </div>

    <div class="header-right">
        <button id="split-toggle" class="split-toggle-btn" onclick="toggleSplitMode()">2分割：OFF</button>
        <button class="admin-btn" onclick="location.href='admin.html'">Adminページ</button>
    </div>

    <div id="history-warning" class="history-warning-banner">⚠️ 表示中の情報は最新ではありません（過去の履歴を表示中）</div>
</header>

<div class="workspace-container">
    <div id="left-pane" class="pane">
        <div id="left-mini-tabs" class="pane-tabs" style="display: none;">
            <button id="ltab-eq" class="active" onclick="switchPaneTab('left', 'eq')">地震</button>
            <button id="ltab-shindo" onclick="switchPaneTab('left', 'shindo')">震度</button>
            <button id="ltab-tsu" onclick="switchPaneTab('left', 'tsu')">津波</button>
            <button id="ltab-yosou" onclick="switchPaneTab('left', 'yosou')">予想</button>
            <button id="ltab-eew" onclick="switchPaneTab('left', 'eew')">EEW</button>
            <button id="ltab-yobikake" onclick="switchPaneTab('left', 'yobikake')">呼びかけ</button>
            <button id="ltab-switch" onclick="switchPaneTab('left', 'switch')">切替</button>
        </div>
        <div class="pane-header">
            <span id="left-title" class="pane-title">メイン表示画面</span>
            <div class="pane-control">
                <button class="pane-btn" onclick="movePage('left', -1)">前へ</button>
                <button class="pane-btn" onclick="movePage('left', 1)">次へ</button>
            </div>
        </div>
        <div class="pane-body">
            <div id="manuscript-display-left" class="manuscript-content"></div>
        </div>
    </div>

    <div id="right-pane" class="pane">
        <div id="right-mini-tabs" class="pane-tabs">
            <button id="rtab-eq" onclick="switchPaneTab('right', 'eq')">地震</button>
            <button id="rtab-shindo" class="active" onclick="switchPaneTab('right', 'shindo')">震度</button>
            <button id="rtab-tsu" onclick="switchPaneTab('right', 'tsu')">津波</button>
            <button id="rtab-yosou" onclick="switchPaneTab('right', 'yosou')">予想</button>
            <button id="rtab-eew" onclick="switchPaneTab('right', 'eew')">EEW</button>
            <button id="rtab-yobikake" onclick="switchPaneTab('right', 'yobikake')">呼びかけ</button>
            <button id="rtab-switch" onclick="switchPaneTab('right', 'switch')">切替</button>
        </div>
        <div class="pane-header">
            <span id="right-title" class="pane-title">サブ表示画面</span>
            <div class="pane-control">
                <button class="pane-btn" onclick="movePage('right', -1)">前へ</button>
                <button class="pane-btn" onclick="movePage('right', 1)">次へ</button>
            </div>
        </div>
        <div class="pane-body">
            <div id="manuscript-display-right" class="manuscript-content"></div>
        </div>
    </div>
</div>

<footer id="global-footer">
    <div class="nav-container">
        <button id="gtab-eq" class="nav-btn active" onclick="switchGlobalTab('eq')">地震<div class="nav-badge" id="badge-eq"></div></button>
        <button id="gtab-shindo" class="nav-btn" onclick="switchGlobalTab('shindo')">震度<div class="nav-badge" id="badge-shindo"></div></button>
        <button id="gtab-tsu" class="nav-btn" onclick="switchGlobalTab('tsu')">津波<div class="nav-badge" id="badge-tsu"></div></button>
        <button id="gtab-yosou" class="nav-btn" onclick="switchGlobalTab('yosou')">到達予想<div class="nav-badge" id="badge-yosou"></div></button>
        <button id="gtab-yobikake" class="nav-btn" onclick="switchGlobalTab('yobikake')">呼びかけ</button>
        <button id="gtab-eew" class="nav-btn" onclick="switchGlobalTab('eew')">EEW<div class="nav-badge" id="badge-eew"></div></button>
        <button id="gtab-switch" class="nav-btn" onclick="switchGlobalTab('switch')">地震切替</button>
    </div>
</footer>

<script>
    // --- 【重要】Yahoo! ルビ振りAPI 連携モジュール ---
    // ※アプリケーションIDを取得して以下に設定してください
    const YAHOO_APP_ID = "YOUR_YAHOO_APP_ID_HERE";

    async function requestRubyText(text) {
        if (!text || YAHOO_APP_ID === "YOUR_YAHOO_APP_ID_HERE") return text;
        try {
            // クロスドメイン(CORS)制約に対応するため、Yahoo!のJSONPまたはプロキシ経由、
            // もしくはサーバーサイド中継がない場合は、代替のローカル自動インジェクションにフォールバックします。
            const url = `https://jlp.yahooapis.jp/FuriganaService/V2/furigana?appid=${YAHOO_APP_ID}&output=json`;
            const response = await fetch(url, {
                method: 'POST',
                body: JSON.stringify({
                    "id": "1",
                    "jsonrpc": "2.0",
                    "method": "jlp.furiganaservice.furigana",
                    "params": { "q": text, "grade": 1 }
                })
            });
            if (!response.ok) return fallbackAutoRuby(text);
            const resData = await response.json();
            
            let htmlResult = "";
            const tokens = resData.result.word;
            tokens.forEach(t => {
                if (t.furigana && t.surface !== t.furigana) {
                    htmlResult += `<ruby>${t.surface}<rt>${t.furigana}</rt></ruby>`;
                } else {
                    htmlResult += t.surface;
                }
            });
            return htmlResult;
        } catch (e) {
            return fallbackAutoRuby(text);
        }
    }

    // API連携失敗時、または未設定時の高性能スタンドアロン補完エンジン
    function fallbackAutoRuby(text) {
        if (!text) return "";
        let result = text;
        const convMap = {
            "小笠原": "おがさわら", "伊豆": "いず", "奄美": "あまみ", "十島": "としま", "三宅": "みやけ", "八丈": "はちじょう",
            "大東島": "だいとうじま", "宮古島": "みやこじま", "西表島": "いりおもてじま", "石垣": "いしがき", "与那国": "よなぐに",
            "那覇": "なは", "沖縄": "おきなわ", "糸満": "いとまん", "豊見城": "とみぐすく", "南城": "なんじょう",
            "うるま": "うるま", "名護": "なご", "宜野湾": "ぎのわん", "浦添": "うらそえ", "国頭": "くにがみ",
            "大宜味": "おおぎみ", "今帰仁": "なきじん", "本部": "もとぶ", "恩納": "おんな", "宜野座": "ぎのざ",
            "金武": "きん", "読谷": "よみたん", "嘉手納": "かでな", "北谷": "ちゃたん", "北中城": "きたなかぐすく",
            "中城": "なかぐすく", "西原": "にしはら", "与那原": "よなばる", "南風原": "はえばる", "渡嘉敷": "とかしき",
            "座間味": "ざまみ", "粟国": "あぐに", "渡名喜": "となき", "久米島": "くめじま", "八重瀬": "やえせ",
            "多良間": "たらま", "竹富": "たけとみ", "伊平屋": "いへや", "伊根": "いね", "伊江": "いえ",
            "千代田": "ちよだ", "中央": "ちゅうおう", "港区": "みなとく", "新宿": "しんじゅく", "文京": "ぶんきょう",
            "台東": "たいとう", "墨田": "すみだ", "江東": "こうとう", "品川": "しながわ", "目黒": "めぐろ",
            "大田": "おおた", "世田谷": "せたがや", "渋谷": "しぶや", "中野": "なかの", "杉並": "すぎなみ",
            "豊島": "としま", "北区": "きたく", "荒川": "あらかわ", "板橋": "いたばし", "練馬": "ねりま",
            "足立": "あだち", "葛飾": "かつしか", "江戸川": "えどがわ", "むつ": "むつ", "いわき": "いわき",
            "相模原": "さがみはら", "横須賀": "よこすか", "小田原": "おだわら", "富士吉田": "ふじよしだ",
            "釜石": "かまいし", "一関": "いちのせき", "気仙沼": "けせんぬま", "宮古": "みやこ", "大船渡": "おおふなと"
        };
        const sortedKeys = Object.keys(convMap).sort((a,b) => b.length - a.length);
        sortedKeys.forEach(k => {
            result = result.replace(new RegExp(k, 'g'), `<ruby>${k}<rt>${convMap[k]}</rt></ruby>`);
        });
        result = result.replace(/([^>])(市区町村)/g, '$1<ruby>$2<rt>しくちょうそん</rt></ruby>');
        result = result.replace(/([^>])(市)/g, '$1<ruby>$2<rt>し</rt></ruby>');
        result = result.replace(/([^>])(町)/g, '$1<ruby>$2<rt>ちょう</rt></ruby>');
        result = result.replace(/([^>])(村)/g, '$1<ruby>$2<rt>そん</rt></ruby>');
        result = result.replace(/([^>])(区)/g, '$1<ruby>$2<rt>く</rt></ruby>');
        return result;
    }

    // データベース定義
    let database = {
        eq: [{ content: "地震情報を読み込み中..." }],
        shindo: [{ content: "震度情報を読み込み中..." }],
        tsu: [{ content: "現在、津波予報は発表されていません。" }],
        yosou: [{ content: "<table class='m-table'><tr><td>津波到達予想データはありません</td></tr></table>" }],
        yobikake: [{
            content: `緊急地震速報が発表された時
▼緊急地震速報です。強い揺れに警戒してください。
▼倒れやすい家具などからは、離れてください。
▼テーブルや机の下に隠れてください。`
        }],
        eew: [{ content: "現在、緊急地震速報（警報）は発表されていません。" }],
        switch: [{ content: "<table class='m-table'><tr><td>地震履歴リストを同期中...</td></tr></table>" }]
    };

    // 状態管理システム
    let isSplitMode = false;
    let currentGlobalTab = 'eq';
    
    let paneTabs = { left: 'eq', right: 'shindo' };
    let panePages = { left: 0, right: 0 };

    let eqHistoryList = [];
    let currentSelectedPacketId = null;
    let alertTimer = null;

    // 2分割画面切り替えトグル
    window.toggleSplitMode = () => {
        isSplitMode = !isSplitMode;
        const btn = document.getElementById('split-toggle');
        const rightPane = document.getElementById('right-pane');
        const leftMiniTabs = document.getElementById('left-mini-tabs');
        const globalFooter = document.getElementById('global-footer');

        if (isSplitMode) {
            btn.innerText = "2分割：ON";
            btn.classList.add('active');
            rightPane.style.display = "flex";
            leftMiniTabs.style.display = "flex";
            globalFooter.style.display = "none"; // 下部グローバルタブを隠す
            
            switchPaneTab('left', paneTabs.left);
            switchPaneTab('right', paneTabs.right);
        } else {
            btn.innerText = "2分割：OFF";
            btn.classList.remove('active');
            rightPane.style.display = "none";
            leftMiniTabs.style.display = "none";
            globalFooter.style.display = "flex"; // 下部グローバルタブを復活
            
            switchGlobalTab(currentGlobalTab);
        }
    };

    // 通常（1画面）モード用グローバルタブ切り替え
    window.switchGlobalTab = (tabId) => {
        currentGlobalTab = tabId;
        paneTabs.left = tabId;
        panePages.left = 0;

        document.querySelectorAll('#global-footer .nav-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById(`gtab-${tabId}`);
        if (activeBtn) activeBtn.classList.add('active');
        
        const badge = document.getElementById(`badge-${tabId}`);
        if (badge) badge.style.display = 'none';

        renderPane('left');
    };

    // 2分割モード用インライン個別タブ切り替え
    window.switchPaneTab = (side, tabId) => {
        paneTabs[side] = tabId;
        panePages[side] = 0;

        document.querySelectorAll(`#${side}-mini-tabs button`).forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById(`${side === 'left' ? 'l' : 'r'}tab-${tabId}`);
        if (activeBtn) activeBtn.classList.add('active');

        renderPane(side);
    };

    window.movePage = (side, direction) => {
        const currentTab = paneTabs[side];
        const pages = database[currentTab] || [];
        const targetIndex = panePages[side] + direction;
        if (targetIndex >= 0 && targetIndex < pages.length) {
            panePages[side] = targetIndex;
            renderPane(side);
        }
    };

    function renderPane(side) {
        const activeTab = paneTabs[side];
        const pages = database[activeTab] || [{ content: "" }];
        const pageIdx = panePages[side];
        
        document.getElementById(`${side}-title`).innerText = `${side === 'left' ? 'メイン' : 'サブ'}画面: [${getTabName(activeTab)}]`;
        document.getElementById(`manuscript-display-${side}`).innerHTML = pages[pageIdx]?.content || "";
    }

    function getTabName(id) {
        const names = { eq: "地震", shindo: "震度", tsu: "津波", yosou: "到達予想", yobikake: "呼びかけ", eew: "EEW", switch: "地震切替" };
        return names[id] || id;
    }

    function triggerIncomingAlert(tabs = []) {
        const tag = document.getElementById('incoming-tag');
        if (tag) tag.style.display = 'block';

        tabs.forEach(t => {
            const b = document.getElementById(`badge-${t}`);
            if (b && currentGlobalTab !== t) b.style.display = 'block';
        });

        if (alertTimer) clearTimeout(alertTimer);
        alertTimer = setTimeout(() => { if (tag) tag.style.display = 'none'; }, 60000);
    }

    // 地震切り替えイベント処理
    window.selectHistoryIndex = (packetId) => {
        currentSelectedPacketId = packetId;
        const banner = document.getElementById('history-warning');
        
        if (currentSelectedPacketId !== eqHistoryList[0]?.id) {
            if (banner) banner.style.display = 'flex';
        } else {
            if (banner) banner.style.display = 'none';
        }

        const target = eqHistoryList.find(p => p.id === packetId);
        if (target) applyPacketToManuscript(target.rawPacket);
        
        renderSwitchTable();
    };

    function renderSwitchTable() {
        let html = `<table class="m-table">`;
        eqHistoryList.forEach((item) => {
            const sel = item.id === currentSelectedPacketId ? 'class="selected"' : '';
            html += `<tr ${sel} onclick="selectHistoryIndex('${item.id}')">
                <td>${item.time}</td>
                <td>${item.name}</td>
                <td>${item.mag}</td>
                <td>${item.tsunami}</td>
            </tr>`;
        });
        html += `</table>`;
        database.switch = [{ content: html }];
        
        renderPane('left');
        if (isSplitMode) renderPane('right');
    }

    // --- P2PQuake ネットワーク連携ロジック ---
    const P2P_WS_URL = "wss://api.p2pquake.net/v2/ws";
    // Bad Request(400)回避のため、formatパラメータを完全除去
    const P2P_HTTP_URL = "https://api.p2pquake.net/v2/history?codes=551&codes=552&codes=556&limit=15";
    let ws = null;
    let processedIds = new Set();

    function connectWebSocket() {
        ws = new WebSocket(P2P_WS_URL);
        ws.onmessage = (e) => {
            try { processIncomingData(JSON.parse(e.data), false); } catch(err) { console.error(err); }
        };
        ws.onclose = () => { setTimeout(connectWebSocket, 5000); };
    }

    async function fetchData() {
        try {
            const res = await fetch(P2P_HTTP_URL);
            if (!res.ok) return;
            const data = await res.json();
            if (Array.isArray(data)) {
                // 配列の最後尾（古いデータ）から先頭（新しいデータ）へ向かって順次処理
                for (let i = data.length - 1; i >= 0; i--) {
                    await processIncomingData(data[i], true);
                }
            }
        } catch (e) { console.error(e); }
    }

    async function processIncomingData(packet, isHistory = false) {
        if (!packet || !packet.id || !packet.code || processedIds.has(packet.id)) return;
        processedIds.add(packet.id);

        if (packet.code === 551) {
            const eq = packet.earthquake;
            if (eq) {
                let dTime = eq.time || "";
                if (dTime.length >= 16) {
                    const day = dTime.substring(8, 10);
                    const hr = parseInt(dTime.substring(11, 13));
                    const mi = dTime.substring(14, 16);
                    const ampm = hr >= 12 ? "午後" : "午前";
                    const displayHr = hr > 12 ? hr - 12 : (hr === 0 ? 12 : hr);
                    dTime = `${day}日${ampm}${displayHr}時${mi}分`;
                }
                const name = eq.hypocenter.name || "調査中";
                const mShort = eq.hypocenter.magnitude >= 0 ? `Ｍ${eq.hypocenter.magnitude.toFixed(1)}` : "Ｍ不明";
                let tShort = "津波なし";
                if (eq.domesticTsunami === "Warning" || eq.domesticTsunami === "Watch") tShort = "津波情報";
                if (eq.domesticTsunami === "NonEffective") tShort = "海面変動";

                const item = { id: packet.id, time: dTime, name: name, mag: mShort, tsunami: tShort, rawPacket: packet };
                
                if (!isHistory) {
                    eqHistoryList.unshift(item); // リアルタイム入電を配列の最先頭にインサート
                    currentSelectedPacketId = packet.id;
                    document.getElementById('history-warning').style.display = 'none';
                    triggerIncomingAlert(['eq', 'shindo']);
                } else {
                    // 過去データ読み込み時は、新しいものを配列の先頭へ積み上げる
                    eqHistoryList.unshift(item);
                }

                if (eqHistoryList.length > 15) eqHistoryList.pop();
                if (isHistory && eqHistoryList.length > 0) currentSelectedPacketId = eqHistoryList[0].id;
            }

            if (!isHistory || currentSelectedPacketId === packet.id) {
                await applyPacketToManuscript(packet);
            }
            renderSwitchTable();

        } else if (packet.code === 552) {
            await parse552(packet);
            if (!isHistory) triggerIncomingAlert(['tsu', 'yosou']);
        } else if (packet.code === 556) {
            await parse556(packet);
            if (!isHistory) triggerIncomingAlert(['eew']);
        }
    }

    async function applyPacketToManuscript(packet) {
        if (packet.code === 551) {
            const eq = packet.earthquake;
            let dTime = eq.time || "";
            if (dTime.length >= 16) {
                const day = dTime.substring(8, 10);
                const hr = parseInt(dTime.substring(11, 13));
                const mi = dTime.substring(14, 16);
                const ampm = hr >= 12 ? "午後" : "午前";
                const displayHr = hr > 12 ? hr - 12 : (hr === 0 ? 12 : hr);
                dTime = `${day}日${ampm}${displayHr}時${mi}分`;
            }
            const name = eq.hypocenter.name || "調査中";
            const depth = eq.hypocenter.depth >= 0 ? `約${eq.hypocenter.depth}キロ` : "調査中";
            const mag = eq.hypocenter.magnitude >= 0 ? `マグニチュード${eq.hypocenter.magnitude.toFixed(1)}` : "不明";
            const maxScale = formatScale(eq.maxScale);

            let tScript = "この地震による津波の心配はありません。";
            if (eq.domesticTsunami === "Warning" || eq.domesticTsunami === "Watch") {
                tScript = `この地震で<span class="c-magenta">大津波警報</span>・<span class="c-red">津波警報</span>が出ています。`;
            } else if (eq.domesticTsunami === "NonEffective") {
                tScript = `この地震により、多少の海面変動があるかもしれませんが、津波の心配はありません。`;
            }

            const eqRawText = `${dTime}ごろ、${name}で\n最大震度${maxScale}を観測する強い地震がありました。\n\n震源：${name}　　深さ：${depth}\n規模：${mag}\n\n${tScript}`;
            database.eq = [{ content: await requestRubyText(eqRawText) }];

            if (packet.points && packet.points.length > 0) {
                let sMap = {};
                packet.points.forEach(p => {
                    const sStr = formatScale(p.scale);
                    if (!sMap[sStr]) sMap[sStr] = [];
                    sMap[sStr].push(p.addr);
                });

                let sManuscript = "";
                Object.keys(sMap).sort((a,b)=>b.localeCompare(a, undefined, {numeric:true})).forEach(sc => {
                    sManuscript += `<span class="c-yellow">震度${sc}</span>\n${sMap[sc].join("　")}\n\n`;
                });
                database.shindo = [{ content: await requestRubyText(sManuscript) }];
            } else {
                database.shindo = [{ content: "震度詳細は発表されていません。" }];
            }
            
            renderPane('left');
            if (isSplitMode) renderPane('right');
        }
    }

    async function parse552(packet) {
        if (!packet.areas || packet.areas.length === 0) return;
        let tContent = `<span class="c-yellow">今すぐ避難！今すぐ避難！</span>\n<span class="c-magenta">津波予報</span>が出ました。\n今すぐ、可能な限り高いところへ逃げること！\n\n`;
        let yHtml = `<table class="m-table">`;

        packet.areas.forEach(a => {
            let col = "c-yellow", lbl = "津波注意報";
            if (a.grade === "majorWarning") { col = "c-magenta"; lbl = "大津波警報"; }
            if (a.grade === "warning") { col = "c-red"; lbl = "津波警報"; }
            tContent += `<span class="${col}">${lbl}</span>\n▼${a.name}\n`;
            yHtml += `<tr class="selected"><td>${a.name}</td><td>第１波の到達を確認</td><td>高さ：調査中</td></tr>`;
        });
        yHtml += `</table>`;

        database.tsu = [{ content: await requestRubyText(tContent) }];
        database.yosou = [{ content: await requestRubyText(yHtml) }];
        renderPane('left');
        if (isSplitMode) renderPane('right');
    }

    async function parse556(packet) {
        if (!packet.earthquake) return;
        const name = packet.earthquake.hypocenter.name || "震源特定中";
        const mag = packet.earthquake.hypocenter.magnitude >= 0 ? `マグニチュード${packet.earthquake.hypocenter.magnitude.toFixed(1)}` : "";
        const areas = packet.areas ? packet.areas.map(a => a.name).join("　") : "";

        const eewRawText = `<span class="c-yellow">緊急地震速報（警報）</span>\n${name}で地震発生　強い揺れに警戒してください。\n推定規模：${mag}\n\n警戒地域：\n${areas}`;
        database.eew = [{ content: await requestRubyText(eewRawText) }];
        renderPane('left');
        if (isSplitMode) renderPane('right');
    }

    function formatScale(scale) {
        const dict = { 10: "1", 20: "2", 30: "3", 40: "4", 45: "5弱", 50: "5強", 55: "6弱", 60: "6強", 70: "7" };
        return dict[scale] || "不明";
    }

    // アプリケーション初期化
    (async () => {
        switchGlobalTab('eq');
        connectWebSocket();
        await fetchData();
        setInterval(fetchData, 12000);
    })();
</script>
