<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-title" content="EQLive 原稿">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <title>EQLive 原稿ツール</title>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d0d0d;
            --header-bg: #141414;
            --footer-bg: #141414;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
            --accent-yellow: #fff200;
            --accent-magenta: #ff00ff;
            --accent-red: #ff0000;
            --border-color: #262626;
            --status-green: #00ff66;
            --status-red: #ff3333;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            font-family: 'BIZ UDPGothic', sans-serif;
            letter-spacing: 0.02em;
        }

        /* ヘッダー */
        header {
            background-color: var(--header-bg);
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            user-select: none;
            position: relative;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
        }

        .brand-badge {
            background-color: #262626;
            color: #cccccc;
            font-size: 12px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid #3c3c3c;
        }

        /* 新規入電アラート表示 */
        .incoming-alert {
            display: none;
            background-color: var(--accent-red);
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 4px;
            animation: flash 1s infinite alternate;
        }

        @keyframes flash {
            from { opacity: 0.3; } to { opacity: 1; }
        }

        /* 過去データ表示中の警告帯 */
        .history-warning-banner {
            display: none;
            position: absolute;
            bottom: -36px;
            left: 0;
            width: 100%;
            height: 36px;
            background-color: #e67e22;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            align-items: center;
            justify-content: center;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* 戻る・進むボタン */
        .page-control {
            display: flex;
            gap: 8px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .page-btn {
            background-color: #262626;
            border: 1px solid #444444;
            color: #ffffff;
            padding: 4px 16px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'BIZ UDPGothic', sans-serif;
        }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .admin-btn {
            background: none;
            border: 1px solid #555555;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
        }

        /* メイン原稿表示域 */
        main {
            flex: 1;
            padding: 55px 60px 40px 60px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .manuscript-content {
            width: 100%;
            font-family: 'BIZ UDPGothic', sans-serif;
            font-size: 36px;
            line-height: 1.65;
            font-weight: 700;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .c-yellow { color: var(--accent-yellow); }
        .c-magenta { color: var(--accent-magenta); }
        .c-red { color: var(--accent-red); }
        
        ruby { padding: 0 1px; }
        rt { font-size: 0.45em; color: #00ffcc; font-family: 'BIZ UDPGothic', sans-serif; font-weight: 700; }

        /* リスト・テーブル構造 */
        .m-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 30px;
            font-family: 'BIZ UDPGothic', sans-serif;
        }
        .m-table tr {
            border-bottom: 2px solid #ffffff;
            cursor: pointer;
        }
        .m-table tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }
        .m-table tr.selected {
            color: var(--accent-yellow);
        }
        .m-table td {
            padding: 12px 10px;
            vertical-align: middle;
        }
        .m-table td:first-child { padding-left: 0; }
        .m-table td:last-child { padding-right: 0; }

        /* フッタータブ */
        footer {
            background-color: var(--footer-bg);
            height: 68px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            user-select: none;
        }

        .nav-container {
            display: flex;
            align-items: center;
            height: 100%;
            width: 100%;
        }

        .nav-btn {
            flex: 1;
            height: 100%;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'BIZ UDPGothic', sans-serif;
            border-right: 1px solid #222222;
            position: relative;
        }
        .nav-btn:last-child { border-right: none; }
        .nav-btn.active { color: var(--accent-yellow); }

        /* タブの新規入電バッジ（赤丸） */
        .nav-badge {
            display: none;
            position: absolute;
            top: 10px;
            right: 14px;
            width: 8px;
            height: 8px;
            background-color: var(--accent-red);
            border-radius: 50%;
        }

        @media (max-width: 800px) {
            .manuscript-content { font-size: 24px; }
            .m-table { font-size: 20px; }
            .page-control { position: static; transform: none; }
            .history-warning-banner { font-size: 12px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <span class="brand-logo">EQLive</span>
        <span class="brand-badge">原稿ツール</span>
        <div id="incoming-tag" class="incoming-alert">【新規入電】</div>
    </div>
    
    <div class="page-control">
        <button id="prev-btn" class="page-btn" onclick="movePage(-1)">戻る</button>
        <button id="next-btn" class="page-btn" onclick="movePage(1)">進む</button>
    </div>

    <button class="admin-btn" onclick="location.href='admin.html'">Adminページ</button>

    <div id="history-warning" class="history-warning-banner">⚠️ 表示中の情報は最新ではありません（過去の履歴を表示中）</div>
</header>

<main>
    <div id="manuscript-display" class="manuscript-content"></div>
</main>

<footer>
    <div class="nav-container">
        <button id="tab-eq" class="nav-btn" onclick="switchTab('eq')">地震<div class="nav-badge" id="badge-eq"></div></button>
        <button id="tab-shindo" class="nav-btn" onclick="switchTab('shindo')">震度<div class="nav-badge" id="badge-shindo"></div></button>
        <button id="tab-tsu" class="nav-btn" onclick="switchTab('tsu')">津波<div class="nav-badge" id="badge-tsu"></div></button>
        <button id="tab-yosou" class="nav-btn" onclick="switchTab('yosou')">到達予想<div class="nav-badge" id="badge-yosou"></div></button>
        <button id="tab-yobikake" class="nav-btn" onclick="switchTab('yobikake')">呼びかけ</button>
        <button id="tab-eew" class="nav-btn" onclick="switchTab('eew')">EEW<div class="nav-badge" id="badge-eew"></div></button>
        <button id="tab-switch" class="nav-btn" onclick="switchTab('switch')">地震切替</button>
    </div>
</footer>

<script>
    // --- 超巨大ルビ自動マッピング辞書 ---
    const rubyDict = {
        // 地震津波共通用語
        "地震": "じしん", "津波": "つなみ", "震度": "しんど", "震源": "しんげん", "深さ": "ふかさ", "規模": "きぼ",
        "大津波警報": "おおつなみけいほう", "津波警報": "つなみけいほう", "津波注意報": "つなみちゅういほう", "緊急地震速報": "きんきゅうじしんそくほう",
        // 北海道
        "石狩地方": "いしかりちほう", "渡島地方": "おしまちほう", "檜山地方": "ひやまちほう", "後志地方": "しりべしちほう", "空知地方": "そらちちほう",
        "上川地方": "かみかわちほう", "留萌地方": "るもちほう", "宗谷地方": "そうやちほう", "網走地方": "あばしりちほう", "北見地方": "きたみちほう",
        "紋別地方": "もんべつちほう", "胆振地方": "いぶりちほう", "日高地方": "ひだかちほう", "十勝地方": "とかちちほう", "釧路地方": "くしろちほう",
        "根室地方": "ねむろちほう", "奥尻島": "おくしりとう", "利尻礼文": "りしりれぶん",
        // 東北・関東
        "青森県": "あおもりけん", "岩手県": "いわてけん", "宮城県": "みやぎけん", "秋田県": "あきたけん", "山形県": "やまがたけん",
        "福島県": "ふくしまけん", "茨城県": "いばらきけん", "栃木県": "とちぎけん", "群馬県": "ぐんまけん", "埼玉県": "さいたまけん",
        "千葉県": "ちばけん", "東京都": "とうきょうと", "神奈川県": "かながわけん", "伊豆諸島": "いずしょとう", "小笠原諸島": "おがさわらしょとう",
        // 中部・近畿・北陸
        "新潟県": "にいがたけん", "富山県": "とやまけん", "石川県": "いしかわけん", "福井県": "ふくいけん", "山梨県": "やまなしけん",
        "長野県": "ながのけん", "岐阜県": "ぎふけん", "静岡県": "しずおかけん", "愛知県": "あいちけん", "三重県": "みえけん",
        "滋賀県": "しがく", "京都府": "きょうとふ", "大阪府": "おおさかふ", "兵庫県": "ひょうごけん", "奈良県": "ならけん", "和歌山県": "わかやまけん",
        // 中国・四国・九州
        "鳥取県": "とっとりけん", "島根県": "しまねけん", "岡山県": "おかやまけん", "広島県": "ひろしまけん", "山口県": "やまぐちけん",
        "徳島県": "とくしまけん", "香川県": "かがわけん", "愛媛県": "えひめけん", "高知県": "こうちけん", "福岡県": "ふくおかけん",
        "佐賀県": "さがけん", "長崎県": "ながさきけん", "熊本県": "くまもとけん", "大分県": "おおいたけん", "宮崎県": "みやざきけん",
        "鹿児島県": "かごしまけん", "種子島": "たねがしま", "屋久島": "やくしま", "奄美群島": "あまみぐんとう", "トカラ列島": "とかられっとう",
        // 沖縄
        "沖縄本島地方": "おきなわほんとうちほう", "大東島地方": "だいとうじまちほう", "宮古島・八重山地方": "みやこじま・やえやまちほう",
        "沖縄市": "おきなわし", "糸満市": "いとまんし", "豊見城市": "とみぐすくし", "南城市": "なんじょうし", "那覇市": "なはし",
        "宜野湾市": "ぎのわんし", "浦添市": "うらそえし", "名護市": "なごし", "うるま市": "うるまし", "宮古島市": "みやこじまし",
        "国頭村": "くにがみそん", "大宜味村": "おおぎみそん", "東村": "ひがしそん", "今帰仁村": "なきじんそん", "座間味村": "ざまみそん",
        "多良間村": "たらまそん", "久米島町": "くめじまちょう", "粟国村": "あぐにそん", "伊平屋村": "いへやそん", "伊江村": "いえそん",
        "石垣市": "いしがきし", "竹富町": "たけとみちょう", "与那国町": "よなぐにちょう",
        // 海域・区域呼称系
        "近海": "きんかい", "北西部": "ほくせいぶ", "南部": "なんぶ", "北部": "ほくぶ", "東部": "とうぶ", "西部": "せいぶ",
        "太平洋沿岸": "たいへいようえんがん", "日本海沿岸": "にほんかいえんがん", "オホーツク海沿岸": "おほーつくかいえんがん",
        "宇和海沿岸": "うわかいえんがん", "瀬戸内海沿岸": "せとないかいえんがん", "豊後水道沿岸": "ぶんごすいどうえんがん"
    };

    function applyRuby(text) {
        let parsed = text;
        const sortedKeys = Object.keys(rubyDict).sort((a, b) => b.length - a.length);
        sortedKeys.forEach(key => {
            const regex = new RegExp(key, 'g');
            parsed = parsed.replace(regex, `<ruby>${key}<rt>${rubyDict[key]}</rt></ruby>`);
        });
        return parsed;
    }

    // 各データベース
    let database = {
        eq: [{ content: "地震情報を読み込み中..." }],
        shindo: [{ content: "震度情報を読み込み中..." }],
        tsu: [{ content: "現在、津波予報は発表されていません。" }],
        yosou: [{ content: "<table class='m-table'><tr><td>津波到達予想データはありません</td></tr></table>" }],
        yobikake: [{
            content: `<span class="c-yellow">緊急地震速報が発表された時</span>
▼緊急地震速報です。（地域名）では、強い揺れに警戒してください。
▼倒れやすい家具などからは、離れてください。
▼テーブルや机の下に隠れてください。`
        }],
        eew: [{ content: "現在、緊急地震速報（警報）は発表されていません。" }],
        switch: [{ content: "<table class='m-table'><tr><td>地震履歴リストを同期中...</td></tr></table>" }]
    };

    let currentTab = 'eq';
    let currentPageIndex = 0;
    
    // システム内部状態管理
    let eqHistoryList = [];   // P2Pから受信したパケットの生配列（最大8件）
    let currentSelectedPacketId = null; // 現在ユーザーが選択して表示しているパケットのID
    let alertTimer = null;

    window.switchTab = (tabId) => {
        currentTab = tabId;
        currentPageIndex = 0;
        document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
        const targetTab = document.getElementById(`tab-${tabId}`);
        if (targetTab) targetTab.classList.add('active');
        
        // タブが開かれたらそのバッジ（赤丸）を消去
        const badge = document.getElementById(`badge-${tabId}`);
        if (badge) badge.style.display = 'none';

        renderPage();
    };

    window.movePage = (direction) => {
        const pages = database[currentTab];
        const newIndex = currentPageIndex + direction;
        if (newIndex >= 0 && newIndex < pages.length) {
            currentPageIndex = newIndex;
            renderPage();
        }
    };

    function renderPage() {
        const pages = database[currentTab] || [{ content: "" }];
        const pageData = pages[currentPageIndex] || { content: "" };
        const displayEl = document.getElementById('manuscript-display');
        if (displayEl) displayEl.innerHTML = pageData.content;

        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        if (prevBtn && nextBtn) {
            prevBtn.disabled = (currentPageIndex === 0);
            nextBtn.disabled = (currentPageIndex === pages.length - 1);
        }
    }

    // --- 「新規入電」アクティベーター（1分間点滅＆バッジ点灯） ---
    function triggerIncomingAlert(targetTabs = []) {
        // ヘッダーの新規入電タグを表示
        const tag = document.getElementById('incoming-tag');
        if (tag) tag.style.display = 'block';

        // 該当タブにバッジを表示
        targetTabs.forEach(tabId => {
            const badge = document.getElementById(`badge-${tabId}`);
            if (badge && currentTab !== tabId) { // 現在開いているタブ以外にバッジを出す
                badge.style.display = 'block';
            }
        });

        // 1分（60000ms）タイマーのリセットと開始
        if (alertTimer) clearTimeout(alertTimer);
        alertTimer = setTimeout(() => {
            if (tag) tag.style.display = 'none';
        }, 60000);
    }

    // --- 地震情報切り替えコアロジック ---
    window.selectHistoryIndex = (packetId) => {
        currentSelectedPacketId = packetId;
        
        // 1. 最新パケットのIDを取得
        const latestId = eqHistoryList[0]?.id;
        const banner = document.getElementById('history-warning');

        // 2. 最新ではないデータの場合、警告帯を出す
        if (currentSelectedPacketId !== latestId) {
            if (banner) banner.style.display = 'flex';
        } else {
            if (banner) banner.style.display = 'none';
        }

        // 3. 対象パケットを検索して原稿を再マッピング
        const targetPacket = eqHistoryList.find(p => p.id === packetId);
        if (targetPacket) {
            applyPacketToManuscript(targetPacket.rawPacket, true);
        }

        // 4. 地震切替テーブルのHTML再レンダリング（選択行のハイライト変化を反映）
        renderSwitchTable();
    };

    // リスト構造の表示更新
    function renderSwitchTable() {
        let tableHtml = `<table class="m-table">`;
        eqHistoryList.forEach((item) => {
            const isSelected = item.id === currentSelectedPacketId ? 'class="selected" style="border-bottom: 2px solid var(--accent-yellow);"' : '';
            tableHtml += `<tr ${isSelected} onclick="selectHistoryIndex('${item.id}')">
                <td>${item.time}</td>
                <td>${item.name}</td>
                <td>${item.mag}</td>
                <td>${item.tsunami}</td>
            </tr>`;
        });
        tableHtml += `</table>`;
        database.switch = [{ content: tableHtml }];
        
        if (currentTab === 'switch') renderPage();
    }


    // --- 同期ネットワークモジュール ---
    const P2P_WS_URL = "wss://api.p2pquake.net/v2/ws";
    const P2P_HTTP_URL = "https://api.p2pquake.net/v2/history?codes=551&codes=552&codes=556&limit=8";
    let ws = null;
    let processedIds = new Set();

    function connectWebSocket() {
        ws = new WebSocket(P2P_WS_URL);
        ws.onmessage = (event) => {
            try {
                const packet = JSON.parse(event.data);
                processIncomingData(packet, false);
            } catch(e) { console.error(e); }
        };
        ws.onclose = () => { setTimeout(connectWebSocket, 5000); };
    }

    async function fetchDataFromTargetURL() {
        try {
            const res = await fetch(P2P_HTTP_URL);
            if (!res.ok) return;
            const data = await res.json();
            if (Array.isArray(data)) {
                const sortedData = [...data].reverse();
                sortedData.forEach(packet => processIncomingData(packet, true));
            }
        } catch (e) { console.error(e); }
    }

    function processIncomingData(packet, isHistoryLoad = false) {
        if (!packet || !packet.id || !packet.code) return;
        if (processedIds.has(packet.id)) return;
        processedIds.add(packet.id);

        if (packet.code === 551) {
            // 地震履歴配列の再構築
            const eq = packet.earthquake;
            if (eq) {
                let displayTime = eq.time || "";
                if (displayTime.length >= 16) {
                    const day = displayTime.substring(8, 10);
                    const hour = parseInt(displayTime.substring(11, 13));
                    const min = displayTime.substring(14, 16);
                    const ampm = hour >= 12 ? "午後" : "午前";
                    const displayHour = hour > 12 ? hour - 12 : (hour === 0 ? 12 : hour);
                    displayTime = `${day}日${ampm}${displayHour}時${min}分`;
                }
                const name = eq.hypocenter.name || "調査中";
                const mShort = eq.hypocenter.magnitude >= 0 ? `Ｍ${eq.hypocenter.magnitude.toFixed(1)}` : "Ｍ不明";
                let tShort = "津波なし";
                if (eq.domesticTsunami === "Warning" || eq.domesticTsunami === "Watch") tShort = "津波情報";
                if (eq.domesticTsunami === "NonEffective") tShort = "海面変動";

                const historyItem = { id: packet.id, time: displayTime, name: name, mag: mShort, tsunami: tShort, rawPacket: packet };
                
                if (!isHistoryLoad) {
                    eqHistoryList.unshift(historyItem);
                    // リアルタイム新規入電時は自動的に最新を選択状態にする
                    currentSelectedPacketId = packet.id;
                    const banner = document.getElementById('history-warning');
                    if (banner) banner.style.display = 'none';
                    
                    // 新規入電アラート＆バッジ点灯
                    triggerIncomingAlert(['eq', 'shindo']);
                } else {
                    eqHistoryList.push(historyItem);
                }

                if (eqHistoryList.length > 8) {
                    if (!isHistoryLoad) eqHistoryList.pop();
                    else eqHistoryList.shift();
                }

                // 初期起動ロードの最終着地の場合も、最新のパケットIDを選択状態に固定
                if (isHistoryLoad && eqHistoryList.length > 0) {
                    currentSelectedPacketId = eqHistoryList[0].id;
                }
            }

            // 原稿側への適用（ユーザーが過去データを閲覧中ではない、または新着リアルタイムデータの場合は即時適用）
            if (!isHistoryLoad || currentSelectedPacketId === packet.id) {
                applyPacketToManuscript(packet, isHistoryLoad);
            }
            renderSwitchTable();

        } else if (packet.code === 552) {
            parse552(packet);
            if (!isHistoryLoad) triggerIncomingAlert(['tsu', 'yosou']);
        } else if (packet.code === 556) {
            parse556(packet);
            if (!isHistoryLoad) triggerIncomingAlert(['eew']);
        }
    }

    // パケットデータを原稿用データベースへマッピングする関数
    function applyPacketToManuscript(packet, isHistoryLoad = false) {
        if (packet.code === 551) {
            const eq = packet.earthquake;
            let displayTime = eq.time || "";
            if (displayTime.length >= 16) {
                const day = displayTime.substring(8, 10);
                const hour = parseInt(displayTime.substring(11, 13));
                const min = displayTime.substring(14, 16);
                const ampm = hour >= 12 ? "午後" : "午前";
                const displayHour = hour > 12 ? hour - 12 : (hour === 0 ? 12 : hour);
                displayTime = `${day}日${ampm}${displayHour}時${min}分`;
            }
            const name = eq.hypocenter.name || "調査中";
            const depth = eq.hypocenter.depth >= 0 ? `約${eq.hypocenter.depth}キロ` : "調査中";
            const mag = eq.hypocenter.magnitude >= 0 ? `マグニチュード${eq.hypocenter.magnitude.toFixed(1)}` : "不明";
            const maxScale = formatScale(eq.maxScale);

            let tsunamiScript = "この地震による津波の心配はありません。";
            if (eq.domesticTsunami === "Warning" || eq.domesticTsunami === "Watch") {
                tsunamiScript = `この地震で<span class="c-magenta">大津波警報</span>・<span class="c-red">津波警報</span>が出ています。`;
            } else if (eq.domesticTsunami === "NonEffective") {
                tsunamiScript = `この地震により、多少の海面変動があるかもしれませんが、津波の心配はありません。`;
            }

            // 地震タブ原稿を生成（ふりがな対応）
            database.eq = [{
                content: applyRuby(`${displayTime}ごろ、${name}で
最大震度${maxScale}を観測する強い地震がありました。

震源：${name}　　深さ：${depth}
規模：${mag}

${tsunamiScript}`)
            }];

            // 震度タブ原稿を生成（ふりがな対応）
            if (packet.points && packet.points.length > 0) {
                let shindoMap = {};
                packet.points.forEach(p => {
                    const sStr = formatScale(p.scale);
                    if (!shindoMap[sStr]) shindoMap[sStr] = [];
                    shindoMap[sStr].push(p.addr);
                });

                let shindoManuscript = "";
                Object.keys(shindoMap).sort((a,b)=>b.localeCompare(a, undefined, {numeric:true})).forEach(scale => {
                    shindoManuscript += `<span class="c-yellow">震度${scale}</span>\n${shindoMap[scale].join("　")}\n\n`;
                });
                database.shindo = [{ content: applyRuby(shindoManuscript) }];
            } else {
                database.shindo = [{ content: "震度詳細は発表されていません。" }];
            }
            
            renderPage();
        }
    }

    // 552 津波予報解析
    function parse552(packet) {
        if (!packet.areas || packet.areas.length === 0) return;

        let tsuContent = `<span class="c-yellow">今すぐ避難！今すぐ避難！</span>\n<span class="c-magenta">津波予報</span>が出ました。\n今すぐ、可能な限り高いところへ逃げること！\n\n`;
        let yosouHtml = `<table class="m-table">`;

        packet.areas.forEach(area => {
            let color = "c-yellow";
            let label = "津波注意報";
            if (area.grade === "majorWarning") { color = "c-magenta"; label = "大津波警報"; }
            if (area.grade === "warning") { color = "c-red"; label = "津波警報"; }

            tsuContent += `<span class="${color}">${label}</span>\n▼${area.name}\n`;
            yosouHtml += `<tr class="selected"><td>${area.name}</td><td>第１波の到達を確認</td><td>高さ：調査中</td></tr>`;
        });
        yosouHtml += `</table>`;

        database.tsu = [{ content: applyRuby(tsuContent) }];
        database.yosou = [{ content: applyRuby(yosouHtml) }];
        if (currentTab === 'tsu' || currentTab === 'yosou') renderPage();
    }

    // 556 EEW解析
    function parse556(packet) {
        if (!packet.earthquake) return;
        const name = packet.earthquake.hypocenter.name || "震源特定中";
        const mag = packet.earthquake.hypocenter.magnitude >= 0 ? `マグニチュード${packet.earthquake.hypocenter.magnitude.toFixed(1)}` : "";
        const areas = packet.areas ? packet.areas.map(a => a.name).join("　") : "";

        database.eew = [{
            content: applyRuby(`<span class="c-yellow">緊急地震速報（警報）</span>
${name}で地震発生　強い揺れに警戒してください。
推定規模：${mag}

警戒地域：
${areas}`)
        }];
        if (currentTab === 'eew') renderPage();
    }

    function formatScale(scale) {
        const dict = { 10: "1", 20: "2", 30: "3", 40: "4", 45: "5弱", 50: "5強", 55: "6弱", 60: "6強", 70: "7" };
        return dict[scale] || "不明";
    }

    // エントリー初期起動
    switchTab('eq');
    connectWebSocket();
    fetchDataFromTargetURL();
    setInterval(fetchDataFromTargetURL, 12000);
</script>
