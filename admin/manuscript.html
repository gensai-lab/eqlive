<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-title" content="EQLive 原稿">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <title>EQLive 原稿ツール</title>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.mini.min.js"></script>
    
    <style>
        :root {
            --bg-color: #0d0d0d;
            --header-bg: #141414;
            --footer-bg: #141414;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
            --accent-yellow: #fff200;
            --accent-magenta: #ff00ff;
            --accent-red: #ff0000;
            --border-color: #262626;
            --status-green: #00ff66;
            --status-red: #ff3333;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            font-family: 'BIZ UDPGothic', sans-serif;
            letter-spacing: 0.04em;
        }

        /* ヘッダー */
        header {
            background-color: var(--header-bg);
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 2px solid var(--border-color);
            flex-shrink: 0;
            user-select: none;
            position: relative;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-logo { font-size: 26px; font-weight: bold; color: #ffffff; letter-spacing: 0.08em; }
        .brand-badge {
            background-color: #262626;
            color: #cccccc;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #3c3c3c;
        }

        /* 辞書ロード状態表示ランプ */
        .dict-status {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            background-color: #333;
            color: #aaa;
        }
        .dict-status.loaded {
            background-color: rgba(0, 255, 102, 0.15);
            color: var(--status-green);
            border: 1px solid rgba(0, 255, 102, 0.3);
        }

        /* 新規入電アラート表示（最優先で目立たせる設計） */
        .incoming-alert-banner {
            display: none;
            background-color: var(--accent-red);
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            padding: 6px 20px;
            border-radius: 4px;
            border: 2px solid #ffffff;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
            animation: ultra-flash 0.5s infinite alternate;
        }

        @keyframes ultra-flash { 
            from { background-color: var(--accent-red); transform: scale(1.0); } 
            to { background-color: #b30000; transform: scale(1.03); } 
        }

        .history-warning-banner {
            display: none;
            position: absolute;
            bottom: -40px;
            left: 0;
            width: 100%;
            height: 40px;
            background-color: #e67e22;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            align-items: center;
            justify-content: center;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .split-toggle-btn {
            background-color: #262626;
            border: 1px solid #555555;
            color: #ffffff;
            padding: 6px 16px;
            font-size: 14px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'BIZ UDPGothic', sans-serif;
            font-weight: bold;
            transition: all 0.2s ease;
        }
        .split-toggle-btn.active {
            background-color: var(--status-green);
            color: #000000;
            border-color: var(--status-green);
        }

        .admin-btn {
            background: none;
            border: 1px solid #555555;
            color: #ffffff;
            font-size: 14px;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
        }

        /* メインワークスペース */
        .workspace-container {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* ペインシステム */
        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            position: relative;
            overflow: hidden;
        }

        /* 各画面のヘッダー情報バー */
        .pane-header {
            background-color: #111111;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #222222;
            flex-shrink: 0;
        }

        .pane-title {
            font-size: 15px;
            font-weight: bold;
            color: var(--accent-yellow);
        }

        .pane-control { display: flex; gap: 8px; }
        .pane-btn {
            background-color: #262626;
            border: 1px solid #444444;
            color: #ffffff;
            padding: 4px 14px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .pane-btn:hover { background-color: #333333; }

        /* 原稿表示領域 */
        .pane-body {
            flex: 1;
            padding: 30px 40px;
            overflow-y: auto;
        }

        /* 2分割画面用：それぞれの画面の直下に独立して配置されるボトムタブバー */
        .pane-footer-tabs {
            display: flex;
            background-color: #141414;
            border-top: 2px solid var(--border-color);
            height: 56px;
            flex-shrink: 0;
        }
        .pane-footer-tabs button {
            flex: 1;
            background: none;
            border: none;
            color: #888888;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'BIZ UDPGothic', sans-serif;
            border-right: 1px solid #222222;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        .pane-footer-tabs button:last-child { border-right: none; }
        .pane-footer-tabs button.active {
            color: var(--accent-yellow);
            background-color: rgba(255, 242, 0, 0.05);
        }

        /* 右ペイン（初期状態は完全に隠蔽） */
        #right-pane {
            display: none;
            border-left: 3px solid var(--border-color);
        }

        /* 原稿テキスト描画スタイル */
        .manuscript-content {
            width: 100%;
            font-size: 38px;
            line-height: 1.75;
            white-space: pre-wrap;
            word-break: break-all;
            font-weight: 400;
        }

        .c-yellow { color: var(--accent-yellow); font-weight: bold; }
        .c-magenta { color: var(--accent-magenta); font-weight: bold; }
        .c-red { color: var(--accent-red); font-weight: bold; }
        
        /* ふりがな（ルビ）最適化 */
        ruby { padding: 0 2px; }
        rt { font-size: 0.44em; color: #00ffcc; font-family: 'BIZ UDPGothic', sans-serif; font-weight: normal; letter-spacing: 0.02em; padding-bottom: 1px; }

        /* リスト・履歴テーブル */
        .m-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 32px;
        }
        .m-table tr {
            border-bottom: 2px solid #333333;
            cursor: pointer;
        }
        .m-table tr:hover { background-color: rgba(255, 255, 255, 0.03); }
        .m-table tr.selected { color: var(--accent-yellow); background-color: rgba(255, 242, 0, 0.02); }
        .m-table td { padding: 16px 12px; vertical-align: middle; }
        .m-table td:first-child { padding-left: 0; }
        .m-table td:last-child { padding-right: 0; }

        /* 通常（1画面表示時）のメイン最下部グローバルナビ */
        #global-footer {
            background-color: var(--footer-bg);
            height: 64px;
            border-top: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            user-select: none;
            flex-shrink: 0;
        }

        .nav-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .nav-btn {
            flex: 1;
            height: 100%;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'BIZ UDPGothic', sans-serif;
            border-right: 1px solid #222222;
            position: relative;
        }
        .nav-btn:last-child { border-right: none; }
        .nav-btn.active { color: var(--accent-yellow); background-color: rgba(255,242,0,0.04); }

        .nav-badge {
            display: none;
            position: absolute;
            top: 12px;
            right: 16px;
            width: 10px;
            height: 10px;
            background-color: var(--accent-red);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-red);
        }

        @media (max-width: 1024px) {
            .manuscript-content { font-size: 26px; }
            .m-table { font-size: 22px; }
            .workspace-container { flex-direction: column; }
            #right-pane { border-left: none; border-top: 3px solid var(--border-color); }
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <span class="brand-logo">EQLive</span>
        <span class="brand-badge">原稿ツール</span>
        <span id="dict-indicator" class="dict-status">Excel辞書同期中...</span>
        <div id="incoming-alert-ui" class="incoming-alert-banner">【新規入電】新着情報があります</div>
    </div>

    <div class="header-right">
        <button id="split-toggle" class="split-toggle-btn" onclick="toggleSplitMode()">2分割：OFF</button>
        <button class="admin-btn" onclick="location.href='admin.html'">Adminページ</button>
    </div>

    <div id="history-warning" class="history-warning-banner">⚠️ 表示中の情報は最新ではありません（過去の履歴を表示中）</div>
</header>

<div class="workspace-container">
    <div id="left-pane" class="pane">
        <div class="pane-header">
            <span id="left-title" class="pane-title">メイン表示画面</span>
            <div class="pane-control">
                <button class="pane-btn" onclick="movePage('left', -1)">前へ</button>
                <button class="pane-btn" onclick="movePage('left', 1)">次へ</button>
            </div>
        </div>
        <div class="pane-body">
            <div id="manuscript-display-left" class="manuscript-content"></div>
        </div>
        <div id="left-mini-tabs" class="pane-footer-tabs" style="display: none;">
            <button id="ltab-eq" class="active" onclick="switchPaneTab('left', 'eq')">地震</button>
            <button id="ltab-shindo" onclick="switchPaneTab('left', 'shindo')">震度</button>
            <button id="ltab-tsu" onclick="switchPaneTab('left', 'tsu')">津波</button>
            <button id="ltab-yosou" onclick="switchPaneTab('left', 'yosou')">予想</button>
            <button id="ltab-eew" onclick="switchPaneTab('left', 'eew')">EEW</button>
            <button id="ltab-yobikake" onclick="switchPaneTab('left', 'yobikake')">呼びかけ</button>
            <button id="ltab-switch" onclick="switchPaneTab('left', 'switch')">切替</button>
        </div>
    </div>

    <div id="right-pane" class="pane">
        <div class="pane-header">
            <span id="right-title" class="pane-title">サブ表示画面</span>
            <div class="pane-control">
                <button class="pane-btn" onclick="movePage('right', -1)">前へ</button>
                <button class="pane-btn" onclick="movePage('right', 1)">次へ</button>
            </div>
        </div>
        <div class="pane-body">
            <div id="manuscript-display-right" class="manuscript-content"></div>
        </div>
        <div id="right-mini-tabs" class="pane-footer-tabs">
            <button id="rtab-eq" onclick="switchPaneTab('right', 'eq')">地震</button>
            <button id="rtab-shindo" class="active" onclick="switchPaneTab('right', 'shindo')">震度</button>
            <button id="rtab-tsu" onclick="switchPaneTab('right', 'tsu')">津波</button>
            <button id="rtab-yosou" onclick="switchPaneTab('right', 'yosou')">予想</button>
            <button id="rtab-eew" onclick="switchPaneTab('right', 'eew')">EEW</button>
            <button id="rtab-yobikake" onclick="switchPaneTab('right', 'yobikake')">呼びかけ</button>
            <button id="rtab-switch" onclick="switchPaneTab('right', 'switch')">切替</button>
        </div>
    </div>
</div>

<footer id="global-footer">
    <div class="nav-container">
        <button id="gtab-eq" class="nav-btn active" onclick="switchGlobalTab('eq')">地震<div class="nav-badge" id="badge-eq"></div></button>
        <button id="gtab-shindo" class="nav-btn" onclick="switchGlobalTab('shindo')">震度<div class="nav-badge" id="badge-shindo"></div></button>
        <button id="gtab-tsu" class="nav-btn" onclick="switchGlobalTab('tsu')">津波<div class="nav-badge" id="badge-tsu"></div></button>
        <button id="gtab-yosou" class="nav-btn" onclick="switchGlobalTab('yosou')">到達予想<div class="nav-badge" id="badge-yosou"></div></button>
        <button id="gtab-yobikake" class="nav-btn" onclick="switchGlobalTab('yobikake')">呼びかけ</button>
        <button id="gtab-eew" class="nav-btn" onclick="switchGlobalTab('eew')">EEW<div class="nav-badge" id="badge-eew"></div></button>
        <button id="gtab-switch" class="nav-btn" onclick="switchGlobalTab('switch')">地震切替</button>
    </div>
</footer>

<script>
    // --- Excelマスターデータ同期・パースモジュール ---
    const EXCEL_URL = "https://gensai-lab.github.io/eqlive/assets/code.xlsx";
    let excelNameRubyMap = {}; 

    // 半角・全角カタカナをすべて「ひらがな」に整音変換する補助ロジック
    function kanaToHiragana(src) {
        if (!src) return "";
        const hankakuMap = {
            'ｱ':'あ','ｲ':'い','ｳ':'う','ｴ':'え','ｵ':'お','ｶ':'か','ｷ':'き','ｸ':'く','ｹ':'け','ｺ':'こ',
            'ｻ':'さ','ｼ':'し','ｽ':'す','ｾ':'せ','ｿ':'そ','ﾀ':'た','ﾁ':'ち','ﾂ':'つ','ﾃ':'て','ﾄ':'と',
            'ﾅ':'な','ﾆ':'に','ﾇ':'ぬ','ﾈ':'ね','ﾉ':'の','ﾊ':'は','ﾋ':'ひ','ﾌ':'ふ','ﾍ':'へ','ﾎ':'ほ',
            'ﾏ':'ま','ﾐ':'み','ﾑ':'む','ﾒ':'め','ﾓ':'も','ﾔ':'や','ﾕ':'ゆ','ﾖ':'よ','ﾗ':'ら','ﾘ':'り',
            'ﾙ':'る','ﾚ':'れ','ﾛ':'ろ','ﾜ':'わ','ｦ':'を','ﾝ':'ん',
            'ｧ':'ぁ','ｨ':'ぃ','ｩ':'ぅ','ｪ':'ぇ','ｫ':'ぉ','ｬ':'ゃ','ｭ':'ゅ','ｮ':'ょ','ｯ':'っ',
            'ｰ':'ー','ﾞ':'','ﾟ':''
        };
        let res = "";
        let str = src.toString().trim();
        for (let i = 0; i < str.length; i++) {
            let c = str[i];
            if (str[i+1] === 'ﾞ') {
                const daku = {'ｶ':'が','ｷ':'ぎ','ｸ':'ぐ','ｹ':'げ','ｺ':'ご','ｻ':'ざ','ｼ':'じ','ｽ':'ず','ｾ':'ぜ','ｿ':'ぞ','ﾀ':'だ','ﾁ':'ぢ','ﾂ':'づ','ﾃ':'で','ﾄ':'ど','ﾊ':'ば','ﾋ':'び','ﾌ':'ぶ','ﾍ':'べ','ﾎ':'ぼ'};
                if (daku[c]) { res += daku[c]; i++; continue; }
            }
            if (str[i+1] === 'ﾟ') {
                const handaku = {'ﾊ':'ぱ','ﾋ':'ぴ','ﾌ':'ぷ','ﾍ':'ぽ','ﾎ':'ぽ'};
                if (handaku[c]) { res += handaku[c]; i++; continue; }
            }
            if (hankakuMap[c]) {
                res += hankakuMap[c];
            } else {
                let code = c.charCodeAt(0);
                if (code >= 0x30A1 && code <= 0x30F6) {
                    res += String.fromCharCode(code - 0x60);
                } else {
                    res += c;
                }
            }
        }
        return res;
    }

    // Excelファイルをフェッチし、列のインデックス（C列=2, E列=4）基準で安全にマッピング
    async function initExcelDictionary() {
        try {
            const response = await fetch(EXCEL_URL);
            if (!response.ok) throw new Error("Excelファイルの取得に失敗しました");
            const arrayBuffer = await response.arrayBuffer();
            const workbook = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array' });
            
            workbook.SheetNames.forEach(sheetName => {
                const worksheet = workbook.Sheets[sheetName];
                // ヘッダー名に依存せず、完全な2次元配列(行列)としてパースする
                const matrix = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                
                matrix.forEach((row, index) => {
                    if (index === 0) return; // ヘッダー行はスキップ
                    
                    // C列(インデックス2)＝市町村の漢字、E列(インデックス4)＝読み仮名
                    const cityKanji = row[2] ? row[2].toString().trim() : "";
                    const cityKana = row[4] ? row[4].toString().trim() : "";
                    
                    // B列(インデックス1)＝都道府県の漢字、D列(インデックス3)＝都道府県のカナ
                    const prefKanji = row[1] ? row[1].toString().trim() : "";
                    const prefKana = row[3] ? row[3].toString().trim() : "";

                    if (cityKanji && cityKana) {
                        const cityHiragana = kanaToHiragana(cityKana);
                        excelNameRubyMap[cityKanji] = cityHiragana;
                        
                        // 「岩手県宮古」などの結合パターンを考慮し、都道府県＋市区町村の複合キーも登録
                        if (prefKanji) {
                            excelNameRubyMap[prefKanji + cityKanji] = kanaToHiragana(prefKana) + cityHiragana;
                        }
                    }
                    if (prefKanji && prefKana && !excelNameRubyMap[prefKanji]) {
                        excelNameRubyMap[prefKanji] = kanaToHiragana(prefKana);
                    }
                });
            });

            // 災害放送用の定型基礎用語も網羅マッピング
            const baseTerms = {
                "震度": "しんど", "震源": "しんげん", "津波": "つなみ", "警報": "けいほう", "注意報": "ちゅういほう",
                "大津波": "おおつなみ", "緊急地震速報": "きんきゅうじしんそくほう", "観測": "かんそく", "規模": "きぼ",
                "深さ": "ふかさ", "マグニチュード": "まぐにちゅーど", "心配": "しんぱい", "多少": "たしょう",
                "海面変動": "かいめんへんどう", "地域": "ちいき", "発生": "はっせい", "強い": "つよい",
                "揺れ": "ゆれ", "警戒": "けいかい", "避難": "ひなん", "高い": "たかい", "可能な限り": "かのうなかぎり",
                "確認": "かくにん", "調査中": "ちょうさちゅう", "特定中": "とくていちゅう", "市区町村": "しくちょうそん",
                "午後": "ごご", "午前": "ごぜん", "地震": "じしん"
            };
            excelNameRubyMap = { ...baseTerms, ...excelNameRubyMap };

            const indicator = document.getElementById('dict-indicator');
            if (indicator) {
                indicator.innerText = `Excel辞書同期完了 (${Object.keys(excelNameRubyMap).length}件)`;
                indicator.classList.add('loaded');
            }
            
            refreshCurrentPanes();
        } catch (error) {
            console.error("Excelマスターデータ読み込みエラー:", error);
            const indicator = document.getElementById('dict-indicator');
            if (indicator) indicator.innerText = "Excel辞書ロード失敗 (C/E列インデックス未検出)";
        }
    }

    // 漢字テキストへの高速・重複防止インジェクション
    function applyExcelRuby(text) {
        if (!text) return "";
        let result = text;
        
        // 置換の競合を防ぐため文字数の長い地名からループを展開
        const sortedKeys = Object.keys(excelNameRubyMap).sort((a, b) => b.length - a.length);
        
        sortedKeys.forEach(k => {
            if (k.length > 0 && result.includes(k)) {
                // rubyタグ内部の文字列を誤置換しないよう否定後読み・先読みで保護
                result = result.replace(new RegExp(`(?<!<rt>)${k}(?!<\/rt>)`, 'g'), `<ruby>${k}<rt>${excelNameRubyMap[k]}</rt></ruby>`);
            }
        });
        return result;
    }

    // 内部データベース定義
    let database = {
        eq: [{ content: "地震情報を同期しています..." }],
        shindo: [{ content: "震度情報を同期しています..." }],
        tsu: [{ content: "現在、津波予報は発表されていません。" }],
        yosou: [{ content: "<table class='m-table'><tr><td>津波到達予想データはありません</td></tr></table>" }],
        yobikake: [{
            content: `緊急地震速報が発表された時
▼緊急地震速報です。強い揺れに警戒してください。
▼倒れやすい家具などからは、離れてください。
▼テーブルや机の下に隠れてください。`
        }],
        eew: [{ content: "現在、緊急地震速報（警報）は発表されていません。" }],
        switch: [{ content: "<table class='m-table'><tr><td>地震履歴データを読み込み中...</td></tr></table>" }]
    };

    // UIマネジメント変数
    let isSplitMode = false;
    let currentGlobalTab = 'eq';
    
    let paneTabs = { left: 'eq', right: 'shindo' };
    let panePages = { left: 0, right: 0 };

    let eqHistoryList = [];
    let currentSelectedPacketId = null;
    let lastProcessedTopId = null; 
    let alertTimer = null;

    // 2分割画面切り替え
    window.toggleSplitMode = () => {
        isSplitMode = !isSplitMode;
        const btn = document.getElementById('split-toggle');
        const rightPane = document.getElementById('right-pane');
        const leftMiniTabs = document.getElementById('left-mini-tabs');
        const globalFooter = document.getElementById('global-footer');

        if (isSplitMode) {
            btn.innerText = "2分割：ON";
            btn.classList.add('active');
            rightPane.style.display = "flex";
            leftMiniTabs.style.display = "flex"; 
            globalFooter.style.display = "none"; 
            
            switchPaneTab('left', paneTabs.left);
            switchPaneTab('right', paneTabs.right);
        } else {
            btn.innerText = "2分割：OFF";
            btn.classList.remove('active');
            rightPane.style.display = "none";
            leftMiniTabs.style.display = "none";
            globalFooter.style.display = "flex"; 
            
            switchGlobalTab(currentGlobalTab);
        }
    };

    window.switchGlobalTab = (tabId) => {
        currentGlobalTab = tabId;
        paneTabs.left = tabId;
        panePages.left = 0;

        document.querySelectorAll('#global-footer .nav-btn').forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById(`gtab-${tabId}`);
        if (activeBtn) activeBtn.classList.add('active');
        
        const badge = document.getElementById(`badge-${tabId}`);
        if (badge) badge.style.display = 'none';

        renderPane('left');
    };

    window.switchPaneTab = (side, tabId) => {
        paneTabs[side] = tabId;
        panePages[side] = 0;

        document.querySelectorAll(`#${side}-mini-tabs button`).forEach(btn => btn.classList.remove('active'));
        const activeBtn = document.getElementById(`${side === 'left' ? 'l' : 'r'}tab-${tabId}`);
        if (activeBtn) activeBtn.classList.add('active');

        renderPane(side);
    };

    window.movePage = (side, direction) => {
        const currentTab = paneTabs[side];
        const pages = database[currentTab] || [];
        const targetIndex = panePages[side] + direction;
        if (targetIndex >= 0 && targetIndex < pages.length) {
            panePages[side] = targetIndex;
            renderPane(side);
        }
    };

    function renderPane(side) {
        const activeTab = paneTabs[side];
        const pages = database[activeTab] || [{ content: "" }];
        const pageIdx = panePages[side];
        
        document.getElementById(`${side}-title`).innerText = `${side === 'left' ? 'メイン' : 'サブ'}画面: [${getTabName(activeTab)}]`;
        document.getElementById(`manuscript-display-${side}`).innerHTML = pages[pageIdx]?.content || "";
    }

    function refreshCurrentPanes() {
        renderPane('left');
        if (isSplitMode) renderPane('right');
    }

    function getTabName(id) {
        const names = { eq: "地震", shindo: "震度", tsu: "津波", yosou: "到達予想", yobikake: "呼びかけ", eew: "EEW", switch: "地震切替" };
        return names[id] || id;
    }

    // 1分間(60秒)の新規入電アラート制御ロジック
    function triggerIncomingAlert(tabs = []) {
        const alertUi = document.getElementById('incoming-alert-ui');
        if (alertUi) alertUi.style.display = 'block';

        tabs.forEach(t => {
            const b = document.getElementById(`badge-${t}`);
            if (b && currentGlobalTab !== t) b.style.display = 'block';
        });

        if (alertTimer) clearTimeout(alertTimer);
        alertTimer = setTimeout(() => { 
            if (alertUi) alertUi.style.display = 'none'; 
        }, 60000); 
    }

    window.selectHistoryIndex = (packetId) => {
        currentSelectedPacketId = packetId;
        const banner = document.getElementById('history-warning');
        
        if (eqHistoryList.length > 0 && currentSelectedPacketId !== eqHistoryList[0]?.id) {
            if (banner) banner.style.display = 'flex';
        } else {
            if (banner) banner.style.display = 'none';
        }

        const target = eqHistoryList.find(p => p.id === packetId);
        if (target) applyPacketToManuscript(target.rawPacket);
        
        renderSwitchTable();
    };

    function renderSwitchTable() {
        let html = `<table class="m-table">`;
        eqHistoryList.forEach((item) => {
            const sel = item.id === currentSelectedPacketId ? 'class="selected"' : '';
            html += `<tr ${sel} onclick="selectHistoryIndex('${item.id}')">
                <td>${item.time}</td>
                <td>${applyExcelRuby(item.name)}</td>
                <td>${item.mag}</td>
                <td>${applyExcelRuby(item.tsunami)}</td>
            </tr>`;
        });
        html += `</table>`;
        database.switch = [{ content: html }];
        
        refreshCurrentPanes();
    }

    // --- P2PQuake 1秒同期エンジン ---
    const P2P_HTTP_URL = "https://api.p2pquake.net/v2/history?codes=551&codes=552&codes=556&limit=15";
    let processedIds = new Set();

    async function fetchP2PDataEngine() {
        try {
            const res = await fetch(P2P_HTTP_URL);
            if (!res.ok) return;
            const data = await res.json();
            if (Array.isArray(data) && data.length > 0) {
                
                let isNewPacketDetected = false;
                for (let i = data.length - 1; i >= 0; i--) {
                    const packet = data[i];
                    if (packet && packet.id && !processedIds.has(packet.id)) {
                        processedIds.add(packet.id);
                        
                        if (lastProcessedTopId !== null) {
                            isNewPacketDetected = true;
                        }
                        await processIncomingData(packet);
                    }
                }

                const latestPacket = data[0];
                if (latestPacket && latestPacket.id && lastProcessedTopId !== latestPacket.id) {
                    lastProcessedTopId = latestPacket.id;
                    if (isNewPacketDetected) {
                        triggerIncomingAlert(['eq', 'shindo']);
                    }
                }
            }
        } catch (e) { console.error("P2Pデータ取得エラー:", e); }
    }

    async function processIncomingData(packet) {
        if (packet.code === 551) {
            const eq = packet.earthquake;
            if (eq) {
                let dTime = eq.time || "";
                if (dTime.length >= 16) {
                    const day = dTime.substring(8, 10);
                    const hr = parseInt(dTime.substring(11, 13));
                    const mi = dTime.substring(14, 16);
                    const ampm = hr >= 12 ? "午後" : "午前";
                    const displayHr = hr > 12 ? hr - 12 : (hr === 0 ? 12 : hr);
                    dTime = `${day}日${ampm}${displayHr}時${mi}分`;
                }
                const name = eq.hypocenter.name || "調査中";
                const mShort = eq.hypocenter.magnitude >= 0 ? `Ｍ${eq.hypocenter.magnitude.toFixed(1)}` : "Ｍ不明";
                let tShort = "津波なし";
                if (eq.domesticTsunami === "Warning" || eq.domesticTsunami === "Watch") tShort = "津波情報";
                if (eq.domesticTsunami === "NonEffective") tShort = "海面変動";

                const item = { id: packet.id, time: dTime, name: name, mag: mShort, tsunami: tShort, rawPacket: packet };
                
                eqHistoryList.unshift(item);
                if (eqHistoryList.length > 15) eqHistoryList.pop();
                
                if (!currentSelectedPacketId || currentSelectedPacketId === eqHistoryList[1]?.id) {
                    currentSelectedPacketId = packet.id;
                    await applyPacketToManuscript(packet);
                }
            }
            renderSwitchTable();

        } else if (packet.code === 552) {
            await parse552(packet);
            triggerIncomingAlert(['tsu', 'yosou']);
        } else if (packet.code === 556) {
            await parse556(packet);
            triggerIncomingAlert(['eew']);
        }
    }

    async function applyPacketToManuscript(packet) {
        if (packet.code === 551) {
            const eq = packet.earthquake;
            let dTime = eq.time || "";
            if (dTime.length >= 16) {
                const day = dTime.substring(8, 10);
                const hr = parseInt(dTime.substring(11, 13));
                const mi = dTime.substring(14, 16);
                const ampm = hr >= 12 ? "午後" : "午前";
                const displayHr = hr > 12 ? hr - 12 : (hr === 0 ? 12 : hr);
                dTime = `${day}日${ampm}${displayHr}時${mi}分`;
            }
            const name = eq.hypocenter.name || "調査中";
            const depth = eq.hypocenter.depth >= 0 ? `約${eq.hypocenter.depth}キロ` : "調査中";
            const mag = eq.hypocenter.magnitude >= 0 ? `マグニチュード${eq.hypocenter.magnitude.toFixed(1)}` : "不明";
            const maxScale = formatScale(eq.maxScale);

            let tScript = "この地震による津波の心配はありません。";
            if (eq.domesticTsunami === "Warning" || eq.domesticTsunami === "Watch") {
                tScript = `この地震で大津波警報・津波警報が出ています。`;
            } else if (eq.domesticTsunami === "NonEffective") {
                tScript = `この地震により、多少の海面変動があるかもしれませんが、津波の心配はありません。`;
            }

            const eqRawText = `${dTime}ごろ、${name}で\n最大震度${maxScale}を観測する強い地震がありました。\n\n震源：${name}　　深さ：${depth}\n規模：${mag}\n\n${tScript}`;
            
            let parsedEq = applyExcelRuby(eqRawText);
            parsedEq = parsedEq.replace("大津波警報", '<span class="c-magenta">大津波警報</span>')
                               .replace("津波警報", '<span class="c-red">津波警報</span>');
            database.eq = [{ content: parsedEq }];

            if (packet.points && packet.points.length > 0) {
                let sMap = {};
                packet.points.forEach(p => {
                    const sStr = formatScale(p.scale);
                    if (!sMap[sStr]) sMap[sStr] = [];
                    sMap[sStr].push(p.addr);
                });

                let sManuscript = "";
                Object.keys(sMap).sort((a,b)=>b.localeCompare(a, undefined, {numeric:true})).forEach(sc => {
                    sManuscript += `<span class="c-yellow">震度${sc}</span>\n${sMap[sc].join("　")}\n\n`;
                });
                database.shindo = [{ content: applyExcelRuby(sManuscript) }];
            } else {
                database.shindo = [{ content: "震度詳細は発表されていません。" }];
            }
            
            refreshCurrentPanes();
        }
    }

    async function parse552(packet) {
        if (!packet.areas || packet.areas.length === 0) return;
        let tContent = `今すぐ避難！今すぐ避難！\n津波予報が出ました。\n今すぐ、可能な限り高いところへ逃げること！\n\n`;
        let yHtml = `<table class="m-table">`;

        packet.areas.forEach(a => {
            let col = "c-yellow", lbl = "津波注意報";
            if (a.grade === "majorWarning") { col = "c-magenta"; lbl = "大津波警報"; }
            if (a.grade === "warning") { col = "c-red"; lbl = "津波警報"; }
            tContent += `${lbl}\n▼${a.name}\n`;
            yHtml += `<tr class="selected"><td>${a.name}</td><td>第１波の到達を確認</td><td>高さ：調査中</td></tr>`;
        });
        yHtml += `</table>`;

        let parsedTsu = applyExcelRuby(tContent);
        parsedTsu = parsedTsu.replace("今すぐ避難！今すぐ避難！", '<span class="c-yellow">今すぐ避難！今すぐ避難！</span>')
                             .replace("津波予報", '<span class="c-magenta">津波予報</span>')
                             .replace("大津波警報", '<span class="c-magenta">大津波警報</span>')
                             .replace("津波警報", '<span class="c-red">津波警報</span>')
                             .replace("津波注意報", '<span class="c-yellow">津波注意報</span>');

        database.tsu = [{ content: parsedTsu }];
        database.yosou = [{ content: applyExcelRuby(yHtml) }];
        refreshCurrentPanes();
    }

    async function parse556(packet) {
        if (!packet.earthquake) return;
        const name = packet.earthquake.hypocenter.name || "震源特定中";
        const mag = packet.earthquake.hypocenter.magnitude >= 0 ? `マグニチュード${packet.earthquake.hypocenter.magnitude.toFixed(1)}` : "";
        const areas = packet.areas ? packet.areas.map(a => a.name).join("　") : "";

        const eewRawText = `緊急地震速報（警報）\n${name}で地震発生　強い揺れに警戒してください。\n推定規模：${mag}\n\n警戒地域：\n${areas}`;
        
        let parsedEew = applyExcelRuby(eewRawText);
        parsedEew = parsedEew.replace("緊急地震速報（警報）", '<span class="c-yellow">緊急地震速報（警報）</span>');
        
        database.eew = [{ content: parsedEew }];
        refreshCurrentPanes();
    }

    function formatScale(scale) {
        const dict = { 10: "1", 20: "2", 30: "3", 40: "4", 45: "5弱", 50: "5強", 55: "6弱", 60: "6強", 70: "7" };
        return dict[scale] || "不明";
    }

    // イニシャライズ
    (async () => {
        switchGlobalTab('eq');
        
        // 1. 列インデックス指定でExcelマスターをロード
        await initExcelDictionary();
        
        // 2. 定型文のルビ同期
        database.yobikake[0].content = applyExcelRuby(database.yobikake[0].content);
        
        // 3. ポーリング開始
        await fetchP2PDataEngine();
        setInterval(fetchP2PDataEngine, 1000);
    })();
</script>
