<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'UDKakugoLarge';
            src: url('../assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
        }

        :root {
            --warning-red: #DE080A;
            --text-white: #ffffff;
            --anim-speed: 0.6s;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: transparent; 
            font-family: 'UDKakugoLarge', sans-serif;
            overflow: hidden;
        }

        .title-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 0px;
            /* 視認性向上のため、全体のドロップシャドウ */
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
        }

        /* 上下のボックスの横幅を完全に一致させるためのラッパー（グループ化） */
        .title-group {
            display: inline-flex;
            flex-direction: column;
            align-items: stretch; /* これにより上下のボックスの幅が同じになります */
            
            /* 横縮小（スケール）時に左端を基準点にするための設定 */
            transform-origin: left center;
            transition: transform 0.2s ease; /* 縮小変化を滑らかにする場合 */
        }

        /* アニメーション：左からスライドイン */
        @keyframes slideIn {
            from { transform: translateX(-100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* 【上段】白ボックスの設定 */
        .subtitle-box {
            background-color: var(--text-white);
            color: var(--warning-red);
            font-size: 44px; 
            font-weight: 700;
            /* 左右のパディングを赤ボックスと揃えて、文字の開始位置を美しく一致させます */
            padding: 6px 30px; 
            /* ご指定の角丸：右上8px 右下0px 左上8px 左下0px */
            border-radius: 8px 8px 0px 0px; 
            white-space: nowrap;
            font-feature-settings: "palt";
            margin-left: 0px;
            line-height: 1.2;
            display: none;
            animation: slideIn var(--anim-speed) cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* 【下段】赤ボックスの設定 */
        .main-title-box {
            background-color: var(--warning-red);
            color: var(--text-white);
            font-size: 90px;
            font-weight: 700;
            padding: 10px 24px;
            /* ご指定の角丸：右上0px 右下8px 左上0px 左下8px */
            border-radius: 0px 0px 8px 8px; 
            white-space: nowrap;
            font-feature-settings: "palt";
            line-height: 1.1;
            margin-top: 0px; /* 上段の白ボックスと隙間なく密着させる */
            display: none;
            animation: slideIn var(--anim-speed) cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
    </style>
</head>
<body>
    <div class="title-container">
        <div class="title-group" id="titleGroup">
            <div class="subtitle-box" id="displaySubtitle"></div>
            <div class="main-title-box" id="displayMainTitle"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
            authDomain: "mgl-eqlive.firebaseapp.com",
            databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
            projectId: "mgl-eqlive",
            storageBucket: "mgl-eqlive.firebasestorage.app",
            messagingSenderId: "1060231327645",
            appId: "1:1060231327645:web:642684f4640bbc21d5c974"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let prevMain = "";
        let prevSub = "";

        // 横幅を1215px以内に収めるようにスケールを調整する関数
        const adjustScale = () => {
            const groupEl = document.getElementById('titleGroup');
            const MAX_WIDTH = 1215;

            // 一度スケールをリセットして本来のサイズを計測する
            groupEl.style.transform = "scaleX(1)";

            // 描画が確定した実際の横幅を取得
            const currentWidth = groupEl.offsetWidth;

            if (currentWidth > MAX_WIDTH) {
                // 超えている割合を計算
                const scaleFactor = MAX_WIDTH / currentWidth;
                // 横方向（scaleX）のみ縮める
                groupEl.style.transform = `scaleX(${scaleFactor})`;
            } else {
                groupEl.style.transform = "scaleX(1)";
            }
        };

        onValue(ref(db, 'broadcast/current'), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const subEl = document.getElementById('displaySubtitle');
            const mainEl = document.getElementById('displayMainTitle');

            // 更新ロジック：値が変わったときだけアニメーションをリセットして実行
            const updateUI = (el, newText, oldText) => {
                if (newText) {
                    if (newText !== oldText) {
                        el.style.display = 'none';
                        void el.offsetWidth; // 強制リフロー
                        el.innerText = newText;
                        el.style.display = 'block';
                    }
                } else {
                    el.style.display = 'none';
                }
            };

            updateUI(subEl, data.subtitle, prevSub);
            updateUI(mainEl, data.mainTitle, prevMain);

            prevSub = data.subtitle;
            prevMain = data.mainTitle;

            // テキスト更新後、要素が画面に表示されてから幅の計算を行う
            setTimeout(adjustScale, 50);
        });
    </script>
</body>
</html>
