<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'UDKakugoLarge';
            src: url('../assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
        }

        :root {
            --warning-red: #DE080A;
            --text-white: #ffffff;
            --anim-speed: 0.4s;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: transparent; 
            font-family: 'UDKakugoLarge', sans-serif;
            overflow: hidden;
        }

        .title-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 0px;
            /* 視認性向上のため、全体のドロップシャドウ */
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
        }

        /* 上下のボックスの横幅を完全に一致させるためのラッパー（グループ化） */
        .title-group {
            display: inline-flex;
            flex-direction: column;
            align-items: stretch; /* 上下のボックスの横幅を自動で長い方に合わせる */
            max-width: 1215px;    /* グループ全体の最大幅を1215pxに制限 */
            width: auto;
        }

        /* アニメーション：シンプルかつ洗練されたフェードイン */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 【上段】白ボックスの設定 */
        .subtitle-box {
            background-color: var(--text-white);
            color: var(--warning-red);
            font-size: 44px; 
            font-weight: 700;
            padding: 6px 30px; 
            /* ご指定の角丸：右上8px 右下0px 左上8px 左下0px */
            border-radius: 8px 8px 0px 0px; 
            white-space: nowrap;
            font-feature-settings: "palt";
            margin-left: 0px;
            line-height: 1.2;
            display: none;
            animation: fadeIn var(--anim-speed) ease-out forwards;
            overflow: hidden;
        }

        /* 【下段】赤ボックスの設定 */
        .main-title-box {
            background-color: var(--warning-red);
            color: var(--text-white);
            font-size: 90px;
            font-weight: 700;
            padding: 10px 24px;
            /* ご指定の角丸：右上0px 右下8px 左上0px 左下8px */
            border-radius: 0px 0px 8px 8px; 
            white-space: nowrap;
            font-feature-settings: "palt";
            line-height: 1.1;
            margin-top: 0px; /* 上段の白ボックスと隙間なく密着させる */
            display: none;
            animation: fadeIn var(--anim-speed) ease-out forwards;
            overflow: hidden;
        }

        /* 文字単体を個別に縮小するためのインナースパン */
        .text-inner {
            display: inline-block;
            transform-origin: left center;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="title-container">
        <div class="title-group" id="titleGroup">
            <div class="subtitle-box" id="displaySubtitle"><span class="text-inner"></span></div>
            <div class="main-title-box" id="displayMainTitle"><span class="text-inner"></span></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
            authDomain: "mgl-eqlive.firebaseapp.com",
            databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
            projectId: "mgl-eqlive",
            storageBucket: "mgl-eqlive.firebasestorage.app",
            messagingSenderId: "1060231327645",
            appId: "1:1060231327645:web:642684f4640bbc21d5c974"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let prevMain = "";
        let prevSub = "";

        // 各ボックス内の文字幅を個別にチェックし、1215pxの枠を超える場合のみ文字を縮小する関数
        const adjustScale = () => {
            const MAX_WIDTH = 1215;
            const subBox = document.getElementById('displaySubtitle');
            const mainBox = document.getElementById('displayMainTitle');

            const boxes = [subBox, mainBox];

            boxes.forEach(box => {
                if (box.style.display === 'none') return;

                const innerText = box.querySelector('.text-inner');
                if (!innerText) return;

                // スケールを一度リセット
                innerText.style.transform = "none";
                innerText.style.width = "auto";

                // ボックスのパディング分を差し引いた「利用可能な最大文字幅」を算出
                const computedStyle = window.getComputedStyle(box);
                const paddingLeft = parseFloat(computedStyle.paddingLeft) || 0;
                const paddingRight = parseFloat(computedStyle.paddingRight) || 0;
                const maxAvailableTextWidth = MAX_WIDTH - paddingLeft - paddingRight;

                // 現在の文字自体の本来の横幅を取得
                const currentTextWidth = innerText.getBoundingClientRect().width;

                // 文字幅が制限枠を超えている場合のみ、そのボックスの文字だけを縮小
                if (currentTextWidth > maxAvailableTextWidth) {
                    const scaleFactor = maxAvailableTextWidth / currentTextWidth;
                    innerText.style.transform = `scaleX(${scaleFactor})`;
                    // スケール縮小しても親のwidth領域を余分に占有し続けないよう、幅を明示的に固定
                    innerText.style.width = `${maxAvailableTextWidth}px`;
                } else {
                    innerText.style.transform = "none";
                    innerText.style.width = "auto";
                }
            });
        };

        onValue(ref(db, 'broadcast/current'), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const subEl = document.getElementById('displaySubtitle');
            const mainEl = document.getElementById('displayMainTitle');

            // 更新ロジック：値が変わったときだけ中身のインナースパンを書き換えてアニメーション
            const updateUI = (el, newText, oldText) => {
                const inner = el.querySelector('.text-inner');
                if (newText) {
                    if (newText !== oldText) {
                        el.style.display = 'none';
                        void el.offsetWidth; // 強制リフロー
                        if (inner) inner.innerText = newText;
                        el.style.display = 'block';
                    }
                } else {
                    el.style.display = 'none';
                    if (inner) inner.innerText = "";
                }
            };

            updateUI(subEl, data.subtitle, prevSub);
            updateUI(mainEl, data.mainTitle, prevMain);

            prevSub = data.subtitle;
            prevMain = data.mainTitle;

            // 文字のレンダリングが確定した後に個別に幅チェックを行う
            requestAnimationFrame(() => {
                setTimeout(adjustScale, 30);
            });
        });
    </script>
</body>
</html>
