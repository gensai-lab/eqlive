<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'UDKakugo';
            src: url('../assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
        }

        body, html {
            margin: 0; padding: 0; width: 600px; height: 135px;
            background-color: transparent; overflow: hidden;
            font-family: 'UDKakugo', sans-serif;
        }

        #ticker-container {
            width: 100%; height: 100%;
            display: flex; align-items: center;
            background-color: #000;
            position: relative;
        }

        #default-view, #emergency-view {
            width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
            transition: opacity 0.4s;
            opacity: 0;
        }

        .active { opacity: 1 !important; }

        /* デフォルトSVG */
        #default-view img { width: 100%; height: 100%; object-fit: cover; }

        /* 有事表示レイアウト */
        #emergency-view { display: flex; align-items: center; }

        #genre-box {
            width: 160px; height: 100%;
            display: flex; justify-content: center; align-items: center;
            font-size: 32px; font-weight: bold; color: white;
            background-color: #0078d4;
            text-align: center;
            line-height: 1.2;
            flex-shrink: 0;
        }

        #text-area {
            flex: 1; padding-left: 20px;
            display: flex; flex-direction: column; justify-content: center;
            color: white; overflow: hidden;
        }

        .line1 { font-size: 34px; font-weight: bold; margin-bottom: 2px; white-space: nowrap; }
        .line2 { font-size: 28px; font-weight: bold; color: #ccc; white-space: nowrap; }

        /* ジャンル別カラー */
        .color-railway { background-color: #00429d !important; }
        .color-tsunami { background-color: #d13438 !important; }
        .color-news { background-color: #444 !important; }
    </style>
</head>
<body>

<div id="ticker-container">
    <div id="default-view" class="active"><img src="../assets/ticker-t.svg"></div>

    <div id="emergency-view">
        <div id="genre-box" id="genre-text">ジャンル</div>
        <div id="text-area">
            <div class="line1" id="line1">本文1行目</div>
            <div class="line2" id="line2">本文2行目</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974",
        measurementId: "G-BK3MJJ0VR7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    onValue(ref(db, 'broadcast/ticker'), (snapshot) => {
        const data = snapshot.val();
        const def = document.getElementById('default-view');
        const emg = document.getElementById('emergency-view');

        if (data && data.active) {
            document.getElementById('genre-box').innerText = data.genre || "";
            document.getElementById('line1').innerText = data.line1 || "";
            document.getElementById('line2').innerText = data.line2 || "";

            const gb = document.getElementById('genre-box');
            gb.className = ""; 
            if (data.genre.includes("鉄道")) gb.classList.add('color-railway');
            else if (data.genre.includes("津波")) gb.classList.add('color-tsunami');
            else gb.classList.add('color-news');

            def.classList.remove('active');
            emg.classList.add('active');
        } else {
            def.classList.add('active');
            emg.classList.remove('active');
        }
    });
</script>
</body>
</html>
