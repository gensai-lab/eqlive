<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'UDKakugoLarge';
            src: url('../assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
            font-weight: 400;
        }

        body {
            margin: 0; padding: 0; overflow: hidden;
            background: transparent; width: 600px; height: 135px;
            font-family: 'UDKakugoLarge', sans-serif;
        }

        .main-container {
            width: 600px; height: 135px;
            background-color: white; display: flex;
            overflow: hidden; position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #waiting-banner {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: url('../assets/ticker-t.svg'); /* パス修正 */
            background-size: contain; background-repeat: no-repeat; background-position: center;
            z-index: 10; transition: opacity 0.5s ease;
        }

        .genre-label {
            background-color: #003EB3; /* デフォルト青 */
            color: white; width: 80px; height: 100%;
            display: flex; justify-content: center; align-items: center;
            font-size: 50px; line-height: 1.1; letter-spacing: 1px;
            font-weight: bold; text-align: center;
            word-break: break-all; padding: 0 5px; box-sizing: border-box;
            opacity: 0;
        }

        .content-area {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 0 15px; background-color: white;
            opacity: 0; text-align: center;
        }

        .news-line {
            width: 100%; font-size: 43px; 
            color: #1a1a1a; font-weight: bold;
            white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; line-height: 1.3;
        }

        .show-content {
            animation: fadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
    </style>
</head>
<body>

<div class="main-container">
    <div id="waiting-banner"></div>
    <div id="genre-text" class="genre-label"></div>
    <div class="content-area" id="main-content">
        <div id="text-line1" class="news-line"></div>
        <div id="text-line2" class="news-line"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const genreElement = document.getElementById('genre-text');
    const line1Element = document.getElementById('text-line1');
    const line2Element = document.getElementById('text-line2');
    const contentArea = document.getElementById('main-content');
    const waitingBanner = document.getElementById('waiting-banner');

    let lastCombinedText = "";

    // manual_news ノードを監視
    onValue(ref(db, 'broadcast/manual_news'), (snapshot) => {
        const data = snapshot.val();
        const currentCombined = (data?.genre || "") + (data?.line1 || "") + (data?.line2 || "");

        if (data && (data.line1 || data.line2)) {
            waitingBanner.style.opacity = "0";
            
            if (currentCombined !== lastCombinedText) {
                genreElement.classList.remove('show-content');
                contentArea.classList.remove('show-content');
                void genreElement.offsetWidth; // リフロー強制

                let genreRaw = data.genre || "情報";
                genreElement.innerHTML = genreRaw.length > 2 
                    ? genreRaw.substring(0, 2) + "<br>" + genreRaw.substring(2, 4)
                    : genreRaw.split('').join('<br>');

                line1Element.innerText = data.line1 || "";
                line2Element.innerText = data.line2 || "";

                genreElement.classList.add('show-content');
                contentArea.classList.add('show-content');
            }
            lastCombinedText = currentCombined;
        } else {
            waitingBanner.style.opacity = "1";
            genreElement.classList.remove('show-content');
            contentArea.classList.remove('show-content');
            lastCombinedText = "";
        }
    });

    onValue(ref(db, 'broadcast/current'), (snapshot) => {
        const data = snapshot.val();
        // 手動モード(ningen)の時は赤、それ以外は青
        genreElement.style.backgroundColor = (data && data.statusType === 'ningen') ? "#de080a" : "#003EB3";
    });
</script>
</body>
</html>
