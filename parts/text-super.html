<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Text Super</title>
<style>
@font-face{
font-family:'FOT-UDKakugo-DB';
src:url('https://gensai-lab.github.io/eqlive/assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
}
html,body{
margin:0;padding:0;width:1920px;height:1080px;background:transparent;overflow:hidden;
font-family:'FOT-UDKakugo-DB',sans-serif;
}
#text-super-container{
position:absolute;
left:380px;top:50px;width:1160px;
font-size:48px;line-height:120%;letter-spacing:.03em;
font-feature-settings:"palt";
color:#fff;
-webkit-text-stroke:0;
filter:drop-shadow(0 0 1px #000);
word-wrap:break-word;overflow-wrap:break-word;
}
#text-super-container *{color:inherit;letter-spacing:inherit;font-feature-settings:inherit;}
</style>
</head>
<body>
<div id="text-super-container"></div>
<script>
const r=15,steps=72;
let arr=[];
for(let i=0;i<steps;i++){
 const a=i*Math.PI*2/steps;
 arr.push(`${(Math.cos(a)*r).toFixed(1)}px ${(Math.sin(a)*r).toFixed(1)}px 0 #000`);
}
document.getElementById("text-super-container").style.textShadow=arr.join(",");
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",authDomain:"mgl-eqlive.firebaseapp.com",databaseURL:"https://mgl-eqlive-default-rtdb.firebaseio.com",projectId:"mgl-eqlive",storageBucket:"mgl-eqlive.firebasestorage.app",messagingSenderId:"1060231327645",appId:"1:1060231327645:web:642684f4640bbc21d5c974"};
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const c=document.getElementById('text-super-container');
onValue(ref(db,'broadcast/text_super/htmlContent'),s=>c.innerHTML=s.val()||'');
</script>
</body>
</html>
