<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Text Super</title>
<style>
/* Webフォントの設定 */
@font-face {
    font-family: 'FOT-UDKakugo-DB';
    src: url('https://gensai-lab.github.io/eqlive/assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype'),
         url('http://gensai-lab.github.io/eqlive/assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
}
body, html {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
    font-family: 'FOT-UDKakugo-DB', sans-serif;
}
/* 文字スーパー描画コンテナ */
#text-super-container {
    position: absolute;
    left: 380px;
    top: 50px;
    width: 1160px;
    height: auto;
    font-size: 48px;
    line-height: 120%; /* 行間 130% */
    letter-spacing: 0.03em; /* 文字間 3% */
    font-feature-settings: "palt"; /* 文字詰め機能（プロポーショナルメトリクス）適用 */
    color: #FFFFFF;
    /* 文字枠線の設定（丸縁取り） */
    -webkit-text-stroke: 15px #000000;
    stroke-linejoin: round; /* 枠線の結合部を丸く加工 */
    paint-order: stroke fill; /* 枠線を文字の背後に回して文字が潰れるのを防ぐ */
    word-wrap: break-word;
    overflow-wrap: break-word;
    box-sizing: border-box;
    /* 連続する空白や改行コードをそのまま表示し、必要に応じて折り返す */
    white-space: pre-wrap; 
}

/* HTML要素が含まれた場合も装飾を継承 */
#text-super-container * {
    /* colorはfontタグ等の色指定を上書きしてしまうため指定しない（親要素から自然に継承させる） */
    -webkit-text-stroke: inherit;
    stroke-linejoin: inherit;
    paint-order: inherit;
    letter-spacing: inherit;
    font-feature-settings: inherit;
}
</style>
</head>
<body>
<div id="text-super-container"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const container = document.getElementById('text-super-container');

    // Firebaseから /broadcast/text_super_sequence をリアルタイム取得
    // （cardsとgenreを同じスナップショットから取得するため、親ノードごと監視する）
    const textSuperSequenceRef = ref(db, 'broadcast/text_super_sequence');

    // タイムアウトを管理するための変数
    let sequenceTimeout = null;

    // ジャンルごとの前置画像（速報カットイン）パス
    const GENRE_IMAGE_MAP = {
        sokuho: 'assets/image/l1.png',   // 速報
        quake: 'assets/image/l2.png',    // 地震
        tsunami: 'assets/image/l3.png',  // 津波
        Weather: 'assets/image/l4.png',  // 気象
        funka: 'assets/image/l5.png'     // 噴火
    };

    const IMAGE_DISPLAY_MS = 6000;  // 前置画像の表示時間（6秒）
    const TEXT_DISPLAY_MS = 10000;  // 各カードの表示時間（10秒）

    // 前置画像を表示し、表示し終わったらコールバックを実行する関数
    function showGenreImage(imageSrc, callback) {
        container.innerHTML = `<img src="${imageSrc}" alt="" style="display:block; max-width:100%; height:auto;">`;
        sequenceTimeout = setTimeout(() => {
            callback();
        }, IMAGE_DISPLAY_MS);
    }

    // カードを順番に表示する関数
    function playSequence(texts, index) {
        if (index < texts.length) {
            // 現在のインデックスのテキストを表示
            container.innerHTML = texts[index];
            
            // 10秒（10000ミリ秒）後に次のテキストを表示
            sequenceTimeout = setTimeout(() => {
                playSequence(texts, index + 1);
            }, TEXT_DISPLAY_MS);
        } else {
            // 最後のカードを表示し終わったら（10秒経過後）、コンテナを空にする
            container.innerHTML = '';
            sequenceTimeout = null;
        }
    }

    onValue(textSuperSequenceRef, (snapshot) => {
        // 新しいデータが来た場合や更新された場合、実行中のタイマーをリセットする
        if (sequenceTimeout) {
            clearTimeout(sequenceTimeout);
            sequenceTimeout = null;
        }

        const data = snapshot.val();
        const cards = data ? data.cards : null;
        const genre = data ? data.genre : null;

        if (cards) {
            const validTexts = [];
            
            // Firebaseからのデータが配列、またはオブジェクト（数字キー）のどちらで返ってきても対応できるように処理
            const keys = Object.keys(cards);
            
            // X=数字 のキー順（0, 1, 2...）になるようにソート
            keys.sort((a, b) => Number(a) - Number(b));
            
            keys.forEach(key => {
                if (cards[key] && cards[key].text) {
                    validTexts.push(cards[key].text);
                }
            });

            if (validTexts.length > 0) {
                // genreに対応する前置画像が設定されていれば、先に6秒表示してから文字カードを再生
                const imageSrc = GENRE_IMAGE_MAP[genre];
                if (imageSrc) {
                    showGenreImage(imageSrc, () => playSequence(validTexts, 0));
                } else {
                    // 該当ジャンルがない場合は従来通り文字カードのみ再生
                    playSequence(validTexts, 0);
                }
            } else {
                container.innerHTML = '';
            }
        } else {
            container.innerHTML = '';
        }
    });
</script>
</body>
</html>
