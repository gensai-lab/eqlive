<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Text Super</title>

<style>
@font-face {
    font-family: 'FOT-UDKakugo-DB';
    src: url('https://gensai-lab.github.io/eqlive/assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
}

html,
body{
    margin:0;
    padding:0;
    width:1920px;
    height:1080px;
    background:transparent;
    overflow:hidden;
    font-family:'FOT-UDKakugo-DB',sans-serif;
}

#text-super-container{

    position:absolute;

    left:380px;
    top:50px;

    width:1160px;

    font-size:48px;
    line-height:120%;
    letter-spacing:.03em;
    font-feature-settings:"palt";

    color:#FFF;

    word-break:break-word;
    overflow-wrap:break-word;

    -webkit-text-stroke:0;

    filter:drop-shadow(0 0 0.6px #000);

    opacity:0;
    transition:opacity .25s ease;
}

#text-super-container *{
    color:inherit;
    letter-spacing:inherit;
    font-feature-settings:inherit;
}
</style>

</head>

<body>

<div id="text-super-container"></div>

<script>

//-------------------------------
// 丸い縁取り生成（約10px）
//-------------------------------

const radius = 10;
const directions = 72;

const shadows = [];

for(let i=0;i<directions;i++){

    const angle = i * Math.PI * 2 / directions;

    shadows.push(
        `${(Math.cos(angle)*radius).toFixed(1)}px ${(Math.sin(angle)*radius).toFixed(1)}px 0 #000`
    );

}

document.getElementById("text-super-container").style.textShadow =
shadows.join(",");

</script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {

    apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
    authDomain: "mgl-eqlive.firebaseapp.com",
    databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
    projectId: "mgl-eqlive",
    storageBucket: "mgl-eqlive.firebasestorage.app",
    messagingSenderId: "1060231327645",
    appId: "1:1060231327645:web:642684f4640bbc21d5c974"

};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const container = document.getElementById("text-super-container");

let hideTimer = null;
let lastId = "";

//----------------------------------------
// text_super_sequence を監視
//----------------------------------------

const sequenceRef = ref(db,"broadcast/text_super_sequence");

onValue(sequenceRef,(snapshot)=>{

    const data = snapshot.val();

    if(!data){

        container.innerHTML="";
        container.style.opacity=0;
        return;

    }

    const currentIndex = String(data.currentIndex ?? 0);

    if(!data.cards || !data.cards[currentIndex]){

        container.innerHTML="";
        container.style.opacity=0;
        return;

    }

    const card = data.cards[currentIndex];

    // 同じカードなら何もしない
    if(card.id === lastId){
        return;
    }

    lastId = card.id;

    container.innerHTML = card.text || "";

    container.style.opacity = 1;

    if(hideTimer){
        clearTimeout(hideTimer);
    }

    hideTimer = setTimeout(()=>{

        container.style.opacity = 0;

    },10000);

});

</script>

</body>
</html>
