<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Text Super</title>
<style>
/* Webフォントの設定 */
@font-face {
    font-family: 'FOT-UDKakugo-DB';
    src: url('https://gensai-lab.github.io/eqlive/assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype'),
         url('http://gensai-lab.github.io/eqlive/assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
    font-weight: normal;
    font-style: normal;
}
body, html {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    background: transparent;
    overflow: hidden;
    font-family: 'FOT-UDKakugo-DB', sans-serif;
}
/* 文字スーパー描画コンテナ */
#text-super-container {
    position: absolute;
    left: 380px;
    top: 50px;
    width: 1160px;
    height: auto;
    font-size: 48px;
    line-height: 120%; /* 行間 130% */
    letter-spacing: 0.03em; /* 文字間 3% */
    font-feature-settings: "palt"; /* 文字詰め機能（プロポーショナルメトリクス）適用 */
    color: #FFFFFF;
    /* 文字枠線の設定（丸縁取り） */
    -webkit-text-stroke: 15px #000000;
    stroke-linejoin: round; /* 枠線の結合部を丸く加工 */
    paint-order: stroke fill; /* 枠線を文字の背後に回して文字が潰れるのを防ぐ */
    word-wrap: break-word;
    overflow-wrap: break-word;
    box-sizing: border-box;
    /* 連続する空白や改行コードをそのまま表示し、必要に応じて折り返す */
    white-space: pre-wrap; 
}

/* HTML要素が含まれた場合も装飾を継承 */
#text-super-container * {
    /* colorはfontタグ等の色指定を上書きしてしまうため指定しない（親要素から自然に継承させる） */
    -webkit-text-stroke: inherit;
    stroke-linejoin: inherit;
    paint-order: inherit;
    letter-spacing: inherit;
    font-feature-settings: inherit;
}

/* ジャンル別ロゴ画像（速報・地震・津波・気象・噴火）表示コンテナ */
#image-super-container {
    position: absolute;
    left: 50%;
    top: 46px;
    height: 68px;
    width: auto;
    transform: translateX(-50%);
    display: none;
}
#image-super-container img {
    height: 68px;
    width: auto;
    display: block;
}
</style>
</head>
<body>
<div id="image-super-container"><img id="genre-image" src="" alt=""></div>
<div id="text-super-container"></div>
<audio id="genre-audio" preload="auto"></audio>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const container = document.getElementById('text-super-container');
    const imageContainer = document.getElementById('image-super-container');
    const imageEl = document.getElementById('genre-image');
    const audioEl = document.getElementById('genre-audio');

    // ジャンルごとのロゴ画像パス（フォントと同じドメインの絶対URLで指定）
    // ※実際の画像設置場所が異なる場合はここのURLを変更してください
    const genreImageMap = {
        sokuho: 'https://gensai-lab.github.io/eqlive/assets/image/l1.png',   // 速報
        quake: 'https://gensai-lab.github.io/eqlive/assets/image/l2.png',    // 地震
        tsunami: 'https://gensai-lab.github.io/eqlive/assets/image/l3.png',  // 津波
        weather: 'https://gensai-lab.github.io/eqlive/assets/image/l4.png',  // 気象
        funka: 'https://gensai-lab.github.io/eqlive/assets/image/l5.png'     // 噴火
    };

    // ジャンルごとの効果音パス（速報・噴火はl1、地震はl2、津波はl3、気象はl4を共用）
    const genreAudioMap = {
        sokuho: 'https://gensai-lab.github.io/eqlive/assets/audio/l1.mp3',   // 速報
        funka: 'https://gensai-lab.github.io/eqlive/assets/audio/l1.mp3',    // 噴火
        quake: 'https://gensai-lab.github.io/eqlive/assets/audio/l2.mp3',    // 地震
        tsunami: 'https://gensai-lab.github.io/eqlive/assets/audio/l3.mp3',  // 津波
        weather: 'https://gensai-lab.github.io/eqlive/assets/audio/l4.mp3'   // 気象
    };

    // 効果音の再生失敗を検知してコンソールに出す（動作確認用）
    audioEl.onerror = () => {
        console.error('[text-super] 効果音の読み込みに失敗しました:', audioEl.src);
    };

    // 震度の強さ比較用（admin.html側と揃えたランク表）
    const EQ_INT_ORDER = ["1", "2", "3", "4", "5-", "!5-", "5+", "6-", "6+", "7"];
    function eqIntRank(v) {
        return EQ_INT_ORDER.indexOf(v);
    }

    // 地震の速報音（震度3以上のみ）を鳴らすかどうかのON/OFF設定。admin画面と共有（既定はON）
    let eqSoundEnabled = true;
    onValue(ref(db, 'settings/eqSoundEnabled'), (snapshot) => {
        const val = snapshot.val();
        eqSoundEnabled = (val === null || val === undefined) ? true : !!val;
    });

    // 画像の読み込み失敗を検知してコンソールに出す（動作確認用）
    imageEl.onerror = () => {
        console.error('[text-super] ジャンル画像の読み込みに失敗しました:', imageEl.src);
    };
    imageEl.onload = () => {
        console.log('[text-super] ジャンル画像を表示しました:', imageEl.src);
    };

    // Firebaseから /broadcast/text_super_sequence をリアルタイム取得（cards・genreの両方を利用）
    const textSuperSequenceRef = ref(db, 'broadcast/text_super_sequence');

    // タイムアウトを管理するための変数
    let sequenceTimeout = null;
    let imageTimeout = null;

    function clearAllTimers() {
        if (sequenceTimeout) {
            clearTimeout(sequenceTimeout);
            sequenceTimeout = null;
        }
        if (imageTimeout) {
            clearTimeout(imageTimeout);
            imageTimeout = null;
        }
    }

    // カードを順番に表示する関数
    function playSequence(texts, index) {
        if (index < texts.length) {
            // 現在のインデックスのテキストを表示
            container.innerHTML = texts[index];

            // 10秒（10000ミリ秒）後に次のテキストを表示
            sequenceTimeout = setTimeout(() => {
                playSequence(texts, index + 1);
            }, 10000);
        } else {
            // 最後のカードを表示し終わったら（10秒経過後）、コンテナを空にする
            container.innerHTML = '';
            sequenceTimeout = null;
        }
    }

    // ジャンル画像を6秒表示してから文字スーパーのシーケンスを開始する関数
    function showImageThenPlaySequence(imgSrc, texts) {
        imageEl.src = imgSrc;
        imageContainer.style.display = 'block';
        container.innerHTML = ''; // 画像表示中は文字を隠す

        imageTimeout = setTimeout(() => {
            imageContainer.style.display = 'none';
            imageEl.src = '';
            playSequence(texts, 0);
        }, 6000);
    }

    onValue(textSuperSequenceRef, (snapshot) => {
        // 新しいデータが来た場合や更新された場合、実行中のタイマーをリセットする
        clearAllTimers();
        imageContainer.style.display = 'none';

        const data = snapshot.val();
        if (!data) {
            container.innerHTML = '';
            return;
        }

        const cards = data.cards;
        const genre = data.genre;
        const maxIntensity = data.maxIntensity;

        const validTexts = [];
        if (cards) {
            // Firebaseからのデータが配列、またはオブジェクト（数字キー）のどちらで返ってきても対応できるように処理
            const keys = Object.keys(cards);

            // X=数字 のキー順（0, 1, 2...）になるようにソート
            keys.sort((a, b) => Number(a) - Number(b));

            keys.forEach(key => {
                if (cards[key] && cards[key].text) {
                    validTexts.push(cards[key].text);
                }
            });
        }

        if (validTexts.length === 0) {
            container.innerHTML = '';
            return;
        }

        // genreの値（大文字小文字を問わない）に対応する画像があれば先に表示
        const genreKey = genre ? String(genre).toLowerCase() : '';
        const imgSrc = genreImageMap[genreKey];
        console.log('[text-super] 受信genre:', genre, '→ 判定キー:', genreKey, '→ 画像URL:', imgSrc || '(なし)');

        // 送出時に、ジャンルに応じた効果音を1回再生する。
        // ただし地震(quake)ジャンルは「震度3以上」かつ「速報音ON設定」の場合のみ鳴らす
        const sndSrc = genreAudioMap[genreKey];
        let shouldPlaySound = !!sndSrc;
        if (sndSrc && genreKey === 'quake') {
            shouldPlaySound = eqSoundEnabled && eqIntRank(maxIntensity) >= eqIntRank('3');
            console.log('[text-super] 地震速報音の判定: eqSoundEnabled=', eqSoundEnabled, ' maxIntensity=', maxIntensity, ' → 再生=', shouldPlaySound);
        }
        if (shouldPlaySound) {
            audioEl.src = sndSrc;
            audioEl.currentTime = 0;
            audioEl.play().catch(err => console.warn('[text-super] 効果音の再生に失敗しました（自動再生ブロックの可能性）:', err));
        }

        if (imgSrc) {
            showImageThenPlaySequence(imgSrc, validTexts);
        } else {
            // 該当ジャンルの画像がない場合はそのまま文字スーパーを再生
            playSequence(validTexts, 0);
        }
    });
</script>
</body>
</html>
