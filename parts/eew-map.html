<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
        #map-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* 地図SVGのラッパー */
        #map-svg-wrapper { width: 100%; height: 100%; }
        #map-svg-wrapper svg { width: 100%; height: 100%; }

        /* 地図の基本色 */
        path, polygon, polyline {
            fill: #BFBFBF; /* 地図の背景色 */
            stroke: #7F7F7F; /* 地図の枠線 */
            stroke-width: 0.5;
        }

        /* 強い揺れが予想される地域（黄色） */
        .eew-active-area {
            fill: #FFF300 !important;
            transition: fill 0.3s ease;
        }
        
        /* 震源地アイコン */
        #shingen-icon {
            position: absolute;
            width: 50px; 
            height: 50px;
            transform: translate(-50%, -50%);
            z-index: 100;
            display: none;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body>

<div id="map-container">
    <div id="map-svg-wrapper">
        </div>
    <img id="shingen-icon" src="../assets/svg/shingen.svg" alt="震源地">
</div>

<script>
    const CONFIG = {
        API_URL: "https://api.p2pquake.net/v2/history?codes=556&limit=1",
        SVG_PATH: "../assets/svg/eew-mapdate.svg",
        // お手持ちの地図の投影範囲に合わせて調整してください
        MAP_BOUNDS: { latMin: 24, latMax: 46, lonMin: 122, lonMax: 149 }
    };

    let lastEventId = "";

    async function init() {
        try {
            const res = await fetch(CONFIG.SVG_PATH);
            const svgText = await res.text();
            document.getElementById('map-svg-wrapper').innerHTML = svgText;
            
            // 初回実行と定期監視
            checkEEW();
            setInterval(checkEEW, 3000); // 3秒間隔でチェック
        } catch (e) {
            console.error("Map Load Error:", e);
        }
    }

    async function checkEEW() {
        try {
            const res = await fetch(CONFIG.API_URL);
            const data = await res.json();
            if (!data || data.length === 0) return;

            const eew = data[0];
            // EventIdが変わった場合のみ更新
            if (eew.issue.eventId === lastEventId) return;
            lastEventId = eew.issue.eventId;

            updateDisplay(eew);
        } catch (e) {
            console.error("API Fetch Error:", e);
        }
    }

    function updateDisplay(eew) {
        // 1. リセット
        document.querySelectorAll('.eew-active-area').forEach(el => el.classList.remove('eew-active-area'));
        const shingen = document.getElementById('shingen-icon');
        shingen.style.display = "none";

        // 2. 強い揺れが予想される地域（pref）を色付け
        if (eew.areas) {
            eew.areas.forEach(area => {
                // SVG内のID（"奈良", "和歌山"など）と一致する要素を探す
                const target = document.getElementById(area.pref);
                if (target) {
                    target.classList.add('eew-active-area');
                }
            });
        }

        // 3. 震源地のプロット (latitude / longitude)
        if (eew.earthquake && eew.earthquake.hypocenter) {
            const { latitude, longitude } = eew.earthquake.hypocenter;
            if (latitude && longitude) {
                const pos = latLonToPercent(latitude, longitude);
                shingen.style.left = `${pos.x}%`;
                shingen.style.top = `${pos.y}%`;
                shingen.style.display = "block";
            }
        }
    }

    /**
     * 緯度経度を画面上の%座標に変換
     * ※地図SVGの投影法が「正距円筒図法」に近い場合。
     * ズレる場合は、MAP_BOUNDSの値を微調整してください。
     */
    function latLonToPercent(lat, lon) {
        const x = ((lon - CONFIG.MAP_BOUNDS.lonMin) / (CONFIG.MAP_BOUNDS.lonMax - CONFIG.MAP_BOUNDS.lonMin)) * 100;
        const y = (1 - (lat - CONFIG.MAP_BOUNDS.latMin) / (CONFIG.MAP_BOUNDS.latMax - CONFIG.MAP_BOUNDS.latMin)) * 100;
        return { x, y };
    }

    window.onload = init;
</script>
</body>
</html>
