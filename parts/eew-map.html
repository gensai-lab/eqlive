<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: transparent; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #map-container { 
            position: relative;
            /* 画面全体ではなく、少し余裕を持たせたサイズにします */
            width: 90vw; 
            height: 90vh;
            border: 1px solid rgba(255,255,255,0.1); /* デバッグ用：枠が見えるように */
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .pref-path { 
            fill: #BFBFBF; 
            stroke: #7F7F7F; 
            stroke-width: 0.5px; 
        }

        .eew-active-area {
            fill: #FFF300 !important;
        }

        #shingen-icon {
            position: absolute;
            width: 50px;
            height: 50px;
            transform: translate(-50%, -50%);
            z-index: 100;
            display: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="map-container">
    <svg id="map-svg"></svg>
    <img id="shingen-icon" src="https://gensai-lab.github.io/eqlive/assets/svg/shingen.svg" alt="震源地">
</div>

<script type="module">
    const BASE_URL = "https://gensai-lab.github.io/eqlive/";
    const GEOJSON_URL = BASE_URL + "assets/json/eew-mapdate-geo.json";
    const API_URL = "https://api.p2pquake.net/v2/history?codes=556&limit=1";

    let projection;
    let mapSvg = d3.select("#map-svg");
    let lastEventId = "";

    async function init() {
        try {
            const geoData = await d3.json(GEOJSON_URL);
            
            const container = document.getElementById("map-container");
            const width = container.clientWidth;
            const height = container.clientHeight;

            // 1. まず標準的な日本中心の投影法を作成
            projection = d3.geoMercator()
                .center([137.5, 38.0])
                .translate([width / 2, height / 2]);

            // 2. 地図データに基づいて、コンテナにぴったり収まるスケールを自動計算
            // これにより「大きすぎて画面外」という問題を防ぎます
            projection.fitSize([width, height], geoData);

            const pathGenerator = d3.geoPath().projection(projection);

            // 3. 地図描画
            mapSvg.selectAll("path")
                .data(geoData.features)
                .enter()
                .append("path")
                .attr("d", pathGenerator)
                .attr("class", "pref-path")
                .attr("id", d => d.properties.name || d.properties.pref || d.properties.nam_ja);

            fetchEEW();
            setInterval(fetchEEW, 3000);

        } catch (e) {
            console.error("Initialization Error:", e);
        }
    }

    async function fetchEEW() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            if (data && data.length > 0) {
                if (data[0].id !== lastEventId) {
                    lastEventId = data[0].id;
                    updateMapDisplay(data[0]);
                }
            }
        } catch (e) { console.error(e); }
    }

    function updateMapDisplay(eew) {
        mapSvg.selectAll(".eew-active-area").classed("eew-active-area", false);
        const shingen = document.getElementById("shingen-icon");
        shingen.style.display = "none";

        if (eew.areas) {
            eew.areas.forEach(area => {
                mapSvg.selectAll("path")
                    .filter(function(d) {
                        const id = d3.select(this).attr("id") || "";
                        return id.includes(area.pref);
                    })
                    .classed("eew-active-area", true);
            });
        }

        if (eew.earthquake?.hypocenter) {
            const { latitude, longitude } = eew.earthquake.hypocenter;
            if (latitude && longitude && latitude !== -1) {
                const [x, y] = projection([longitude, latitude]);
                // コンテナの相対位置に合わせて調整
                shingen.style.left = `${x}px`;
                shingen.style.top = `${y}px`;
                shingen.style.display = "block";
            }
        }
    }

    window.onload = init;
</script>
</body>
</html>
