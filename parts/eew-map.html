<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>EEW Map - Leaflet</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0;
            background: transparent; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
        }

        #map { 
            width: 100%; 
            height: 100%; 
            background: transparent; /* 地図の背景を透明に */
        }

        /* GeoJSONのポリゴンの基本スタイル */
        .leaflet-interactive {
            fill-opacity: 1; /* 透明度をなくしてしっかり色を塗る */
        }

        /* 震源地アイコンのスタイル */
        .shingen-icon-style {
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    const BASE_URL = "https://gensai-lab.github.io/eqlive/";
    const GEOJSON_URL = BASE_URL + "assets/json/eew-mapdate-geo.json";
    const API_URL = "https://api.p2pquake.net/v2/history?codes=556&limit=1";
    const SHINGEN_SVG = BASE_URL + "assets/svg/shingen.svg";

    let map;
    let geoJsonLayer;
    let shingenMarker;
    let lastEventId = "";

    async function init() {
        // 1. 地図の初期化
        // ズームコントロールなどは不要なので非表示。背景も透明にする。
        map = L.map('map', {
            zoomControl: false,
            attributionControl: false,
            dragging: false,
            scrollWheelZoom: false,
            doubleClickZoom: false,
            boxZoom: false
        }).setView([38.0, 137.5], 5); // 日本全体が見える位置

        try {
            // 2. GeoJSONデータの読み込み
            const response = await fetch(GEOJSON_URL);
            const geoData = await response.json();

            // 3. 地図にGeoJSONを表示
            geoJsonLayer = L.geoJSON(geoData, {
                style: {
                    color: "#7F7F7F",   // 枠線の色
                    weight: 0.5,        // 枠線の太さ
                    fillColor: "#BFBFBF", // 地図の基本色
                    fillOpacity: 1
                },
                onEachFeature: (feature, layer) => {
                    // IDをレイヤーに紐付け（P2Pのprefとの照合用）
                    const props = feature.properties;
                    layer._prefName = props.name || props.nam_ja || props.pref || "";
                }
            }).addTo(map);

            // 4. 地図をGeoJSONの範囲にぴったり合わせる（これで巨大化を防ぎます）
            map.fitBounds(geoJsonLayer.getBounds(), { padding: [10, 10] });

            // 5. データ監視開始
            fetchEEW();
            setInterval(fetchEEW, 3000);

        } catch (e) {
            console.error("Map Init Error:", e);
        }
    }

    async function fetchEEW() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            if (!data || data.length === 0) return;

            const eew = data[0];
            if (eew.id === lastEventId) return;
            lastEventId = eew.id;

            updateMap(eew);
        } catch (e) {
            console.error("Fetch Error:", e);
        }
    }

    function updateMap(eew) {
        // 全地域の色をリセット
        geoJsonLayer.setStyle({ fillColor: "#BFBFBF" });
        
        // 前の震源地を消去
        if (shingenMarker) {
            map.removeLayer(shingenMarker);
        }

        if (eew.cancelled) return;

        // 1. 警告地域（黄色）の塗りつぶし
        if (eew.areas) {
            const activePrefs = eew.areas.map(a => a.pref); // ["奈良", "和歌山"...]
            
            geoJsonLayer.eachLayer(layer => {
                const geoName = layer._prefName;
                const isMatch = activePrefs.some(p => geoName.includes(p));
                
                if (isMatch) {
                    layer.setStyle({ fillColor: "#FFF300" });
                }
            });
        }

        // 2. 震源地のプロット
        if (eew.earthquake && eew.earthquake.hypocenter) {
            const { latitude, longitude } = eew.earthquake.hypocenter;
            if (latitude && longitude && latitude !== -1) {
                const shingenIcon = L.icon({
                    iconUrl: SHINGEN_SVG,
                    iconSize: [60, 60],
                    iconAnchor: [30, 30], // 中心合わせ
                    className: 'shingen-icon-style'
                });

                shingenMarker = L.marker([latitude, longitude], { icon: shingenIcon }).addTo(map);
            }
        }
    }

    window.onload = init;
</script>
</body>
</html>
