<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>EEW Map - Leaflet</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; background: transparent; width: 100vw; height: 100vh; overflow: hidden; }
        #map { width: 100%; height: 100%; background: transparent; }
        .leaflet-interactive { fill-opacity: 1; }
        .shingen-icon-style { pointer-events: none; }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    const BASE_URL = "https://gensai-lab.github.io/eqlive/";
    const GEOJSON_URL = BASE_URL + "assets/json/eew-mapdate-geo.json";
    const SHINGEN_SVG = BASE_URL + "assets/svg/shingen.svg";

    let map;
    let geoJsonLayer;
    let shingenMarker;

    async function init() {
        map = L.map('map', {
            zoomControl: false, attributionControl: false, dragging: false,
            scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false
        }).setView([38.0, 137.5], 5);

        try {
            const response = await fetch(GEOJSON_URL);
            const geoData = await response.json();

            geoJsonLayer = L.geoJSON(geoData, {
                style: { color: "#7F7F7F", weight: 0.5, fillColor: "#BFBFBF", fillOpacity: 1 },
                onEachFeature: (feature, layer) => {
                    layer._prefName = feature.properties.name || feature.properties.nam_ja || feature.properties.pref || "";
                }
            }).addTo(map);

            // 親からデータが来るのを待つ準備
            window.addEventListener('message', (event) => {
                if (event.data.type === 'UPDATE_EEW') {
                    updateMap(event.data.eew);
                }
            });

            // 親に準備完了を通知
            window.parent.postMessage({ type: 'MAP_READY' }, '*');

        } catch (e) { console.error("Map Init Error:", e); }
    }

    function updateMap(eew) {
        // iFrameのサイズ変更を再認識させる（重要）
        map.invalidateSize();

        geoJsonLayer.setStyle({ fillColor: "#BFBFBF" });
        if (shingenMarker) map.removeLayer(shingenMarker);

        let bounds = L.latLngBounds();
        if (eew.areas) {
            const activePrefs = eew.areas.map(a => a.pref);
            geoJsonLayer.eachLayer(layer => {
                if (activePrefs.some(p => layer._prefName.includes(p))) {
                    layer.setStyle({ fillColor: "#FFF300" });
                    bounds.extend(layer.getBounds());
                }
            });
        }

        if (eew.earthquake && eew.earthquake.hypocenter) {
            const { latitude, longitude } = eew.earthquake.hypocenter;
            if (latitude && longitude && latitude !== -1) {
                shingenMarker = L.marker([latitude, longitude], {
                    icon: L.icon({ iconUrl: SHINGEN_SVG, iconSize: [80, 80], iconAnchor: [40, 40], className: 'shingen-icon-style' })
                }).addTo(map);
                bounds.extend([latitude, longitude]);
            }
        }

        if (bounds.isValid()) {
            map.fitBounds(bounds, { padding: [20, 20], maxZoom: 8 });
        } else {
            map.fitBounds(geoJsonLayer.getBounds());
        }
    }
    window.onload = init;
</script>
</body>
</html>
