<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { margin: 0; background: transparent; width: 100vw; height: 100vh; overflow: hidden; }
        #map-container { width: 100%; height: 100%; position: relative; }
        svg { width: 100%; height: 100%; display: block; }
        .pref-path { fill: #BFBFBF; stroke: #7F7F7F; stroke-width: 0.5px; }
        .eew-active-area { fill: #FFF300 !important; }
        #shingen-icon {
            position: absolute; width: 50px; height: 50px;
            transform: translate(-50%, -50%); z-index: 100;
            display: none; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="map-container">
    <svg id="map-svg"></svg>
    <img id="shingen-icon" src="https://gensai-lab.github.io/eqlive/assets/svg/shingen.svg" alt="震源地">
</div>

<script type="module">
    const GEOJSON_URL = "https://gensai-lab.github.io/eqlive/assets/json/eew-mapdate-geo.json";
    const API_URL = "https://api.p2pquake.net/v2/history?codes=556&limit=1";

    let projection;
    let mapSvg = d3.select("#map-svg");

    async function init() {
        try {
            const geoData = await d3.json(GEOJSON_URL);
            
            const width = window.innerWidth;
            const height = window.innerHeight;

            // 【改善】地図が画面に収まるように自動計算
            projection = d3.geoMercator().fitSize([width, height], geoData);
            const pathGenerator = d3.geoPath().projection(projection);

            mapSvg.selectAll("path")
                .data(geoData.features)
                .enter()
                .append("path")
                .attr("d", pathGenerator)
                .attr("class", "pref-path")
                .attr("id", d => d.properties.name || d.properties.pref || d.properties.nam_ja);

            console.log("Map initialized successfully");
            
            fetchEEW();
            setInterval(fetchEEW, 3000);
        } catch (e) {
            console.error("Error loading map:", e);
            // 画面にエラーを表示（デバッグ用）
            document.body.innerHTML += `<div style="color:red; position:absolute; top:0;">Error: ${e.message}</div>`;
        }
    }

    async function fetchEEW() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            if (data && data.length > 0) updateDisplay(data[0]);
        } catch (e) { console.error("API error:", e); }
    }

    function updateDisplay(eew) {
        mapSvg.selectAll(".eew-active-area").classed("eew-active-area", false);
        const shingen = document.getElementById("shingen-icon");
        
        if (eew.areas) {
            eew.areas.forEach(area => {
                mapSvg.selectAll("path")
                    .filter(function(d) {
                        const id = d3.select(this).attr("id") || "";
                        return id === area.pref || id.includes(area.pref);
                    })
                    .classed("eew-active-area", true);
            });
        }

        if (eew.earthquake?.hypocenter) {
            const { latitude, longitude } = eew.earthquake.hypocenter;
            if (latitude && longitude && latitude !== -1) {
                const [x, y] = projection([longitude, latitude]);
                shingen.style.left = `${x}px`;
                shingen.style.top = `${y}px`;
                shingen.style.display = "block";
            }
        }
    }

    window.onload = init;
</script>
</body>
</html>
