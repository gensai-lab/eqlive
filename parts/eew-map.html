<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: transparent; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #map-container { 
            position: relative;
            width: 100%; 
            height: 100%;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        /* 地図の基本スタイル */
        .pref-path { 
            fill: #BFBFBF; 
            stroke: #7F7F7F; 
            stroke-width: 0.2px; 
        }

        /* 強い揺れが予想される地域（黄色） */
        .eew-active-area {
            fill: #FFF300 !important;
        }

        /* 震源地アイコン（shingen.svg） */
        #shingen-icon {
            position: absolute;
            width: 60px;
            height: 60px;
            transform: translate(-50%, -50%);
            z-index: 100;
            display: none;
            pointer-events: none;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body>

<div id="map-container">
    <svg id="map-svg"></svg>
    <img id="shingen-icon" src="https://gensai-lab.github.io/eqlive/assets/svg/shingen.svg" alt="震源地">
</div>

<script type="module">
    const BASE_URL = "https://gensai-lab.github.io/eqlive/";
    const GEOJSON_URL = BASE_URL + "assets/json/eew-mapdate-geo.json";
    const API_URL = "https://api.p2pquake.net/v2/history?codes=556&limit=1";

    let projection;
    let mapSvg = d3.select("#map-svg");
    let lastEventId = "";

    async function init() {
        try {
            // 1. GeoJSON読み込み
            const geoData = await d3.json(GEOJSON_URL);
            
            const width = window.innerWidth;
            const height = window.innerHeight;

            // 2. 投影法の設定（GeoJSONを画面いっぱいにフィットさせる）
            projection = d3.geoMercator()
                .fitExtent([[20, 20], [width - 20, height - 20]], geoData);

            const pathGenerator = d3.geoPath().projection(projection);

            // 3. 地図の描画
            mapSvg.selectAll("path")
                .data(geoData.features)
                .enter()
                .append("path")
                .attr("d", pathGenerator)
                .attr("class", "pref-path")
                .attr("id", d => {
                    // IDとして都道府県名を取得（mapshaperの書き出し設定に依存）
                    return d.properties.name || d.properties.pref || d.properties.nam_ja;
                });

            console.log("EEW Map Initialized.");

            // 4. 定期監視（3秒ごと）
            fetchEEW();
            setInterval(fetchEEW, 3000);

        } catch (e) {
            console.error("Initialization Error:", e);
        }
    }

    async function fetchEEW() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            if (!data || data.length === 0) return;

            const eew = data[0];
            // 更新があった場合のみ処理
            if (eew.id === lastEventId) return;
            lastEventId = eew.id;

            updateMapDisplay(eew);
        } catch (e) {
            console.error("API Error:", e);
        }
    }

    function updateMapDisplay(eew) {
        // リセット
        mapSvg.selectAll(".eew-active-area").classed("eew-active-area", false);
        const shingen = document.getElementById("shingen-icon");
        shingen.style.display = "none";

        // 発表キャンセル時は何もしない
        if (eew.cancelled) return;

        // 1. 警告地域（pref）の塗りつぶし
        if (eew.areas) {
            eew.areas.forEach(area => {
                const prefName = area.pref; // 例: "奈良"
                
                mapSvg.selectAll("path")
                    .filter(function(d) {
                        const geoId = d3.select(this).attr("id") || "";
                        // GeoJSON側のIDが "奈良" または "奈良県" の場合にマッチ
                        return geoId === prefName || geoId.includes(prefName);
                    })
                    .classed("eew-active-area", true);
            });
        }

        // 2. 震源地のプロット
        if (eew.earthquake && eew.earthquake.hypocenter) {
            const { latitude, longitude } = eew.earthquake.hypocenter;
            if (latitude && longitude && latitude !== -1) {
                // 緯度経度からピクセル座標を算出
                const [x, y] = projection([longitude, latitude]);
                
                shingen.style.left = `${x}px`;
                shingen.style.top = `${y}px`;
                shingen.style.display = "block";
            }
        }
    }

    // リサイズ対応
    window.addEventListener('resize', () => {
        location.reload();
    });

    window.onload = init;
</script>
</body>
</html>
