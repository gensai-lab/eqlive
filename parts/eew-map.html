<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: transparent; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #map-container { 
            position: relative;
            width: 100vw; 
            height: 100vh;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 地図の基本スタイル */
        .pref-path { 
            fill: #BFBFBF; 
            stroke: #7F7F7F; 
            stroke-width: 0.2px; 
        }

        /* 強い揺れが予想される地域（黄色） */
        .eew-active-area {
            fill: #FFF300 !important;
            transition: fill 0.3s ease;
        }

        /* 震源地アイコン（絶対パスで指定） */
        #shingen-icon {
            position: absolute;
            width: 60px;
            height: 60px;
            transform: translate(-50%, -50%);
            z-index: 100;
            display: none;
            pointer-events: none;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body>

<div id="map-container">
    <svg id="map-svg"></svg>
    <img id="shingen-icon" src="https://gensai-lab.github.io/eqlive/assets/svg/shingen.svg" alt="震源地">
</div>

<script type="module">
    const BASE_URL = "https://gensai-lab.github.io/eqlive/";
    const GEOJSON_URL = BASE_URL + "assets/json/eew-mapdate-geo.json";
    const API_URL = "https://api.p2pquake.net/v2/history?codes=556&limit=1";

    let projection;
    let mapSvg = d3.select("#map-svg");
    let lastId = "";

    async function init() {
        try {
            // 1. GeoJSONデータを取得
            const geoData = await d3.json(GEOJSON_URL);
            
            // 2. 描画領域のサイズ取得
            const width = window.innerWidth;
            const height = window.innerHeight;

            // 3. 投影法の設定
            // メルカトル図法を使用し、GeoJSONの範囲に合わせて画面いっぱいにフィット
            projection = d3.geoMercator()
                .fitExtent([[20, 20], [width - 20, height - 20]], geoData);

            const pathGenerator = d3.geoPath().projection(projection);

            // 4. 地図を描画
            mapSvg.selectAll("path")
                .data(geoData.features)
                .enter()
                .append("path")
                .attr("d", pathGenerator)
                .attr("class", "pref-path")
                .attr("id", d => {
                    // mapshaperで出力した際のプロパティ名に合わせる
                    // 通常は pref, name, nam_ja 等のいずれか
                    return d.properties.name || d.properties.pref || d.properties.nam_ja || d.properties.NAME_1;
                });

            console.log("GeoJSON map initialized.");

            // 5. 緊急地震速報の監視
            fetchEEW();
            setInterval(fetchEEW, 3000);

        } catch (e) {
            console.error("Initialization Error:", e);
        }
    }

    async function fetchEEW() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            if (!data || data.length === 0) return;

            const eew = data[0];
            // 更新があった場合のみ描画を更新
            if (eew.id === lastId) return;
            lastId = eew.id;

            updateDisplay(eew);
        } catch (e) {
            console.error("API Fetch Error:", e);
        }
    }

    function updateDisplay(eew) {
        // 色付けをリセット
        mapSvg.selectAll(".eew-active-area").classed("eew-active-area", false);
        const shingen = document.getElementById("shingen-icon");
        shingen.style.display = "none";

        // 1. 警告地域の塗りつぶし (pref キーを使用)
        if (eew.areas) {
            eew.areas.forEach(area => {
                const prefName = area.pref;
                mapSvg.selectAll("path")
                    .filter(function(d) {
                        const id = d3.select(this).attr("id") || "";
                        // JSONの "奈良" が GeoJSONの "奈良県" などに含まれるか判定
                        return id === prefName || id.includes(prefName);
                    })
                    .classed("eew-active-area", true);
            });
        }

        // 2. 震源地の配置 (latitude/longitude を変換)
        if (eew.earthquake && eew.earthquake.hypocenter) {
            const { latitude, longitude } = eew.earthquake.hypocenter;
            if (latitude && longitude && latitude !== -1) {
                // GeoJSONと同じ投影ルールで座標を算出
                const [x, y] = projection([longitude, latitude]);
                
                shingen.style.left = `${x}px`;
                shingen.style.top = `${y}px`;
                shingen.style.display = "block";
            }
        }
    }

    // リサイズ時に再描画
    window.addEventListener('resize', () => {
        location.reload();
    });

    window.onload = init;
</script>
</body>
</html>
