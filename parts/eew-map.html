<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: transparent; 
            width: 100vw; 
            height: 100vh; 
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #map-container { 
            position: relative;
            /* 画面に対して少し余裕を持たせる */
            width: 95vw; 
            height: 95vh;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 地図の基本色（指定通り） */
        .pref-path { 
            fill: #BFBFBF; 
            stroke: #7F7F7F; 
            stroke-width: 0.3px; 
        }

        /* 強い揺れが予想される地域（指定通り：黄色） */
        .eew-active-area {
            fill: #FFF300 !important;
            transition: fill 0.3s ease;
        }

        /* 震源地アイコン（shingen.svg） */
        #shingen-icon {
            position: absolute;
            width: 60px;
            height: 60px;
            transform: translate(-50%, -50%);
            z-index: 100;
            display: none;
            pointer-events: none;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body>

<div id="map-container">
    <svg id="map-svg"></svg>
    <img id="shingen-icon" src="https://gensai-lab.github.io/eqlive/assets/svg/shingen.svg" alt="震源地">
</div>

<script type="module">
    const BASE_URL = "https://gensai-lab.github.io/eqlive/";
    const GEOJSON_URL = BASE_URL + "assets/json/eew-mapdate-geo.json";
    const API_URL = "https://api.p2pquake.net/v2/history?codes=556&limit=1";

    let projection;
    let mapSvg = d3.select("#map-svg");
    let lastEventId = "";

    async function init() {
        try {
            const geoData = await d3.json(GEOJSON_URL);
            
            const width = window.innerWidth;
            const height = window.innerHeight;

            // 投影法の設定: 日本全体をバランスよく配置
            // fitSizeでデータ全体を収めつつ、中心を微調整します
            projection = d3.geoMercator()
                .fitSize([width, height], geoData);

            const pathGenerator = d3.geoPath().projection(projection);

            // 地図の描画
            mapSvg.selectAll("path")
                .data(geoData.features)
                .enter()
                .append("path")
                .attr("d", pathGenerator)
                .attr("class", "pref-path")
                .attr("id", d => {
                    // GeoJSONのpropertiesから名前を抽出
                    // あなたのデータに合わせて、存在するプロパティを優先順位で取得
                    return d.properties.name || d.properties.nam_ja || d.properties.pref || "";
                });

            console.log("EEW Map Loaded Successfully.");

            fetchEEW();
            setInterval(fetchEEW, 3000);

        } catch (e) {
            console.error("Map Init Error:", e);
        }
    }

    async function fetchEEW() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            if (!data || data.length === 0) return;

            const eew = data[0];
            if (eew.id === lastEventId) return;
            lastEventId = eew.id;

            updateMap(eew);
        } catch (e) {
            console.error("Fetch Error:", e);
        }
    }

    function updateMap(eew) {
        // 全地域のリセット
        mapSvg.selectAll(".eew-active-area").classed("eew-active-area", false);
        const shingen = document.getElementById("shingen-icon");
        shingen.style.display = "none";

        if (eew.cancelled) return;

        // 1. 警告地域の色塗り
        if (eew.areas) {
            eew.areas.forEach(area => {
                const prefName = area.pref; // 例: "奈良"
                
                mapSvg.selectAll("path")
                    .filter(function(d) {
                        const targetId = d3.select(this).attr("id") || "";
                        // P2Pの "奈良" が GeoJSONの "奈良県" に含まれるかを判定
                        return targetId.includes(prefName);
                    })
                    .classed("eew-active-area", true);
            });
        }

        // 2. 震源地の表示
        if (eew.earthquake && eew.earthquake.hypocenter) {
            const { latitude, longitude } = eew.earthquake.hypocenter;
            if (latitude && longitude && latitude !== -1) {
                const [x, y] = projection([longitude, latitude]);
                
                // SVGコンテナ内の座標に配置
                shingen.style.left = `${x}px`;
                shingen.style.top = `${y}px`;
                shingen.style.display = "block";
            }
        }
    }

    window.onload = init;
</script>
</body>
</html>
