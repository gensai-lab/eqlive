<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>EEW Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #002060; width: 100vw; height: 100vh; overflow: hidden; }
        #map { width: 100%; height: 100%; background: #002060; }
        .leaflet-interactive { fill-opacity: 1; }
        .shingen-icon-style { pointer-events: none; }
        .leaflet-container { background: #002060 !important; }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    const BASE_URL = "https://gensai-lab.github.io/eqlive/";
    const GEOJSON_URL = BASE_URL + "assets/json/eew-mapdate-geo.json";
    const SHINGEN_SVG = BASE_URL + "assets/svg/shingen.svg";

    let map;
    let geoJsonLayer;
    let shingenMarker;
    let pendingEew = null; // geoJsonLayerの読み込み完了前にupdateMapFromParentが呼ばれた場合に保持しておく

    async function init() {
        map = L.map('map', {
            zoomControl: false, attributionControl: false, dragging: false,
            scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false,
            fadeAnimation: false
        }).setView([36.0, 137.5], 5);

        try {
            const response = await fetch(GEOJSON_URL);
            const geoData = await response.json();
            geoJsonLayer = L.geoJSON(geoData, {
                style: { color: "#7F7F7F", weight: 2.5, fillColor: "#BFBFBF", fillOpacity: 1 },
                onEachFeature: (feature, layer) => {
                    layer._prefName = feature.properties.name || feature.properties.nam_ja || feature.properties.pref || "";
                }
            }).addTo(map);

            // GeoJSONの読み込み完了前に更新要求が来ていた場合は、ここで反映する
            if (pendingEew) {
                const eew = pendingEew;
                pendingEew = null;
                updateMap(eew);
            }
        } catch (e) { console.error(e); }
    }

    window.updateMapFromParent = function(eew) {
        if (!map || !geoJsonLayer) {
            // まだ準備ができていない場合は保留しておき、init完了後に反映する
            pendingEew = eew;
            return;
        }
        // 親側のvisibility切り替え直後は、iframe内部のレイアウト確定が
        // 1〜2フレーム遅れることがあるため、念のためここでもrAFを挟む
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                updateMap(eew);
            });
        });
    };

    function updateMap(eew) {
        map.invalidateSize();
        geoJsonLayer.setStyle({ fillColor: "#BFBFBF" });
        if (shingenMarker) map.removeLayer(shingenMarker);

        let bounds = L.latLngBounds();
        if (eew.areas) {
            const activePrefs = eew.areas.map(a => a.pref);
            geoJsonLayer.eachLayer(layer => {
                if (activePrefs.some(p => layer._prefName.includes(p))) {
                    layer.setStyle({ fillColor: "#FFF300" });
                    bounds.extend(layer.getBounds());
                }
            });
        }

        if (eew.earthquake && eew.earthquake.hypocenter) {
            const { latitude, longitude } = eew.earthquake.hypocenter;
            if (latitude && longitude && latitude !== -1) {
                shingenMarker = L.marker([latitude, longitude], {
                    icon: L.icon({ iconUrl: SHINGEN_SVG, iconSize: [60, 60], iconAnchor: [30, 30], className: 'shingen-icon-style' })
                }).addTo(map);
                bounds.extend([latitude, longitude]);
            }
        }

        if (bounds.isValid()) {
            // paddingを [10, 10] に減らして、さらに拡大されるように調整
            map.fitBounds(bounds, { padding: [10, 10], maxZoom: 13, animate: false });
        }
    }

    window.onload = init;
</script>
</body>
</html>
