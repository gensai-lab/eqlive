<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 600px;
            height: 145px;
            overflow: hidden;
            background: transparent;
        }

        #yobikake-container {
            position: relative;
            width: 100%;
            height: 100%;
            opacity: 0; /* 初期状態は非表示 */
            transition: opacity 0.5s ease-in-out;
        }

        .yobikake-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 1.5s ease-in-out; /* クロスフェードの速度 */
        }

        .yobikake-image.active {
            opacity: 1;
        }
    </style>
</head>
<body>

<div id="yobikake-container">
    </div>

<script type="module">
    const container = document.getElementById('yobikake-container');
    let currentImages = [];
    let currentIndex = 0;
    let switchInterval = null;
    let lastGrade = "";

    // 画像のベースパス
    const BASE_URL = "https://gensai-lab.github.io/eqlive/assets/banner/yobikake/";

    // グレードごとの画像定義
    const IMAGE_SETS = {
        "MajorWarning": ["tsunami-yk_o1.svg", "tsunami-yk_o2.svg", "tsunami-yk_o3.svg", "tsunami-yk_o4.svg", "tsunami-yk_o5.svg"],
        "Warning": ["tsunami-yk_k1.svg", "tsunami-yk_k2.svg", "tsunami-yk_k3.svg", "tsunami-yk_k4.svg", "tsunami-yk_k5.svg"],
        "Watch": ["tsunami-yk_c1.svg", "tsunami-yk_c2.svg", "tsunami-yk_c3.svg"]
    };

    function updateImages(grade) {
        if (grade === lastGrade) return; // グレードが変わってなければ何もしない
        lastGrade = grade;

        // リセット
        container.innerHTML = '';
        clearInterval(switchInterval);
        
        currentImages = IMAGE_SETS[grade] || [];
        if (currentImages.length === 0) return;

        // 画像要素を作成
        currentImages.forEach((imgSrc, index) => {
            const img = document.createElement('img');
            img.src = BASE_URL + imgSrc;
            img.className = 'yobikake-image' + (index === 0 ? ' active' : '');
            container.appendChild(img);
        });

        // 10秒ごとにスライド
        currentIndex = 0;
        switchInterval = setInterval(slideNext, 10000);
    }

    function slideNext() {
        const imgs = container.getElementsByClassName('yobikake-image');
        if (imgs.length <= 1) return;

        imgs[currentIndex].classList.remove('active');
        currentIndex = (currentIndex + 1) % imgs.length;
        imgs[currentIndex].classList.add('active');
    }

    async function fetchTsunamiStatus() {
        try {
            const response = await fetch("https://api.p2pquake.net/v2/history?codes=552&limit=1");
            const data = await response.json();

            if (data && data.length > 0) {
                const latest = data[0];

                if (latest.cancelled === false && latest.areas && latest.areas.length > 0) {
                    // 最も高いグレードを特定
                    const grades = latest.areas.map(a => a.grade);
                    let topGrade = "Watch";
                    if (grades.includes("MajorWarning")) topGrade = "MajorWarning";
                    else if (grades.includes("Warning")) topGrade = "Warning";

                    updateImages(topGrade);
                    container.style.opacity = "1";
                } else {
                    container.style.opacity = "0";
                    lastGrade = ""; // リセット
                }
            }
        } catch (e) {
            console.error("Yobikake fetch error:", e);
        }
    }

    // 初回実行とループ
    fetchTsunamiStatus();
    setInterval(fetchTsunamiStatus, 10000);
</script>

</body>
</html>
