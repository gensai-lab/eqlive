<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'UDKakugo';
            src: url('../assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: transparent;
            overflow: hidden;
            font-family: 'UDKakugo', sans-serif;
            /* プロポーショナルメトリクスを有効にして文字詰めを適用 */
            font-feature-settings: "palt";
        }

        .container {
            display: flex;
            align-items: center;
            gap: 15px; /* 時計とバッジの間隔 */
            padding: 10px;
        }

        #clock-box {
            background-color: #003EB3;
            color: #FFFFFF;
            border: 5px solid #FFFFFF; /* 白枠 */
            border-radius: 16px;       /* 16pxのラウンド */
            padding: 5px 25px;
            font-size: 54px;
            font-weight: bold;
            line-height: 1.2;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .distributor-badge {
            height: 70px; /* 時計の高さに合わせて調整 */
            display: flex;
            align-items: center;
        }

        .distributor-badge img {
            height: 100%;
            width: auto;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="clock-box">
        <span id="clock-text">00：00</span>
    </div>

    <div class="distributor-badge">
        <img id="dist-img" src="../assets/banner/distributor/bot.png" alt="distributor">
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 時計の更新（秒なし・全角コロン）
    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        // 全角コロンを使用して表示
        document.getElementById('clock-text').textContent = `${hours}：${minutes}`;
    }
    
    setInterval(updateClock, 1000);
    updateClock();

    // Firebaseから配信主体を監視して画像を切り替え
    const distImg = document.getElementById('dist-img');
    onValue(ref(db, 'broadcast/current/distributor'), (snapshot) => {
        const val = snapshot.val() || 'bot';
        // assets/banner/distributor/bot.png または ningen.png
        distImg.src = `../assets/banner/distributor/${val}.png`;
    });
</script>
</body>
</html>
