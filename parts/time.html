<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'UDKakugo';
            src: url('../assets/fonts/FOT-UDKakugo_LargePr6-B.otf') format('opentype');
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: transparent;
            overflow: hidden;
            font-family: 'UDKakugo', sans-serif;
            font-feature-settings: "palt";
        }

        .container {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 36px;
            /* 全体的に中央寄りの薄い影を付与 */
            filter: drop-shadow(0 0 8px rgba(0, 0, 0, 0.4));
        }

        /* 文字を重ねるためのコンテナ */
        .clock-wrapper {
            position: relative;
            display: inline-block;
            line-height: 1;
        }

        .clock-base {
            font-size: 72px;
            font-weight: bold;
            white-space: nowrap;
        }

        /* 背面の文字（白い縁取り用） */
        .clock-border {
            color: #FFFFFF;
            -webkit-text-stroke: 13px #FFFFFF;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 前面の文字（青色） */
        .clock-main {
            color: #003EB3;
            position: relative;
            z-index: 2;
        }

        /* 配信主体バッジ */
        .distributor-badge {
            height: 56px; /* 少し小さめに調整 */
            display: flex;
            align-items: center;
            z-index: 3;
        }

        .distributor-badge img {
            height: 100%;
            width: auto;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="clock-wrapper">
        <div id="clock-border" class="clock-base clock-border">00：00</div>
        <div id="clock-main" class="clock-base clock-main">00：00</div>
    </div>

    <div class="distributor-badge">
        <img id="dist-img" src="../assets/banner/distributor/bot.png" alt="distributor">
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    function updateClock() {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const timeStr = `${hours}：${minutes}`;
        
        // 前後両方のテキストを更新
        document.getElementById('clock-border').textContent = timeStr;
        document.getElementById('clock-main').textContent = timeStr;
    }
    
    setInterval(updateClock, 1000);
    updateClock();

    const distImg = document.getElementById('dist-img');
    onValue(ref(db, 'broadcast/current/distributor'), (snapshot) => {
        const val = snapshot.val() || 'bot';
        distImg.src = `../assets/banner/distributor/${val}.png`;
    });
</script>
</body>
</html>
