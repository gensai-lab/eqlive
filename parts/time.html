<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'UDKakugo';
            src: url('../assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
        }
        body, html {
            margin: 0; padding: 0;
            width: 400px; height: 100px;
            background-color: transparent;
            overflow: hidden;
            font-family: 'UDKakugo', sans-serif;
            color: white;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 10px;
        }
        #clock {
            font-size: 48px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 2px;
        }
        .distributor-badge {
            width: 240px;
            height: auto;
        }
        img {
            width: 100%;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="clock">00:00:00</div>
    <div class="distributor-badge">
        <img id="dist-img" src="../assets/banner/distributor/bot.png" alt="distributor">
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 時計の更新
    function updateClock() {
        const now = new Date();
        document.getElementById('clock').textContent = now.toLocaleTimeString('ja-JP', {
            hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 管理画面からの切り替えを監視
    const distImg = document.getElementById('dist-img');
    onValue(ref(db, 'broadcast/current/distributor'), (snapshot) => {
        const val = snapshot.val() || 'bot';
        distImg.src = `../assets/banner/distributor/${val}.png`;
    });
</script>
</body>
</html>
