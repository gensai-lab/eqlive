<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'UDKakugo';
            src: url('../assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
        }
        body, html {
            margin: 0; padding: 0; width: 600px; height: 310px;
            background-color: rgba(0,0,0,0.9); overflow: hidden;
            font-family: 'UDKakugo', sans-serif; color: white;
        }
        .container {
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            border: 1px solid #444; box-sizing: border-box;
        }
        .header {
            background-color: #d13438;
            height: 50px; display: flex; align-items: center; padding: 0 15px;
            font-size: 24px; font-weight: bold; justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .page-indicator { font-size: 16px; background: rgba(0,0,0,0.4); padding: 2px 10px; border-radius: 20px; }
        
        .list-area { flex: 1; display: flex; flex-direction: column; }
        .row {
            height: 52px; display: flex; align-items: center;
            border-bottom: 1px solid #333; padding: 0 15px;
            font-size: 22px; font-weight: bold;
            animation: slideIn 0.5s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
        
        .row:nth-child(even) { background: rgba(255,255,255,0.03); }
        .grade {
            width: 140px; height: 36px; display: flex; align-items: center; justify-content: center;
            border-radius: 4px; margin-right: 20px; font-size: 18px; flex-shrink: 0;
        }
        .grade-major { background-color: #ff00ff; color: white; } /* 大津波 */
        .grade-warning { background-color: #ff0000; color: white; } /* 津波警報 */
        .grade-advise { background-color: #ffff00; color: black; } /* 津波注意報 */

        /* マニュアル操作ボタン */
        #manual-ctrl {
            position: absolute; bottom: 10px; right: 10px;
            display: none; gap: 8px; z-index: 100;
        }
        .ctrl-btn {
            background: #222; border: 1px solid #555; color: white;
            padding: 8px 12px; cursor: pointer; border-radius: 6px; font-size: 14px;
        }
        .ctrl-btn:active { background: #444; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span>津波情報（沿岸）</span>
        <div class="page-indicator" id="page-num">1 / 1</div>
    </div>
    <div class="list-area" id="list-container">
        <!-- JSで挿入 -->
    </div>
</div>

<div id="manual-ctrl">
    <button class="ctrl-btn" onclick="prevPage()">前へ</button>
    <button class="ctrl-btn" onclick="nextPage()">次へ</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 設計用テストデータ (P2P地震情報 code:552 を想定)
    const testData = [
        { name: "岩手県", grade: "major" },
        { name: "宮城県", grade: "major" },
        { name: "福島県", grade: "warning" },
        { name: "青森県太平洋沿岸", grade: "warning" },
        { name: "茨城県", grade: "advise" },
        { name: "千葉県九十九里・外房", grade: "advise" },
        { name: "北海道太平洋沿岸東部", grade: "advise" },
        { name: "伊豆諸島", grade: "advise" },
        { name: "相模湾・三浦半島", grade: "advise" }
    ];

    let currentPage = 0;
    let autoPage = true;
    let tsunamiData = testData;
    const rowsPerPage = 5;

    function render() {
        const container = document.getElementById('list-container');
        const pageIndicator = document.getElementById('page-num');
        container.innerHTML = "";

        const totalPages = Math.ceil(tsunamiData.length / rowsPerPage) || 1;
        if (currentPage >= totalPages) currentPage = 0;

        const start = currentPage * rowsPerPage;
        const pageItems = tsunamiData.slice(start, start + rowsPerPage);

        pageItems.forEach(item => {
            const row = document.createElement('div');
            row.className = 'row';
            
            let label = ""; let css = "";
            switch(item.grade) {
                case 'major': label = "大津波警報"; css = "grade-major"; break;
                case 'warning': label = "津波警報"; css = "grade-warning"; break;
                case 'advise': label = "津波注意報"; css = "grade-advise"; break;
            }

            row.innerHTML = `<div class="grade ${css}">${label}</div><div class="name">${item.name}</div>`;
            container.appendChild(row);
        });

        pageIndicator.innerText = `${currentPage + 1} / ${totalPages}`;
    }

    // 10秒ごとの自動切替
    setInterval(() => {
        if (autoPage) {
            const total = Math.ceil(tsunamiData.length / rowsPerPage);
            if (total > 1) {
                currentPage = (currentPage + 1) % total;
                render();
            }
        }
    }, 10000);

    window.nextPage = () => { 
        currentPage = (currentPage + 1) % Math.ceil(tsunamiData.length / rowsPerPage); 
        render(); 
    };
    window.prevPage = () => { 
        const total = Math.ceil(tsunamiData.length / rowsPerPage);
        currentPage = (currentPage - 1 + total) % total; 
        render(); 
    };

    // Adminからの制御
    onValue(ref(db, 'broadcast/tsunami_config'), (snapshot) => {
        const config = snapshot.val();
        autoPage = config?.autoPage !== false;
        document.getElementById('manual-ctrl').style.display = autoPage ? 'none' : 'flex';
    });

    render();
</script>
</body>
</html>
