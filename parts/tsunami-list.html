<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'UDKakugo';
            src: url('../assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
        }
        body, html {
            margin: 0; padding: 0; width: 600px;
            background-color: transparent; overflow: hidden;
            font-family: 'UDKakugo', sans-serif;
            color: #1E1E1E;
        }
        .container { width: 600px; display: flex; flex-direction: column; }
        .header-img, .row-img {
            width: 600px; height: 53px;
            background-size: 100% 100%; background-repeat: no-repeat;
            display: flex; align-items: center; box-sizing: border-box;
        }
        .row-content {
            width: 100%; display: flex; align-items: center; font-weight: bold;
        }
        .area-wrapper {
            width: 280px; padding-left: 14px;
            overflow: visible; display: flex; align-items: center; box-sizing: border-box;
        }
        
        /* font-feature-settingsを追加 */
        .area-name { 
            font-size: 32px; 
            white-space: nowrap; 
            transform-origin: left center; 
            font-feature-settings: "palt"; 
        }

        .time-wrapper {
            width: 170px; margin-left: auto; margin-right: 117px;
            overflow: visible; display: flex; justify-content: center;
        }

        /* font-feature-settingsを追加 */
        .time { 
            font-size: 32px; 
            white-space: nowrap; 
            transform-origin: center center; 
            font-feature-settings: "palt";
        }

        .day-unit { font-size: 0.8em; margin: 0 1px; }
    </style>
</head>
<body>

<div class="container">
    <div id="header-area" class="header-img"></div>
    <div class="list-area" id="list-container"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const CONDITION_DICT = {
        "第１波の到達を確認": "第1波到達",
        "津波到達中と推測": "津波到達中",
        "ただちに到達と推測": "すぐ来る"
    };

    const HEIGHT_IMAGE_MAP = {
        "１ｍ": "assets/banner/tsunami/tsunami-list_1m.svg",
        "３ｍ": "assets/banner/tsunami/tsunami-list_3m.svg",
        "５ｍ": "assets/banner/tsunami/tsunami-list_5m.svg",
        "１０ｍ": "assets/banner/tsunami/tsunami-list_10m.svg",
        "１０ｍ超": "assets/banner/tsunami/tsunami-list_10mu.svg",
        "巨大": "assets/banner/tsunami/tsunami-list_kyodai.svg",
        "高い": "assets/banner/tsunami/tsunami-list_takai.svg",
        "none": "assets/banner/tsunami/tsunami-list_none.svg"
    };

    function adjustScale(el, maxWidth) {
        el.style.transform = "scaleX(1)";
        const width = el.offsetWidth;
        if (width > maxWidth) el.style.transform = `scaleX(${maxWidth / width})`;
    }

    function formatConditionHTML(cond) {
        if (!cond) return "";
        let text = CONDITION_DICT[cond] || cond;
        const date = new Date(text);
        if (!isNaN(date.getTime()) && text.includes(':')) {
            return `${date.getDate()}<span class="day-unit">日</span> ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
        }
        return text.replace("日", '<span class="day-unit">日</span>');
    }

    let allTsunamiData = [
        { name: "静岡県", maxHeight: { description: "１０ｍ超", value: 10 }, firstHeight: { condition: "津波到達中と推測" } },
        { name: "愛知県外海", maxHeight: { description: "１０ｍ超", value: 10 }, firstHeight: { condition: "第１波の到達を確認" } },
        { name: "伊勢・三河湾", maxHeight: { description: "１０ｍ", value: 10 }, firstHeight: { condition: "津波到達中と推測" } },
        { name: "三重県南部", maxHeight: { description: "１０ｍ超", value: 10 }, firstHeight: { condition: "ただちに到達と推測" } },
        { name: "和歌山県", maxHeight: { description: "５ｍ", value: 5 }, firstHeight: { condition: "ただちに到達と推測" } },
        { name: "伊豆諸島", maxHeight: { description: "５ｍ", value: 5 }, firstHeight: { condition: "2027/05/22 10:30:00" } },
        { name: "相模湾・三浦半島", maxHeight: { description: "３ｍ", value: 3 }, firstHeight: { condition: "2027/05/22 10:40:00" } },
        { name: "東京湾内湾", maxHeight: { description: "３ｍ", value: 3 }, firstHeight: { condition: "2027/05/22 10:40:00" } },
        { name: "徳島県", maxHeight: { description: "３ｍ", value: 3 }, firstHeight: { condition: "2027/05/22 10:50:00" } },
        { name: "高知県", maxHeight: { description: "３ｍ", value: 3 }, firstHeight: { condition: "2027/05/22 10:50:00" } },
        { name: "淡路島南部", maxHeight: { description: "１ｍ", value: 1 }, firstHeight: { condition: "2027/05/22 11:00:00" } },
        { name: "大阪府", maxHeight: { description: "１ｍ", value: 1 }, firstHeight: { condition: "2027/05/22 11:10:00" } }
    ];

    let currentGroupIndex = 0; 
    let currentPageInGroup = 0;
    const rowsPerPage = 5;
    let autoPage = true;
    let lastTriggerTime = 0;

    function getGroups() {
        return [
            { id: 'ot', data: allTsunamiData.filter(d => d.maxHeight.value >= 5 || d.maxHeight.description === "巨大") },
            { id: 'kt', data: allTsunamiData.filter(d => (d.maxHeight.value === 3 || d.maxHeight.description === "高い") && d.maxHeight.description !== "巨大") },
            { id: 'ct', data: allTsunamiData.filter(d => d.maxHeight.value === 1 || d.maxHeight.description === "none") }
        ].filter(g => g.data.length > 0);
    }

    function render() {
        const groups = getGroups();
        if (groups.length === 0) return;

        if (currentGroupIndex >= groups.length) currentGroupIndex = 0;
        const currentGroup = groups[currentGroupIndex];
        const totalPages = Math.ceil(currentGroup.data.length / rowsPerPage);

        if (currentPageInGroup >= totalPages) currentPageInGroup = 0;

        const container = document.getElementById('list-container');
        const header = document.getElementById('header-area');
        container.innerHTML = "";

        header.style.backgroundImage = `url('../assets/banner/tsunami/tsunami-list_${currentGroup.id}.svg')`;

        const pageItems = currentGroup.data.slice(currentPageInGroup * rowsPerPage, (currentPageInGroup + 1) * rowsPerPage);

        pageItems.forEach(item => {
            const row = document.createElement('div');
            row.className = 'row-img';
            row.style.backgroundImage = `url('../${HEIGHT_IMAGE_MAP[item.maxHeight.description] || HEIGHT_IMAGE_MAP["none"]}')`;
            row.innerHTML = `
                <div class="row-content">
                    <div class="area-wrapper"><div class="area-name">${item.name}</div></div>
                    <div class="time-wrapper"><div class="time">${formatConditionHTML(item.firstHeight.condition)}</div></div>
                </div>`;
            container.appendChild(row);
            adjustScale(row.querySelector('.area-name'), 266);
            adjustScale(row.querySelector('.time'), 170);
        });
    }

    function nextPage() {
        const groups = getGroups();
        if (groups.length === 0) return;
        const currentGroup = groups[currentGroupIndex];
        const totalPages = Math.ceil(currentGroup.data.length / rowsPerPage);

        if (currentPageInGroup + 1 < totalPages) {
            currentPageInGroup++;
        } else {
            currentPageInGroup = 0;
            currentGroupIndex = (currentGroupIndex + 1) % groups.length;
        }
        render();
    }

    function prevPage() {
        const groups = getGroups();
        if (groups.length === 0) return;
        if (currentPageInGroup > 0) {
            currentPageInGroup--;
        } else {
            currentGroupIndex = (currentGroupIndex - 1 + groups.length) % groups.length;
            const prevGroup = groups[currentGroupIndex];
            currentPageInGroup = Math.ceil(prevGroup.data.length / rowsPerPage) - 1;
        }
        render();
    }

    onValue(ref(db, 'broadcast/tsunami_config'), (snapshot) => {
        const config = snapshot.val();
        if (!config) return;
        autoPage = config.autoPage !== false;
        if (config.manualTrigger && config.manualTrigger.timestamp !== lastTriggerTime) {
            if (config.manualTrigger.direction === 'next') nextPage();
            else prevPage();
            lastTriggerTime = config.manualTrigger.timestamp;
        }
        render();
    });

    setInterval(() => {
        if (autoPage) nextPage();
    }, 10000);

    render();
</script>
</body>
</html>
