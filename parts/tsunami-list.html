<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'UDKakugo';
            src: url('../assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
        }
        body, html {
            margin: 0; padding: 0; width: 600px; height: 310px;
            background-color: transparent; overflow: hidden;
            font-family: 'UDKakugo', sans-serif; color: white;
        }
        .container {
            width: 600px; height: 310px;
            display: flex; flex-direction: column;
            position: relative;
        }
        
        /* タイトル行 */
        .header-img {
            width: 600px; height: 60px;
            background-size: 100% 100%;
            display: flex; align-items: center; justify-content: flex-end;
            padding-right: 20px; box-sizing: border-box;
        }
        .page-indicator {
            font-size: 18px; font-weight: bold; color: white;
            background: rgba(0,0,0,0.5); padding: 2px 10px; border-radius: 15px;
        }

        /* リストエリア */
        .list-area { flex: 1; display: flex; flex-direction: column; }
        .row-img {
            width: 600px; height: 50px;
            background-size: 100% 100%;
            display: flex; align-items: center;
            position: relative;
            animation: slideIn 0.4s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }

        /* 行内のテキスト配置 (画像に合わせて調整が必要な場合があります) */
        .row-content {
            width: 100%; display: flex; align-items: center;
            padding: 0 15px; font-weight: bold;
        }
        .time { width: 100px; font-size: 20px; text-align: center; }
        .area-name { flex: 1; font-size: 24px; padding-left: 100px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }

        #manual-ctrl {
            position: absolute; bottom: 5px; right: 5px;
            display: none; gap: 5px; z-index: 100;
        }
        .ctrl-btn {
            background: rgba(0,0,0,0.7); border: 1px solid #fff; color: white;
            padding: 4px 8px; cursor: pointer; border-radius: 4px; font-size: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="header-area" class="header-img">
        <div class="page-indicator" id="page-num">1 / 1</div>
    </div>
    <div class="list-area" id="list-container">
        <!-- JSで挿入 -->
    </div>
</div>

<div id="manual-ctrl">
    <button class="ctrl-btn" onclick="prevPage()">前へ</button>
    <button class="ctrl-btn" onclick="nextPage()">次へ</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // テストデータ
    // grade: 'ot', 'kt', 'ct' (Title)
    // height: '10m', '10mu', '5m', '3m', '1m', 'kyodai', 'takai', 'none'
    const testData = [
        { name: "岩手県", height: "kyodai", time: "14:50" },
        { name: "宮城県", height: "kyodai", time: "14:52" },
        { name: "福島県", height: "5m", time: "14:55" },
        { name: "青森県太平洋沿岸", height: "3m", time: "15:01" },
        { name: "茨城県", height: "3m", time: "15:10" },
        { name: "千葉県九十九里・外房", height: "1m", time: "15:15" },
        { name: "相模湾・三浦半島", height: "none", time: "15:20" }
    ];

    let currentPage = 0;
    let autoPage = true;
    let tsunamiData = testData;
    let currentGrade = "ot"; // ot: 大津波, kt: 警報, ct: 注意報
    const rowsPerPage = 5;

    function render() {
        const container = document.getElementById('list-container');
        const header = document.getElementById('header-area');
        const pageIndicator = document.getElementById('page-num');
        
        // ヘッダー背景画像の設定
        header.style.backgroundImage = `url('../assets/banner/tsunami/tsunami-list_${currentGrade}.svg')`;
        
        container.innerHTML = "";
        const totalPages = Math.ceil(tsunamiData.length / rowsPerPage) || 1;
        if (currentPage >= totalPages) currentPage = 0;

        const start = currentPage * rowsPerPage;
        const pageItems = tsunamiData.slice(start, start + rowsPerPage);

        pageItems.forEach(item => {
            const row = document.createElement('div');
            row.className = 'row-img';
            row.style.backgroundImage = `url('../assets/banner/tsunami/tsunami-list_${item.height}.svg')`;
            
            row.innerHTML = `
                <div class="row-content">
                    <div class="time">${item.time}</div>
                    <div class="area-name">${item.name}</div>
                </div>
            `;
            container.appendChild(row);
        });

        pageIndicator.innerText = `${currentPage + 1} / ${totalPages}`;
    }

    // 10秒ごとの自動切替
    setInterval(() => {
        if (autoPage) {
            const total = Math.ceil(tsunamiData.length / rowsPerPage);
            if (total > 1) {
                currentPage = (currentPage + 1) % total;
                render();
            }
        }
    }, 10000);

    window.nextPage = () => { currentPage = (currentPage + 1) % Math.ceil(tsunamiData.length / rowsPerPage); render(); };
    window.prevPage = () => { 
        const total = Math.ceil(tsunamiData.length / rowsPerPage);
        currentPage = (currentPage - 1 + total) % total; 
        render(); 
    };

    onValue(ref(db, 'broadcast/tsunami_config'), (snapshot) => {
        const config = snapshot.val();
        autoPage = config?.autoPage !== false;
        document.getElementById('manual-ctrl').style.display = autoPage ? 'none' : 'flex';
        if(config?.grade) { currentGrade = config.grade; render(); }
    });

    render();
</script>
</body>
</html>
