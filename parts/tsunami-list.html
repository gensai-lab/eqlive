<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'UDKakugo';
            src: url('../assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
        }
        body, html {
            margin: 0; padding: 0; width: 600px;
            background-color: transparent; overflow: hidden;
            font-family: 'UDKakugo', sans-serif;
            color: #1E1E1E;
        }
        .container { width: 600px; display: flex; flex-direction: column; }
        
        /* タイトル・リスト行共通：高さ52px、パディングなし */
        .header-img, .row-img {
            width: 600px; height: 52px;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            display: flex; align-items: center;
            box-sizing: border-box;
        }

        .row-content {
            width: 100%; display: flex; align-items: center;
            padding: 0; margin: 0; font-weight: bold;
        }

        /* 予報区名：左パディング14px、最大幅280pxで縮小 */
        .area-wrapper {
            width: 280px; 
            padding-left: 14px; /* 指定の14px */
            overflow: visible; display: flex; align-items: center;
            box-sizing: border-box;
        }
        .area-name {
            font-size: 32px; white-space: nowrap; transform-origin: left center;
        }

        /* 到達予想：中央揃え、右パディング（後ほど調整用） */
        .time {
            flex: 1; font-size: 32px; 
            text-align: center; /* 中央揃え */
            padding-right: 30px; /* 右パディング：いい感じに（仮） */
            white-space: nowrap;
        }
        
        /* 「日」の文字サイズを小さくする用 */
        .day-unit {
            font-size: 0.7em;
            margin: 0 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="header-area" class="header-img"></div>
    <div class="list-area" id="list-container"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // --- 設定・辞書 ---
    const CONDITION_DICT = {
        "第１波の到達を確認": "第1波到達",
        "津波到達中と推測": "到達中",
        "ただちに到達と推測": "すぐくる"
    };

    // 画像マッピング設定
    const HEIGHT_IMAGE_MAP = {
        "１ｍ": "assets/banner/tsunami/tsunami-list_1m.svg",
        "３ｍ": "assets/banner/tsunami/tsunami-list_3m.svg",
        "５ｍ": "assets/banner/tsunami/tsunami-list_5m.svg",
        "１０ｍ": "assets/banner/tsunami/tsunami-list_10m.svg",
        "１０ｍ超": "assets/banner/tsunami/tsunami-list_10mu.svg",
        "giant": "assets/banner/tsunami/tsunami-list_kyodai.svg",
        "high": "assets/banner/tsunami/tsunami-list_takai.svg",
        "none": "assets/banner/tsunami/tsunami-list_none.svg"
    };

    // --- 関数：文字幅の自動圧縮 ---
    function adjustTextScale(el) {
        el.style.transform = "scaleX(1)";
        const width = el.offsetWidth;
        const maxWidth = 266; // 280px - padding 14px
        if (width > maxWidth) {
            const scale = maxWidth / width;
            el.style.transform = `scaleX(${scale})`;
        }
    }

    // --- 関数：時刻・文言の整形（「日」の小文字化含む） ---
    function formatConditionHTML(cond) {
        if (!cond) return "";
        let text = CONDITION_DICT[cond] || cond;
        
        // 日付形式の判定と整形
        const date = new Date(text);
        if (!isNaN(date.getTime()) && text.includes(':')) {
            const d = date.getDate();
            const h = String(date.getHours()).padStart(2, '0');
            const m = String(date.getMinutes()).padStart(2, '0');
            // 「日」をspanで囲んで出力
            return `${d}<span class="day-unit">日</span> ${h}:${m}`;
        }

        // すでに文字列の中に「日」がある場合も置換（例: 21日 00:30）
        if (text.includes("日")) {
            return text.replace("日", '<span class="day-unit">日</span>');
        }

        return text;
    }

    let currentPage = 0;
    const rowsPerPage = 5;
    let tsunamiAreas = [];
    let currentGradeImg = "ot";

    function render(data) {
        const container = document.getElementById('list-container');
        const header = document.getElementById('header-area');
        container.innerHTML = "";

        if (!data || data.length === 0) return;

        // 代表的な警報種別を決定
        const maxValue = Math.max(...data.map(a => a.maxHeight?.value || 0));
        if (maxValue >= 5) currentGradeImg = "ot";
        else if (maxValue >= 3) currentGradeImg = "kt";
        else currentGradeImg = "ct";

        header.style.backgroundImage = `url('../assets/banner/tsunami/tsunami-list_${currentGradeImg}.svg')`;

        const start = currentPage * rowsPerPage;
        const pageItems = data.slice(start, start + rowsPerPage);

        pageItems.forEach(item => {
            const row = document.createElement('div');
            row.className = 'row-img';
            
            // 指定のパスに基づき背景画像を設定
            const desc = item.maxHeight?.description || "none";
            const imgPath = HEIGHT_IMAGE_MAP[desc] || HEIGHT_IMAGE_MAP["none"];
            row.style.backgroundImage = `url('../${imgPath}')`;

            const condHTML = formatConditionHTML(item.firstHeight?.condition || item.firstHeight?.arrivalTime);

            row.innerHTML = `
                <div class="row-content">
                    <div class="area-wrapper">
                        <div class="area-name">${item.name}</div>
                    </div>
                    <div class="time">${condHTML}</div>
                </div>
            `;
            container.appendChild(row);
            adjustTextScale(row.querySelector('.area-name'));
        });
    }

    // P2P地震情報のJSONから抽出して適用する例
    const sampleFromP2P = [
        { name: "北海道太平洋沿岸東部", maxHeight: { description: "１ｍ", value: 1 }, firstHeight: { condition: "第１波の到達を確認" } },
        { name: "北海道太平洋沿岸中部", maxHeight: { description: "１ｍ", value: 1 }, firstHeight: { condition: "2026-04-20 23:55:00" } },
        { name: "岩手県", maxHeight: { description: "giant", value: 5 }, firstHeight: { condition: "津波到達中と推測" } }
    ];

    tsunamiAreas = sampleFromP2P; 
    render(tsunamiAreas);

    // 10秒ページ送り
    setInterval(() => {
        const totalPages = Math.ceil(tsunamiAreas.length / rowsPerPage);
        if (totalPages > 1) {
            currentPage = (currentPage + 1) % totalPages;
            render(tsunamiAreas);
        }
    }, 10000);
</script>
</body>
</html>
