<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'UDKakugo';
            src: url('../assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
        }
        body, html {
            margin: 0; padding: 0; width: 600px; height: auto;
            background-color: transparent; overflow: hidden;
            font-family: 'UDKakugo', sans-serif;
            /* 文字色を一律 #1E1E1E に指定 */
            color: #1E1E1E;
        }
        .container {
            width: 600px;
            display: flex;
            flex-direction: column;
        }
        
        /* タイトル行（余白なし） */
        .header-img {
            width: 600px;
            height: 60px;
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        /* リストエリア */
        .list-area {
            display: flex;
            flex-direction: column;
        }
        .row-img {
            width: 600px;
            height: 50px;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
        }

        /* テキスト配置設定 */
        .row-content {
            width: 100%;
            display: flex;
            align-items: center;
            padding: 0 0px;
            font-weight: bold;
            box-sizing: border-box;
        }
        /* 並び順：予報区名(左) -> 到達予想(右) */
        .area-name {
            flex: 1;
            font-size: 26px;
            padding-left: 20px;
            white-space: nowrap;
            overflow: hidden;
        }
        .time {
            width: 150px;
            font-size: 24px;
            text-align: right;
            padding-right: 20px;
        }

        /* 手動操作ボタン（admin用・画面上は極力邪魔しない位置） */
        #manual-ctrl {
            position: fixed;
            bottom: 0;
            right: 0;
            display: none;
            gap: 2px;
            z-index: 100;
        }
        .ctrl-btn {
            background: rgba(255,255,255,0.8);
            border: 1px solid #ccc;
            color: #000;
            padding: 2px 5px;
            font-size: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="header-area" class="header-img"></div>
    <div class="list-area" id="list-container">
        </div>
</div>

<div id="manual-ctrl">
    <button class="ctrl-btn" onclick="prevPage()">前</button>
    <button class="ctrl-btn" onclick="nextPage()">次</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // テストデータ
    // height: '10m', '10mu', '5m', '3m', '1m', 'kyodai', 'takai', 'none'
    const testData = [
        { name: "岩手県", height: "kyodai", time: "14:50" },
        { name: "宮城県", height: "kyodai", time: "14:52" },
        { name: "福島県", height: "5m", time: "14:55" },
        { name: "青森県太平洋沿岸", height: "3m", time: "15:01" },
        { name: "茨城県", height: "3m", time: "15:10" },
        { name: "千葉県九十九里・外房", height: "1m", time: "15:15" },
        { name: "相模湾・三浦半島", height: "none", time: "15:20" }
    ];

    let currentPage = 0;
    let autoPage = true;
    let tsunamiData = testData;
    let currentGrade = "ot"; // ot: 大津波, kt: 警報, ct: 注意報
    const rowsPerPage = 5;

    function render() {
        const container = document.getElementById('list-container');
        const header = document.getElementById('header-area');
        
        // ヘッダー背景画像の設定
        header.style.backgroundImage = `url('../assets/banner/tsunami/tsunami-list_${currentGrade}.svg')`;
        
        container.innerHTML = "";
        const totalPages = Math.ceil(tsunamiData.length / rowsPerPage) || 1;
        if (currentPage >= totalPages) currentPage = 0;

        const start = currentPage * rowsPerPage;
        const pageItems = tsunamiData.slice(start, start + rowsPerPage);

        pageItems.forEach(item => {
            const row = document.createElement('div');
            row.className = 'row-img';
            row.style.backgroundImage = `url('../assets/banner/tsunami/tsunami-list_${item.height}.svg')`;
            
            // 順序：area-name(左) -> time(右)
            row.innerHTML = `
                <div class="row-content">
                    <div class="area-name">${item.name}</div>
                    <div class="time">${item.time}</div>
                </div>
            `;
            container.appendChild(row);
        });
    }

    // 10秒ごとの自動切替
    setInterval(() => {
        if (autoPage) {
            const total = Math.ceil(tsunamiData.length / rowsPerPage);
            if (total > 1) {
                currentPage = (currentPage + 1) % total;
                render();
            }
        }
    }, 10000);

    window.nextPage = () => { 
        const total = Math.ceil(tsunamiData.length / rowsPerPage);
        currentPage = (currentPage + 1) % total; 
        render(); 
    };
    window.prevPage = () => { 
        const total = Math.ceil(tsunamiData.length / rowsPerPage);
        currentPage = (currentPage - 1 + total) % total; 
        render(); 
    };

    // Firebase連携
    onValue(ref(db, 'broadcast/tsunami_config'), (snapshot) => {
        const config = snapshot.val();
        if (config) {
            autoPage = config.autoPage !== false;
            document.getElementById('manual-ctrl').style.display = autoPage ? 'none' : 'flex';
            if(config.grade) currentGrade = config.grade;
            render();
        }
    });

    render();
</script>
</body>
</html>
