<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'UDKakugo';
            src: url('../assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
        }
        body, html {
            margin: 0; padding: 0; width: 600px;
            background-color: transparent; overflow: hidden;
            font-family: 'UDKakugo', sans-serif;
            color: #1E1E1E;
        }
        .container { width: 600px; display: flex; flex-direction: column; }
        
        /* タイトル・リスト行共通：高さ52px、パディングなし */
        .header-img, .row-img {
            width: 600px; height: 52px;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            display: flex; align-items: center;
            box-sizing: border-box;
        }

        .row-content {
            width: 100%; display: flex; align-items: center;
            padding: 0; margin: 0; font-weight: bold;
        }

        /* 予報区名：32px、最大幅280pxで縮小 */
        .area-wrapper {
            width: 280px; margin-left: 100px; /* 画像のラベル位置に合わせるため調整 */
            overflow: visible; display: flex; align-items: center;
        }
        .area-name {
            font-size: 32px; white-space: nowrap; transform-origin: left center;
        }

        /* 到達予想：32px */
        .time {
            flex: 1; font-size: 32px; text-align: right;
            padding-right: 25px; white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="header-area" class="header-img"></div>
    <div class="list-area" id="list-container"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // --- 設定・辞書 ---
    const CONDITION_DICT = {
        "第１波の到達を確認": "第1波到達",
        "津波到達中と推測": "津波到達中",
        "ただちに到達と推測": "直ちに到達"
    };

    const HEIGHT_TO_FILE = {
        "10m": "10m", "10m超": "10mu", "5m": "5m", "3m": "3m", "1m": "1m",
        "巨大": "kyodai", "高い": "takai", "none": "none"
    };

    // --- 関数：文字幅の自動圧縮 ---
    function adjustTextScale(el) {
        el.style.transform = "scaleX(1)";
        const width = el.offsetWidth;
        if (width > 280) {
            const scale = 280 / width;
            el.style.transform = `scaleX(${scale})`;
        }
    }

    // --- 関数：時刻・文言の整形 ---
    function formatCondition(cond) {
        if (!cond) return "";
        if (CONDITION_DICT[cond]) return CONDITION_DICT[cond];
        
        // 日付形式 (例: 2026-04-20T23:45:00) の判定
        const date = new Date(cond);
        if (!isNaN(date.getTime()) && cond.includes(':')) {
            const d = date.getDate();
            const h = String(date.getHours()).padStart(2, '0');
            const m = String(date.getMinutes()).padStart(2, '0');
            return `${d}日 ${h}:${m}`;
        }
        return cond;
    }

    // --- メインレンダリング ---
    let currentPage = 0;
    const rowsPerPage = 5;
    let tsunamiAreas = [];
    let currentGradeImg = "ot";

    function render(data) {
        const container = document.getElementById('list-container');
        const header = document.getElementById('header-area');
        container.innerHTML = "";

        if (!data || data.length === 0) return;

        // 代表的な警報種別を決定 (一番高いvalueに合わせる)
        const maxValue = Math.max(...data.map(a => a.maxHeight?.value || 0));
        if (maxValue >= 5) currentGradeImg = "ot";      // 大津波
        else if (maxValue >= 3) currentGradeImg = "kt"; // 警報
        else currentGradeImg = "ct";                    // 注意報

        header.style.backgroundImage = `url('../assets/banner/tsunami/tsunami-list_${currentGradeImg}.svg')`;

        const start = currentPage * rowsPerPage;
        const pageItems = data.slice(start, start + rowsPerPage);

        pageItems.forEach(item => {
            const row = document.createElement('div');
            row.className = 'row-img';
            
            // 画像ファイル名の決定
            const hKey = item.maxHeight?.description || "none";
            const fileName = HEIGHT_TO_FILE[hKey] || "none";
            row.style.backgroundImage = `url('../assets/banner/tsunami/tsunami-list_${fileName}.svg')`;

            const condText = formatCondition(item.firstHeight?.condition || item.firstHeight?.arrivalTime);

            row.innerHTML = `
                <div class="row-content">
                    <div class="area-wrapper">
                        <div class="area-name">${item.name}</div>
                    </div>
                    <div class="time">${condText}</div>
                </div>
            `;
            container.appendChild(row);
            adjustTextScale(row.querySelector('.area-name'));
        });
    }

    // P2P地震情報 API等からデータを取得する想定のダミーロジック
    // 実際には fetch 等で data[1].areas を取得して渡してください
    const sampleData = [
        { name: "北海道太平洋沿岸東部", maxHeight: { description: "１ｍ", value: 1 }, firstHeight: { condition: "第１波の到達を確認" } },
        { name: "青森県日本海沿岸", maxHeight: { description: "１ｍ", value: 1 }, firstHeight: { condition: "津波到達中と推測" } },
        { name: "岩手県", maxHeight: { description: "３ｍ", value: 3 }, firstHeight: { condition: "2026-04-20T23:50:00" } }
    ];

    // 初期実行
    tsunamiAreas = sampleData; 
    render(tsunamiAreas);

    // 10秒ごとにページ切り替え
    setInterval(() => {
        const totalPages = Math.ceil(tsunamiAreas.length / rowsPerPage);
        if (totalPages > 1) {
            currentPage = (currentPage + 1) % totalPages;
            render(tsunamiAreas);
        }
    }, 10000);
</script>
</body>
</html>
