<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background: transparent;
            width: 600px;
            height: 350px;
            overflow: hidden;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        #main-canvas {
            position: relative;
            width: 600px;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
        }

        #background-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            position: absolute;
        }

        #map-container {
            position: absolute;
            z-index: 2;
            pointer-events: none;
            top: 0;
            left: -10px; 
            width: 100%;
            height: 100%;
        }

        #svg-area {
            position: relative;
            width: 100%;
            height: 100%;
        }

        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
        }

        .pref-path {
            fill: #333333;
            stroke: #555555;
            stroke-width: 0.2px;
        }

        @keyframes tsunami-blink {
            0%, 75% { opacity: 1; }
            75.1%, 100% { opacity: 0; }
        }

        .tsunami-layer {
            animation: tsunami-blink 4s infinite;
        }

        .tsunami-path {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s;
        }
    </style>
</head>
<body>

<div id="main-canvas">
    <img id="background-cover" src="https://gensai-lab.github.io/eqlive/assets/cover/tsunami_cover.png" alt="tsunami-bg">
    <div id="map-container">
        <div id="svg-area"></div>
    </div>
</div>

<script type="module">
    let tsunamiSvgElement = null;

    const config = {
        prefScale: 1.0,
        tsunamiScale: 1.0,
        offsetX: 0,
        offsetY: 0,
        apiUrl: "https://api.p2pquake.net/v2/history?codes=552&limit=5"
    };

    async function applyTsunamiData(tsunamiSvg, data) {
        if (!tsunamiSvg) return;

        tsunamiSvg.selectAll("path")
            .style("stroke", "none")
            .style("stroke-width", "0");

        if (!data || data.cancelled || !data.areas) {
            console.log("津波予報なし");
            return;
        }

        data.areas.forEach(area => {
            const areaName = area.name.trim();
            const grade = area.grade;
            let color = "none";
            let width = 0;

            if (grade === "MajorWarning") { 
                color = "#C91EFB"; width = 12;
            } else if (grade === "Warning") { 
                color = "#DE080A"; width = 8;
            } else if (grade === "Watch") { 
                color = "#FEDC00"; width = 6;
            }

            const target = tsunamiSvg.selectAll("path").filter(function() {
                const id = d3.select(this).attr("id");
                return id && (id === areaName || id.includes(areaName));
            });

            if (!target.empty()) {
                target
                    .style("stroke", color)
                    .style("stroke-width", `${width}px`)
                    .style("stroke-linecap", "round")
                    .style("stroke-linejoin", "round")
                    .raise();
            }
        });
    }

    async function fetchTsunamiInfo() {
        try {
            const response = await fetch(config.apiUrl);
            const history = await response.json();
            const latestActive = history.find(item => item.cancelled === false);
            
            if (latestActive) {
                applyTsunamiData(tsunamiSvgElement, latestActive);
            } else {
                applyTsunamiData(tsunamiSvgElement, { cancelled: true });
            }
        } catch (e) {
            console.error("API取得エラー:", e);
        }
    }

    async function init() {
        try {
            const [prefXml, tsunamiXml] = await Promise.all([
                d3.xml("https://gensai-lab.github.io/eqlive/assets/svg/pref.svg"),
                d3.xml("https://gensai-lab.github.io/eqlive/assets/svg/tsunami2_id.svg")
            ]);

            const svgArea = d3.select("#svg-area");
            const prefNode = svgArea.append(() => prefXml.documentElement);
            prefNode.selectAll("path").classed("pref-path", true);

            const tsunamiLayer = svgArea.append("div").attr("class", "tsunami-layer");
            tsunamiSvgElement = tsunamiLayer.append(() => tsunamiXml.documentElement);
            tsunamiSvgElement.selectAll("path").classed("tsunami-path", true);

            [prefNode, tsunamiSvgElement].forEach(svg => svg.attr("width", null).attr("height", null));

            const pBbox = prefNode.node().getBBox();
            const tBbox = tsunamiSvgElement.node().getBBox();
            const minX = Math.min(pBbox.x, tBbox.x);
            const minY = Math.min(pBbox.y, tBbox.y);
            const width = Math.max(pBbox.x + pBbox.width, tBbox.x + tBbox.width) - minX;
            const height = Math.max(pBbox.y + pBbox.height, tBbox.y + tBbox.height) - minY;

            const getAdjustedViewBox = (scale) => {
                const adjW = width / scale;
                const adjH = height / scale;
                const diffW = (adjW - width) / 2;
                const diffH = (adjH - height) / 2;
                return `${minX - diffW - config.offsetX} ${minY - diffH - config.offsetY} ${adjW} ${adjH}`;
            };

            prefNode.attr("viewBox", getAdjustedViewBox(config.prefScale)).attr("preserveAspectRatio", "xMidYMid meet");
            tsunamiSvgElement.attr("viewBox", getAdjustedViewBox(config.tsunamiScale)).attr("preserveAspectRatio", "xMidYMid meet");

            // 10秒ごとに自動更新するように設定
            fetchTsunamiInfo();
            setInterval(fetchTsunamiInfo, 10000);

        } catch (error) {
            console.error("初期化失敗:", error);
        }
    }

    init();
</script>
</body>
</html>
