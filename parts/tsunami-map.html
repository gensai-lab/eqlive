<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: transparent; /* Switcher側で背景色を設定しているため透過 */
            width: 100vw; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            overflow: hidden; 
            position: relative; 
        }

        #main-canvas { 
            height: 100vh; 
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            opacity: 0; /* 初期状態は非表示 */
            transition: opacity 0.5s ease-in-out; /* ふわっと表示させるアニメーション */
        }

        #background-cover { 
            position: relative; 
            height: 100%; 
            width: auto;   
            z-index: -1; 
            display: block;
        }

        #map-container { 
            position: absolute;
            top: 0;
            left: -75px; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            pointer-events: none; 
        }
        
        .pref-svg {
            position: absolute; 
            width: 90% !important; 
            height: 90% !important; 
            object-fit: contain;
            z-index: 10;
        }

        .tsunami-svg { 
            position: absolute; 
            width: 89% !important; 
            height: 89% !important; 
            object-fit: contain; 
            z-index: 1;
        }
        
        .pref-path { fill: #BFBFBF; stroke: #BFBFBF; stroke-width: 1px; }
        .tsunami-path { fill: none; stroke: none; transition: stroke 0.3s, stroke-width 0.3s; }
    </style>
</head>
<body>

<div id="main-canvas">
    <img id="background-cover" src="https://gensai-lab.github.io/eqlive/assets/cover/tsunami_cover.png" alt="background">
    <div id="map-container"></div>
</div>

<script type="module">
    let tsunamiSvgElement = null;
    let prefSvgElement = null;
    const mainCanvas = document.getElementById('main-canvas');

    async function applyTsunamiData(tsunamiSvg, data) {
        if (!tsunamiSvg) return;

        // すべての線をリセット
        tsunamiSvg.selectAll("path")
            .style("stroke", "none")
            .style("stroke-width", "0");

        // 津波情報がない、またはキャンセル（解除）されている場合
        if (!data || data.cancelled === true || !data.areas) {
            mainCanvas.style.opacity = "0"; // 非表示にする
            return;
        }

        // 津波情報がある場合のみ表示する
        mainCanvas.style.opacity = "1";

        data.areas.forEach(area => {
            const areaName = area.name.trim();
            const grade = area.grade;
            const baseWidth = 24; 
            
            let color = "none";
            let width = "0px";

            if (grade === "MajorWarning") { 
                color = "#C91EFB"; width = `${baseWidth * 6}px`;
            } else if (grade === "Warning") { 
                color = "#DE080A"; width = `${baseWidth}px`; 
            } else if (grade === "Watch") { 
                color = "#FEDC00"; width = `${baseWidth}px`; 
            }

            const target = tsunamiSvg.selectAll("path").filter(function() {
                const id = d3.select(this).attr("id");
                return id && (id === areaName || id.includes(areaName));
            });

            if (!target.empty()) {
                target
                    .style("stroke", color)
                    .style("stroke-width", width)
                    .style("stroke-linecap", "round")
                    .style("stroke-linejoin", "round");
            }
        });
    }

    async function fetchTsunamiInfo() {
        try {
            const response = await fetch("https://api.p2pquake.net/v2/history?codes=552&limit=5");
            const history = await response.json();
            // cancelledがfalse（発表中）の最新データを取得
            const latestActive = history.find(item => item.cancelled === false);
            
            applyTsunamiData(tsunamiSvgElement, latestActive || { cancelled: true });
        } catch (e) {
            console.error("API取得エラー:", e);
        }
    }

    async function init() {
        try {
            const [prefXml, tsunamiXml] = await Promise.all([
                d3.xml("https://gensai-lab.github.io/eqlive/assets/svg/pref.svg"),
                d3.xml("https://gensai-lab.github.io/eqlive/assets/svg/tsunami2_id.svg")
            ]);

            const container = d3.select("#map-container");

            tsunamiSvgElement = container.append(() => tsunamiXml.documentElement);
            prefSvgElement = container.append(() => prefXml.documentElement);
            
            tsunamiSvgElement.attr("class", "tsunami-svg");
            prefSvgElement.attr("class", "pref-svg");

            prefSvgElement.selectAll("path").classed("pref-path", true);
            tsunamiSvgElement.selectAll("path").classed("tsunami-path", true);

            const fitToContainer = (svgNode, margin) => {
                const bbox = svgNode.getBBox();
                svgNode.setAttribute("viewBox", `${bbox.x - margin} ${bbox.y - margin} ${bbox.width + margin * 2} ${bbox.height + margin * 2}`);
                svgNode.removeAttribute("width");
                svgNode.removeAttribute("height");
                svgNode.setAttribute("preserveAspectRatio", "xMidYMid meet");
            };

            setTimeout(() => {
                fitToContainer(prefSvgElement.node(), 10);
                fitToContainer(tsunamiSvgElement.node(), 0);
                
                // 初回チェック
                fetchTsunamiInfo();
                // 10秒毎にチェック
                setInterval(fetchTsunamiInfo, 10000);
            }, 300);

        } catch (error) {
            console.error("読み込み失敗:", error);
        }
    }

    init();
</script>
</body>
</html>
