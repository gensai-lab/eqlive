<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background: transparent;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: flex-end; /* 右下に配置される想定で右寄せ */
            align-items: flex-end;
        }

        #main-canvas {
            position: relative;
            height: 100vh;
            width: auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #background-cover {
            height: 100%;
            width: auto;
            display: block;
            z-index: 1;
        }

        #map-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            height: 90%;
            z-index: 2;
            pointer-events: none;
        }

        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* 都道府県の塗り */
        .pref-path {
            fill: #444444; /* マップのベースカラー */
            stroke: #666666;
            stroke-width: 0.5px;
        }

        /* 津波線の点滅アニメーション (3秒表示 / 1秒非表示) */
        @keyframes tsunami-blink {
            0%, 75% { opacity: 1; }   /* 0s ~ 3s は表示 */
            75.1%, 100% { opacity: 0; } /* 3s ~ 4s は非表示 */
        }

        .tsunami-layer {
            animation: tsunami-blink 4s infinite;
        }

        .tsunami-path {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s;
        }
    </style>
</head>
<body>

<div id="main-canvas">
    <img id="background-cover" src="../assets/cover/tsunami_cover.png" alt="tsunami-bg">
    
    <div id="map-container">
        <div id="pref-layer"></div>
        <div id="tsunami-layer" class="tsunami-layer"></div>
    </div>
</div>

<script type="module">
    let tsunamiSvg = null;

    async function initMap() {
        try {
            // SVGの読み込み
            const [prefXml, tsunamiXml] = await Promise.all([
                d3.xml("../assets/svg/pref.svg"),
                d3.xml("../assets/svg/tsunami2_id.svg")
            ]);

            // 都道府県レイヤーの設置
            const prefContainer = d3.select("#pref-layer");
            const prefNode = prefContainer.append(() => prefXml.documentElement);
            prefNode.selectAll("path").classed("pref-path", true);

            // 津波予報区レイヤーの設置
            const tsunamiContainer = d3.select("#tsunami-layer");
            tsunamiSvg = tsunamiContainer.append(() => tsunamiXml.documentElement);
            tsunamiSvg.selectAll("path").classed("tsunami-path", true);

            // viewBoxの自動調整（両方のSVGを合わせる）
            const autoFit = (svgElement) => {
                const bbox = svgElement.node().getBBox();
                const margin = 20;
                svgElement
                    .attr("viewBox", `${bbox.x - margin} ${bbox.y - margin} ${bbox.width + margin * 2} ${bbox.height + margin * 2}`)
                    .attr("preserveAspectRatio", "xMidYMid meet")
                    .attr("width", "100%")
                    .attr("height", "100%");
            };

            autoFit(prefNode);
            autoFit(tsunamiSvg);

        } catch (error) {
            console.error("Map initialization failed:", error);
        }
    }

    /**
     * 津波情報を地図に適用する
     * @param {Object} data - { areas: [{ name: "地区名", grade: "MajorWarning|Warning|Watch" }] }
     */
    window.updateTsunamiMap = (data) => {
        if (!tsunamiSvg) return;

        // 一旦すべての線を消す
        tsunamiSvg.selectAll("path")
            .style("stroke", "none")
            .style("stroke-width", "0");

        if (!data || !data.areas) return;

        data.areas.forEach(area => {
            const grade = area.grade;
            let color = "none";
            let width = 0;

            // 等級に応じた色と太さ（放送基準に近い設定）
            switch (grade) {
                case "MajorWarning":
                    color = "#C91EFB"; // 大津波警報（紫）
                    width = 18;
                    break;
                case "Warning":
                    color = "#DE080A"; // 津波警報（赤）
                    width = 12;
                    break;
                case "Watch":
                    color = "#FEDC00"; // 津波注意報（黄）
                    width = 10;
                    break;
            }

            // IDまたはクラス名から該当する予報区を探して適用
            tsunamiSvg.selectAll("path")
                .filter(function() {
                    const id = d3.select(this).attr("id");
                    return id === area.name || (id && id.includes(area.name));
                })
                .style("stroke", color)
                .style("stroke-width", `${width}px`)
                .raise(); // 線を最前面へ
        });
    };

    initMap();
</script>
</body>
</html>
