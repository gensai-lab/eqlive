<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background: transparent;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: flex-start; /* 左寄せ */
            align-items: flex-end;
        }

        #main-canvas {
            position: relative;
            height: 100vh;
            width: auto;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        #background-cover {
            height: 100%;
            width: auto;
            display: block;
            z-index: 1;
        }

        /* マップの位置とマージンの設定 */
        #map-container {
            position: absolute;
            z-index: 2;
            pointer-events: none;
            
            /* --- ここで位置とサイズを調整 --- */
            top: 5%;           /* 上からのマージン */
            left: 20px;        /* 左からのマージン */
            width: 90%;        /* 背景画像に対する幅 */
            height: 90%;       /* 背景画像に対する高さ */
        }

        #svg-area {
            position: relative;
            width: 100%;
            height: 100%;
        }

        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .pref-path {
            fill: #444444;
            stroke: #666666;
            stroke-width: 0.3px;
        }

        @keyframes tsunami-blink {
            0%, 75% { opacity: 1; }
            75.1%, 100% { opacity: 0; }
        }

        .tsunami-layer {
            animation: tsunami-blink 4s infinite;
        }

        .tsunami-path {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s;
        }
    </style>
</head>
<body>

<div id="main-canvas">
    <img id="background-cover" src="../assets/cover/tsunami_cover.png" alt="tsunami-bg">
    
    <div id="map-container">
        <div id="svg-area"></div>
    </div>
</div>

<script type="module">
    let tsunamiSvg = null;

    async function initMap() {
        try {
            const [prefXml, tsunamiXml] = await Promise.all([
                d3.xml("../assets/svg/pref.svg"),
                d3.xml("../assets/svg/tsunami2_id.svg")
            ]);

            const svgArea = d3.select("#svg-area");
            
            // 1. 都道府県SVGの追加
            const prefSvg = svgArea.append(() => prefXml.documentElement);
            prefSvg.selectAll("path").classed("pref-path", true);

            // 2. 津波予報区SVGの追加（点滅レイヤーの中に入れる）
            const tsunamiLayer = svgArea.append("div").attr("class", "tsunami-layer");
            tsunamiSvg = tsunamiLayer.append(() => tsunamiXml.documentElement);
            tsunamiSvg.selectAll("path").classed("tsunami-path", true);

            // 3. スケールを統一する（サイズズレの解消）
            // 両方の要素を合わせた最大の境界ボックス（BBox）を取得
            const pBox = prefSvg.node().getBBox();
            const tBox = tsunamiSvg.node().getBBox();

            const minX = Math.min(pBox.x, tBox.x);
            const minY = Math.min(pBox.y, tBox.y);
            const maxX = Math.max(pBox.x + pBox.width, tBox.x + tBox.width);
            const maxY = Math.max(pBox.y + pBox.height, tBox.y + tBox.height);

            const commonViewBox = `${minX - 10} ${minY - 10} ${maxX - minX + 20} ${maxY - minY + 20}`;

            // 両方のSVGに全く同じviewBoxを適用することでズレをなくす
            [prefSvg, tsunamiSvg].forEach(svg => {
                svg.attr("viewBox", commonViewBox)
                   .attr("preserveAspectRatio", "xMidYMid meet")
                   .attr("width", "100%")
                   .attr("height", "100%");
            });

        } catch (error) {
            console.error("Map initialization failed:", error);
        }
    }

    window.updateTsunamiMap = (data) => {
        if (!tsunamiSvg) return;
        tsunamiSvg.selectAll("path").style("stroke", "none").style("stroke-width", "0");
        if (!data || !data.areas) return;

        data.areas.forEach(area => {
            const grade = area.grade;
            let color = "none", width = 0;
            switch (grade) {
                case "MajorWarning": color = "#C91EFB"; width = 12; break; // 太さは調整可能
                case "Warning": color = "#DE080A"; width = 8; break;
                case "Watch": color = "#FEDC00"; width = 6; break;
            }
            tsunamiSvg.selectAll("path")
                .filter(function() {
                    const id = d3.select(this).attr("id");
                    return id === area.name || (id && id.includes(area.name));
                })
                .style("stroke", color)
                .style("stroke-width", `${width}px`)
                .raise();
        });
    };

    initMap();
</script>
</body>
</html>
