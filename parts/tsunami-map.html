<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: transparent; 
            width: 100vw; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            overflow: hidden; 
            position: relative; 
        }

        #main-canvas { 
            height: 100vh; 
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }

        #background-cover { 
            position: relative; 
            height: 100%; 
            width: auto;   
            z-index: -1; 
            display: block;
        }

        #map-container { 
            position: absolute;
            top: 0;
            left: -225px;
            width: 100%; 
            height: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            pointer-events: none; 
        }
        
        svg { 
            position: absolute; 
            width: 90% !important; 
            height: 90% !important; 
            object-fit: contain; 
        }
        
        /* 陸地と都道府県境界（前面） */
        .pref-path { 
            fill: #BFBFBF; 
            stroke: #BFBFBF; 
            stroke-width: 0.5px; 
            position: relative;
            z-index: 5;
        }
        
        /* 津波線の基本設定（背面） */
        .tsunami-path { 
            fill: none; 
            stroke: none; 
            transition: stroke 0.3s, stroke-width 0.3s; 
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body>

<div id="main-canvas">
    <img id="background-cover" src="https://gensai-lab.github.io/eqlive/assets/cover/tsunami_cover.png" alt="background">
    <div id="map-container"></div>
</div>

<script type="module">
    let tsunamiSvgElement = null;
    let prefSvgElement = null;

    async function applyTsunamiData(tsunamiSvg, data) {
        if (!tsunamiSvg) return;

        tsunamiSvg.selectAll("path")
            .style("stroke", "none")
            .style("stroke-width", "0");

        if (!data || data.cancelled || !data.areas) {
            console.log("津波予報は発表されていません");
            return;
        }

        data.areas.forEach(area => {
            const areaName = area.name.trim();
            const grade = area.grade;
            const baseWidth = 14; 
            
            let color = "none";
            let width = "0px";

            if (grade === "MajorWarning") { 
                color = "#C91EFB"; 
                width = `${baseWidth * 2}px`;
            } 
            else if (grade === "Warning") { 
                color = "#DE080A"; 
                width = `${baseWidth}px`; 
            } 
            else if (grade === "Watch") { 
                color = "#FEDC00"; 
                width = `${baseWidth}px`; 
            }

            const target = tsunamiSvg.selectAll("path").filter(function() {
                const id = d3.select(this).attr("id");
                return id && (id === areaName || id.includes(areaName));
            });

            if (!target.empty()) {
                target
                    .style("stroke", color)
                    .style("stroke-width", width)
                    .style("stroke-linecap", "round")
                    .style("stroke-linejoin", "round");
                // .raise() を削除：津波レイヤーの中で最前面に行くと都道府県を隠す可能性があるため
            }
        });
    }

    async function fetchTsunamiInfo() {
        try {
            const response = await fetch("https://api.p2pquake.net/v2/history?codes=552&limit=5");
            const history = await response.json();
            const latestActive = history.find(item => item.cancelled === false);
            
            if (latestActive) {
                applyTsunamiData(tsunamiSvgElement, latestActive);
            } else {
                applyTsunamiData(tsunamiSvgElement, { cancelled: true });
            }
        } catch (e) {
            console.error("API取得エラー:", e);
        }
    }

    async function init() {
        try {
            const [prefXml, tsunamiXml] = await Promise.all([
                d3.xml("https://gensai-lab.github.io/eqlive/assets/svg/pref.svg"),
                d3.xml("https://gensai-lab.github.io/eqlive/assets/svg/tsunami2_id.svg")
            ]);

            const container = d3.select("#map-container");

            // --- 順番を入れ替え：先に津波（後ろ）、次に都道府県（前）を追加 ---
            tsunamiSvgElement = container.append(() => tsunamiXml.documentElement);
            prefSvgElement = container.append(() => prefXml.documentElement);
            
            // z-index を明示的に設定
            tsunamiSvgElement.style("position", "absolute").style("z-index", "1");
            prefSvgElement.style("position", "absolute").style("z-index", "10");

            prefSvgElement.selectAll("path").classed("pref-path", true);
            tsunamiSvgElement.selectAll("path").classed("tsunami-path", true);

            const autoFit = (svgNode) => {
                const bbox = svgNode.getBBox();
                const margin = 10;
                svgNode.setAttribute("viewBox", `${bbox.x - margin} ${bbox.y - margin} ${bbox.width + margin * 2} ${bbox.height + margin * 2}`);
                svgNode.removeAttribute("width");
                svgNode.removeAttribute("height");
                svgNode.setAttribute("preserveAspectRatio", "xMidYMid meet");
            };

            setTimeout(() => {
                autoFit(prefSvgElement.node());
                autoFit(tsunamiSvgElement.node());
                
                fetchTsunamiInfo();
                setInterval(fetchTsunamiInfo, 10000);
            }, 300);

        } catch (error) {
            console.error("読み込みに失敗しました:", error);
        }
    }

    window.updateTsunamiMap = (data) => {
        applyTsunamiData(tsunamiSvgElement, data);
    };

    init();
</script>
</body>
</html>
