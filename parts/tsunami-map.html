<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: transparent; 
            width: 100vw; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            overflow: hidden; 
            position: relative; 
        }

        #main-canvas { 
            width: 100%;
            height: 100%;
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }

        #map-container { 
            position: relative;
            width: 95%; 
            height: 95%;
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        /* 地図SVGのスタイル */
        .eew-map-svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 地図の基本色設定 */
        .map-path { 
            fill: #BFBFBF; /* 地図の背景色 */
            stroke: #7F7F7F; /* 地図の枠線 */
            stroke-width: 0.5px; 
        }

        /* 警告地域（黄色） */
        .eew-active-area {
            fill: #FFF300 !important;
            transition: fill 0.3s;
        }

        /* 震源地アイコン（shingen.svg） */
        #shingen-icon {
            position: absolute;
            width: 60px; /* サイズは適宜調整してください */
            height: 60px;
            transform: translate(-50%, -50%); /* 中心合わせ */
            z-index: 100;
            display: none;
            filter: drop-shadow(0 0 4px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body>

<div id="main-canvas">
    <div id="map-container">
        <img id="shingen-icon" src="../assets/svg/shingen.svg" alt="震源地">
    </div>
</div>

<script type="module">
    let mapSvgElement = null;
    const API_URL = "https://api.p2pquake.net/v2/history?codes=556&limit=1";
    const SVG_URL = "../assets/svg/eew-mapdate.svg";

    // 【重要】緯度経度計算用の基準範囲
    // 地図がズレる場合は、ここの数値を調整してください
    const MAP_CONFIG = {
        north: 46.0, // 地図の北端緯度
        south: 22.0, // 地図の南端緯度（小笠原などを含む場合は低めに設定）
        west: 122.0, // 地図の西端経度
        east: 149.0  // 地図の東端経度
    };

    /**
     * 緯度経度をSVGコンテナ上のパーセント座標に変換
     */
    function latLonToPercent(lat, lon) {
        const latRange = MAP_CONFIG.north - MAP_CONFIG.south;
        const lonRange = MAP_CONFIG.east - MAP_CONFIG.west;

        const xRatio = (lon - MAP_CONFIG.west) / lonRange;
        const yRatio = (MAP_CONFIG.north - lat) / latRange;

        return {
            x: xRatio * 100,
            y: yRatio * 100
        };
    }

    /**
     * P2P地震情報のデータを地図に反映
     */
    async function applyEEWData(data) {
        if (!mapSvgElement || !data) return;

        // リセット
        mapSvgElement.selectAll("path").classed("eew-active-area", false);
        const shingen = document.getElementById('shingen-icon');
        shingen.style.display = "none";

        // 1. 強い揺れが予想される地域（pref）を黄色に
        if (data.areas) {
            data.areas.forEach(area => {
                const prefName = area.pref;
                // SVG内のIDとpref名が一致する要素を選択
                const target = mapSvgElement.select(`#${prefName}`);
                if (!target.empty()) {
                    target.classed("eew-active-area", true);
                }
            });
        }

        // 2. 震源地のプロット
        if (data.earthquake && data.earthquake.hypocenter) {
            const { latitude, longitude } = data.earthquake.hypocenter;
            if (latitude !== -1 && longitude !== -1) {
                const pos = latLonToPercent(latitude, longitude);
                shingen.style.left = `${pos.x}%`;
                shingen.style.top = `${pos.y}%`;
                shingen.style.display = "block";
            }
        }
    }

    async function fetchEEWInfo() {
        try {
            const response = await fetch(API_URL);
            const history = await response.json();
            if (history && history.length > 0) {
                applyEEWData(history[0]);
            }
        } catch (e) {
            console.error("EEW API取得エラー:", e);
        }
    }

    async function init() {
        try {
            // 1. 地図SVGの読み込み
            const mapXml = await d3.xml(SVG_URL);
            const container = d3.select("#map-container");

            // 2. SVG要素をDOMに追加
            mapSvgElement = container.append(() => mapXml.documentElement);
            mapSvgElement.attr("class", "eew-map-svg");

            // 3. 全てのpathに基本クラスを付与
            mapSvgElement.selectAll("path").classed("map-path", true);

            // 4. ViewBoxの調整（サイズをコンテナに合わせる）
            const fitToContainer = (svgNode) => {
                const bbox = svgNode.getBBox();
                svgNode.setAttribute("viewBox", `${bbox.x} ${bbox.y} ${bbox.width} ${bbox.height}`);
                svgNode.removeAttribute("width");
                svgNode.removeAttribute("height");
                svgNode.setAttribute("preserveAspectRatio", "xMidYMid meet");
            };
            
            fitToContainer(mapSvgElement.node());

            // 5. 初回実行と定期チェック（3秒毎）
            fetchEEWInfo();
            setInterval(fetchEEWInfo, 3000);

        } catch (error) {
            console.error("初期化失敗:", error);
        }
    }

    init();
</script>
</body>
</html>
