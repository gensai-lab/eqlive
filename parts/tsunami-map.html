<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background: transparent; 
            width: 100vw; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            overflow: hidden; 
            position: relative; 
        }

        #main-canvas { 
            height: 100vh; 
            position: relative; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }

        #background-cover { 
            position: relative; 
            height: 100%; 
            width: auto;   
            z-index: -1; 
            display: block;
        }

        #map-container { 
            position: absolute;
            top: 0;
            left: -72px;
            width: 100%; 
            height: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            pointer-events: none; 
        }
        
        svg { 
            position: absolute; 
            width: 90% !important; 
            height: 90% !important; 
            object-fit: contain; 
        }
        
        .pref-path { fill: #BFBFBF; stroke: #BFBFBF; stroke-width: 0.5px; }
        
        .tsunami-path { fill: none; stroke: none; transition: stroke 0.3s, stroke-width 0.3s; }
    </style>
</head>
<body>

<div id="main-canvas">
    <img id="background-cover" src="assets/cover/tsunami_cover.png" alt="background">
    <div id="map-container"></div>
</div>

<script type="module">
    let tsunamiSvgElement = null;

    /**
     * 津波データを地図に反映させる関数
     */
    async function applyTsunamiData(tsunamiSvg, data) {
        if (!tsunamiSvg) return;

        // 全ての線をリセット
        tsunamiSvg.selectAll("path")
            .style("stroke", "none")
            .style("stroke-width", "0");

        // 解除時、またはデータがない場合は終了
        if (!data || data.cancelled || !data.areas) {
            console.log("津波予報は発表されていません");
            return;
        }

        data.areas.forEach(area => {
            const areaName = area.name.trim();
            const grade = area.grade;
            const baseWidth = 14; 
            
            let color = "none";
            let width = "0px";

            // 凡例に基づいた色分け
            if (grade === "MajorWarning") { 
                color = "#C91EFB"; // 大津波警報
                width = `${baseWidth * 2}px`;
            } 
            else if (grade === "Warning") { 
                color = "#DE080A"; // 津波警報
                width = `${baseWidth}px`; 
            } 
            else if (grade === "Watch") { 
                color = "#FEDC00"; // 津波注意報
                width = `${baseWidth}px`; 
            }

            const target = tsunamiSvg.selectAll("path").filter(function() {
                const id = d3.select(this).attr("id");
                // IDとエリア名が一致、またはIDにエリア名が含まれているかチェック
                return id && (id === areaName || id.includes(areaName));
            });

            if (!target.empty()) {
                target
                    .style("stroke", color)
                    .style("stroke-width", width)
                    .style("stroke-linecap", "round")
                    .style("stroke-linejoin", "round")
                    .raise();
            }
        });
    }

    /**
     * P2P地震情報APIから最新の津波情報を取得
     */
    async function fetchTsunamiInfo() {
        try {
            // codes=552 は津波予報
            const response = await fetch("https://api.p2pquake.net/v2/history?codes=552&limit=5");
            const history = await response.json();
            
            // 履歴の中から cancelled が false（発表中）の最新の1件を探す
            const latestActive = history.find(item => item.cancelled === false);
            
            if (latestActive) {
                applyTsunamiData(tsunamiSvgElement, latestActive);
            } else {
                // すべて解除されている、または有効なデータがない場合
                applyTsunamiData(tsunamiSvgElement, { cancelled: true });
            }
        } catch (e) {
            console.error("API取得エラー:", e);
        }
    }

    async function init() {
        try {
            const [prefXml, tsunamiXml] = await Promise.all([
                d3.xml("assets/svg/pref.svg"),
                d3.xml("assets/svg/tsunami2_id.svg")
            ]);

            const container = d3.select("#map-container");
            const prefSvg = container.append(() => prefXml.documentElement);
            tsunamiSvgElement = container.append(() => tsunamiXml.documentElement);
            
            tsunamiSvgElement.style("position", "absolute").style("z-index", "10");
            prefSvg.selectAll("path").classed("pref-path", true);
            tsunamiSvgElement.selectAll("path").classed("tsunami-path", true);

            const autoFit = (svgNode) => {
                const bbox = svgNode.getBBox();
                const margin = 10;
                svgNode.setAttribute("viewBox", `${bbox.x - margin} ${bbox.y - margin} ${bbox.width + margin * 2} ${bbox.height + margin * 2}`);
                svgNode.removeAttribute("width");
                svgNode.removeAttribute("height");
                svgNode.setAttribute("preserveAspectRatio", "xMidYMid meet");
            };

            setTimeout(() => {
                autoFit(prefSvg.node());
                autoFit(tsunamiSvgElement.node());
                
                // 初期化完了後に最初のデータ取得
                fetchTsunamiInfo();
                
                // 以降、10秒ごとに自動更新
                setInterval(fetchTsunamiInfo, 10000);
            }, 300);

        } catch (error) {
            console.error("読み込みに失敗しました:", error);
        }
    }

    // 手動更新・管理パネルからの制御用
    window.updateTsunamiMap = (data) => {
        applyTsunamiData(tsunamiSvgElement, data);
    };

    init();
</script>
</body>
</html>
