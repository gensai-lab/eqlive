<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background: transparent;
            width: 600px;  /* 全体サイズ固定 */
            height: 350px;
            overflow: hidden;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
        }

        #main-canvas {
            position: relative;
            width: 600px;
            height: 350px;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            overflow: hidden;
        }

        #background-cover {
            width: 600px;  /* 背景画像を600x350に固定 */
            height: 350px;
            object-fit: cover;
            display: block;
            z-index: 1;
        }

        #map-container {
            position: absolute;
            z-index: 2;
            pointer-events: none;
            
            /* ご指定の位置設定 */
            top: 40px;
            left: -30px;
            /* マップ自体の描画エリアもコンテナサイズに合わせる */
            width: 600px;
            height: 350px;
        }

        #svg-area {
            position: relative;
            width: 100%;
            height: 100%;
        }

        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
        }

        .pref-path {
            fill: #333333;
            stroke: #555555;
            stroke-width: 0.2px;
        }

        @keyframes tsunami-blink {
            0%, 75% { opacity: 1; }
            75.1%, 100% { opacity: 0; }
        }

        .tsunami-layer {
            animation: tsunami-blink 4s infinite;
        }

        .tsunami-path {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s;
        }
    </style>
</head>
<body>

<div id="main-canvas">
    <img id="background-cover" src="../assets/cover/tsunami_cover.png" alt="tsunami-bg">
    
    <div id="map-container">
        <div id="svg-area"></div>
    </div>
</div>

<script type="module">
    let tsunamiSvg = null;

    async function initMap() {
        try {
            const [prefXml, tsunamiXml] = await Promise.all([
                d3.xml("../assets/svg/pref.svg"),
                d3.xml("../assets/svg/tsunami2_id.svg")
            ]);

            const svgArea = d3.select("#svg-area");
            
            const prefNode = svgArea.append(() => prefXml.documentElement);
            prefNode.selectAll("path").classed("pref-path", true);

            const tsunamiLayer = svgArea.append("div").attr("class", "tsunami-layer");
            tsunamiSvg = tsunamiLayer.append(() => tsunamiXml.documentElement);
            tsunamiSvg.selectAll("path").classed("tsunami-path", true);

            // 元のサイズ属性を削除
            [prefNode, tsunamiSvg].forEach(svg => {
                svg.attr("width", null).attr("height", null);
            });

            // 座標範囲の計算
            const pBbox = prefNode.node().getBBox();
            const tBbox = tsunamiSvg.node().getBBox();

            const minX = Math.min(pBbox.x, tBbox.x);
            const minY = Math.min(pBbox.y, tBbox.y);
            const maxX = Math.max(pBbox.x + pBbox.width, tBbox.x + tBbox.width);
            const maxY = Math.max(pBbox.y + pBbox.height, tBbox.y + tBbox.height);

            // 表示比率を保ちつつ枠いっぱいに広げる設定
            const commonViewBox = `${minX} ${minY} ${maxX - minX} ${maxY - minY}`;

            [prefNode, tsunamiSvg].forEach(svg => {
                svg.attr("viewBox", commonViewBox)
                   .attr("preserveAspectRatio", "xMidYMid meet");
            });

        } catch (error) {
            console.error("Map initialization failed:", error);
        }
    }

    window.updateTsunamiMap = (data) => {
        if (!tsunamiSvg) return;
        tsunamiSvg.selectAll("path").style("stroke", "none").style("stroke-width", "0");
        if (!data || !data.areas) return;

        data.areas.forEach(area => {
            const grade = area.grade;
            let color = "none", width = 0;
            switch (grade) {
                case "MajorWarning": color = "#C91EFB"; width = 12; break;
                case "Warning": color = "#DE080A"; width = 8; break;
                case "Watch": color = "#FEDC00"; width = 6; break;
            }
            tsunamiSvg.selectAll("path")
                .filter(function() {
                    const id = d3.select(this).attr("id");
                    return id === area.name || (id && id.includes(area.name));
                })
                .style("stroke", color)
                .style("stroke-width", `${width}px`)
                .raise();
        });
    };

    initMap();
</script>
</body>
</html>
