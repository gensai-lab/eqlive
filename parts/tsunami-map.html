<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background: transparent;
            width: 600px;  /* キャンバスサイズ固定 */
            height: 350px;
            overflow: hidden;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        #main-canvas {
            position: relative;
            width: 600px;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
        }

        #background-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            position: absolute;
        }

        #map-container {
            position: absolute;
            z-index: 2;
            pointer-events: none;
            /* 1500x1000から600x350に合わせて調整 */
            top: 0;
            left: -10px; 
            width: 100%;
            height: 100%;
        }

        #svg-area {
            position: relative;
            width: 100%;
            height: 100%;
        }

        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
        }

        .pref-path {
            fill: #333333;
            stroke: #555555;
            stroke-width: 0.2px;
        }

        @keyframes tsunami-blink {
            0%, 75% { opacity: 1; }
            75.1%, 100% { opacity: 0; }
        }

        .tsunami-layer {
            animation: tsunami-blink 4s infinite;
        }

        .tsunami-path {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s;
        }
    </style>
</head>
<body>

<div id="main-canvas">
    <img id="background-cover" src="../assets/cover/tsunami_cover.png" alt="tsunami-bg">
    
    <div id="map-container">
        <div id="svg-area"></div>
    </div>
</div>

<script type="module">
    let tsunamiSvg = null;

    // --- 【設定項目】サイズや位置を個別に微調整したい場合はここを変更 ---
    const config = {
        prefScale: 1.0,    // 都道府県の大きさ倍率
        tsunamiScale: 1.0, // 津波予報区の大きさ倍率
        offsetX: 0,        // 左右位置微調整
        offsetY: 0         // 上下位置微調整
    };

    async function initMap() {
        try {
            const [prefXml, tsunamiXml] = await Promise.all([
                d3.xml("../assets/svg/pref.svg"),
                d3.xml("../assets/svg/tsunami2_id.svg")
            ]);

            const svgArea = d3.select("#svg-area");
            
            // 各レイヤーの生成
            const prefNode = svgArea.append(() => prefXml.documentElement);
            prefNode.selectAll("path").classed("pref-path", true);

            const tsunamiLayer = svgArea.append("div").attr("class", "tsunami-layer");
            tsunamiSvg = tsunamiLayer.append(() => tsunamiXml.documentElement);
            tsunamiSvg.selectAll("path").classed("tsunami-path", true);

            [prefNode, tsunamiSvg].forEach(svg => svg.attr("width", null).attr("height", null));

            // 座標範囲の取得
            const pBbox = prefNode.node().getBBox();
            const tBbox = tsunamiSvg.node().getBBox();

            // 共通のベースとなるViewBoxを計算
            const minX = Math.min(pBbox.x, tBbox.x);
            const minY = Math.min(pBbox.y, tBbox.y);
            const width = Math.max(pBbox.x + pBbox.width, tBbox.x + tBbox.width) - minX;
            const height = Math.max(pBbox.y + pBbox.height, tBbox.y + tBbox.height) - minY;

            /**
             * 個別にスケールを適用したViewBoxを計算する関数
             * @param {number} scale - 倍率 (1.0が標準)
             */
            const getAdjustedViewBox = (scale) => {
                const adjW = width / scale;
                const adjH = height / scale;
                const diffW = (adjW - width) / 2;
                const diffH = (adjH - height) / 2;
                return `${minX - diffW - config.offsetX} ${minY - diffH - config.offsetY} ${adjW} ${adjH}`;
            };

            // 個別にViewBoxを適用
            prefNode.attr("viewBox", getAdjustedViewBox(config.prefScale))
                    .attr("preserveAspectRatio", "xMidYMid meet");

            tsunamiSvg.attr("viewBox", getAdjustedViewBox(config.tsunamiScale))
                      .attr("preserveAspectRatio", "xMidYMid meet");

        } catch (error) {
            console.error("Map initialization failed:", error);
        }
    }

    window.updateTsunamiMap = (data) => {
        if (!tsunamiSvg) return;
        tsunamiSvg.selectAll("path").style("stroke", "none").style("stroke-width", "0");
        if (!data || !data.areas) return;

        data.areas.forEach(area => {
            const grade = area.grade;
            let color = "none", width = 0;
            switch (grade) {
                case "MajorWarning": color = "#C91EFB"; width = 12; break;
                case "Warning": color = "#DE080A"; width = 8; break;
                case "Watch": color = "#FEDC00"; width = 6; break;
            }
            tsunamiSvg.selectAll("path")
                .filter(function() {
                    const id = d3.select(this).attr("id");
                    return id === area.name || (id && id.includes(area.name));
                })
                .style("stroke", color)
                .style("stroke-width", `${width}px`)
                .raise();
        });
    };

    initMap();
</script>
</body>
</html>
