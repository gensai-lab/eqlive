<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background: transparent;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            /* 左下に配置される想定 */
            display: flex;
            justify-content: flex-start; 
            align-items: flex-end;
        }

        #main-canvas {
            position: relative;
            height: 100vh;
            /* 背景画像の横幅に合わせるため auto */
            width: auto;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        #background-cover {
            height: 100%;
            width: auto;
            display: block;
            z-index: 1;
        }

        #map-container {
            position: absolute;
            /* 左寄せに固定 */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            /* 背景画像に対して微調整が必要な場合はここを調整 */
            padding: 20px; 
            box-sizing: border-box;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .pref-path {
            fill: #444444;
            stroke: #666666;
            stroke-width: 0.5px;
        }

        @keyframes tsunami-blink {
            0%, 75% { opacity: 1; }
            75.1%, 100% { opacity: 0; }
        }

        .tsunami-layer {
            animation: tsunami-blink 4s infinite;
        }

        .tsunami-path {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s;
        }
    </style>
</head>
<body>

<div id="main-canvas">
    <img id="background-cover" src="../assets/cover/tsunami_cover.png" alt="tsunami-bg">
    
    <div id="map-container">
        <div id="svg-area" style="position: relative; width: 100%; height: 100%;"></div>
    </div>
</div>

<script type="module">
    let tsunamiSvg = null;

    async function initMap() {
        try {
            const [prefXml, tsunamiXml] = await Promise.all([
                d3.xml("../assets/svg/pref.svg"),
                d3.xml("../assets/svg/tsunami2_id.svg")
            ]);

            const svgArea = d3.select("#svg-area");
            
            // 重ね合わせるために絶対座標で配置
            const prefNode = svgArea.append("div")
                .style("position", "absolute")
                .style("width", "100%")
                .style("height", "100%")
                .append(() => prefXml.documentElement);
                
            prefNode.selectAll("path").classed("pref-path", true);

            const tsunamiLayer = svgArea.append("div")
                .attr("class", "tsunami-layer")
                .style("position", "absolute")
                .style("width", "100%")
                .style("height", "100%");
                
            tsunamiSvg = tsunamiLayer.append(() => tsunamiXml.documentElement);
            tsunamiSvg.selectAll("path").classed("tsunami-path", true);

            const autoFit = (svgElement) => {
                const bbox = svgElement.node().getBBox();
                const margin = 20;
                svgElement
                    .attr("viewBox", `${bbox.x - margin} ${bbox.y - margin} ${bbox.width + margin * 2} ${bbox.height + margin * 2}`)
                    .attr("preserveAspectRatio", "xMidYMid meet")
                    .attr("width", "100%")
                    .attr("height", "100%");
            };

            autoFit(prefNode);
            autoFit(tsunamiSvg);

        } catch (error) {
            console.error("Map initialization failed:", error);
        }
    }

    window.updateTsunamiMap = (data) => {
        if (!tsunamiSvg) return;
        tsunamiSvg.selectAll("path").style("stroke", "none").style("stroke-width", "0");
        if (!data || !data.areas) return;

        data.areas.forEach(area => {
            const grade = area.grade;
            let color = "none", width = 0;
            switch (grade) {
                case "MajorWarning": color = "#C91EFB"; width = 18; break;
                case "Warning": color = "#DE080A"; width = 12; break;
                case "Watch": color = "#FEDC00"; width = 10; break;
            }
            tsunamiSvg.selectAll("path")
                .filter(function() {
                    const id = d3.select(this).attr("id");
                    return id === area.name || (id && id.includes(area.name));
                })
                .style("stroke", color)
                .style("stroke-width", `${width}px`)
                .raise();
        });
    };

    initMap();
</script>
</body>
</html>
