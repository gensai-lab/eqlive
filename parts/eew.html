<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        /* フォント設定 */
        @font-face {
            font-family: 'UDKakugo-DB';
            src: url('../assets/fonts/FOT-UDKakugo_LargePr6-DB.otf');
        }
        @font-face {
            font-family: 'UDKakugoC80-B';
            src: url('../assets/fonts/FOT-UDKakugoC80Pro-B.otf');
        }

        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
        }

        /* 全体サイズ 1300x371 */
        #eew-container {
            position: relative;
            width: 1300px;
            height: 371px;
            background: transparent;
            display: none;
        }

        /* 背景SVG */
        #base-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 1300px;
            height: 371px;
            z-index: 1;
        }

        /* 震源地の表示 (文字) */
        #display-hypocenter-name {
            position: absolute;
            left: 701px;
            top: 25px;
            width: 570px;
            height: 42px;
            z-index: 2;
            font-family: 'UDKakugo-DB', sans-serif;
            font-size: 42px;
            color: #FFFF00;
            text-align: right;
            line-height: 1;
            white-space: nowrap;
            font-weight: normal; 
        }

        /* マップ (iframe) */
        #map-frame {
            position: absolute;
            left: 850px;
            top: 93px;
            width: 450.23px;
            height: 276.83px;
            z-index: 2;
            border: none;
        }

        /* 強い揺れが予想される地域（共通設定） */
        .area-text {
            position: absolute;
            left: 39px;
            width: 770px;
            height: 145px;
            z-index: 2;
            font-family: 'UDKakugoC80-B', sans-serif;
            font-size: 61px;
            color: #FFFFFF;
            text-align: left;
            line-height: 1.2;
            font-weight: normal; 
        }

        #area-row1 { top: 189px; }
        #area-row2 { top: 273px; }
    </style>
</head>
<body>

<div id="eew-container">
    <img id="base-svg" src="../assets/svg/eew.svg">

    <div id="display-hypocenter-name"></div>

    <div id="area-row1" class="area-text"></div>
    <div id="area-row2" class="area-text"></div>

    <iframe id="map-frame" src="eew-map.html"></iframe>
</div>

<script>
    const API_URL = "https://api.p2pquake.net/v2/history?codes=556&limit=1";
    let lastId = "";
    let expireTime = null; 
    let isTested = false;

    async function checkEEW() {
        if (!isTested) {
            const testData = {
                "id": "test-" + Date.now(),
                "earthquake": {
                    "hypocenter": {
                        "name": "奈良県",
                        "latitude": 34.4, // 地図に渡すための緯度
                        "longitude": 135.8, // 地図に渡すための経度
                        "magnitude": 5.7,
                        "depth": 80
                    }
                },
                "areas": [
                    { "pref": "奈良" }, { "pref": "和歌山" }, { "pref": "大阪" },
                    { "pref": "三重" }, { "pref": "兵庫" }, { "pref": "京都" }
                ],
                "cancelled": false
            };

            lastId = testData.id;
            processEEW(testData);
            isTested = true;
            return;
        }

        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            if (!data || data.length === 0) return;
            const eew = data[0];
            if (eew.id !== lastId) {
                lastId = eew.id;
                processEEW(eew);
            }
        } catch (e) {
            console.error("API Fetch Error:", e);
        }
    }

    function processEEW(eew) {
        if (eew.cancelled) {
            hideContainer();
            return;
        }

        expireTime = new Date(Date.now() + 60000); 

        // 震源地テキスト更新
        document.getElementById("display-hypocenter-name").innerText = eew.earthquake.hypocenter.name + "で地震";

        // 都道府県テキスト更新
        const prefSet = new Set();
        eew.areas.forEach(area => prefSet.add(area.pref));
        const uniquePrefs = Array.from(prefSet);

        let row1 = "";
        let row2 = "";
        let currentText = "";

        uniquePrefs.forEach((pref) => {
            const nextPart = (currentText === "" ? "" : "　") + pref;
            if ((currentText + nextPart).length <= 14 && row2 === "") {
                currentText += nextPart;
                row1 = currentText;
            } else {
                if (row2 === "") {
                    currentText = pref;
                    row2 = currentText;
                } else {
                    const nextPartRow2 = "　" + pref;
                    if ((row2 + nextPartRow2).length <= 14) {
                        row2 += nextPartRow2;
                    }
                }
            }
        });

        document.getElementById("area-row1").innerText = row1;
        document.getElementById("area-row2").innerText = row2;

        // 表示開始
        document.getElementById("eew-container").style.display = "block";

        // 【ここが重要】iframeのリロードではなく、中の関数にデータを直接渡す
        const mapFrame = document.getElementById("map-frame");
        if (mapFrame.contentWindow && typeof mapFrame.contentWindow.updateMapFromParent === 'function') {
            mapFrame.contentWindow.updateMapFromParent(eew);
        } else {
            // iframeのロードがまだの場合は少し待ってから実行
            mapFrame.onload = () => {
                mapFrame.contentWindow.updateMapFromParent(eew);
            };
        }
    }

    function hideContainer() {
        document.getElementById("eew-container").style.display = "none";
        expireTime = null;
    }

    function monitorTime() {
        if (expireTime) {
            const now = new Date();
            if (now >= expireTime) {
                hideContainer();
            }
        }
        requestAnimationFrame(monitorTime);
    }

    setInterval(checkEEW, 3000);
    checkEEW();
    monitorTime();
</script>
</body>
</html>
