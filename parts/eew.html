<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'UDKakugo-DB';
            src: url('../assets/fonts/FOT-UDKakugo_LargePr6-DB.otf');
        }
        @font-face {
            font-family: 'UDKakugoC80-B';
            src: url('../assets/fonts/FOT-UDKakugoC80Pro-B.otf');
        }

        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
        }

        #eew-container {
            position: relative;
            width: 1300px;
            height: 371px;
            background: transparent;
            display: none; 
        }

        #base-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 1300px;
            height: 371px;
            z-index: 1;
        }

        #display-hypocenter-name {
            position: absolute;
            left: 701px;
            top: 25px;
            width: 570px;
            height: 42px;
            z-index: 2;
            font-family: 'UDKakugo-DB', sans-serif;
            font-size: 42px;
            color: #FFFF00;
            text-align: right;
            line-height: 1;
            white-space: nowrap;
            font-weight: normal;
        }

        #map-frame {
            position: absolute;
            left: 815px; 
            top: 91px;  
            width: 485px;
            height: 279px;
            z-index: 2;
            border: none;
            background: #002060;
            border-bottom-right-radius: 12px;
        }

        .area-text {
            position: absolute;
            left: 39px;
            width: 770px;
            height: 145px;
            z-index: 2;
            font-family: 'UDKakugoC80-B', sans-serif;
            font-size: 61px;
            color: #FFFFFF;
            text-align: left;
            line-height: 1.1;
            font-weight: normal !important; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            letter-spacing: 0.01em;
        }

        #area-row1 { top: 187px; }
        #area-row2 { top: 273px; }
    </style>
</head>
<body>

<div id="eew-container">
    <img id="base-svg" src="../assets/svg/eew.svg">
    <div id="display-hypocenter-name"></div>
    <div id="area-row1" class="area-text"></div>
    <div id="area-row2" class="area-text"></div>
    <iframe id="map-frame" src="eew-map.html"></iframe>
</div>

<script>
    const API_URL = "https://api.p2pquake.net/v2/history?codes=556&limit=1";
    let lastId = "";
    let expireTime = null; 
    let isFirstCheck = true; // 初回チェック判定フラグ

    async function checkEEW() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            if (!data || data.length === 0) return;
            const eew = data[0];

            // 1. 初回起動時は最新のIDを覚えるだけで、表示はしない
            if (isFirstCheck) {
                lastId = eew.id;
                isFirstCheck = false;
                console.log("Monitoring started. Last ID set to:", lastId);
                return;
            }

            // 2. IDが変わった（新しい速報が出た）時だけ処理を行う
            if (eew.id !== lastId) {
                lastId = eew.id;
                processEEW(eew);
            }
        } catch (e) {
            console.error("API Fetch Error:", e);
        }
    }

    function processEEW(eew) {
        if (eew.cancelled) {
            hideContainer();
            return;
        }

        // 親要素へ通知
        window.parent.postMessage('playEEWAudio', '*');

        expireTime = new Date(Date.now() + 60000); 
        document.getElementById("display-hypocenter-name").innerText = eew.earthquake.hypocenter.name + "で地震";

        const prefSet = new Set();
        eew.areas.forEach(area => prefSet.add(area.pref));
        const uniquePrefs = Array.from(prefSet);

        let row1 = "", row2 = "", currentText = "";
        uniquePrefs.forEach((pref) => {
            const nextPart = (currentText === "" ? "" : "　") + pref;
            if ((currentText + nextPart).length <= 14 && row2 === "") {
                currentText += nextPart;
                row1 = currentText;
            } else {
                if (row2 === "") { currentText = pref; row2 = currentText; }
                else {
                    const nextPartRow2 = "　" + pref;
                    if ((row2 + nextPartRow2).length <= 14) row2 += nextPartRow2;
                }
            }
        });

        document.getElementById("area-row1").innerText = row1;
        document.getElementById("area-row2").innerText = row2;

        const mapFrame = document.getElementById("map-frame");
        const sendData = () => {
            // 先にコンテナを表示してから、レイアウトが確定するのを待って地図を更新する。
            // （非表示＝display:noneのうちにLeafletのinvalidateSize/fitBoundsを呼ぶと
            //   地図のサイズが正しく取得できず、正常に描画されなくなるため）
            document.getElementById("eew-container").style.display = "block";
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    mapFrame.contentWindow.updateMapFromParent(eew);
                });
            });
        };

        if (mapFrame.contentWindow && typeof mapFrame.contentWindow.updateMapFromParent === 'function') {
            sendData();
        } else {
            mapFrame.onload = sendData;
        }
    }

    function hideContainer() {
        document.getElementById("eew-container").style.display = "none";
        expireTime = null;
    }

    function monitorTime() {
        if (expireTime && new Date() >= expireTime) hideContainer();
        requestAnimationFrame(monitorTime);
    }

    setInterval(checkEEW, 3000);
    checkEEW();
    monitorTime();
</script>
</body>
</html>
