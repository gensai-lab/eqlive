<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>EQLive L-Screen</title>
    <style>
        /* フォントの読み込み */
        @font-face {
            font-family: 'FOT-UDKakugo_LargePr6-DB';
            src: url('assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
        }

        body, html {
            margin: 0; padding: 0;
            width: 1920px; height: 1080px;
            background-color: black;
            overflow: hidden;
            font-family: 'FOT-UDKakugo_LargePr6-DB', sans-serif;
        }

        /* L字背景画像：全面配置 */
        #l-background {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        /* Sub Switcher エリア：パーセントで調整可能 */
        #main-content {
            position: absolute;
            top: 105px;  /* 背景デザインに合わせて微調整してください */
            left: 210px; 
            /* --- ここでサイズ（％）を調整 --- */
            width: 87.5%; 
            height: 87.5%;
            /* ---------------------------- */
            z-index: 2;
            overflow: hidden;
        }

        #main-content iframe {
            width: 1920px;
            height: 1080px;
            border: none;
            /* 親要素に合わせて自動フィット */
            transform-origin: top left;
        }

        /* --- 各種テキスト：絶対座標指定 --- */
        .text-overlay {
            position: absolute;
            z-index: 10;
            color: white;
            line-height: 1;
        }

        /* 左側タイトル（縦書き） */
        #l-title {
            top: 50px;
            left: 50px;
            font-size: 115px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-weight: bold;
            letter-spacing: 0.05em;
        }

        /* ジャンル（透明ボックス・中央揃え） */
        #genre-container {
            top: 39px;
            left: 217px;
            width: 220px;
            height: 60px; /* サイズに余裕を持たせる */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #info-genre {
            font-size: 46px;
            white-space: nowrap;
            display: inline-block;
        }

        /* メインテキスト（透明ボックス・左揃え） */
        #main-text-container {
            top: 39px;
            left: 466px;
            width: 1380px;
            height: 60px;
            display: flex;
            align-items: center;
        }

        #info-main {
            font-size: 46px;
            white-space: nowrap;
            transition: opacity 0.8s ease-in-out;
        }

        .fade-out { opacity: 0; }
    </style>
</head>
<body>

    <img id="l-background" src="assets/cover/Lscreen.png" alt="L-Screen BG">

    <div id="main-content">
        <iframe id="sub-switcher-frame" src="sub-switcher.html"></iframe>
    </div>

    <div id="l-title" class="text-overlay">北海道・東北 津波警報</div>

    <div id="genre-container" class="text-overlay">
        <div id="info-genre">地震</div>
    </div>

    <div id="main-text-container" class="text-overlay">
        <div id="info-main">情報を読み込んでいます...</div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const titleEl = document.getElementById('l-title');
    const genreEl = document.getElementById('info-genre');
    const mainEl = document.getElementById('info-main');
    const iframe = document.getElementById('sub-switcher-frame');

    let infoList = [];
    let currentIndex = 0;
    let isLooping = false;

    // iframeのスケールをコンテナに合わせて自動計算
    function adjustIframeScale() {
        const container = document.getElementById('main-content');
        const scale = container.offsetWidth / 1920;
        iframe.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', adjustIframeScale);
    adjustIframeScale();

    // ジャンルの文字溢れ調整（210pxを超えたら縮小）
    function adjustGenreFontSize() {
        const maxWidth = 210;
        genreEl.style.transform = "scale(1)";
        const currentWidth = genreEl.offsetWidth;
        if (currentWidth > maxWidth) {
            const scale = maxWidth / currentWidth;
            genreEl.style.transform = `scale(${scale})`;
            genreEl.style.transformOrigin = "center center";
        }
    }

    // Firebase監視
    onValue(ref(db, 'broadcast/lscreen'), (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        if (data.title) titleEl.textContent = data.title;

        if (data.news) {
            infoList = Object.values(data.news);
            if (infoList.length > 0 && !isLooping) {
                isLooping = true;
                startTextLoop();
            }
        }
    });

    function startTextLoop() {
        showText();
        setInterval(nextText, 10000);
    }

    function showText() {
        if (infoList.length === 0) return;
        const current = infoList[currentIndex];

        mainEl.classList.add('fade-out');

        setTimeout(() => {
            genreEl.textContent = current.genre || "情報";
            mainEl.textContent = current.text || "";
            
            adjustGenreFontSize(); // 文字数に応じた縮小適用
            mainEl.classList.remove('fade-out');
        }, 800);
    }

    function nextText() {
        if (infoList.length === 0) return;
        currentIndex = (currentIndex + 1) % infoList.length;
        showText();
    }
</script>
</body>
</html>
