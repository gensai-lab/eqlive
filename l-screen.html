<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>EQLive L-Screen</title>
    <style>
        @font-face {
            font-family: 'FOT-UDKakugo_LargePr6-B';
            src: url('assets/fonts/FOT-UDKakugo_LargePr6-B.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        body, html {
            margin: 0; padding: 0;
            width: 1920px; height: 1080px;
            background-color: black;
            overflow: hidden;
            font-family: 'FOT-UDKakugo_LargePr6-B', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        #l-background {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        #main-content {
            position: absolute;
            top: 121px;
            left: 216px;
            width: 88%;
            height: 88%;
            z-index: 2;
            overflow: hidden;
        }

        #main-content iframe {
            width: 1920px;
            height: 1080px;
            border: none;
            transform-origin: top left;
        }

        .text-overlay {
            position: absolute;
            z-index: 10;
            line-height: 100%;
        }

        /* 左側タイトル */
        #title-container {
            position: absolute;
            top: 40px;
            left: 22px;
            height: 980px;
            width: 180px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: visible;
        }

        #l-title {
            color: #003EB3;
            font-family: 'FOT-UDKakugo_LargePr6-B', sans-serif;
            font-size: 116px; /* 基準サイズを116pxに変更 */
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-weight: normal;
            letter-spacing: 0.02em;
            white-space: nowrap;
            padding-top: 10px;
            display: block;
            transform-origin: top center;
        }

        /* --- 文字別の個別調整 --- */
        
        .tight-space {
            display: inline-block;
            height: 0.15em; /* 縦書き時のスペースの幅（高さ） */
            letter-spacing: 0;
            visibility: hidden;
        }

        .tight-dot {
            display: inline-block;
            margin-top: -0.25em;
            margin-bottom: -0.25em;
            transform: scaleY(1.1);
        }

        #genre-container {
            top: 32px;
            left: 217px;
            width: 220px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        #info-genre {
            font-size: 46px;
            white-space: nowrap;
            display: inline-block;
            transform-origin: center center; /* 中央基準で横に縮める */
        }

        #main-text-container {
            top: 32px;
            left: 466px;
            width: 1380px;
            height: 60px;
            display: flex;
            align-items: center;
            color: white;
        }

        #info-main {
            font-size: 46px;
            white-space: nowrap;
            transition: opacity 0.8s ease-in-out;
        }

        .fade-out { opacity: 0; }
    </style>
</head>
<body>

    <img id="l-background" src="assets/cover/Lscreen.png" alt="L-Screen BG">

    <div id="main-content">
        <iframe id="sub-switcher-frame" src="sub-switcher.html"></iframe>
    </div>

    <div id="title-container" class="text-overlay">
        <div id="l-title"></div>
    </div>

    <div id="genre-container" class="text-overlay">
        <div id="info-genre"></div>
    </div>

    <div id="main-text-container" class="text-overlay">
        <div id="info-main"></div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const titleEl = document.getElementById('l-title');
    const genreEl = document.getElementById('info-genre');
    const mainEl = document.getElementById('info-main');
    const iframe = document.getElementById('sub-switcher-frame');

    let infoList = [];
    let currentIndex = 0;
    let isLooping = false;

    /**
     * 文字詰め処理（完全リセット版）
     * 文字列を一度プレーンテキストにしてから、一文字ずつ再構築します。
     */
    function applyTightText(element, text) {
        if (!text) {
            element.innerHTML = "";
            return;
        }

        // 1. まず既存のタグを完全に除去（テキストのみ抽出）
        const temp = document.createElement("div");
        temp.innerHTML = text;
        const pureText = temp.textContent || temp.innerText || "";

        // 2. 文字を配列に分解して、一文字ずつチェック
        const chars = Array.from(pureText);
        const htmlOutput = chars.map(char => {
            if (char === '・') {
                return `<span class="tight-dot">・</span>`;
            } else if (char === ' ' || char === '　') { // 半角・全角スペース両対応
                return `<span class="tight-space"> </span>`;
            } else {
                return char; // 普通の文字はそのまま
            }
        }).join('');

        element.innerHTML = htmlOutput;
    }

    // タイトルの縦幅調整（980px超過時）
    function adjustTitleSize() {
        const maxHeight = 980;
        titleEl.style.transform = "scaleY(1)";
        const currentHeight = titleEl.offsetHeight;
        if (currentHeight > maxHeight) {
            const scaleY = maxHeight / currentHeight;
            titleEl.style.transform = `scaleY(${scaleY})`;
        }
    }

    // ジャンルの横幅調整（210px超過時、横方向のみ縮小）
    function adjustGenreFontSize() {
        const maxWidth = 210;
        genreEl.style.transform = "scaleX(1)"; // 一旦リセット
        const currentWidth = genreEl.offsetWidth;
        if (currentWidth > maxWidth) {
            const scaleX = maxWidth / currentWidth;
            genreEl.style.transform = `scaleX(${scaleX})`;
        }
    }

    function adjustIframeScale() {
        const container = document.getElementById('main-content');
        const scale = container.offsetWidth / 1920;
        iframe.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', () => {
        adjustIframeScale();
        adjustTitleSize();
    });
    adjustIframeScale();

    // Firebaseデータの購読
    onValue(ref(db, 'broadcast/l_shape'), (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        if (data.leftText !== undefined) {
            applyTightText(titleEl, data.leftText);
            // DOM更新後に高さを測るため少し待機
            setTimeout(adjustTitleSize, 50);
        }

        if (data.topItems) {
            infoList = Object.values(data.topItems);
            if (infoList.length > 0 && !isLooping) {
                isLooping = true;
                startTextLoop();
            }
        }
    });

    function startTextLoop() {
        showText();
        setInterval(nextText, 10000);
    }

    function showText() {
        if (infoList.length === 0) return;
        if (currentIndex >= infoList.length) currentIndex = 0;
        const current = infoList[currentIndex];

        mainEl.classList.add('fade-out');

        setTimeout(() => {
            genreEl.textContent = current.genre || "";
            mainEl.textContent = current.text || "";
            adjustGenreFontSize(); // ジャンルのリサイズを実行
            mainEl.classList.remove('fade-out');
        }, 800);
    }

    function nextText() {
        if (infoList.length === 0) return;
        currentIndex = (currentIndex + 1) % infoList.length;
        showText();
    }
</script>
</body>
</html>
