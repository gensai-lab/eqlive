<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>EQLive L-Screen</title>
    <style>
        /* 放送基準フォントの設定（端末に入っていない場合はUD系ゴシックが選ばれます） */
        body, html {
            margin: 0; padding: 0;
            width: 1920px; height: 1080px;
            background-color: #002080; /* NHK風の濃い青 */
            overflow: hidden;
            font-family: 'A-OTF UD Shin Go', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
        }

        /* 配信映像エリア（右下に配置） */
        #main-content {
            position: absolute;
            top: 105px;  /* 上帯の高さ分下げる */
            left: 210px; /* 左帯の幅分右に寄せる */
            width: 1670px; 
            height: 940px; 
            background-color: #000;
            z-index: 2;
        }

        #main-content iframe {
            width: 1920px;
            height: 1080px;
            border: none;
            transform: scale(0.87); /* 枠に合わせて縮小調整 */
            transform-origin: top left;
        }

        /* --- 左側：タイトルエリア（縦書き） --- */
        #l-title-container {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 160px;
            height: 1040px;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
            z-index: 10;
        }

        #l-title {
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-size: 85px;
            font-weight: 900;
            color: #002080;
            letter-spacing: 0.1em;
        }

        /* --- 上側：情報エリア --- */
        #info-bar {
            position: absolute;
            top: 20px;
            left: 210px;
            width: 1670px;
            height: 65px;
            background-color: #001040; /* ニュース帯の背景 */
            display: flex;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
            box-sizing: border-box;
        }

        #info-genre {
            background-color: #0040D0; /* ジャンルの青ボックス */
            color: white;
            font-size: 32px;
            font-weight: bold;
            padding: 5px 40px;
            border-radius: 3px;
            margin-right: 30px;
            min-width: 180px;
            text-align: center;
        }

        #info-main {
            color: white;
            font-size: 42px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            transition: opacity 0.8s ease-in-out;
        }

        /* フェード用CSS */
        .fade-out { opacity: 0; }
    </style>
</head>
<body>

    <div id="main-content">
        <iframe src="sub-switcher.html"></iframe>
    </div>

    <div id="l-title-container">
        <div id="l-title">北海道・東北 津波警報</div>
    </div>

    <div id="info-bar">
        <div id="info-genre">地震</div>
        <div id="info-main">情報を読み込んでいます...</div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const titleEl = document.getElementById('l-title');
    const genreEl = document.getElementById('info-genre');
    const mainEl = document.getElementById('info-main');

    let infoList = [];
    let currentIndex = 0;
    let isLooping = false;

    // Firebaseから設定取得
    onValue(ref(db, 'broadcast/lscreen'), (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        // 左側縦書きタイトル更新
        if (data.title) titleEl.textContent = data.title;

        // ニュースリスト更新
        if (data.news) {
            infoList = Object.values(data.news);
            if (infoList.length > 0 && !isLooping) {
                isLooping = true;
                startTextLoop();
            }
        }
    });

    function startTextLoop() {
        showText();
        setInterval(nextText, 10000); // 10秒毎に切り替え
    }

    function showText() {
        if (infoList.length === 0) return;
        const current = infoList[currentIndex];

        // フェードアウト
        mainEl.classList.add('fade-out');

        setTimeout(() => {
            genreEl.textContent = current.genre || "情報";
            mainEl.textContent = current.text || "";
            // フェードイン
            mainEl.classList.remove('fade-out');
        }, 800);
    }

    function nextText() {
        if (infoList.length === 0) return;
        currentIndex = (currentIndex + 1) % infoList.length;
        showText();
    }
</script>
</body>
</html>
