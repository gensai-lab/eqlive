<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>EQLive L-Screen</title>
    <style>
        @font-face {
            font-family: 'FOT-UDKakugo_LargePr6-DB';
            src: url('assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
            /* フォント本来の太さを維持するため normal 指定 */
            font-weight: normal; 
        }

        body, html {
            margin: 0; padding: 0;
            width: 1920px; height: 1080px;
            background-color: black;
            overflow: hidden;
            font-family: 'FOT-UDKakugo_LargePr6-DB', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #l-background {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        #main-content {
            position: absolute;
            top: 105px;
            left: 210px; 
            width: 87.5%; 
            height: 87.5%;
            z-index: 2;
            overflow: hidden;
        }

        #main-content iframe {
            width: 1920px;
            height: 1080px;
            border: none;
            transform-origin: top left;
        }

        .text-overlay {
            position: absolute;
            z-index: 10;
            line-height: 1.1;
        }

        /* 左側タイトル */
        #title-container {
            position: absolute;
            top: 50px;
            left: 50px;
            height: 980px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        #l-title {
            color: #003EB3; /* 指定の色に変更 */
            font-size: 115px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            /* 合成太字を避けるため normal に設定 */
            font-weight: normal; 
            letter-spacing: 0.12em; /* 文字の間隔を広げて高級感を出す */
            white-space: nowrap;
            /* アンチエイリアスを綺麗に出すための設定 */
            text-rendering: optimizeLegibility;
        }

        #genre-container {
            top: 39px;
            left: 217px;
            width: 220px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
        }

        #info-genre {
            font-size: 46px;
            white-space: nowrap;
            display: inline-block;
            font-weight: normal;
        }

        #main-text-container {
            top: 39px;
            left: 466px;
            width: 1380px;
            height: 60px;
            display: flex;
            align-items: center;
            color: white;
        }

        #info-main {
            font-size: 46px;
            white-space: nowrap;
            font-weight: normal;
            transition: opacity 0.8s ease-in-out;
        }

        .fade-out { opacity: 0; }
    </style>
</head>
<body>

    <img id="l-background" src="assets/cover/Lscreen.png" alt="L-Screen BG">

    <div id="main-content">
        <iframe id="sub-switcher-frame" src="sub-switcher.html"></iframe>
    </div>

    <div id="title-container" class="text-overlay">
        <div id="l-title"></div>
    </div>

    <div id="genre-container" class="text-overlay">
        <div id="info-genre"></div>
    </div>

    <div id="main-text-container" class="text-overlay">
        <div id="info-main"></div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const titleEl = document.getElementById('l-title');
    const genreEl = document.getElementById('info-genre');
    const mainEl = document.getElementById('info-main');
    const iframe = document.getElementById('sub-switcher-frame');

    let infoList = [];
    let currentIndex = 0;
    let isLooping = false;

    function adjustTitleSize() {
        const maxHeight = 980;
        titleEl.style.transform = "scale(1)";
        const currentHeight = titleEl.offsetHeight;
        if (currentHeight > maxHeight) {
            const scale = maxHeight / currentHeight;
            titleEl.style.transform = `scale(${scale})`;
            titleEl.style.transformOrigin = "top center";
        }
    }

    function adjustGenreFontSize() {
        const maxWidth = 210;
        genreEl.style.transform = "scale(1)";
        const currentWidth = genreEl.offsetWidth;
        if (currentWidth > maxWidth) {
            const scale = maxWidth / currentWidth;
            genreEl.style.transform = `scale(${scale})`;
            genreEl.style.transformOrigin = "center center";
        }
    }

    function adjustIframeScale() {
        const container = document.getElementById('main-content');
        const scale = container.offsetWidth / 1920;
        iframe.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', () => {
        adjustIframeScale();
        adjustTitleSize();
    });
    adjustIframeScale();

    onValue(ref(db, 'broadcast/l_shape'), (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        if (data.leftText !== undefined) {
            titleEl.textContent = data.leftText;
            setTimeout(adjustTitleSize, 50);
        }

        if (data.topItems) {
            infoList = Object.values(data.topItems);
            if (infoList.length > 0 && !isLooping) {
                isLooping = true;
                startTextLoop();
            }
        } else {
            infoList = [];
            genreEl.textContent = "";
            mainEl.textContent = "";
        }
    });

    function startTextLoop() {
        showText();
        setInterval(nextText, 10000);
    }

    function showText() {
        if (infoList.length === 0) return;
        if (currentIndex >= infoList.length) currentIndex = 0;
        const current = infoList[currentIndex];

        mainEl.classList.add('fade-out');

        setTimeout(() => {
            genreEl.textContent = current.genre || "";
            mainEl.textContent = current.text || "";
            adjustGenreFontSize();
            mainEl.classList.remove('fade-out');
        }, 800);
    }

    function nextText() {
        if (infoList.length === 0) return;
        currentIndex = (currentIndex + 1) % infoList.length;
        showText();
    }
</script>
</body>
</html>
