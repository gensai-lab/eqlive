<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>EQLive L-Screen</title>
    <style>
        @font-face {
            font-family: 'FOT-UDKakugo_LargePr6-DB';
            src: url('assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
            font-weight: normal; 
        }

        body, html {
            margin: 0; padding: 0;
            width: 1920px; height: 1080px;
            background-color: black;
            overflow: hidden;
            font-family: 'FOT-UDKakugo_LargePr6-DB', sans-serif;
        }

        #l-background {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        #main-content {
            position: absolute;
            top: 105px;
            left: 210px; 
            width: 87.5%; 
            height: 87.5%;
            z-index: 2;
            overflow: hidden;
        }

        #main-content iframe {
            width: 1920px;
            height: 1080px;
            border: none;
            transform-origin: top left;
        }

        .text-overlay {
            position: absolute;
            z-index: 10;
        }

        /* --- 左側縦書きエリアの修正 --- */
        #title-container {
            position: absolute;
            top: 40px;   /* 背景の白い枠に合わせて微調整 */
            left: 25px;  /* 背景の白い枠に合わせて微調整 */
            width: 160px; /* 白い枠の幅に合わせる */
            height: 1000px; /* 白い枠の高さに合わせる */
            display: flex;
            flex-direction: column;
            justify-content: center; /* 中央配置 */
            align-items: center;
            overflow: hidden;
        }

        #l-title {
            color: #003EB3;
            font-size: 115px;
            writing-mode: vertical-rl;
            text-orientation: upright;
            font-weight: normal;
            line-height: 1.1;
            letter-spacing: 0.05em;
            white-space: nowrap;
            /* 突き抜け防止：中身に合わせて伸縮 */
            display: inline-block;
            text-align: center;
        }

        /* --- 上部情報エリア --- */
        #genre-container {
            top: 39px;
            left: 217px;
            width: 220px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        #info-genre {
            font-size: 46px;
            white-space: nowrap;
        }

        #main-text-container {
            top: 39px;
            left: 466px;
            width: 1380px;
            height: 60px;
            display: flex;
            align-items: center;
            color: white;
        }

        #info-main {
            font-size: 46px;
            white-space: nowrap;
            transition: opacity 0.8s ease-in-out;
        }

        .fade-out { opacity: 0; }
    </style>
</head>
<body>

    <img id="l-background" src="assets/cover/Lscreen.png" alt="L-Screen BG">

    <div id="main-content">
        <iframe id="sub-switcher-frame" src="sub-switcher.html"></iframe>
    </div>

    <div id="title-container">
        <div id="l-title"></div>
    </div>

    <div id="genre-container" class="text-overlay">
        <div id="info-genre"></div>
    </div>

    <div id="main-text-container" class="text-overlay">
        <div id="info-main"></div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const titleEl = document.getElementById('l-title');
    const containerEl = document.getElementById('title-container');
    const genreEl = document.getElementById('info-genre');
    const mainEl = document.getElementById('info-main');

    // 縦書きの突き抜けを防止するリサイズ関数
    function adjustTitleLayout() {
        const maxHeight = containerEl.offsetHeight - 40; // 上下余白
        titleEl.style.transform = "scale(1)";
        
        // 要素の実際の高さを取得
        const currentHeight = titleEl.scrollHeight;
        
        if (currentHeight > maxHeight) {
            const scale = maxHeight / currentHeight;
            titleEl.style.transform = `scale(${scale})`;
            titleEl.style.transformOrigin = "center center";
        }
    }

    onValue(ref(db, 'broadcast/l_shape'), (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        if (data.leftText !== undefined) {
            titleEl.textContent = data.leftText;
            // フォントの読み込みや描画を待ってから実行
            requestAnimationFrame(() => {
                adjustTitleLayout();
            });
        }
        
        // (中略: infoListの更新処理などは前回と同じ)
        if (data.topItems) {
            window.infoList = Object.values(data.topItems);
            if (window.infoList.length > 0 && !window.isLooping) {
                window.isLooping = true;
                startTextLoop();
            }
        }
    });

    // 文字列ループ処理 (前回同様)
    function startTextLoop() {
        showText();
        setInterval(nextText, 10000);
    }
    function showText() {
        if (!window.infoList || window.infoList.length === 0) return;
        const current = window.infoList[window.currentIndex || 0];
        mainEl.classList.add('fade-out');
        setTimeout(() => {
            genreEl.textContent = current.genre || "";
            mainEl.textContent = current.text || "";
            mainEl.classList.remove('fade-out');
        }, 800);
    }
    function nextText() {
        if (!window.infoList) return;
        window.currentIndex = ((window.currentIndex || 0) + 1) % window.infoList.length;
        showText();
    }
</script>
</body>
</html>
