<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>EQLive Sub-Switcher</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 1920px; height: 1080px;
            background-color: black;
            overflow: hidden;
        }

        /* 背面のメインコンテンツエリア（main-screen.htmlを表示） */
        #bg-layer {
            position: absolute;
            top: 0; left: 0;
            width: 1920px; height: 1080px;
            z-index: 1;
        }

        /* 前面の共通パーツ（オーバーレイ） */
        .overlay-part {
            position: absolute;
            z-index: 10;
            pointer-events: none;
            /* 非表示時のアニメーション */
            transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
        }

        /* 各パーツの配置 */
        .top-left { top: 6px; left: 20px; width: 700px; height: 150px; }
        .top-right { top: 40px; right: 40px; width: 600px; height: 145px; }
        .bottom-left { bottom: 40px; left: 0px; width: 1250px; height: 176px; }

        /* 右下: 津波地図（初期状態は非表示） */
        .bottom-right { 
            bottom: 40px; 
            right: 40px; 
            width: 600px; 
            height: 350px; 
            background-color: rgba(0, 0, 0, 0.9);
            border-radius: 8px;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
        }

        /* 表示状態のクラス */
        .is-active {
            opacity: 1;
            transform: translateY(0);
        }

        iframe {
            width: 100%; height: 100%;
            border: none; display: block;
        }
    </style>
</head>
<body>

    <div id="bg-layer">
        <iframe src="main-screen.html"></iframe>
    </div>

    <div class="overlay-part top-left">
        <iframe src="parts/time.html"></iframe>
    </div>

    <div class="overlay-part top-right">
        <iframe src="parts/tsunami-yobikake.html"></iframe>
    </div>

    <div class="overlay-part bottom-left">
        <iframe src="parts/title.html"></iframe>
    </div>

    <div id="tsunami-map-container" class="overlay-part bottom-right">
        <iframe src="parts/tsunami-map.html"></iframe>
    </div>

<script type="module">
    // 津波情報の自動表示/非表示のみを管理
    const tsunamiContainer = document.getElementById('tsunami-map-container');

    async function checkTsunamiStatus() {
        try {
            // P2P地震情報APIから最新の津波予報を取得
            const response = await fetch("https://api.p2pquake.net/v2/history?codes=552&limit=1");
            const history = await response.json();
            
            if (history && history.length > 0) {
                const latest = history[0];
                // 発表中(cancelled: false)なら表示、解除(true)なら非表示
                if (latest.cancelled === false) {
                    tsunamiContainer.classList.add('is-active');
                    console.log("TSUNAMI ALERT: Active");
                } else {
                    tsunamiContainer.classList.remove('is-active');
                    console.log("TSUNAMI ALERT: Cancelled");
                }
            }
        } catch (e) {
            console.error("Tsunami status check failed:", e);
        }
    }

    // 10秒ごとにAPIをチェックしてオーバーレイを制御
    checkTsunamiStatus();
    setInterval(checkTsunamiStatus, 10000);

</script>
</body>
</html>
