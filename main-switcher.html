<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>EQLive Main Switcher</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 1920px; height: 1080px;
            background-color: black;
            overflow: hidden;
            font-family: sans-serif;
        }
        #view-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .base-frame {
            position: absolute;
            top: 0; left: 0;
            width: 1920px;
            height: 1080px;
            border: none;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            z-index: 1;
        }
        .base-frame.active {
            opacity: 1;
            z-index: 10;
        }
        #frame-eew {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 1300px;
            height: 371px;
            z-index: 999;
            border: none;
            background: transparent;
            pointer-events: none;
        }
        /* インタラクションを促すためのオーバーレイ（初回のみ） */
        #audio-unlock {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            cursor: pointer;
            font-family: sans-serif;
        }

        /* === 【新規追加】自由配置画像用レイヤーのCSS === */
        #free-image-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            z-index: 500; /* iframe群(10)より上で、EEW(999)より下 */
            pointer-events: none; /* OBSの対話を邪魔しない */
        }
        #custom-free-image {
            position: absolute;
            display: none;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div id="audio-unlock">音声再生を有効にするにはここをクリック（OBSの場合は「対話」から）</div>

    <div id="view-container">
        <iframe id="frame-l-screen" class="base-frame" src="l-screen.html"></iframe>
        <iframe id="frame-sub-switcher" class="base-frame" src="sub-switcher.html"></iframe>
        
        <div id="free-image-layer">
            <img id="custom-free-image" src="" alt="Free Overlay">
        </div>

        <iframe id="frame-eew" src="parts/eew.html"></iframe>
    </div>

    <audio id="eew-audio" src="assets/eew-audio.mp3" preload="auto"></audio>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const frameL = document.getElementById('frame-l-screen');
    const frameSub = document.getElementById('frame-sub-switcher');
    const eewAudio = document.getElementById('eew-audio');
    const unlockOverlay = document.getElementById('audio-unlock');

    // 自由配置画像要素の取得
    const freeImage = document.getElementById('custom-free-image');

    // 音声アンロック処理
    unlockOverlay.addEventListener('click', () => {
        eewAudio.play().then(() => {
            eewAudio.pause();
            eewAudio.currentTime = 0;
            unlockOverlay.style.display = 'none'; // オーバーレイを消す
            console.log("Audio Unlocked!");
        }).catch(err => console.error("Unlock failed:", err));
    });

    function switchView(viewType) {
        if (viewType === 'l-screen') {
            frameL.classList.add('active');
            frameSub.classList.remove('active');
        } else {
            frameSub.classList.add('active');
            frameL.classList.remove('active');
        }
    }

    const modeRef = ref(db, 'broadcast/current_mode');
    onValue(modeRef, (snapshot) => {
        const mode = snapshot.val();
        if (mode) switchView(mode);
        else switchView('sub-switcher');
    });

    // === 【新規追加】自由配置画像のデータ変更を監視・反映する ===
    const freeImageRef = ref(db, 'broadcast/free_image');
    onValue(freeImageRef, (snapshot) => {
        const data = snapshot.val();
        if (data && data.visible && data.url) {
            freeImage.src = data.url;
            freeImage.style.left = `${data.x || 0}px`;
            freeImage.style.top = `${data.y || 0}px`;
            freeImage.style.width = `${data.width || 300}px`;
            freeImage.style.height = `${data.height || 'auto'}`;
            freeImage.style.opacity = (data.opacity !== undefined) ? data.opacity : 1;
            freeImage.style.display = 'block';
        } else {
            freeImage.style.display = 'none';
            freeImage.src = "";
        }
    });

    window.addEventListener('message', (event) => {
        if (event.data === 'playEEWAudio') {
            // アンロック済みであれば再生される
            eewAudio.currentTime = 0; 
            eewAudio.play().catch(e => {
                console.warn("再生に失敗しました。OBSの『対話』から画面をクリックしてください。");
            });
        }
    });
</script>
</body>
</html>
