<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>EQLive Main Switcher</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 1920px; height: 1080px;
            background-color: black;
            overflow: hidden;
        }

        #view-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* L字画面やサブスイッチ用のiframe */
        .base-frame {
            position: absolute;
            top: 0; left: 0;
            width: 1920px;
            height: 1080px;
            border: none;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            z-index: 1;
        }

        /* 表示中のiframeを前面に出して表示 */
        .base-frame.active {
            opacity: 1;
            z-index: 10; /* 通常画面の前面へ */
        }

        /* EEWパーツ：位置を中央下部・最前面に固定 */
        #frame-eew {
            position: absolute;
            bottom: 50px; /* 下から50px */
            left: 50%;
            transform: translateX(-50%); /* 中央寄せ */
            width: 1300px;
            height: 371px;
            z-index: 999; /* どんな画面よりも上に表示 */
            border: none;
            background: transparent;
            pointer-events: none; /* 下の画面の操作を邪魔しない */
        }
    </style>
</head>
<body>

    <div id="view-container">
        <iframe id="frame-l-screen" class="base-frame" src="l-screen.html"></iframe>
        <iframe id="frame-sub-switcher" class="base-frame" src="sub-switcher.html"></iframe>
        
        <iframe id="frame-eew" src="parts/eew.html"></iframe>
    </div>

    <audio id="eew-audio" src="assets/eew-audio.mp3" preload="auto"></audio>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const frameL = document.getElementById('frame-l-screen');
    const frameSub = document.getElementById('frame-sub-switcher');
    const eewAudio = document.getElementById('eew-audio');

    /**
     * 表示の切り替え処理
     */
    function switchView(viewType) {
        if (viewType === 'l-screen') {
            frameL.classList.add('active');
            frameSub.classList.remove('active');
        } else {
            frameSub.classList.add('active');
            frameL.classList.remove('active');
        }
    }

    // Firebaseの監視
    const modeRef = ref(db, 'broadcast/current_mode');
    onValue(modeRef, (snapshot) => {
        const mode = snapshot.val();
        if (mode) {
            switchView(mode);
        } else {
            switchView('sub-switcher');
        }
    });

    /**
     * parts/eew.html からの音声再生命令を受け取る
     */
    window.addEventListener('message', (event) => {
        if (event.data === 'playEEWAudio') {
            eewAudio.currentTime = 0; 
            eewAudio.play().catch(e => console.warn("音声再生に失敗:", e));
        }
    });
</script>
</body>
</html>
