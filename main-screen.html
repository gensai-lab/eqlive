<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>EQLive - Main Switcher</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: black; overflow: hidden; }
        #main-viewport { width: 100vw; height: 100vh; border: none; transition: opacity 0.5s ease-in-out; }
        .switching { opacity: 0; }
    </style>
</head>
<body>
    <iframe id="main-viewport" src="about:blank" allow="autoplay; encrypted-media"></iframe>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const viewport = document.getElementById('main-viewport');
    let currentSource = "";

    onValue(ref(db, 'broadcast/current/mainSource'), (snapshot) => {
        const mode = snapshot.val();
        if (!mode || mode === currentSource) return;
        viewport.classList.add('switching');
        setTimeout(() => {
            viewport.src = (mode === 'camera') ? "live-only.html" : "screen-program.html";
            viewport.onload = () => viewport.classList.remove('switching');
            currentSource = mode;
        }, 500);
    });
</script>
</body>
</html>
