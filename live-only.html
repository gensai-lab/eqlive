<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQLive - Live Display</title>
    <style>
        @font-face {
            font-family: 'UDKakugo';
            src: url('assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: black;
            overflow: hidden;
            font-family: 'UDKakugo', sans-serif;
        }

        #video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: black;
        }

        /* 映像レイヤー */
        .player-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
            z-index: 1;
            background: black;
            /* clip-pathで切り取り範囲を制御 */
            clip-path: inset(0 0 0 0); 
        }

        .player-layer.active {
            z-index: 2;
        }

        /* 切り替わり時のアニメーション用クラス */
        .wipe-transition {
            animation: wipe-effect 1.2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        @keyframes wipe-effect {
            0% { clip-path: inset(0 100% 0 0); }
            100% { clip-path: inset(0 0 0 0); }
        }

        /* スイープバー（白い線） */
        #sweep-bar {
            position: absolute;
            top: 0;
            left: -10px;
            width: 15px;
            height: 100%;
            background: white;
            box-shadow: 0 0 20px 5px rgba(255, 255, 255, 0.8);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
        }

        .bar-anim {
            animation: bar-move 1.2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        }

        @keyframes bar-move {
            0% { left: -20px; opacity: 1; }
            90% { opacity: 1; }
            100% { left: 100%; opacity: 0; }
        }

        video, iframe {
            width: 100%; height: 100%;
            border: none; object-fit: cover;
        }

        /* 中継テロップ */
        #live-location-overlay {
            position: absolute;
            top: 140px; left: 60px;
            display: flex; align-items: center;
            color: white; z-index: 110;
            transition: opacity 0.5s;
            opacity: 0;
            filter: drop-shadow(0 0 4px rgba(0,0,0,1)) drop-shadow(0 0 8px rgba(0,0,0,1));
        }
        #live-location-overlay.active { opacity: 1; }
        .live-icon { width: 115px; height: auto; margin-right: 24px; }
        .location-name {
            font-size: 48px; font-weight: bold; letter-spacing: 0.08em;
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, -2px 2px 0 #000, 2px -2px 0 #000;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<div id="video-container">
    <div id="sweep-bar"></div>
    
    <div id="live-location-overlay">
        <img src="assets/live.svg" class="live-icon" alt="中継">
        <span id="target-location-name" class="location-name">---</span>
    </div>

    <div id="layer-1" class="player-layer active"></div>
    <div id="layer-2" class="player-layer"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let cameraList = [];
    let currentCameraId = "";
    let activeLayerId = 1;
    let hls = null;

    async function loadConfig() {
        try {
            const response = await fetch('https://gensai-lab.github.io/eqlive/assets/json/kh-livec.json');
            cameraList = await response.json();
            startSync();
        } catch (e) { console.error(e); }
    }

    function startSync() {
        onValue(ref(db, 'broadcast/current'), (snapshot) => {
            const data = snapshot.val();
            if (data && data.cameraSource !== currentCameraId) {
                updateCamera(data.cameraSource);
            }
        });
    }

    function updateCamera(id) {
        currentCameraId = id;
        const cam = cameraList.find(c => c.id === id);
        if (!cam) return;

        const nextLayerId = activeLayerId === 1 ? 2 : 1;
        const currentLayer = document.getElementById(`layer-${activeLayerId}`);
        const nextLayer = document.getElementById(`layer-${nextLayerId}`);
        const bar = document.getElementById('sweep-bar');
        const overlay = document.getElementById('live-location-overlay');

        // 1. 次の映像を背面で準備（非表示状態でロード）
        nextLayer.classList.remove('wipe-transition');
        nextLayer.style.zIndex = 3; // 一時的に最前面に
        nextLayer.innerHTML = "";

        if (cam.type === 'hls' || cam.url.includes('.m3u8')) {
            const video = document.createElement('video');
            video.muted = true; video.autoplay = true; video.playsInline = true;
            nextLayer.appendChild(video);
            if (hls) hls.destroy();
            hls = new Hls();
            hls.loadSource(cam.url); hls.attachMedia(video);
        } else {
            const vidId = cam.url.split('v=')[1] || cam.url.split('/').pop();
            const embedUrl = cam.url.includes('youtu') 
                ? `https://www.youtube.com/embed/${vidId}?autoplay=1&mute=1&controls=0` 
                : cam.url;
            nextLayer.innerHTML = `<iframe src="${embedUrl}" allow="autoplay; encrypted-media"></iframe>`;
        }

        // 2. 映像のロード時間を考慮して少し待機してからアニメーション開始
        setTimeout(() => {
            // テロップ更新
            document.getElementById('target-location-name').innerText = cam.name;
            overlay.classList.add('active');

            // アニメーション適用
            bar.classList.remove('bar-anim');
            void bar.offsetWidth; // リフロー強制
            bar.classList.add('bar-anim');

            nextLayer.classList.add('wipe-transition');

            // 3. アニメーション終了後の後処理
            setTimeout(() => {
                currentLayer.classList.remove('active');
                currentLayer.style.zIndex = 1;
                currentLayer.innerHTML = "";
                nextLayer.classList.remove('wipe-transition');
                nextLayer.classList.add('active');
                activeLayerId = nextLayerId;
            }, 1200);
        }, 800); 
    }

    window.onload = loadConfig;
</script>
</body>
</html>
