<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQLive - Live Display</title>
    <style>
        @font-face {
            font-family: 'UDKakugo';
            src: url('assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: black;
            overflow: hidden;
            font-family: 'UDKakugo', sans-serif;
        }

        #video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: black;
        }

        /* 映像要素の共通スタイル */
        .player-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
            opacity: 0;
            transition: opacity 1.5s ease-in-out; /* 1.5秒かけてフェード */
            z-index: 1;
            background: black;
        }

        /* 表示中のレイヤー */
        .player-layer.active {
            opacity: 1;
            z-index: 2;
        }

        video, iframe {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: cover;
        }

        /* 中継テロップ */
        #live-location-overlay {
            position: absolute;
            top: 140px;
            left: 60px;
            display: flex;
            align-items: center;
            color: white;
            z-index: 100;
            transition: opacity 0.8s;
            opacity: 0;
            pointer-events: none;
            filter: drop-shadow(0 0 4px rgba(0,0,0,1)) drop-shadow(0 0 8px rgba(0,0,0,1));
        }

        #live-location-overlay.active { opacity: 1; }

        .live-icon {
            width: 115px;
            height: auto;
            margin-right: 24px;
        }

        .location-name {
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 0.08em;
            text-shadow: 
                2px 2px 0 #000, -2px -2px 0 #000,
                -2px 2px 0 #000, 2px -2px 0 #000,
                0px 2px 0 #000, 0px -2px 0 #000,
                -2px 0px 0 #000, 2px 0px 0 #000;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<div id="video-container">
    <div id="live-location-overlay">
        <img src="assets/live.svg" class="live-icon" alt="中継">
        <span id="target-location-name" class="location-name">---</span>
    </div>

    <div id="layer-1" class="player-layer"></div>
    <div id="layer-2" class="player-layer"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let cameraList = [];
    let currentCameraId = "";
    let hls = null;
    let activeLayerId = 1;

    async function loadConfig() {
        try {
            const response = await fetch('https://gensai-lab.github.io/eqlive/assets/json/kh-livec.json');
            cameraList = await response.json();
            startSync();
        } catch (e) { console.error("JSON Load Error:", e); }
    }

    function startSync() {
        onValue(ref(db, 'broadcast/current'), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            if (data.cameraSource !== currentCameraId) {
                updateCamera(data.cameraSource);
            }
        });
    }

    function updateCamera(id) {
        currentCameraId = id;
        const cam = cameraList.find(c => c.id === id);
        const overlay = document.getElementById('live-location-overlay');
        const nameElement = document.getElementById('target-location-name');
        
        // 切り替え先のレイヤーを決定
        const nextLayerId = activeLayerId === 1 ? 2 : 1;
        const currentLayer = document.getElementById(`layer-${activeLayerId}`);
        const nextLayer = document.getElementById(`layer-${nextLayerId}`);

        if (cam) {
            // テロップ更新
            nameElement.innerText = cam.name;
            overlay.classList.add('active');

            // 次のレイヤーに映像を準備
            nextLayer.innerHTML = "";
            if (cam.type === 'hls' || cam.url.includes('.m3u8')) {
                const video = document.createElement('video');
                video.muted = true; video.autoplay = true; video.playsInline = true;
                nextLayer.appendChild(video);

                if (Hls.isSupported()) {
                    if (hls) hls.destroy();
                    hls = new Hls();
                    hls.loadSource(cam.url);
                    hls.attachMedia(video);
                } else {
                    video.src = cam.url;
                }
            } else if (cam.url.includes('youtube.com') || cam.url.includes('youtu.be')) {
                let vidId = cam.url.split('v=')[1] || cam.url.split('/').pop();
                nextLayer.innerHTML = `<iframe src="https://www.youtube.com/embed/${vidId}?autoplay=1&mute=1&rel=0&controls=0" allow="autoplay; encrypted-media"></iframe>`;
            } else {
                nextLayer.innerHTML = `<iframe src="${cam.url}" allow="autoplay; encrypted-media"></iframe>`;
            }

            // フェード切り替え
            setTimeout(() => {
                nextLayer.classList.add('active');
                currentLayer.classList.remove('active');
                activeLayerId = nextLayerId;

                // 古いレイヤーの中身を少し遅れて消去（残像防止）
                setTimeout(() => {
                    if (!currentLayer.classList.contains('active')) {
                        currentLayer.innerHTML = "";
                    }
                }, 1500);
            }, 500); // 読み込み待ちの微調整

        } else {
            overlay.classList.remove('active');
            currentLayer.classList.remove('active');
            nextLayer.classList.remove('active');
        }
    }

    window.onload = loadConfig;
</script>
</body>
</html>
