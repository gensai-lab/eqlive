<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQLive - Live Display</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            font-family: "A-OTF UD新ゴ Pr6N", "Hiragino Sans", "Meiryo", sans-serif;
        }

        #video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        iframe, video {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 中継テロップのスタイル */
        #live-location-overlay {
            position: absolute;
            top: 40px; /* 左上より少し下 */
            left: 40px;
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 15px 5px 8px;
            border-radius: 4px;
            border-left: 5px solid #ff0000; /* アクセントの赤 */
            color: white;
            z-index: 100;
            transition: opacity 0.5s;
            opacity: 0; /* 初期は非表示 */
        }

        #live-location-overlay.active {
            opacity: 1;
        }

        .live-icon {
            width: 80px; /* SVGのサイズに合わせて調整 */
            height: auto;
            margin-right: 10px;
        }

        .location-name {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 0.05em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        /* ログ（デバッグ用） */
        #log {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: rgba(255,255,255,0.3);
            font-size: 10px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="video-container">
    <div id="live-location-overlay">
        <img src="assets/live.svg" class="live-icon" alt="中継">
        <span id="target-location-name" class="location-name">---</span>
    </div>

    <div id="player"></div>
</div>

<div id="log">Initializing...</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974",
        measurementId: "G-BK3MJJ0VR7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let cameraList = [];
    let currentCameraId = "";

    function log(msg) {
        console.log(msg);
        document.getElementById('log').innerText = msg;
    }

    // 1. カメラリスト(JSON)を読み込む
    async function loadConfig() {
        try {
            const response = await fetch('https://gensai-lab.github.io/eqlive/assets/json/kh-livec.json');
            cameraList = await response.json();
            log(`JSON Loaded: ${cameraList.length} cams`);
            startSync();
        } catch (e) {
            log("JSON Load Error: " + e.message);
        }
    }

    // 2. Firebase同期開始
    function startSync() {
        onValue(ref(db, 'broadcast/current'), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const newCameraId = data.cameraSource;
            if (newCameraId !== currentCameraId) {
                updateCamera(newCameraId);
            }
        });
    }

    // 3. 映像と地点名表示の更新
    function updateCamera(id) {
        currentCameraId = id;
        const cam = cameraList.find(c => c.id === id);
        const overlay = document.getElementById('live-location-overlay');
        const nameElement = document.getElementById('target-location-name');

        if (cam) {
            log(`Switching to: ${cam.name}`);
            
            // 地点名の更新
            nameElement.innerText = cam.name;
            overlay.classList.add('active');

            // 映像の切り替え（iframe等の実装に合わせて変更してください）
            const player = document.getElementById('player');
            // 例: cam.type が youtube なら iframe、hls なら video など
            player.innerHTML = `<iframe src="${cam.url}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        } else {
            overlay.classList.remove('active');
            log(`Camera ID not found: ${id}`);
        }
    }

    // 起動
    window.onload = loadConfig;
</script>

</body>
</html>
