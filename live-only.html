<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQLive - Live Display</title>
    <style>
        /* フォントの設定 */
        @font-face {
            font-family: 'UDKakugo';
            src: url('assets/fonts/FOT-UDKakugo_LargePr6-DB.otf') format('opentype');
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            font-family: 'UDKakugo', sans-serif;
        }

        #video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 映像表示エリア */
        video, iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            object-fit: cover;
        }

        /* 中継テロップ */
        #live-location-overlay {
            position: absolute;
            top: 140px;
            left: 60px;
            display: flex;
            align-items: center;
            color: white;
            z-index: 100;
            transition: opacity 0.3s;
            opacity: 0;
            pointer-events: none;
            filter: drop-shadow(0 0 4px rgba(0,0,0,1)) drop-shadow(0 0 8px rgba(0,0,0,1));
        }

        #live-location-overlay.active {
            opacity: 1;
        }

        .live-icon {
            width: 115px;
            height: auto;
            margin-right: 24px;
        }

        .location-name {
            font-size: 48px;
            font-weight: bold;
            letter-spacing: 0.08em;
            text-shadow: 
                2px 2px 0 #000, -2px -2px 0 #000,
                -2px 2px 0 #000, 2px -2px 0 #000,
                0px 2px 0 #000, 0px -2px 0 #000,
                -2px 0px 0 #000, 2px 0px 0 #000;
        }

        #player-target {
            width: 100%;
            height: 100%;
            background-color: black;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<div id="video-container">
    <div id="live-location-overlay">
        <img src="assets/live.svg" class="live-icon" alt="中継">
        <span id="target-location-name" class="location-name">---</span>
    </div>

    <div id="player-target"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let cameraList = [];
    let currentCameraId = "";
    let hls = null;

    async function loadConfig() {
        try {
            const response = await fetch('https://gensai-lab.github.io/eqlive/assets/json/kh-livec.json');
            cameraList = await response.json();
            startSync();
        } catch (e) {
            console.error("JSON Load Error:", e);
        }
    }

    function startSync() {
        onValue(ref(db, 'broadcast/current'), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            // IDが変わった瞬間のみ更新
            if (data.cameraSource !== currentCameraId) {
                updateCamera(data.cameraSource);
            }
        });
    }

    function updateCamera(id) {
        currentCameraId = id;
        const cam = cameraList.find(c => c.id === id);
        const overlay = document.getElementById('live-location-overlay');
        const nameElement = document.getElementById('target-location-name');
        const container = document.getElementById('player-target');

        // 前のHLSインスタンスがあれば破棄
        if (hls) {
            hls.destroy();
            hls = null;
        }

        // コンテナを空にする（アニメーションなしで即入れ替え）
        container.innerHTML = "";

        if (cam) {
            nameElement.innerText = cam.name;
            overlay.classList.add('active');

            if (cam.type === 'hls' || cam.url.includes('.m3u8')) {
                const video = document.createElement('video');
                video.muted = true;
                video.autoplay = true;
                video.playsInline = true;
                container.appendChild(video);

                if (Hls.isSupported()) {
                    hls = new Hls();
                    hls.loadSource(cam.url);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play().catch(e => console.error("Autoplay failed:", e));
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = cam.url;
                    video.addEventListener('loadedmetadata', () => {
                        video.play();
                    });
                }
            } else if (cam.url.includes('youtube.com') || cam.url.includes('youtu.be')) {
                let vidId = cam.url.split('v=')[1] || cam.url.split('/').pop();
                container.innerHTML = `<iframe src="https://www.youtube.com/embed/${vidId}?autoplay=1&mute=1&rel=0&controls=0&showinfo=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            } else {
                container.innerHTML = `<iframe src="${cam.url}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            }
        } else {
            overlay.classList.remove('active');
        }
    }

    window.onload = loadConfig;
</script>

</body>
</html>
