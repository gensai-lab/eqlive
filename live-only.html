<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQLive - Live Display</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            font-family: "A-OTF UD新ゴ Pr6N", "Hiragino Sans", "Meiryo", sans-serif;
        }

        #video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        iframe, video {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 中継テロップのスタイル */
        #live-location-overlay {
            position: absolute;
            top: 50px; /* 左上より少し下 */
            left: 40px;
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 20px 8px 12px;
            border-radius: 4px;
            /* border-left を削除しました */
            color: white;
            z-index: 100;
            transition: opacity 0.5s;
            opacity: 0;
        }

        #live-location-overlay.active {
            opacity: 1;
        }

        .live-icon {
            width: 100px; /* live.svgのサイズに合わせて調整 */
            height: auto;
            margin-right: 12px;
        }

        .location-name {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 0.05em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        #log {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: rgba(255,255,255,0.3);
            font-size: 10px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="video-container">
    <div id="live-location-overlay">
        <img src="assets/live.svg" class="live-icon" alt="中継">
        <span id="target-location-name" class="location-name">---</span>
    </div>

    <div id="player" style="width:100%; height:100%;"></div>
</div>

<div id="log">Initializing...</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCGrVjAU91VsGFbsdvhjoP7Dlk8C-Y4ibc",
        authDomain: "mgl-eqlive.firebaseapp.com",
        databaseURL: "https://mgl-eqlive-default-rtdb.firebaseio.com",
        projectId: "mgl-eqlive",
        storageBucket: "mgl-eqlive.firebasestorage.app",
        messagingSenderId: "1060231327645",
        appId: "1:1060231327645:web:642684f4640bbc21d5c974",
        measurementId: "G-BK3MJJ0VR7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let cameraList = [];
    let currentCameraId = "";

    function log(msg) {
        console.log(msg);
        document.getElementById('log').innerText = msg;
    }

    async function loadConfig() {
        try {
            const response = await fetch('https://gensai-lab.github.io/eqlive/assets/json/kh-livec.json');
            cameraList = await response.json();
            log(`JSON Loaded: ${cameraList.length} cams`);
            startSync();
        } catch (e) {
            log("JSON Load Error: " + e.message);
        }
    }

    function startSync() {
        onValue(ref(db, 'broadcast/current'), (snapshot) => {
            const data = snapshot.val();
            if (!data) return;
            if (data.cameraSource !== currentCameraId) {
                updateCamera(data.cameraSource);
            }
        });
    }

    function updateCamera(id) {
        currentCameraId = id;
        const cam = cameraList.find(c => c.id === id);
        const overlay = document.getElementById('live-location-overlay');
        const nameElement = document.getElementById('target-location-name');
        const player = document.getElementById('player');

        if (cam) {
            log(`Switching to: ${cam.name}`);
            nameElement.innerText = cam.name;
            overlay.classList.add('active');

            // 自動再生対応の埋め込み処理
            if (cam.url.includes('youtube.com') || cam.url.includes('youtu.be')) {
                // YouTubeの場合: mute=1 と autoplay=1 を付与
                let vidId = cam.url.split('v=')[1] || cam.url.split('/').pop();
                player.innerHTML = `<iframe src="https://www.youtube.com/embed/${vidId}?autoplay=1&mute=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            } else {
                // HLSなどの汎用URLの場合: muted autoplay を属性に追加
                // cam.urlが直接m3u8ならvideoタグ、埋め込みURLならiframeにパラメーターを付与
                player.innerHTML = `<iframe src="${cam.url}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
                
                // ※もし自作のHLSプレイヤー(Video.js等)を使う場合は、videoタグに muted 属性を付けて .play() を呼び出してください。
            }
        } else {
            overlay.classList.remove('active');
        }
    }

    window.onload = loadConfig;
</script>

</body>
</html>
